<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>⚡ Automatismes – Brevet 2026</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:#000000;font-family:'DM Sans',sans-serif;padding:1rem;color:#ffffff;}
    .container{max-width:800px;margin:0 auto;background:#1a1a1a;border-radius:2rem;padding:1.5rem;border:1px solid #ffcc00;}
    h1{font-family:'Playfair Display',serif;font-size:1.8rem;color:#ffcc00;margin-bottom:0.25rem;}
    .sub{color:#aaa;margin-bottom:1rem;border-left:3px solid #ffcc00;padding-left:1rem;font-size:0.8rem;}
    .info-bar{background:#2a2a2a;border-radius:1rem;padding:0.8rem;margin-bottom:1rem;display:flex;justify-content:space-between;flex-wrap:wrap;gap:0.5rem;font-size:0.8rem;}
    .question-card{background:#2a2a2a;border-radius:1.5rem;padding:1.5rem;margin-bottom:1rem;border:1px solid #333;}
    .question-text{font-size:1.1rem;margin-bottom:1rem;font-weight:500;}
    textarea{width:100%;background:#0a0a0f;border:1px solid #333;border-radius:1rem;padding:0.8rem;color:white;font-size:1rem;margin-bottom:1rem;font-family:'DM Sans',sans-serif;resize:vertical;}
    .btn-group{display:flex;gap:1rem;justify-content:center;margin:1rem 0;flex-wrap:wrap;}
    button{background:#1e2a3e;border:1px solid #5ecfb1;border-radius:40px;padding:0.5rem 1.2rem;font-size:0.8rem;color:#5ecfb1;cursor:pointer;}
    button:hover{background:#2a3652;}
    .progress{background:#0a0a0f;border-radius:1rem;padding:0.6rem;margin-top:0.5rem;font-size:0.7rem;color:#aaa;text-align:center;}
    .feedback{background:#0a0a0f;border-radius:1rem;padding:0.6rem;margin-top:0.5rem;font-size:0.75rem;display:none;}
    .feedback.show{display:block;}
    .timer{font-family:'DM Mono',monospace;font-size:1.2rem;color:#ffcc00;}
    select{background:#2a2a2a;border:1px solid #333;border-radius:40px;padding:0.4rem 0.8rem;color:white;margin:0 0.5rem;}
    .back-link{display:inline-block;margin-top:1rem;text-decoration:none;color:#5ecfb1;font-size:0.8rem;}
    hr{border-color:#333;margin:0.5rem 0;}
    .reponse-modele{background:#1a2a1a;border-left:3px solid #5ecfb1;padding:0.5rem;margin-top:0.5rem;border-radius:0.5rem;font-size:0.8rem;}
  </style>
</head>
<body>
<div class="container">
  <h1>⚡ Automatismes</h1>
  <div class="sub">45 min • Reformule avec tes mots • La compréhension compte, pas le par cœur</div>

  <div class="info-bar">
    <span>📅 Jour J-<span id="jourActuel">--</span></span>
    <span>📚 Matière : 
      <select id="matiereSelect">
        <option value="francais">Français</option>
        <option value="maths">Mathématiques</option>
        <option value="histoire">Histoire-Géo & EMC</option>
        <option value="sciences">Sciences</option>
      </select>
      <button id="changerMatiereBtn">OK</button>
    </span>
    <span class="timer" id="timer">⏱️ 45:00</span>
  </div>

  <div id="sessionInfo" class="progress">📊 Chargement...</div>
  <div id="questionArea"></div>

  <div class="btn-group">
    <button id="resetBtn" style="border-color:#e8c87a;color:#e8c87a;">🔄 Réinitialiser progression</button>
    <button id="nextDayBtn" style="border-color:#ffcc00;color:#ffcc00;">📅 Passer au jour suivant</button>
  </div>

  <a href="index.html" class="back-link">← Retour au hub</a>
</div>

<script>
  // ==================== EXTRAIRE LES MOTS-CLÉS D'UNE RÉPONSE ====================
  function extraireMotsCles(texte) {
    const stopWords = ["le", "la", "les", "un", "une", "des", "et", "ou", "donc", "or", "ni", "car", "de", "du", "des", "à", "dans", "par", "pour", "avec", "sans", "sur", "sous", "chez", "est", "sont", "ce", "cet", "cette", "ces", "il", "elle", "ils", "elles", "on", "nous", "vous", "je", "tu", "ce", "que", "qui", "dont", "où", "un", "une", "des", "du", "de", "la", "le"];
    const mots = texte.toLowerCase()
      .replace(/[^\w\sàâäéèêëîïôöùûüç]/g, ' ')
      .split(/\s+/)
      .filter(m => m.length > 2 && !stopWords.includes(m));
    return [...new Set(mots)];
  }

  function evaluerComprehension(reponseEleve, reponseAttendue) {
    const motsClesAttendus = extraireMotsCles(reponseAttendue);
    const motsEleve = extraireMotsCles(reponseEleve);
    if (motsClesAttendus.length === 0) return { valide: true, taux: 1 };
    let trouves = 0;
    for (const mot of motsClesAttendus) {
      if (motsEleve.some(m => m.includes(mot) || mot.includes(m))) trouves++;
    }
    const taux = trouves / motsClesAttendus.length;
    return { valide: taux >= 0.5, taux: Math.round(taux * 100) };
  }

  // ==================== DONNÉES EXEMPLES (à remplacer par les vraies flashcards) ====================
  const cartesParMatiere = {
    francais: Array.from({length: 200}, (_,i) => ({question: `Question français ${i+1}`, reponse: `Réponse détaillée pour la question ${i+1} : il faut comprendre le sens et pas réciter mot à mot.`})),
    maths: Array.from({length: 200}, (_,i) => ({question: `Question maths ${i+1}`, reponse: `Réponse maths ${i+1} : explique avec tes propres mots.`})),
    histoire: Array.from({length: 200}, (_,i) => ({question: `Question histoire ${i+1}`, reponse: `Réponse histoire ${i+1} : reformule librement.`})),
    sciences: Array.from({length: 200}, (_,i) => ({question: `Question sciences ${i+1}`, reponse: `Réponse sciences ${i+1} : l'important est d'avoir compris le mécanisme.`}))
  };

  let currentMatiere = "francais";
  let planning = { jour: 26, termine: false };
  let progression = {};
  let questionsSession = [];
  let indexActuel = 0;
  let currentQuestion = null;
  let timerInterval = null;
  let tempsRestant = 45 * 60;

  function sauvegarderPlanning() { localStorage.setItem("planning_automatismes", JSON.stringify(planning)); }
  function sauvegarderProgression() { localStorage.setItem(`automatismes_${currentMatiere}`, JSON.stringify(progression)); }

  function chargerDonnees() {
    const savedPlanning = localStorage.getItem("planning_automatismes");
    if (savedPlanning) planning = JSON.parse(savedPlanning);
    else planning = { jour: 26, termine: false };
    const savedProg = localStorage.getItem(`automatismes_${currentMatiere}`);
    if (savedProg) progression = JSON.parse(savedProg);
    else progression = {};
    document.getElementById("jourActuel").innerText = planning.jour;
  }

  function selectionnerQuestions() {
    const toutesCartes = cartesParMatiere[currentMatiere];
    const nouvelles = toutesCartes.filter(c => !progression[c.question] || progression[c.question].etat === "nouvelle").slice(0, 30);
    const erreurs = toutesCartes.filter(c => progression[c.question] && progression[c.question].nbErreurs > 0).slice(0, 10);
    const rebrassage = toutesCartes.filter(c => progression[c.question] && progression[c.question].etat === "maitrisee").slice(0, 5);
    let selected = [...nouvelles, ...erreurs, ...rebrassage];
    const ids = new Set();
    selected = selected.filter(c => {
      if (ids.has(c.question)) return false;
      ids.add(c.question);
      return true;
    });
    for (let i=selected.length-1; i>0; i--) {
      const j = Math.floor(Math.random()*(i+1));
      [selected[i], selected[j]] = [selected[j], selected[i]];
    }
    return selected;
  }

  function demarrerSession() {
    questionsSession = selectionnerQuestions();
    indexActuel = 0;
    document.getElementById("sessionInfo").innerHTML = `📌 ${questionsSession.length} questions (30 nouvelles + 10 erreurs + 5 rebrassage)`;
    if (questionsSession.length === 0) {
      document.getElementById("questionArea").innerHTML = '<div class="progress">🎉 Félicitations ! Plus de questions à réviser.</div>';
      return;
    }
    afficherQuestion();
    demarrerTimer();
  }

  function afficherQuestion() {
    if (indexActuel >= questionsSession.length) {
      terminerSession();
      return;
    }
    currentQuestion = questionsSession[indexActuel];
    document.getElementById("questionArea").innerHTML = `
      <div class="question-card">
        <div class="question-text">${currentQuestion.question}</div>
        <textarea id="reponseInput" rows="3" placeholder="Explique avec tes propres mots..."></textarea>
        <div class="btn-group">
          <button id="validerBtn">✔️ Vérifier ma compréhension</button>
        </div>
        <div id="feedback" class="feedback"></div>
      </div>
    `;
    document.getElementById("validerBtn").onclick = () => verifierReponse();
    document.getElementById("reponseInput").focus();
    document.getElementById("sessionInfo").innerHTML = `📌 Question ${indexActuel+1}/${questionsSession.length}`;
  }

  function verifierReponse() {
    const userReponse = document.getElementById("reponseInput").value.trim();
    if (userReponse === "") {
      document.getElementById("feedback").innerHTML = "✏️ Écris une réponse avant de valider (même courte).";
      document.getElementById("feedback").classList.add("show");
      return;
    }
    const evaluation = evaluerComprehension(userReponse, currentQuestion.reponse);
    const state = progression[currentQuestion.question] || { nbErreurs: 0, etat: "nouvelle" };
    if (evaluation.valide) {
      state.nbErreurs = 0;
      state.etat = "maitrisee";
      document.getElementById("feedback").innerHTML = `✅ Bien compris ! (${evaluation.taux}% des idées clés)<br><div class="reponse-modele">📖 Pour info : ${currentQuestion.reponse}</div>`;
    } else {
      state.nbErreurs = (state.nbErreurs || 0) + 1;
      state.etat = "en_erreur";
      document.getElementById("feedback").innerHTML = `⚠️ On va revoir ça. (${evaluation.taux}% des idées clés)<br><div class="reponse-modele">📖 Réponse modèle : ${currentQuestion.reponse}</div><br>💡 Essaie de reformuler avec tes mots.`;
    }
    progression[currentQuestion.question] = state;
    sauvegarderProgression();
    document.getElementById("feedback").classList.add("show");
    indexActuel++;
    setTimeout(() => afficherQuestion(), 2500);
  }

  function terminerSession() {
    clearInterval(timerInterval);
    document.getElementById("questionArea").innerHTML = '<div class="progress">✅ Session terminée ! Reviens demain.</div>';
    planning.termine = true;
    sauvegarderPlanning();
  }

  function demarrerTimer() {
    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      if (tempsRestant <= 0) {
        clearInterval(timerInterval);
        terminerSession();
        return;
      }
      tempsRestant--;
      const minutes = Math.floor(tempsRestant / 60);
      const secondes = tempsRestant % 60;
      document.getElementById("timer").innerHTML = `⏱️ ${minutes.toString().padStart(2,'0')}:${secondes.toString().padStart(2,'0')}`;
    }, 1000);
  }

  function reinitialiser() {
    if (confirm("⚠️ Réinitialiser toute la progression pour cette matière ?")) {
      localStorage.removeItem(`automatismes_${currentMatiere}`);
      chargerDonnees();
      demarrerSession();
    }
  }

  function passerJourSuivant() {
    if (planning.jour <= 0) {
      alert("🎉 Planning terminé !");
      return;
    }
    planning.jour--;
    planning.termine = false;
    sauvegarderPlanning();
    chargerDonnees();
    demarrerSession();
  }

  document.getElementById("changerMatiereBtn").addEventListener("click", () => {
    currentMatiere = document.getElementById("matiereSelect").value;
    chargerDonnees();
    demarrerSession();
  });
  document.getElementById("resetBtn").addEventListener("click", reinitialiser);
  document.getElementById("nextDayBtn").addEventListener("click", passerJourSuivant);

  chargerDonnees();
  demarrerSession();
</script>
</body>
</html>
