<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔬 Sciences — Brevet 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;1,700&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#09090f;--bg2:#111118;--bg3:#181820;--border:rgba(255,255,255,0.06);--border2:rgba(255,255,255,0.12);--text:#f0ede8;--muted:rgba(240,237,232,0.45);--muted2:rgba(240,237,232,0.2);--gold:#e8c87a;--gold2:#f5dfa0;--teal:#5ecfb1;--coral:#f07a5a;--red:#f55a5a;--green:#7ecf8a;--purple:#a98af5;--r:14px;--r-sm:8px;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;}
#home{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;background:radial-gradient(ellipse at 50% 0%,rgba(94,207,177,0.08) 0%,transparent 55%);}
.badge{font-family:'DM Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:2px;color:var(--purple);border:1px solid rgba(169,138,245,0.3);background:rgba(169,138,245,0.06);padding:5px 14px;border-radius:999px;margin-bottom:20px;}
h1{font-family:'Playfair Display',serif;font-size:clamp(32px,6vw,54px);font-weight:800;text-align:center;line-height:1.05;margin-bottom:8px;}
h1 em{color:var(--purple);font-style:italic;}
.sub{color:var(--muted);font-size:14px;text-align:center;max-width:480px;line-height:1.7;margin-bottom:32px;}
.sujets-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;max-width:600px;width:100%;margin-bottom:28px;}
.sujet-card{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r);padding:18px;cursor:pointer;transition:all 0.2s;position:relative;}
.sujet-card:hover{border-color:rgba(169,138,245,0.4);transform:translateY(-2px);}
.sc-num{font-family:'DM Mono',monospace;font-size:10px;color:var(--purple);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;}
.sc-title{font-family:'Playfair Display',serif;font-size:15px;font-weight:700;margin-bottom:4px;}
.sc-info{font-size:11px;color:var(--muted);font-family:'DM Mono',monospace;}
.sc-done{position:absolute;top:12px;right:12px;width:18px;height:18px;border-radius:50%;background:var(--green);display:none;align-items:center;justify-content:center;font-size:9px;color:#060f0a;}
.who-row{display:flex;gap:10px;margin-bottom:20px;}
.who-btn{padding:8px 22px;border-radius:999px;border:1px solid var(--border2);background:var(--bg2);color:var(--muted);cursor:pointer;font-family:'DM Sans',sans-serif;font-weight:600;font-size:13px;transition:all 0.18s;}
.who-btn.aw{border-color:#7eb8f5;background:rgba(126,184,245,0.1);color:#7eb8f5;}
.who-btn.an{border-color:#f59eb8;background:rgba(245,158,184,0.1);color:#f59eb8;}
#sujet-page{display:none;max-width:760px;margin:0 auto;padding:0;}
.s-header{position:sticky;top:0;z-index:10;background:rgba(9,9,15,0.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;gap:14px;}
.s-logo{font-family:'Playfair Display',serif;font-weight:700;font-size:15px;color:var(--purple);}
.s-meta{font-size:11px;color:var(--muted);font-family:'DM Mono',monospace;}
.back{margin-left:auto;background:none;border:1px solid var(--border2);border-radius:var(--r-sm);padding:7px 14px;color:var(--muted);cursor:pointer;font-size:11px;font-family:'DM Mono',monospace;transition:all 0.15s;text-transform:uppercase;}
.back:hover{background:rgba(255,255,255,0.04);}
.chrono-bar{background:rgba(169,138,245,0.06);border-bottom:1px solid rgba(169,138,245,0.15);padding:8px 24px;display:flex;align-items:center;justify-content:space-between;}
.chrono-time{font-family:'DM Mono',monospace;font-size:18px;font-weight:700;color:var(--purple);}
.chrono-time.urgent{color:var(--red);animation:blink 0.8s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}
.chrono-btns{display:flex;gap:8px;}
.chrono-btn{font-size:11px;padding:4px 12px;border-radius:999px;border:1px solid rgba(169,138,245,0.3);background:rgba(169,138,245,0.07);color:var(--purple);cursor:pointer;font-family:'DM Mono',monospace;transition:all 0.15s;}
.s-body{padding:24px;}
.partie{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r);margin-bottom:20px;overflow:hidden;}
.partie-header{background:var(--bg3);padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;}
.partie-label{font-family:'Playfair Display',serif;font-size:14px;font-weight:700;color:var(--purple);}
.partie-pts{font-family:'DM Mono',monospace;font-size:11px;color:var(--gold);margin-left:auto;}
.partie-time{font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);}
.partie-body{padding:20px;}
.texte-box{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r-sm);padding:20px 22px;margin-bottom:20px;font-family:'Playfair Display',serif;font-size:15px;line-height:1.9;color:var(--text);border-left:2px solid var(--purple);}
.q-block{margin-bottom:16px;}
.q-line{display:flex;align-items:flex-start;gap:10px;margin-bottom:8px;}
.q-label{font-family:'DM Mono',monospace;font-size:11px;color:var(--purple);font-weight:700;min-width:24px;margin-top:2px;}
.q-text{font-size:13px;color:var(--text);line-height:1.6;flex:1;}
.q-pts-sm{font-size:10px;color:var(--gold);font-family:'DM Mono',monospace;white-space:nowrap;}
.answer-ta{width:100%;min-height:80px;background:var(--bg);border:1px solid var(--border2);border-radius:var(--r-sm);padding:10px 12px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;line-height:1.6;outline:none;resize:vertical;margin-bottom:6px;transition:border-color 0.2s;}
.answer-ta:focus{border-color:rgba(169,138,245,0.4);}
.corr-btn{font-size:11px;padding:5px 12px;border-radius:999px;border:1px solid rgba(169,138,245,0.25);background:rgba(169,138,245,0.06);color:var(--purple);cursor:pointer;font-family:'DM Mono',monospace;transition:all 0.15s;}
.corr-btn:hover{background:rgba(169,138,245,0.12);}
.corr-box{display:none;margin-top:8px;padding:12px 14px;background:rgba(126,207,138,0.06);border:1px solid rgba(126,207,138,0.2);border-radius:var(--r-sm);font-size:13px;color:var(--muted);line-height:1.7;}
.corr-box.show{display:block;}
.auto-eval{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r);padding:20px;margin-top:20px;}
.ae-title{font-family:'DM Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:2px;color:var(--muted);margin-bottom:16px;}
.ae-row{display:flex;align-items:center;gap:12px;margin-bottom:10px;}
.ae-label{font-size:13px;flex:1;}
.ae-input{width:60px;background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r-sm);padding:6px 10px;color:var(--text);font-family:'DM Mono',monospace;font-size:14px;text-align:center;outline:none;}
.ae-max{font-size:12px;color:var(--muted);font-family:'DM Mono',monospace;}
.ae-total{background:linear-gradient(135deg,rgba(169,138,245,0.1),rgba(169,138,245,0.05));border:1px solid rgba(169,138,245,0.25);border-radius:var(--r-sm);padding:14px;text-align:center;margin-top:14px;}
.ae-total-num{font-family:'Playfair Display',serif;font-size:36px;font-weight:800;color:var(--purple);}
.save-btn{width:100%;background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r);padding:12px;color:var(--muted);cursor:pointer;font-family:'DM Sans',sans-serif;font-size:13px;transition:all 0.15s;margin-top:12px;}
.save-btn:hover{background:rgba(255,255,255,0.04);color:var(--text);}
.nav-btns{display:flex;gap:10px;margin-top:12px;}
.nav-btn{flex:1;padding:12px;border-radius:var(--r);border:1px solid var(--border2);background:var(--bg2);color:var(--muted);cursor:pointer;font-family:'DM Sans',sans-serif;font-size:13px;transition:all 0.15s;}
.nav-btn:hover{background:rgba(255,255,255,0.04);color:var(--text);}
.nav-btn.primary{background:linear-gradient(135deg,var(--purple),#7c5ece);border:none;color:#f0ede8;font-weight:700;}
.toast{position:fixed;bottom:24px;right:24px;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r-sm);padding:12px 20px;font-size:12px;z-index:200;opacity:0;transform:translateY(10px);transition:all 0.3s;pointer-events:none;font-family:'DM Mono',monospace;}
.toast.show{opacity:1;transform:translateY(0);}
.toast.ok{border-color:rgba(126,207,138,0.4);color:var(--green);}
.toast.err{border-color:rgba(245,90,90,0.4);color:var(--red);}
@media(max-width:480px){.sujets-grid{grid-template-columns:1fr;}}

/* IA */
.ai-btn{width:100%;margin-top:8px;background:linear-gradient(135deg,#e8c87a,#d4a840);border:none;border-radius:8px;padding:12px;color:#080600;font-family:'Syne',sans-serif;font-weight:800;font-size:14px;cursor:pointer;transition:all 0.2s;}
.ai-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(232,200,122,0.3);}
.ai-btn:disabled{opacity:0.4;cursor:not-allowed;transform:none;}
.ai-loading{display:none;text-align:center;padding:16px;background:rgba(232,200,122,0.04);border:1px solid rgba(232,200,122,0.12);border-radius:8px;margin-top:8px;}
.ai-spin{width:24px;height:24px;border:2px solid rgba(232,200,122,0.2);border-top-color:#e8c87a;border-radius:50%;animation:aiSp 0.8s linear infinite;margin:0 auto 8px;}
@keyframes aiSp{to{transform:rotate(360deg)}}
.ai-result{display:none;margin-top:10px;border-radius:10px;overflow:hidden;border:1px solid rgba(255,255,255,0.08);}
.ai-score-bar{padding:14px 18px;display:flex;align-items:center;gap:14px;}
.ai-score-num{font-family:'Syne',sans-serif;font-size:38px;font-weight:800;line-height:1;flex-shrink:0;}
.ai-score-info{flex:1;font-size:11px;}
.ai-pbar-bg{height:4px;background:rgba(255,255,255,0.08);border-radius:999px;overflow:hidden;margin-top:5px;}
.ai-pbar-fill{height:100%;border-radius:999px;transition:width 1s ease;}
.ai-body{padding:14px 18px;background:rgba(0,0,0,0.2);font-size:12px;}
.ai-annote{line-height:2;margin-bottom:12px;padding:12px;background:rgba(255,255,255,0.03);border-radius:6px;font-size:13px;}
.ar{background:rgba(245,85,85,0.15);border-bottom:2px solid #f55a5a;cursor:help;position:relative;}
.av{background:rgba(126,207,138,0.12);border-bottom:2px solid #7ecf8a;}
.ar .tt{display:none;position:absolute;bottom:calc(100%+5px);left:0;background:#1a1a26;border:1px solid rgba(255,255,255,0.12);border-radius:6px;padding:8px 12px;font-size:11px;color:#f0ede8;line-height:1.5;z-index:20;min-width:180px;max-width:280px;white-space:normal;}
.ar:hover .tt{display:block;}
.ai-sec{margin-bottom:10px;}
.ai-sec-t{font-family:'DM Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:4px;padding-bottom:3px;border-bottom:1px solid rgba(255,255,255,0.06);}
.ai-sec-b{color:rgba(240,237,232,0.55);line-height:1.6;}
.ai-sec-b ul{margin-left:12px;}.ai-sec-b li{margin-bottom:2px;}
.ai-sec-b strong{color:#f0ede8;}
.ai-r .ai-sec-t{color:#f55a5a;}.ai-v .ai-sec-t{color:#7ecf8a;}
.ai-g .ai-sec-t{color:#e8c87a;}.ai-p .ai-sec-t{color:#a98af5;}
</style>
</head>
<body>
<div id="home">
  <div class="badge">🔬 Sujets blancs complets — Sciences</div>
  <h1>Brevet Blanc <em>Sciences</em></h1>
  <p class="sub">10 sujets complets format DNB. Physique-Chimie et SVT. Questions + démarche scientifique + schémas.</p>
  <div style="font-size:11px;color:var(--muted);font-family:'DM Mono',monospace;text-transform:uppercase;letter-spacing:1px;margin-bottom:12px">Qui révise ?</div>
  <div class="who-row">
    <button class="who-btn" id="wb-w" onclick="selWho('W')">Wassil</button>
    <button class="who-btn" id="wb-n" onclick="selWho('N')">Nawal</button>
  </div>
  <div class="sujets-grid" id="sujets-grid"></div>
  <a href="index.html" style="font-size:12px;color:var(--muted);font-family:'DM Mono',monospace;text-decoration:none;margin-top:8px;">← Hub Central</a>
</div>

<div id="sujet-page">
  <div class="s-header">
    <div><div class="s-logo">🔬 Brevet Blanc Sciences</div><div class="s-meta" id="s-meta">—</div></div>
    <button class="back" onclick="goHome()">← Retour</button>
  </div>
  <div class="chrono-bar">
    <span style="font-size:11px;color:var(--purple);font-family:'DM Mono',monospace;text-transform:uppercase;letter-spacing:1px;">⏱ Chronomètre</span>
    <div class="chrono-time" id="chrono">1:00:00</div>
    <div class="chrono-btns">
      <button class="chrono-btn" onclick="startChrono()">▶ Démarrer</button>
      <button class="chrono-btn" onclick="resetChrono()">↺ Reset</button>
    </div>
  </div>
  <div class="s-body" id="s-body"></div>
</div>
<div class="toast" id="toast"></div>

<script>
const SHEETS={W:'https://script.google.com/macros/s/AKfycbwOGUebP39z8WqcGgsNz0lmxFe3dQPW6gy3fV9KcmbbojP2RUpsbXiO0I7s8OQzuTGrsw/exec',N:'https://script.google.com/macros/s/AKfycbwOGUebP39z8WqcGgsNz0lmxFe3dQPW6gy3fV9KcmbbojP2RUpsbXiO0I7s8OQzuTGrsw/exec'};

const SUJETS = [
  {
    id: 1, titre: "Réflexion de la lumière et miroirs",
    enonce: "Un rayon lumineux arrive sur un miroir plan avec un angle d'incidence de 35°. Tracez le rayon réfléchi et calculez l'angle de réflexion.",
    questions: [
      { n: "1", pts: 2, q: "Rappelez la loi de la réflexion. Que vaut l'angle de réflexion ?", c: "Loi : angle d'incidence = angle de réflexion. L'angle de réflexion vaut donc 35°." },
      { n: "2", pts: 3, q: "Dessinez la situation (miroir, normale, rayons incident et réfléchi) et expliquez ce qu'est la normale.", c: "La normale est la perpendiculaire à la surface au point d'incidence. Le rayon incident et le rayon réfléchi sont symétriques par rapport à la normale." },
      { n: "3", pts: 2, q: "Si l'angle d'incidence devient 0°, que se passe-t-il ?", c: "Si l'angle d'incidence = 0°, le rayon arrive perpendiculairement au miroir. L'angle de réflexion est aussi 0°, le rayon repart dans la direction opposée." }
    ]
  },
  {
    id: 2, titre: "La photosynthèse",
    enonce: "Les plantes vertes produisent leur matière organique à partir de la lumière, de l'eau et du dioxyde de carbone.",
    questions: [
      { n: "1", pts: 2, q: "Écrivez l'équation bilan de la photosynthèse.", c: "6 CO₂ + 6 H₂O → (lumière, chlorophylle) → C₆H₁₂O₆ + 6 O₂" },
      { n: "2", pts: 3, q: "Où se déroule la photosynthèse dans la plante ? Quelle est la molécule verte impliquée ?", c: "La photosynthèse se déroule dans les chloroplastes des cellules des feuilles. La chlorophylle est le pigment vert qui capte l'énergie lumineuse." },
      { n: "3", pts: 2, q: "Pourquoi la plante a-t-elle besoin d'eau pour fabriquer sa matière organique ?", c: "L'eau fournit les ions hydrogène (H⁺) nécessaires à la réduction du CO₂ en glucose. Elle est indispensable pour former les molécules organiques." }
    ]
  },
  {
    id: 3, titre: "L'énergie électrique",
    enonce: "Une lampe de 60 W est allumée pendant 2 heures. Calculez l'énergie consommée en joules et en wattheures.",
    questions: [
      { n: "1", pts: 2, q: "Rappelez la formule reliant puissance, énergie et temps.", c: "E = P × t, avec E en joules (J), P en watts (W), t en secondes (s). En Wh : E(Wh) = P(W) × t(h)." },
      { n: "2", pts: 3, q: "Calculez l'énergie en Wh. Puis convertissez en joules (1 Wh = 3600 J).", c: "E(Wh) = 60 W × 2 h = 120 Wh. E(J) = 120 × 3600 = 432 000 J." },
      { n: "3", pts: 2, q: "Si le kWh est facturé 0,20 €, quel est le coût de fonctionnement ?", c: "120 Wh = 0,120 kWh. Coût = 0,120 × 0,20 = 0,024 €, soit 2,4 centimes d'euro." }
    ]
  },
  {
    id: 4, titre: "La reproduction humaine",
    enonce: "Décrivez le trajet des spermatozoïdes depuis la production jusqu'à la fécondation.",
    questions: [
      { n: "1", pts: 2, q: "Où sont produits les spermatozoïdes ?", c: "Les spermatozoïdes sont produits dans les testicules, plus précisément dans les tubes séminifères." },
      { n: "2", pts: 3, q: "Décrivez le trajet complet.", c: "Testicules → épididyme (maturation) → canal déférent → voies génitales (urètre) → vagin → utérus → trompes de Fallope (rencontre avec l'ovule)." },
      { n: "3", pts: 2, q: "Où a lieu la fécondation ? Combien de chromosomes l'œuf possède-t-il ?", c: "La fécondation a lieu dans la trompe de Fallope. L'œuf possède 46 chromosomes (23 de chaque parent)." }
    ]
  },
  {
    id: 5, titre: "La loi d'Ohm",
    enonce: "Un conducteur ohmique de résistance 220 Ω est traversé par un courant de 0,5 A. Calculez la tension à ses bornes.",
    questions: [
      { n: "1", pts: 2, q: "Rappelez la loi d'Ohm.", c: "U = R × I, avec U en volts (V), R en ohms (Ω), I en ampères (A)." },
      { n: "2", pts: 3, q: "Calculez la tension U.", c: "U = 220 Ω × 0,5 A = 110 V." },
      { n: "3", pts: 2, q: "Si on augmente la résistance à 440 Ω à intensité constante, comment évolue la tension ?", c: "La tension double : U = 440 × 0,5 = 220 V. La tension est proportionnelle à la résistance." }
    ]
  },
  {
    id: 6, titre: "Les séismes et ondes sismiques",
    enonce: "Lors d'un séisme, on enregistre les ondes P et S. Expliquez leurs différences.",
    questions: [
      { n: "1", pts: 2, q: "Quelles sont les vitesses respectives des ondes P et S ?", c: "Les ondes P sont plus rapides (environ 6 km/s dans la croûte) que les ondes S (environ 3,5 km/s)." },
      { n: "2", pts: 3, q: "Quelle est la nature de chaque onde ?", c: "Ondes P : ondes de compression (longitudinales) – la matière vibre dans la direction de propagation. Ondes S : ondes de cisaillement (transversales) – la matière vibre perpendiculairement." },
      { n: "3", pts: 2, q: "Pourquoi les ondes S ne traversent-elles pas le noyau externe ?", c: "Les ondes S ne se propagent pas dans les liquides. Le noyau externe est liquide, donc elles sont arrêtées." }
    ]
  },
  {
    id: 7, titre: "La digestion des glucides",
    enonce: "L'amidon est une macromolécule complexe. Décrivez sa digestion dans le tube digestif.",
    questions: [
      { n: "1", pts: 2, q: "Quelle enzyme digère l'amidon ? Où est-elle produite ?", c: "L'amylase (ou ptyaline). Elle est produite par les glandes salivaires (bouche) et par le pancréas (amylase pancréatique dans l'intestin)." },
      { n: "2", pts: 3, q: "Quels sont les produits finaux de la digestion de l'amidon ?", c: "L'amidon est digéré en maltose (dans la bouche), puis en glucose (dans l'intestin grâce à la maltase). Le glucose est la molécule absorbable." },
      { n: "3", pts: 2, q: "À quel moment du tube digestif se fait l'absorption du glucose ?", c: "L'absorption du glucose se fait dans l'intestin grêle (au niveau des villosités intestinales)." }
    ]
  },
  {
    id: 8, titre: "Circuit en série et en dérivation",
    enonce: "Deux lampes de résistances 100 Ω et 200 Ω sont branchées en série sur une pile de 6 V. Calculez l'intensité.",
    questions: [
      { n: "1", pts: 2, q: "Calculez la résistance équivalente du circuit en série.", c: "Req = R1 + R2 = 100 + 200 = 300 Ω." },
      { n: "2", pts: 3, q: "Calculez l'intensité du courant dans le circuit.", c: "I = U / Req = 6 V / 300 Ω = 0,02 A = 20 mA." },
      { n: "3", pts: 2, q: "Si on branche les deux lampes en dérivation, quelle est la nouvelle résistance équivalente ?", c: "1/Req = 1/100 + 1/200 = 2/200 + 1/200 = 3/200 → Req = 200/3 ≈ 66,7 Ω. L'intensité totale augmente." }
    ]
  },
  {
    id: 9, titre: "La classification du vivant",
    enonce: "Classez les êtres vivants suivants dans les groupes emboîtés : Homme, Chat, Pin, Champignon, Bactérie.",
    questions: [
      { n: "1", pts: 2, q: "Quels attributs partagent l'Homme et le Chat ?", c: "Ils partagent l'attribut 'vertébrés' (mammifères, mais le plus proche est 'Eucaryotes pluricellulaires animaux')." },
      { n: "2", pts: 3, q: "Construisez un arbre de parenté simplifié avec ces 5 espèces.", c: "Arbre : (Bactérie (Champignon (Pin (Homme, Chat)))) → Eucaryotes (Champignon + Végétal + Animal), Végétaux (Pin), Animaux (Homme + Chat)." },
      { n: "3", pts: 2, q: "Qu'est-ce qu'un groupe monophylétique ? Donnez un exemple.", c: "Un groupe monophylétique comprend un ancêtre commun et tous ses descendants. Exemple : les mammifères." }
    ]
  },
  {
    id: 10, titre: "Combustion et bilan de matière",
    enonce: "On brûle 12 g de carbone dans 32 g de dioxygène. Il se forme uniquement du dioxyde de carbone.",
    questions: [
      { n: "1", pts: 2, q: "Écrivez l'équation de la combustion du carbone.", c: "C + O₂ → CO₂" },
      { n: "2", pts: 3, q: "Quelle masse de CO₂ obtient-on ? Justifiez avec la loi de conservation de la masse.", c: "Masse totale avant = 12 + 32 = 44 g. La masse se conserve, donc masse de CO₂ = 44 g." },
      { n: "3", pts: 2, q: "Si on brûle 24 g de carbone avec 32 g de dioxygène, lequel est en excès ? Quelle masse de CO₂ se forme ?", c: "Réaction : 12 g C réagissent avec 32 g O₂. Pour 24 g C, il faudrait 64 g O₂. O₂ limitant. Masse C consommé : (12/32)×32 = 12 g. Masse CO₂ = 12 + 32 = 44 g. Il reste 24-12 = 12 g C non brûlé." }
    ]
  }
];

let who = null, currentIdx = 0, chronoSecs = 3600, running = false, chronoInterval = null;

function selWho(w) { who = w; document.getElementById('wb-w').className = 'who-btn' + (w === 'W' ? ' aw' : ''); document.getElementById('wb-n').className = 'who-btn' + (w === 'N' ? ' an' : ''); renderHome(); }
function renderHome() {
  const g = document.getElementById('sujets-grid'); g.innerHTML = '';
  const done = JSON.parse(localStorage.getItem('sciences_done_' + (who || 'X')) || '[]');
  SUJETS.forEach((s, i) => {
    const d = document.createElement('div'); d.className = 'sujet-card'; d.onclick = () => openSujet(i);
    const isDone = done.includes(s.id);
    d.innerHTML = `<div class="sc-num">Sujet ${s.id} / 10</div><div class="sc-title">${s.titre}</div><div class="sc-info">Questions de sciences</div><div class="sc-done" style="display:${isDone ? 'flex' : 'none'}">✓</div>`;
    g.appendChild(d);
  });
}
function openSujet(idx) { currentIdx = idx; const s = SUJETS[idx]; document.getElementById('home').style.display = 'none'; document.getElementById('sujet-page').style.display = 'block'; document.getElementById('s-meta').textContent = 'Sujet ' + s.id + '/10 — ' + (who === 'W' ? 'Wassil' : 'Nawal'); renderSujet(s); chronoSecs = 3600; running = false; clearInterval(chronoInterval); updateChrono(); window.scrollTo(0, 0); }
function goHome() { document.getElementById('sujet-page').style.display = 'none'; document.getElementById('home').style.display = 'flex'; clearInterval(chronoInterval); }
function renderSujet(s) {
  let h = `<div class="partie"><div class="partie-header"><span class="partie-label">Énoncé</span><span class="partie-pts">20 pts</span></div><div class="partie-body"><div class="texte-box">${s.enonce}</div>`;
  s.questions.forEach((q, i) => {
    h += `<div class="q-block"><div class="q-line"><span class="q-label">${q.n}.</span><span class="q-text">${q.q}</span><span class="q-pts-sm">${q.pts}pts</span></div><textarea class="answer-ta" id="q${i}" placeholder="Ta réponse..."></textarea><button class="ai-btn" style="font-size:12px;padding:9px;margin-bottom:5px" id="ai-q${i}" onclick="corrigerIA('ai-q${i}','q${i}','${q.q.replace(/'/g, "\\'")}','science',${q.pts},'Sciences')">🔬 Corriger avec l'IA</button><div class="ai-loading" id="ai-q${i}_load"><div class="ai-spin"></div></div><div class="ai-result" id="ai-q${i}_result"></div><button class="corr-btn" onclick="tog('c${i}')">Voir correction</button><div class="corr-box" id="c${i}"><strong>✓</strong> ${q.c}</div></div>`;
  });
  h += `</div></div><div class="auto-eval"><div class="ae-title">— Auto-évaluation</div><div class="ae-row"><span class="ae-label">Note totale sur 20</span><input type="number" class="ae-input" id="ae1" min="0" max="20" value="0" oninput="updateTotal()"><span class="ae-max">/ 20</span></div><div class="ae-total"><div class="ae-total-lbl">Note finale</div><div class="ae-total-num" id="ae-total">0/20</div></div></div>`;
  h += `<div class="nav-btns">${currentIdx > 0 ? `<button class="nav-btn" onclick="openSujet(${currentIdx - 1})">← Précédent</button>` : ''}<button class="save-btn" onclick="saveSujet()">💾 Sauvegarder</button>${currentIdx < SUJETS.length - 1 ? `<button class="nav-btn primary" onclick="openSujet(${currentIdx + 1})">Sujet suivant →</button>` : `<button class="nav-btn primary" onclick="goHome()">🏠 Accueil</button>`}</div>`;
  document.getElementById('s-body').innerHTML = h;
}
function tog(id) { document.getElementById(id).classList.toggle('show'); }
function updateTotal() { const a = parseInt(document.getElementById('ae1').value) || 0; const t = Math.min(a, 20); document.getElementById('ae-total').textContent = t + '/20'; }
async function saveSujet() { const s = SUJETS[currentIdx]; const note = Math.min(parseInt(document.getElementById('ae1').value) || 0, 20); const done = JSON.parse(localStorage.getItem('sciences_done_' + (who || 'X')) || '[]'); if (!done.includes(s.id)) { done.push(s.id); localStorage.setItem('sciences_done_' + (who || 'X'), JSON.stringify(done)); } const url = SHEETS[who]; try { await fetch(url, { method: 'POST', mode: 'cors', body: JSON.stringify({ action: 'logAnnale', matiere: 'Sciences', annee: 'Sujet blanc ' + s.id, exercice: s.titre, score: Math.round(note / 20 * 20), pointsPerdus: 'Note:' + note + '/20', bloque: '', aRetravailler: '' }) }); showToast('✓ Note sauvegardée', 'ok'); } catch (e) { showToast('⚠ Sauvegarde impossible', 'err'); } }
function startChrono() { if (running) return; running = true; chronoInterval = setInterval(() => { if (chronoSecs <= 0) { clearInterval(chronoInterval); running = false; showToast('⏱ Temps écoulé !', 'err'); return; } chronoSecs--; updateChrono(); }, 1000); }
function resetChrono() { clearInterval(chronoInterval); running = false; chronoSecs = 3600; updateChrono(); }
function updateChrono() { const h = Math.floor(chronoSecs / 3600); const m = Math.floor((chronoSecs % 3600) / 60); const s = chronoSecs % 60; const el = document.getElementById('chrono'); el.textContent = `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`; el.className = 'chrono-time' + (chronoSecs < 300 ? ' urgent' : ''); }
function showToast(msg, t) { const el = document.getElementById('toast'); el.textContent = msg; el.className = 'toast show ' + t; setTimeout(() => el.className = 'toast', 3500); }
window.addEventListener('DOMContentLoaded', () => renderHome());

// Proxy Apps Script utilisé — pas de clé ici

async function corrigerIA(btnId, taId, question, typeExo, pts, matiere) {
  const texte = document.getElementById(taId).value.trim();
  if (!texte || texte.length < 10) { alert('Écris ta réponse avant de corriger !'); return; }
  const btn = document.getElementById(btnId);
  const loadEl = document.getElementById(btnId + '_load');
  const resEl = document.getElementById(btnId + '_result');
  btn.disabled = true;
  if (loadEl) loadEl.style.display = 'block';
  if (resEl) resEl.style.display = 'none';
  const prompt = `Tu es correcteur DNB 2026 ${matiere}. Corrige cette réponse scientifique sur ${pts} pts. Critères: mots-clés scientifiques, exactitude, logique. JSON uniquement: {"noteTotal":X,"maxTotal":${pts},"sousNotes":"Mots-clés X, Exactitude X, Logique X","annotations":[{"t":"extrait 8-15 mots","type":"rouge","c":"commentaire"}],"motsClesManquants":["..."],"erreurLogique":"description ou null","methodologie":"<p>Cheminement attendu...</p>","conseil":"Conseil concret."}`;
  try {
    const res = await fetch('https://script.google.com/macros/s/AKfycbwOGUebP39z8WqcGgsNz0lmxFe3dQPW6gy3fV9KcmbbojP2RUpsbXiO0I7s8OQzuTGrsw/exec', {
      method: 'POST', headers: { 'Content-Type': 'text/plain' }, redirect: 'follow',
      body: JSON.stringify({ system: prompt, prompt: 'Question: ' + question + '\n\nRéponse élève:\n\n' + texte + '\n\nJSON uniquement.' })
    });
    const data = await res.json();
    const rawText = data.content || (data.success && data.data && data.data.content) || '';
    const json = JSON.parse(rawText.replace(/```json|```/g, '').trim());
    renderAIRes(resEl, json, texte);
  } catch (e) { alert('Erreur: ' + e.message); }
  if (loadEl) loadEl.style.display = 'none';
  btn.disabled = false;
}
function renderAIRes(el, j, orig) {
  const pct = Math.round(j.noteTotal / j.maxTotal * 100);
  const col = pct >= 75 ? '#7ecf8a' : pct >= 55 ? '#e8c87a' : '#f55a5a';
  const bg = pct >= 75 ? 'rgba(126,207,138,0.08)' : pct >= 55 ? 'rgba(232,200,122,0.08)' : 'rgba(245,85,85,0.08)';
  const barCol = pct >= 75 ? 'linear-gradient(90deg,#7ecf8a,#5ecfb1)' : pct >= 55 ? 'linear-gradient(90deg,#e8c87a,#f07a5a)' : 'linear-gradient(90deg,#f55a5a,#f07a5a)';
  let html = `<div class="ai-score-bar" style="background:${bg}"><div class="ai-score-num" style="color:${col}">${j.noteTotal}/${j.maxTotal}</div><div class="ai-score-info"><div style="font-weight:700;color:${col}">${pct >= 75 ? 'Excellent' : pct >= 55 ? 'À améliorer' : 'Insuffisant'}</div><div class="ai-pbar-bg"><div class="ai-pbar-fill" id="${el.id}_pb" style="width:0%;background:${barCol}"></div></div></div></div><div class="ai-body">`;
  if (j.motsClesManquants && j.motsClesManquants.length) html += `<div class="ai-sec ai-r"><div class="ai-sec-t">Mots-clés manquants</div><div class="ai-sec-b">${j.motsClesManquants.map(m => '<span style="display:inline-block;margin:2px 3px;padding:2px 8px;border-radius:999px;border:1px solid rgba(245,85,85,0.3);background:rgba(245,85,85,0.07);font-size:11px;color:#f55a5a">' + m + '</span>').join('')}</div></div>`;
  if (j.erreurLogique) html += `<div class="ai-sec ai-r"><div class="ai-sec-t">Erreur logique</div><div class="ai-sec-b">${j.erreurLogique}</div></div>`;
  if (j.methodologie) html += `<div class="ai-sec ai-g"><div class="ai-sec-t">Méthodologie</div><div class="ai-sec-b">${j.methodologie}</div></div>`;
  if (j.conseil) html += `<div class="ai-sec ai-p"><div class="ai-sec-t">Conseil</div><div class="ai-sec-b"><strong>${j.conseil}</strong></div></div>`;
  html += `</div>`;
  el.innerHTML = html;
  el.style.display = 'block';
  setTimeout(() => { const b = document.getElementById(el.id + '_pb'); if (b) b.style.width = pct + '%'; }, 100);
}
</script>
