<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sciences — 10 sujets blancs DNB</title>
<style>
  body { background: #09090f; color: #f0ede8; font-family: 'DM Sans', sans-serif; padding: 2rem; }
  .container { max-width: 1000px; margin: 0 auto; }
  .sujet { background: #111118; border-left: 5px solid #3498db; margin: 2rem 0; padding: 1.5rem; border-radius: 12px; position: relative; }
  .texte { background: #0a0a12; padding: 1rem; border-radius: 8px; margin: 1rem 0; white-space: pre-wrap; }
  .document { background: #0a1a1a; padding: 0.8rem; margin: 0.5rem 0; border-radius: 6px; border-left: 3px solid #3498db; white-space: pre-wrap; }
  textarea { width: 100%; background: #181820; border: 1px solid #2a2a35; color: #f0ede8; padding: 0.8rem; margin: 0.5rem 0; border-radius: 8px; font-size: 0.95rem; line-height: 1.5; font-family: 'DM Mono', monospace; resize: vertical; }
  textarea.dictee { min-height: 200px; }
  textarea.redaction { min-height: 250px; }
  button { background: #3498db; border: none; padding: 0.4rem 0.8rem; border-radius: 6px; cursor: pointer; margin-right: 0.5rem; margin-top: 0.3rem; font-size: 0.8rem; color: #09090f; font-weight: 600; }
  button:hover { background: #5aade8; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .correction { display: none; margin-top: 0.5rem; background: #0a0a12; padding: 0.8rem; border-radius: 8px; font-size: 0.9rem; white-space: pre-wrap; }
  .feedback-buttons { margin-top: 0.4rem; display: flex; gap: 0.5rem; }
  .btn-copy { background: #1a1a26; border: 1px solid #3498db; color: #3498db; padding: 0.3rem 0.6rem; border-radius: 6px; font-size: 0.75rem; cursor: pointer; transition: 0.1s; }
  .btn-copy:hover { background: #2a2a36; }
  .save-all-btn { background: #1a1a26; border: 1px solid #3498db; color: #3498db; padding: 0.5rem 1rem; border-radius: 8px; font-size: 0.8rem; cursor: pointer; transition: 0.1s; margin-top: 1rem; width: 100%; }
  .save-all-btn:hover { background: #2a2a36; }
  hr { border-color: #2a2a35; margin: 1rem 0; }
  h3 { color: #3498db; }
  .badge { display: inline-block; background: #3498db20; color: #3498db; padding: 0.2rem 0.6rem; border-radius: 999px; font-size: 0.7rem; margin-left: 0.5rem; }
  .question { margin-top: 1rem; }
  .loading { color: #3498db; font-style: italic; }
  .erreur { color: #e87a7a; }
  .correction-officielle { color: #e87a7a; margin-top: 12px; padding: 8px; background: rgba(232,122,122,0.1); border-radius: 6px; }
  
  @media print {
    body * { visibility: hidden; }
    .print-correction, .print-correction * { visibility: visible; }
    .print-correction { position: absolute; top: 0; left: 0; width: 100%; }
    .no-print { display: none; }
    button { display: none; }
    textarea { display: none; }
  }
</style>
</head>
<body>
<div class="container">
  <h1>Sciences — 10 sujets blancs (DNB)</h1>
  <div id="sujets"></div>
</div>
<script>

// ============================================================
// PROXY QUI MARCHE (identique à sujets-francais.html)
// ============================================================
const PROXY_URL = 'https://script.google.com/macros/s/AKfycbwOGUebP39z8WqcGgsNz0lmxFe3dQPW6gy3fV9KcmbbojP2RUpsbXiO0I7s8OQzuTGrsw/exec';

async function callIA(prompt, system) {
  const response = await fetch(PROXY_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify({ prompt, system }),
    redirect: 'follow'
  });
  if (!response.ok) throw new Error('HTTP ' + response.status);
  const result = await response.json();
  if (result.success && result.content) return result.content;
  throw new Error(result.error || 'Réponse inattendue');
}

function safeParseJSON(txt) {
  try {
    return JSON.parse(txt.replace(/```json|```/g, '').trim());
  } catch(e) { return null; }
}

async function copierCorrection(texte, btn) {
  try {
    await navigator.clipboard.writeText(texte);
    const originalText = btn.textContent;
    btn.textContent = '✓ Copié !';
    setTimeout(() => { btn.textContent = originalText; }, 1500);
  } catch(e) { alert('Impossible de copier'); }
}

// Stockage des corrections IA par sujet
let correctionsIASujet = {};

function stockerCorrectionIA(sujetId, numQuestion, contenu) {
  if (!correctionsIASujet[sujetId]) correctionsIASujet[sujetId] = {};
  correctionsIASujet[sujetId][numQuestion] = contenu;
}

// Sauvegarde unique en bas du sujet
async function sauvegarderTout(sujetId, annee, session, titre, questions) {
  const corrections = {};
  for (let i = 0; i < questions.length; i++) {
    const numQ = i + 1;
    const iaCorr = (correctionsIASujet[sujetId] && correctionsIASujet[sujetId][numQ]) 
      ? correctionsIASujet[sujetId][numQ] 
      : "Non corrigée";
    corrections[numQ] = {
      ia: iaCorr,
      officielle: questions[i].reponse
    };
  }
  
  const data = {
    sujet: sujetId,
    annee: annee,
    session: session,
    titre: titre,
    date: new Date().toISOString(),
    corrections: corrections
  };
  
  // Sauvegarde JSON
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `Sujet_${sujetId}_${annee}_${session.replace(/[()]/g, '').replace(/ /g, '_')}.json`;
  a.click();
  URL.revokeObjectURL(url);
  
  // Génération PDF
  const printDiv = document.createElement('div');
  printDiv.className = 'print-correction';
  printDiv.style.cssText = 'padding: 20px; font-family: "DM Sans", sans-serif; line-height: 1.6;';
  let htmlContent = `<h1>Sujet ${sujetId} - ${annee} (${session})</h1><h2>${titre}</h2><hr>`;
  for (let i = 0; i < questions.length; i++) {
    const numQ = i + 1;
    const iaCorr = (correctionsIASujet[sujetId] && correctionsIASujet[sujetId][numQ]) 
      ? correctionsIASujet[sujetId][numQ] 
      : "Non corrigée";
    htmlContent += `
      <div style="margin-bottom: 20px; border-bottom: 1px solid #ccc; padding-bottom: 10px;">
        <h3>Question ${numQ} (${questions[i].pts} points)</h3>
        <p><strong>Question :</strong> ${questions[i].texte}</p>
        <p><strong>🤖 Correction IA :</strong><br>${iaCorr}</p>
        <p style="color: #e74c3c;"><strong>📖 Correction officielle :</strong><br>${questions[i].reponse}</p>
      </div>
    `;
  }
  htmlContent += `<hr><p style="font-size: 0.8rem;">Document généré le ${new Date().toLocaleDateString()}</p>`;
  printDiv.innerHTML = htmlContent;
  document.body.appendChild(printDiv);
  document.title = `Sujet_${sujetId}_${annee}_${session.replace(/[()]/g, '').replace(/ /g, '_')}.pdf`;
  window.print();
  document.body.removeChild(printDiv);
  document.title = "Sciences - 10 sujets blancs DNB";
  
  alert(`✅ ${Object.keys(correctionsIASujet[sujetId] || {}).length}/${questions.length} corrections sauvegardées (JSON + PDF)`);
}

// ============================================================
// 10 SUJETS SCIENCES

// ============================================================
// CORRECTION EXERCICE
// ============================================================
async function corrigerExercice(idTextarea, reponseAttendue, pts, annee, session, numQuestion, numSujet, texteQuestion, sujetId) {
  const texteEleve = document.getElementById(idTextarea).value.trim();
  if (!texteEleve) { alert("Écris ta réponse avant de corriger."); return; }
  const btn = event.target;
  btn.disabled = true;
  btn.textContent = '⏳...';
  const system = 'Tu es un professeur de sciences bienveillant. Corrige cette réponse. Réponds UNIQUEMENT en JSON valide : {"note": nombre, "commentaire": "explication courte", "conseil": "conseil"}';
  const prompt = 'Question : "' + texteQuestion + '"\nRéponse attendue : "' + reponseAttendue + '"\nRéponse élève : "' + texteEleve + '"\nNote sur ' + pts + ' points.';
  try {
    const txt = await callIA(prompt, system);
    const json = safeParseJSON(txt);
    let contenu = '';
    if (json) {
      contenu = 'Note : ' + json.note + '/' + pts + '\n\n' + json.commentaire + '\n\n💡 Conseil : ' + json.conseil;
      alert(contenu);
    } else {
      contenu = txt;
      alert(txt);
    }
    
    // Stocker la correction IA
    stockerCorrectionIA(sujetId, numQuestion, contenu);
    
    const corrDiv = document.getElementById('corr-' + idTextarea);
    if (corrDiv) {
      corrDiv.innerHTML = contenu;
      const officielleDiv = document.createElement('div');
      officielleDiv.className = 'correction-officielle';
      officielleDiv.innerHTML = '<strong>📖 Correction officielle :</strong><br>' + reponseAttendue;
      corrDiv.appendChild(officielleDiv);
      const btnContainer = document.createElement('div');
      btnContainer.className = 'feedback-buttons';
      btnContainer.innerHTML = `<button class="btn-copy" onclick="copierCorrection(\`${contenu.replace(/`/g, '\\`')}\`, this)">📋 Copier</button>`;
      corrDiv.appendChild(btnContainer);
      corrDiv.style.display = 'block';
    }
  } catch(e) {
    alert('Erreur : ' + e.message);
  }
  btn.disabled = false;
  btn.textContent = 'Corriger avec IA';
}

function afficherCorrection(id) {
  const el = document.getElementById(id);
  el.style.display = (el.style.display === 'block') ? 'none' : 'block';
}

// ============================================================
// RENDU DES SUJETS
// ============================================================
function afficherSujets() {
  const container = document.getElementById('sujets');
  container.innerHTML = '';
  SUJETS.forEach((s, idx) => {
    const num = idx + 1;
    const sujetId = s.id;
    const div = document.createElement('div');
    div.className = 'sujet';
    let html = '<h3>Sujet ' + num + ' – ' + s.annee + ' (' + s.session + ') <span class="badge">' + s.titre + '</span></h3>';
    
    s.questions.forEach((q, i) => {
      const taId = 'exo-' + sujetId + '-' + i;
      const corrId = 'corr-' + taId;
      html += '<div class="question"><strong>Question ' + (i+1) + '</strong> (' + q.pts + ' points)<br>' + q.texte + '</div>';
      html += '<textarea id="' + taId + '" rows="4" placeholder="Votre réponse..."></textarea>';
      html += '<button onclick="corrigerExercice(\'' + taId + '\', \'' + q.reponse.replace(/\\/g, '\\\\').replace(/'/g, "\\'") + '\', ' + q.pts + ', \'' + s.annee + '\', \'' + s.session + '\', ' + (i+1) + ', ' + num + ', \'' + q.texte.replace(/\\/g, '\\\\').replace(/'/g, "\\'") + '\', \'' + sujetId + '\')">Corriger avec IA</button>';
      html += '<button onclick="afficherCorrection(\'corr-officielle-' + taId + '\')">📖 Voir correction officielle</button>';
      html += '<div id="corr-officielle-' + taId + '" class="correction"><strong>✓ Correction officielle :</strong><br>' + q.reponse + '</div>';
      html += '<div id="' + corrId + '" class="correction"></div>';
    });
    
    // Bouton unique en bas du sujet
    html += `<button class="save-all-btn" onclick="sauvegarderTout('${sujetId}', '${s.annee}', '${s.session}', '${s.titre}', ${JSON.stringify(s.questions).replace(/"/g, '&quot;')})">💾 Sauvegarder toutes les corrections (JSON + PDF)</button>`;
    html += '<hr>';
    div.innerHTML = html;
    container.appendChild(div);
  });
}

afficherSujets();
</script>
</body>
</html>
