<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📋 Annales DNB — Brevet 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#09090f;--bg2:#111118;--bg3:#181820;--border:rgba(255,255,255,0.06);--border2:rgba(255,255,255,0.12);--text:#f0ede8;--muted:rgba(240,237,232,0.45);--muted2:rgba(240,237,232,0.2);--gold:#e8c87a;--gold2:#f5dfa0;--teal:#5ecfb1;--coral:#f07a5a;--red:#f55a5a;--green:#7ecf8a;--blue:#6ab4f5;--purple:#a98af5;--r:14px;--r-sm:8px;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;}

/* HOME */
#screen-home{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;background:radial-gradient(ellipse at 50% 0%,rgba(106,180,245,0.08) 0%,transparent 55%);}
.badge{font-family:'DM Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:2px;color:var(--blue);border:1px solid rgba(106,180,245,0.3);background:rgba(106,180,245,0.06);padding:5px 14px;border-radius:999px;margin-bottom:24px;}
.home-title{font-family:'Syne',sans-serif;font-size:clamp(36px,7vw,60px);font-weight:800;text-align:center;line-height:1.05;letter-spacing:-1px;margin-bottom:10px;}
.home-title span{color:var(--blue);}
.home-sub{color:var(--muted);font-size:14px;text-align:center;max-width:480px;line-height:1.7;margin-bottom:36px;}

.years-row{display:flex;gap:8px;margin-bottom:28px;flex-wrap:wrap;justify-content:center;}
.year-chip{padding:8px 18px;border-radius:999px;border:1px solid var(--border2);background:var(--bg2);color:var(--muted);cursor:pointer;font-family:'DM Mono',monospace;font-size:12px;transition:all 0.18s;}
.year-chip.on{border-color:rgba(106,180,245,0.4);background:rgba(106,180,245,0.1);color:var(--blue);}

.mat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:520px;width:100%;margin-bottom:28px;}
.mat-chip{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-sm);padding:12px 10px;cursor:pointer;transition:all 0.18s;text-align:center;}
.mat-chip.on{border-color:rgba(106,180,245,0.35);background:rgba(106,180,245,0.06);}
.mat-ico{font-size:20px;display:block;margin-bottom:4px;}
.mat-nm{font-size:10px;color:var(--muted);font-family:'DM Mono',monospace;text-transform:uppercase;letter-spacing:0.5px;}

.who-row{display:flex;gap:10px;margin-bottom:28px;}
.who-btn{padding:9px 24px;border-radius:999px;border:1px solid var(--border2);background:var(--bg2);color:var(--muted);cursor:pointer;font-family:'DM Sans',sans-serif;font-weight:600;font-size:13px;transition:all 0.18s;}
.who-btn.aw{border-color:#7eb8f5;background:rgba(126,184,245,0.1);color:#7eb8f5;}
.who-btn.an{border-color:#f59eb8;background:rgba(245,158,184,0.1);color:#f59eb8;}

.go-btn{background:linear-gradient(135deg,var(--blue),#4a8fd4);border:none;border-radius:var(--r);padding:15px 48px;color:#fff;font-family:'Syne',sans-serif;font-weight:800;font-size:16px;cursor:pointer;transition:all 0.2s;box-shadow:0 8px 28px rgba(106,180,245,0.22);}
.go-btn:hover{transform:translateY(-2px);}
.go-btn:disabled{opacity:0.35;cursor:not-allowed;transform:none;}

/* EXERCICE */
#screen-exo{display:none;max-width:720px;margin:0 auto;padding:0 24px 60px;}
.exo-header{position:sticky;top:0;z-index:10;background:rgba(9,9,15,0.93);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);padding:12px 0;display:flex;align-items:center;gap:14px;margin:0 -24px;padding:12px 24px;}
.exo-logo{font-family:'Syne',sans-serif;font-weight:800;font-size:14px;color:var(--blue);}
.exo-meta{font-size:11px;color:var(--muted);font-family:'DM Mono',monospace;}
.back-btn{margin-left:auto;background:none;border:1px solid var(--border2);border-radius:var(--r-sm);padding:7px 14px;color:var(--muted);cursor:pointer;font-size:11px;font-family:'DM Mono',monospace;transition:all 0.15s;text-transform:uppercase;}
.back-btn:hover{background:rgba(255,255,255,0.04);color:var(--text);}

.exo-card{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r);padding:28px;margin-top:24px;}
.exo-year-badge{display:inline-flex;align-items:center;gap:8px;font-family:'DM Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--blue);border:1px solid rgba(106,180,245,0.3);background:rgba(106,180,245,0.07);padding:4px 12px;border-radius:999px;margin-bottom:16px;}
.exo-title{font-family:'Syne',sans-serif;font-size:20px;font-weight:800;margin-bottom:6px;}
.exo-pts{font-size:12px;color:var(--gold);font-family:'DM Mono',monospace;margin-bottom:20px;}
.exo-context{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r-sm);padding:16px 18px;margin-bottom:20px;font-size:14px;color:var(--muted);line-height:1.7;border-left:2px solid var(--blue);}
.exo-context strong{color:var(--text);}

.questions-list{display:flex;flex-direction:column;gap:16px;}
.question-block{border:1px solid var(--border);border-radius:var(--r-sm);overflow:hidden;}
.q-header{background:var(--bg3);padding:12px 16px;display:flex;align-items:center;gap:10px;}
.q-num{font-family:'DM Mono',monospace;font-size:11px;color:var(--blue);font-weight:700;}
.q-pts-badge{margin-left:auto;font-family:'DM Mono',monospace;font-size:10px;color:var(--gold);border:1px solid rgba(232,200,122,0.3);background:rgba(232,200,122,0.07);padding:2px 8px;border-radius:999px;}
.q-text{font-size:14px;color:var(--text);flex:1;line-height:1.5;}
.q-body{padding:14px 16px;}
.answer-ta{width:100%;min-height:80px;background:var(--bg);border:1px solid var(--border2);border-radius:var(--r-sm);padding:12px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;line-height:1.7;outline:none;resize:vertical;transition:border-color 0.2s;}
.answer-ta:focus{border-color:rgba(106,180,245,0.4);}
.show-corr-btn{margin-top:10px;background:rgba(106,180,245,0.08);border:1px solid rgba(106,180,245,0.25);border-radius:var(--r-sm);padding:8px 16px;color:var(--blue);cursor:pointer;font-size:12px;font-family:'DM Mono',monospace;text-transform:uppercase;letter-spacing:1px;transition:all 0.15s;}
.show-corr-btn:hover{background:rgba(106,180,245,0.15);}
.correction-box{display:none;margin-top:12px;padding:14px 16px;background:rgba(126,207,138,0.06);border:1px solid rgba(126,207,138,0.25);border-radius:var(--r-sm);}
.correction-box.show{display:block;}
.corr-label{font-family:'DM Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--green);margin-bottom:8px;}
.corr-text{font-size:13px;color:var(--muted);line-height:1.7;}
.corr-text strong{color:var(--text);}

.bareme-section{margin-top:20px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--r-sm);padding:16px;}
.bareme-title{font-family:'DM Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin-bottom:12px;}
.bareme-row{display:flex;align-items:center;gap:12px;padding:6px 0;border-bottom:1px solid var(--border);font-size:12px;}
.bareme-row:last-child{border-bottom:none;}
.bareme-pts{font-family:'DM Mono',monospace;font-size:12px;color:var(--gold);min-width:40px;}
.bareme-desc{color:var(--muted);}

.nav-exo{display:flex;gap:12px;margin-top:24px;}
.nav-btn{flex:1;padding:13px;border-radius:var(--r);border:1px solid var(--border2);background:var(--bg2);color:var(--muted);cursor:pointer;font-family:'DM Sans',sans-serif;font-size:13px;transition:all 0.15s;}
.nav-btn:hover{background:rgba(255,255,255,0.04);color:var(--text);}
.nav-btn.primary{background:linear-gradient(135deg,var(--blue),#4a8fd4);border:none;color:#fff;font-weight:700;}
.nav-btn.primary:hover{transform:translateY(-1px);}

.save-btn{width:100%;background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r);padding:12px;color:var(--muted);cursor:pointer;font-family:'DM Sans',sans-serif;font-size:13px;transition:all 0.15s;margin-top:10px;}
.save-btn:hover{background:rgba(255,255,255,0.04);color:var(--text);}

.toast{position:fixed;bottom:24px;right:24px;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r-sm);padding:12px 20px;font-size:12px;z-index:200;opacity:0;transform:translateY(10px);transition:all 0.3s;pointer-events:none;font-family:'DM Mono',monospace;}
.toast.show{opacity:1;transform:translateY(0);}
.toast.ok{border-color:rgba(94,207,177,0.4);color:var(--teal);}
.toast.err{border-color:rgba(245,90,90,0.4);color:var(--red);}

@media(max-width:480px){.mat-grid{grid-template-columns:repeat(2,1fr);}.nav-exo{flex-direction:column;}}
</style>
</head>
<body>

<div id="screen-home">
  <div class="badge">📋 Sujets type DNB 2021–2025</div>
  <h1 class="home-title">Annales <span>DNB</span></h1>
  <p class="home-sub">Exercices inspirés des sujets officiels 2021–2025. Corrigés détaillés avec barèmes. Entraîne-toi dans les conditions du Brevet.</p>

  <div style="font-size:11px;color:var(--muted);font-family:'DM Mono',monospace;text-transform:uppercase;letter-spacing:1px;margin-bottom:12px">Matière</div>
  <div class="mat-grid">
    <div class="mat-chip on" data-mat="maths"   onclick="togM(this)"><span class="mat-ico">📐</span><span class="mat-nm">Maths</span></div>
    <div class="mat-chip on" data-mat="francais" onclick="togM(this)"><span class="mat-ico">📖</span><span class="mat-nm">Français</span></div>
    <div class="mat-chip on" data-mat="histgeo"  onclick="togM(this)"><span class="mat-ico">🌍</span><span class="mat-nm">Hist-Géo</span></div>
    <div class="mat-chip on" data-mat="svt"      onclick="togM(this)"><span class="mat-ico">🔬</span><span class="mat-nm">SVT</span></div>
    <div class="mat-chip on" data-mat="physchim" onclick="togM(this)"><span class="mat-ico">⚗️</span><span class="mat-nm">Phys-Chimie</span></div>
    <div class="mat-chip on" data-mat="francaislit" onclick="togM(this)"><span class="mat-ico">✍️</span><span class="mat-nm">Rédaction</span></div>
  </div>

  <div style="font-size:11px;color:var(--muted);font-family:'DM Mono',monospace;text-transform:uppercase;letter-spacing:1px;margin-bottom:12px">Qui révise ?</div>
  <div class="who-row">
    <button class="who-btn" id="wb-w" onclick="selWho('W')">Wassil</button>
    <button class="who-btn" id="wb-n" onclick="selWho('N')">Nawal</button>
  </div>
  <button class="go-btn" id="go-btn" onclick="startExo()" disabled>Commencer les annales 📋</button>
</div>

<div id="screen-exo">
  <div class="exo-header">
    <div><div class="exo-logo">📋 Annales DNB</div><div class="exo-meta" id="exo-meta">—</div></div>
    <button class="back-btn" onclick="goHome()">← Retour</button>
  </div>
  <div id="exo-content"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const SHEETS={W:'https://script.google.com/macros/s/AKfycbyak5HZqHjMtAUB2lsfA_tKHmQipCjpfFUE6jN0OTf0GmlFt7ScHrOHkcitGw_5sZc2/exec',N:'https://script.google.com/macros/s/AKfycbxf_F8OOvL7QvtWFcNEHw-ErjYOw7MkQn3d7X-QeS6aqkEDZlVVytTxw3KVbhhszfcs/exec'};

const ANNALES=[
// ══ MATHS ════════════════════════════════════════════════
{id:'m2023a',mat:'maths',annee:'2023',titre:'Probabilités et statistiques',pts:8,
context:'Un sac contient 5 billes rouges, 3 billes bleues et 2 billes vertes. On tire une bille au hasard.',
questions:[
  {num:'1',pts:2,q:'Calculer la probabilité de tirer une bille rouge.',corr:'P(rouge) = 5/10 = 1/2 = 0,5. Il y a 10 billes au total (5+3+2) et 5 sont rouges.'},
  {num:'2',pts:2,q:'Calculer la probabilité de tirer une bille qui n\'est pas bleue.',corr:'P(non bleue) = 1 - P(bleue) = 1 - 3/10 = 7/10 = 0,7. Ou directement : (5+2)/10 = 7/10.'},
  {num:'3',pts:4,q:'On tire 3 billes successivement avec remise. Calculer la probabilité d\'obtenir 3 billes rouges.',corr:'P(3 rouges) = (1/2)³ = 1/8 = 0,125. Avec remise = tirages indépendants, on multiplie les probabilités.'},
],
bareme:[{pts:'2 pts',desc:'Identification correcte de l\'espace de probabilité'},{pts:'2 pts',desc:'Utilisation de la complémentarité'},{pts:'4 pts',desc:'Calcul de probabilité composée avec remise'}]},

{id:'m2022a',mat:'maths',annee:'2022',titre:'Géométrie — Pythagore et trigonométrie',pts:10,
context:'Un triangle ABC est rectangle en B. AB = 6 cm, BC = 8 cm.',
questions:[
  {num:'1',pts:3,q:'Calculer la longueur AC (hypoténuse).',corr:'AC² = AB² + BC² = 36 + 64 = 100. Donc AC = √100 = 10 cm.'},
  {num:'2',pts:3,q:'Calculer cos(Â) et en déduire la mesure de l\'angle A (arrondie au degré).',corr:'cos(Â) = AB/AC = 6/10 = 0,6. Â = arccos(0,6) ≈ 53°.'},
  {num:'3',pts:4,q:'Un poteau vertical de 3 m de hauteur projette une ombre de 4 m. Calculer la distance entre le sommet du poteau et l\'extrémité de l\'ombre.',corr:'On applique Pythagore : d² = 3² + 4² = 9 + 16 = 25. d = 5 m.'},
],
bareme:[{pts:'3 pts',desc:'Application correcte du théorème de Pythagore'},{pts:'3 pts',desc:'Utilisation du cosinus dans un triangle rectangle'},{pts:'4 pts',desc:'Mise en situation et résolution de problème'}]},

{id:'m2024a',mat:'maths',annee:'2024',titre:'Fonctions et représentations graphiques',pts:8,
context:'Une fonction f est définie par f(x) = 2x - 3.',
questions:[
  {num:'1',pts:2,q:'Calculer f(0), f(3) et f(-1).',corr:'f(0) = 2×0-3 = -3. f(3) = 2×3-3 = 3. f(-1) = 2×(-1)-3 = -5.'},
  {num:'2',pts:3,q:'Résoudre f(x) = 5.',corr:'2x - 3 = 5 → 2x = 8 → x = 4. Vérification : f(4) = 2×4-3 = 5 ✓'},
  {num:'3',pts:3,q:'Résoudre f(x) > 0.',corr:'2x - 3 > 0 → 2x > 3 → x > 3/2 = 1,5. La solution est l\'ensemble ]1,5 ; +∞[.'},
],
bareme:[{pts:'2 pts',desc:'Calcul d\'images d\'une fonction'},{pts:'3 pts',desc:'Résolution d\'équation du 1er degré'},{pts:'3 pts',desc:'Résolution d\'inéquation du 1er degré'}]},

{id:'m2021a',mat:'maths',annee:'2021',titre:'Proportionnalité et pourcentages',pts:6,
context:'En 2020, une ville comptait 45 000 habitants. En 2021, la population a augmenté de 4%.',
questions:[
  {num:'1',pts:2,q:'Calculer le nombre d\'habitants en 2021.',corr:'4% de 45 000 = 0,04 × 45 000 = 1 800. Population 2021 = 45 000 + 1 800 = 46 800 habitants. Ou : 45 000 × 1,04 = 46 800.'},
  {num:'2',pts:2,q:'En 2022, la population a diminué de 2% par rapport à 2021. Calculer la population en 2022.',corr:'46 800 × 0,98 = 45 864 habitants.'},
  {num:'3',pts:2,q:'Calculer le taux d\'évolution global entre 2020 et 2022.',corr:'Taux = (45 864 - 45 000)/45 000 × 100 = 864/45 000 × 100 ≈ 1,92%. La population a augmenté d\'environ 1,92%.'},
],
bareme:[{pts:'2 pts',desc:'Calcul d\'augmentation en pourcentage'},{pts:'2 pts',desc:'Calcul de diminution en pourcentage'},{pts:'2 pts',desc:'Taux d\'évolution global'}]},

// ══ FRANÇAIS ═════════════════════════════════════════════
{id:'f2023a',mat:'francais',annee:'2023',titre:'Compréhension de texte — Roman',pts:12,
context:`Texte : "Il s'avança vers la porte avec précaution, le cœur battant à tout rompre. Depuis trois longues années, il n'avait pas revu cette maison de son enfance. Les murs semblaient avoir vieilli, les volets étaient à demi fermés comme des paupières mi-closes. Soudain, une lumière vacilla derrière une fenêtre. Il n'était donc pas seul."`,
questions:[
  {num:'1',pts:3,q:'Relevez deux figures de style dans ce texte et nommez-les.',corr:'1. "le cœur battant à tout rompre" = hyperbole (exagération de l\'émotion). 2. "comme des paupières mi-closes" = comparaison (volets comparés à des paupières). Bonus : "une lumière vacilla" = personnification.'},
  {num:'2',pts:3,q:'Quelle est l\'atmosphère dominante de ce texte ? Justifiez avec 2 relevés précis.',corr:'Atmosphère de tension/mystère/émotion. Justifications possibles : "cœur battant à tout rompre" (tension physique), "trois longues années" (durée pesante), "lumière vacilla" (mystère), "Il n\'était donc pas seul" (suspense final).'},
  {num:'3',pts:3,q:'Relevez tous les indicateurs de temps dans ce texte.',corr:'"Depuis trois longues années" (durée), "Soudain" (rupture temporelle), imparfaits (durée) vs passé simple "s\'avança" (action ponctuelle).'},
  {num:'4',pts:3,q:'Réécrivez la dernière phrase au discours indirect : Il pensa que...',corr:'"Il pensa qu\'il n\'était donc pas seul." Attention : pas de changement de temps ici (conditionnel si discours indirect passé au sens strict, mais le present reste possible).'},
],
bareme:[{pts:'3 pts',desc:'Identification et nomination correcte des figures de style'},{pts:'3 pts',desc:'Analyse de l\'atmosphère avec relevés justifiés'},{pts:'3 pts',desc:'Repérage des indicateurs temporels'},{pts:'3 pts',desc:'Transformation au discours indirect'}]},

{id:'f2022a',mat:'francais',annee:'2022',titre:'Grammaire et conjugaison',pts:10,
context:'Analysez les phrases suivantes et répondez aux questions.',
questions:[
  {num:'1',pts:3,q:'Donnez la nature et la fonction de "rapidement" dans : "Il court rapidement."',corr:'Nature : adverbe de manière. Fonction : complément circonstanciel de manière du verbe "court". Il est invariable.'},
  {num:'2',pts:3,q:'Conjuguez "finir" au plus-que-parfait de l\'indicatif (1ère pers. singulier et pluriel).',corr:'j\'avais fini / nous avions fini. Formation : auxiliaire avoir à l\'imparfait + participe passé du verbe.'},
  {num:'3',pts:4,q:'Réécrivez la phrase au passif : "Le chat mange la souris."',corr:'"La souris est mangée par le chat." Transformation passive : sujet → complément d\'agent (par...), COD → sujet, verbe → être + participe passé accordé.'},
],
bareme:[{pts:'3 pts',desc:'Analyse grammaticale complète (nature + fonction)'},{pts:'3 pts',desc:'Conjugaison du plus-que-parfait'},{pts:'4 pts',desc:'Transformation à la voix passive avec accord correct'}]},

{id:'f2024a',mat:'francaislit',annee:'2024',titre:'Rédaction — Texte narratif',pts:20,
context:'Sujet de rédaction inspiré du DNB 2024',
questions:[
  {num:'Sujet',pts:20,q:'Vous racontez un souvenir d\'enfance important pour vous. Vous expliquerez en quoi il a changé votre façon de voir les choses. (Minimum 300 mots)',
  corr:`Critères d'évaluation DNB :
• Introduction avec mise en situation (2 pts)
• Récit cohérent avec connecteurs logiques (4 pts)
• Description vivante avec figures de style (4 pts)
• Réflexion personnelle développée (4 pts)
• Conclusion avec prise de recul (2 pts)
• Orthographe et grammaire (4 pts)

Points à vérifier : temps narratifs cohérents (imparfait/passé composé), ponctuation, paragraphes distincts, vocabulaire varié.`},
],
bareme:[{pts:'6 pts',desc:'Fond : cohérence, développement des idées, réflexion'},{pts:'6 pts',desc:'Forme narrative : structure, figures de style, description'},{pts:'4 pts',desc:'Langue : grammaire, conjugaison, ponctuation'},{pts:'4 pts',desc:'Orthographe'}]},

// ══ HISTOIRE-GÉO ═════════════════════════════════════════
{id:'h2023a',mat:'histgeo',annee:'2023',titre:'La Première Guerre Mondiale',pts:10,
context:'Répondez aux questions suivantes sur la Première Guerre Mondiale (1914-1918).',
questions:[
  {num:'1',pts:3,q:'Quelles sont les causes principales du déclenchement de la Première Guerre Mondiale ?',corr:'4 causes principales : 1. Nationalisme exacerbé. 2. Système d\'alliances (Triple Entente vs Triple Alliance). 3. Assassinat de François-Ferdinand à Sarajevo (28 juin 1914). 4. Impérialisme colonial et rivalités économiques.'},
  {num:'2',pts:4,q:'Décrivez les conditions de vie des soldats dans les tranchées.',corr:'Conditions très dures : boue, rats, poux, froid. Mort omniprésente. "Vie de poilu" entre assauts meurtriers. Batailles de Verdun et de la Somme (1916) = centaines de milliers de morts. Traumatismes psychologiques (obus, gaz).'},
  {num:'3',pts:3,q:'Quelles sont les conséquences du traité de Versailles (1919) pour l\'Allemagne ?',corr:'Conséquences : 1. Clause de culpabilité (art.231). 2. Réparations financières énormes. 3. Pertes territoriales (Alsace-Lorraine, colonies). 4. Limitation de l\'armée. Ces humiliations alimenteront la montée du nazisme.'},
],
bareme:[{pts:'3 pts',desc:'4 causes identifiées et expliquées'},{pts:'4 pts',desc:'Description précise des conditions de vie'},{pts:'3 pts',desc:'3 conséquences du traité avec explications'}]},

{id:'h2022a',mat:'histgeo',annee:'2022',titre:'La mondialisation',pts:10,
context:'La mondialisation est au programme du DNB depuis plusieurs années.',
questions:[

  {num:'2',pts:4,q:'Faites l\'échiquier de croisement et déterminez les probabilités pour les enfants du couple.',corr:'Père : X^m Y (porteur de la mutation sur X). Mère : X^n X^n (saine). Enfants : filles X^m X^n (porteuses saines, 50%) et X^n X^n (saines, 50%). Garçons : X^m Y (malades, 50%) et X^n Y (sains, 50%). Seuls les garçons peuvent être malades.'},

let who=null, selMats=new Set(['maths','francais','histgeo','svt','physchim','francaislit']);
let currentExos=[], currentIdx=0;

function togM(el){const m=el.dataset.mat;if(selMats.has(m)){if(selMats.size<=1)return;selMats.delete(m);el.classList.remove('on');}else{selMats.add(m);el.classList.add('on');}}
function selWho(w){who=w;document.getElementById('wb-w').className='who-btn'+(w==='W'?' aw':'');document.getElementById('wb-n').className='who-btn'+(w==='N'?' an':'');document.getElementById('go-btn').disabled=false;}
function goHome(){document.getElementById('screen-exo').style.display='none';document.getElementById('screen-home').style.display='flex';}

function startExo(){
  currentExos=shuffle(ANNALES.filter(e=>selMats.has(e.mat)));
  currentIdx=0;
  document.getElementById('screen-home').style.display='none';
  document.getElementById('screen-exo').style.display='block';
  renderExo();
}

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

const MAT_LABELS={maths:'📐 Maths',francais:'📖 Français',histgeo:'🌍 Hist-Géo',svt:'🔬 SVT',physchim:'⚗️ Phys-Chimie',francaislit:'✍️ Rédaction'};

function renderExo(){
  const e=currentExos[currentIdx];
  document.getElementById('exo-meta').textContent=(currentIdx+1)+' / '+currentExos.length+' — '+(who==='W'?'Wassil':'Nawal');

  let html=`<div class="exo-card">
    <div class="exo-year-badge">${MAT_LABELS[e.mat]||e.mat} · DNB ${e.annee}</div>
    <div class="exo-title">${e.titre}</div>
    <div class="exo-pts">Exercice sur ${e.pts} points</div>`;

  if(e.context) html+=`<div class="exo-context">${e.context.replace(/\n/g,'<br>')}</div>`;

  html+=`<div class="questions-list">`;
  e.questions.forEach((q,i)=>{
    html+=`<div class="question-block">
      <div class="q-header">
        <span class="q-num">Question ${q.num}</span>
        <span class="q-text">${q.q}</span>
        <span class="q-pts-badge">${q.pts} pt${q.pts>1?'s':''}</span>
      </div>
      <div class="q-body">
        <textarea class="answer-ta" id="ta-${i}" placeholder="Écris ta réponse ici..."></textarea>
        <button class="show-corr-btn" onclick="showCorr(${i})">Voir la correction</button>
        <div class="correction-box" id="corr-${i}">
          <div class="corr-label">✓ Correction</div>
          <div class="corr-text">${q.corr.replace(/\n/g,'<br>')}</div>
        </div>
      </div>
    </div>`;
  });
  html+=`</div>`;

  // Barème
  if(e.bareme&&e.bareme.length){
    html+=`<div class="bareme-section"><div class="bareme-title">— Barème officiel</div>`;
    e.bareme.forEach(b=>{html+=`<div class="bareme-row"><span class="bareme-pts">${b.pts}</span><span class="bareme-desc">${b.desc}</span></div>`;});
    html+=`</div>`;
  }

  // Navigation
  html+=`<div class="nav-exo">
    ${currentIdx>0?`<button class="nav-btn" onclick="prevExo()">← Précédent</button>`:''}
    <button class="save-btn" onclick="saveExo()">💾 Sauvegarder</button>
    ${currentIdx<currentExos.length-1?`<button class="nav-btn primary" onclick="nextExo()">Exercice suivant →</button>`:`<button class="nav-btn primary" onclick="goHome()">🏠 Retour accueil</button>`}
  </div>`;

  html+=`</div>`;
  document.getElementById('exo-content').innerHTML=html;
  window.scrollTo(0,0);
}

function showCorr(i){
  const box=document.getElementById('corr-'+i);
  box.classList.toggle('show');
  const btn=box.previousElementSibling;
  btn.textContent=box.classList.contains('show')?'Masquer la correction':'Voir la correction';
}

function nextExo(){currentIdx++;renderExo();}
function prevExo(){currentIdx--;renderExo();}

async function saveExo(){
  const e=currentExos[currentIdx];
  const url=SHEETS[who];
  try{
    const res=await fetch(url,{method:'POST',mode:'cors',body:JSON.stringify({action:'logAnnale',matiere:MAT_LABELS[e.mat]||e.mat,annee:e.annee,exercice:e.titre,score:'',pointsPerdus:'',bloque:'',aRetravailler:''})});
    if(res.ok)showToast('✓ Exercice noté dans le Sheet','ok');
    else throw 0;
  }catch(e){showToast('⚠ Sauvegarde impossible','err');}
}

function showToast(msg,t){const el=document.getElementById('toast');el.textContent=msg;el.className='toast show '+t;setTimeout(()=>el.className='toast',3500);}
</script>
