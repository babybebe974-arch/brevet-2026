      {q:"Quelles sont les inégalités territoriales dans l'UE ?", r:"Opposition Est/Ouest (PIB), métropoles dynamiques / périphéries en déclin."},
      {q:"Qu'est-ce que le corridor Rhin-Rhône ?", r:"Infrastructure de transport (voie navigable, autoroute, LGV) traversant l'Europe."},

    // CHAPITRE 24 : Mondialisation – 10 cartes
    24: [
      {q:"Qu'est-ce que la mondialisation ?", r:"Mise en relation des différentes parties du monde par les échanges (marchandises, capitaux, informations, personnes)."},
      {q:"Qu'est-ce qu'une FMN ?", r:"Firme multinationale (Apple, Total, Nestlé). Possède des filiales dans plusieurs pays."},
      {q:"Quels sont les trois piliers institutionnels de la mondialisation ?", r:"OMC (commerce), FMI (finance), Banque mondiale (développement)."},
      {q:"Quels sont les flux de la mondialisation ?", r:"Marchandises (conteneurs), capitaux (bourses), informations (Internet), personnes (touristes, migrants)."},
      {q:"Qu'est-ce qu'un hub ?", r:"Plateforme de transport (aéroport, port) où transitent les flux mondiaux (Dubaï, Singapour, Rotterdam)."},
      {q:"Qu'est-ce qu'une mégalopole ?", r:"Région urbaine très peuplée et connectée (Tokyo, New York, Londres, Shanghai, Paris)."},
      {q:"Que sont les pays émergents ?", r:"Pays en développement dont l'économie connaît une forte croissance (BRICS)."},
      {q:"Quelles sont les inégalités spatiales de la mondialisation ?", r:"Métropoles gagnantes / territoires perdants (désindustrialisation, périphéries abandonnées)."},
      {q:"Qu'est-ce qu'une ZES (zone économique spéciale) ?", r:"Zone où les entreprises bénéficient d'avantages fiscaux et douaniers (Shenzhen en Chine)."},
      {q:"Qu'est-ce que la mondialisation culturelle ?", r:"Diffusion mondiale de modes de vie, de produits, de valeurs (fast-food, cinéma américain, réseaux sociaux)."}
    ],
    // CHAPITRE 25 : Inégalités de développement – 8 cartes
    25: [
      {q:"Qu'est-ce que l'IDH ?", r:"Indice de développement humain. Mesure le développement d'un pays (PIB, santé, éducation)."},
      {q:"Qu'est-ce que la distinction Nord/Sud ?", r:"Nord = pays développés (fort IDH). Sud = pays en développement (IDH faible)."},
      {q:"Que sont les PMA (pays les moins avancés) ?", r:"Pays avec un IDH très faible (Afrique subsaharienne, Afghanistan, Haïti)."},
      {q:"Pourquoi le taux d'alphabétisation est-il un indicateur de développement ?", r:"Permet de mesurer l'accès à l'éducation, facteur de développement économique."},
      {q:"Qu'est-ce que l'espérance de vie ?", r:"Durée de vie moyenne dans un pays. Reflète la qualité du système de santé."},
      {q:"Que sont les OMD (objectifs du millénaire) ?", r:"Objectifs fixés par l'ONU en 2000 (réduire la pauvreté, lutter contre les maladies)."},
      {q:"Que sont les ODD (objectifs de développement durable) ?", r:"17 objectifs adoptés par l'ONU en 2015 pour 2030 (climat, inégalités, paix)."},
      {q:"Qu'est-ce que la fracture numérique ?", r:"Inégalité d'accès à Internet et aux technologies numériques entre pays et entre populations."}
    ],
    // CHAPITRE 26 : Défis du XXIe siècle – 10 cartes
    26: [
      {q:"Qu'est-ce que le changement climatique ?", r:"Augmentation de la température moyenne (GES). Conséquences : fonte des glaces, montée des eaux, catastrophes."},
      {q:"Qu'est-ce que la transition énergétique ?", r:"Passage des énergies fossiles (charbon, pétrole) aux énergies renouvelables."},
      {q:"Quels sont les types de migrations ?", r:"Économiques (travail), politiques (réfugiés, guerres), climatiques (sécheresses, inondations)."},
      {q:"Qu'est-ce qu'un conflit asymétrique ?", r:"Conflit entre armée régulière et groupes non étatiques (terrorisme, guérilla)."},
      {q:"Qu'est-ce que le développement durable ?", r:"Développement qui répond aux besoins actuels sans compromettre la capacité des générations futures."},
      {q:"Qu'est-ce que l'économie circulaire ?", r:"Économie qui recycle, répare, réutilise pour limiter les déchets."},
      {q:"Quels sont les défis de l'intelligence artificielle ?", r:"Éthique, suppression d'emplois, surveillance des populations, désinformation."},
      {q:"Qu'est-ce que la désinformation (fake news) ?", r:"Fausses informations diffusées intentionnellement (réseaux sociaux, médias) pour manipuler l'opinion."},
      {q:"Qu'est-ce que la pandémie de Covid-19 ?", r:"Maladie virale apparue en 2019. Confinements, télétravail, vaccins, conséquences économiques."},
      {q:"Qu'est-ce que la perte de biodiversité ?", r:"Disparition massive des espèces (sixième extinction). Causes : déforestation, pollution, climat."}
    ],
    // CHAPITRE 27 : Valeurs de la République (EMC) – 8 cartes
    27: [
      {q:"Que signifie 'liberté' dans la devise républicaine ?", r:"Liberté d'expression, de presse, de conscience, de réunion. Limites : diffamation, incitation à la haine."},
      {q:"Que signifie 'égalité' dans la devise républicaine ?", r:"Égalité des droits, égalité homme/femme, lutte contre les discriminations."},
      {q:"Que signifie 'fraternité' dans la devise républicaine ?", r:"Solidarité (sécurité sociale, impôt). Aide aux plus faibles."},
      {q:"Qu'est-ce que la laïcité en France ?", r:"Principe de neutralité de l'État. Séparation des Églises et de l'État (loi de 1905). Liberté de conscience."},
      {q:"Quelle est la devise de la République française ?", r:"Liberté, Égalité, Fraternité."},
      {q:"Que signifie la neutralité des agents publics ?", r:"Les fonctionnaires (enseignants, policiers, juges) ne doivent pas manifester leurs opinions religieuses."},
      {q:"Qu'est-ce que la charte de la laïcité (2013) ?", r:"Texte rappelant les règles de la laïcité à l'école. Affiché dans tous les établissements scolaires."},
      {q:"Quelles sont les limites à la liberté d'expression ?", r:"Diffamation, incitation à la haine, négationnisme, apologie du terrorisme."}
    ],
    // CHAPITRE 28 : Citoyenneté française (EMC) – 8 cartes
    28: [
      {q:"Qu'est-ce que le droit du sol ?", r:"Obtention de la nationalité par naissance sur le territoire français."},
      {q:"Qu'est-ce que le droit du sang ?", r:"Obtention de la nationalité par filiation (parents français)."},
      {q:"Qu'est-ce que la naturalisation ?", r:"Procédure pour devenir français quand on ne remplit pas les conditions du droit du sol ou du sang."},
      {q:"Quelles sont les conditions pour voter ?", r:"Être majeur (18 ans), de nationalité française, jouir de ses droits civils."},
      {q:"Qu'est-ce que le devoir de défense ?", r:"JDC (journée défense citoyenneté). Obligatoire pour les jeunes (16-18 ans)."},
      {q:"Qu'est-ce que le SNU ?", r:"Service national universel (séjour de cohésion de 12 jours). Obligatoire (sauf dispense)."},
      {q:"Qu'est-ce que le service civique ?", r:"Engagement volontaire (6-12 mois) dans une association. Indemnisé."},
      {q:"Quels sont les trois niveaux des institutions françaises ?", r:"Communes (mairies), départements (conseils départementaux), régions (conseils régionaux). L'État (Président, Parlement)."}
    ],
    // CHAPITRE 29 : Justice en France (EMC) – 8 cartes
    29: [
      {q:"Quels sont les trois grands principes de la justice française ?", r:"Indépendance (juges indépendants), égalité devant la loi, présomption d'innocence."},
      {q:"Qu'est-ce que la présomption d'innocence ?", r:"Toute personne est considérée innocente tant qu'elle n'a pas été jugée coupable."},
      {q:"Quelle est la différence entre justice civile et justice pénale ?", r:"Civile : litiges entre personnes (divorce, contrat). Pénale : infractions (délits, crimes)."},
      {q:"Qu'est-ce que la cour d'assises ?", r:"Juridiction qui juge les crimes (meurtre, viol). Juges + jury populaire de 6 citoyens."},
      {q:"Qu'est-ce que le TIG (travail d'intérêt général) ?", r:"Peine alternative à l'emprisonnement. Le condamné effectue un travail non rémunéré pour la collectivité."},
      {q:"Qu'est-ce que le juge des enfants ?", r:"Magistrat spécialisé dans la protection des mineurs en danger ou délinquants."},
      {q:"Qu'est-ce que le tribunal de proximité ?", r:"Juge les petits litiges (moins de 10 000 €) rapidement."},
      {q:"Qu'est-ce que l'aide juridictionnelle ?", r:"Prise en charge par l'État des frais de justice pour les personnes aux revenus modestes."}
    ],
    // CHAPITRE 30 : Débat démocratique et médias (EMC) – 8 cartes
    30: [
      {q:"Quels sont les trois rôles des médias en démocratie ?", r:"Informer les citoyens, permettre le débat public, contrôler le pouvoir (contre-pouvoir)."},
      {q:"Qu'est-ce que la liberté de la presse ?", r:"Droit d'informer sans censure préalable. Garantie par la loi de 1881."},
      {q:"Que sont les fake news ?", r:"Fausses informations diffusées intentionnellement pour manipuler l'opinion publique."},
      {q:"Qu'est-ce que le fact-checking ?", r:"Vérification des faits par des journalistes pour lutter contre la désinformation."},
      {q:"Quels sont les dangers des réseaux sociaux ?", r:"Bulles de filtre (enfermement idéologique), harcèlement, diffusion de fake news, radicalisation."},
      {q:"Qu'est-ce que la loi de 1881 sur la liberté de la presse ?", r:"Loi fondamentale qui garantit la liberté d'expression et de publication en France."},
      {q:"Qu'est-ce que le droit de grève ?", r:"Droit des salariés de cesser le travail pour défendre leurs revendications. Reconnu par la Constitution."},
      {q:"Que sont les associations loi 1901 ?", r:"Associations à but non lucratif. Permettent l'expression citoyenne (sport, culture, humanitaire)."}
    ]
  };

  // Stockage de la progression
  let progression = JSON.parse(localStorage.getItem("flashcards_histoire")) || {};
  let currentChapter = 10;
  let currentCards = [];
  let currentIndex = 0;
  let currentCardObj = null;

  function sauvegarderProgression() { localStorage.setItem("flashcards_histoire", JSON.stringify(progression)); }

  function getCardKey(chapitre, question) { return `ch${chapitre}_${question}`; }

  function melanger(tableau) {
    for (let i = tableau.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [tableau[i], tableau[j]] = [tableau[j], tableau[i]];
    }
    return tableau;
  }

  function chargerChapitre(chapitre) {
    currentChapter = chapitre;
    const cartesSource = flashcardsParChapitre[chapitre];
    if (!cartesSource) { document.getElementById("card-area").innerHTML = '<div class="progress">Chapitre introuvable.</div>'; return; }
    
    // Filtrer les cartes non maîtrisées (score < 3)
    let cartes = cartesSource.filter(c => {
      const key = getCardKey(chapitre, c.q);
      return !progression[key] || progression[key] < 3;
    });
    
    if (cartes.length === 0) {
      document.getElementById("card-area").innerHTML = '<div class="progress">🎉 Félicitations ! Toutes les cartes de ce chapitre sont maîtrisées. Passez au chapitre suivant !</div>';
      document.getElementById("stats").innerHTML = `✅ Chapitre ${chapitre} : maîtrisé !`;
      return;
    }
    
    currentCards = melanger([...cartes]);
    currentIndex = 0;
    afficherCarteCourante();
    mettreAJourStats(chapitre);
  }

  function afficherCarteCourante() {
    if (currentIndex >= currentCards.length) {
      chargerChapitre(currentChapter);
      return;
    }
    currentCardObj = currentCards[currentIndex];
    const key = getCardKey(currentChapter, currentCardObj.q);
    const score = progression[key] || 0;
    
    document.getElementById("card-area").innerHTML = `
      <div class="flashcard" onclick="revelerReponse()">
        <div class="question">📖 ${currentCardObj.q}</div>
        <div class="answer" id="answer">📌 ${currentCardObj.r}</div>
        <div class="show-answer">👆 Cliquez pour voir la réponse</div>
      </div>
      <div class="btn-group" id="btns" style="display:none;">
        <button onclick="repondre(true)">✅ Je sais (${score}/3)</button>
        <button onclick="repondre(false)">❌ Je ne sais pas</button>
      </div>
    `;
    document.getElementById("session-stats").innerHTML = `📌 Carte ${currentIndex+1}/${currentCards.length} · Chapitre ${currentChapter}`;
  }

  window.revelerReponse = function() {
    document.getElementById("answer").style.display = "block";
    document.getElementById("btns").style.display = "flex";
  };

  window.repondre = function(reussi) {
    const key = getCardKey(currentChapter, currentCardObj.q);
    let score = progression[key] || 0;
    if (reussi) { score = Math.min(score + 1, 3); }
    else { score = 0; }
    progression[key] = score;
    sauvegarderProgression();
    currentIndex++;
    afficherCarteCourante();
    mettreAJourStats(currentChapter);
  };

  function mettreAJourStats(chapitre) {
    const cartesSource = flashcardsParChapitre[chapitre];
    if (!cartesSource) return;
    let total = cartesSource.length;
    let maitrisees = 0;
    for (let c of cartesSource) {
      const key = getCardKey(chapitre, c.q);
      if (progression[key] >= 3) maitrisees++;
    }
    document.getElementById("stats").innerHTML = `📊 Chapitre ${chapitre} : ${maitrisees}/${total} cartes maîtrisées · ${Math.round(maitrisees/total*100)}%`;
  }

  function reinitialiserChapitre() {
    if (confirm(`Réinitialiser le chapitre ${currentChapter} ?`)) {
      const cartesSource = flashcardsParChapitre[currentChapter];
      if (cartesSource) {
        for (let c of cartesSource) {
          const key = getCardKey(currentChapter, c.q);
          delete progression[key];
        }
        sauvegarderProgression();
        chargerChapitre(currentChapter);
      }
    }
  }

  function reinitialiserTout() {
    if (confirm("⚠️ Attention : cela supprimera TOUTE progression dans TOUS les chapitres. Êtes-vous sûr ?")) {
      localStorage.removeItem("flashcards_histoire");
      progression = {};
      chargerChapitre(currentChapter);
    }
  }

  function remplirSelecteur() {
    const select = document.getElementById("chapterSelect");
    select.innerHTML = "";
    for (let i = 10; i <= 30; i++) {
      if (flashcardsParChapitre[i]) {
        const option = document.createElement("option");
        option.value = i;
        let titre = "";
        if (i===10) titre = "10. Première Guerre mondiale";
        else if (i===11) titre = "11. Sortie de guerre et traités";
        else if (i===12) titre = "12. Montée des totalitarismes";
        else if (i===13) titre = "13. Guerre-éclair (1939-1941)";
        else if (i===14) titre = "14. Guerre d'anéantissement (1941-1945)";
        else if (i===15) titre = "15. Libération et bilan";
        else if (i===16) titre = "16. Guerre froide (1947-1991)";
        else if (i===17) titre = "17. Construction européenne";
        else if (i===18) titre = "18. Décolonisation";
        else if (i===19) titre = "19. Après-guerre froide (1991→)";
        else if (i===20) titre = "20. Aires urbaines (géographie)";
        else if (i===21) titre = "21. Espaces productifs";
        else if (i===22) titre = "22. Espaces de faible densité";
        else if (i===23) titre = "23. Union européenne (géographie)";
        else if (i===24) titre = "24. Mondialisation";
        else if (i===25) titre = "25. Inégalités de développement";
        else if (i===26) titre = "26. Défis du XXIe siècle";
        else if (i===27) titre = "27. Valeurs de la République (EMC)";
        else if (i===28) titre = "28. Citoyenneté française (EMC)";
        else if (i===29) titre = "29. Justice en France (EMC)";
        else if (i===30) titre = "30. Débat démocratique et médias (EMC)";
        else titre = `${i}. Chapitre ${i}`;
        option.textContent = titre;
        select.appendChild(option);
      }
    }
    select.value = "10";
  }

  // Événements
  document.getElementById("loadChapterBtn").addEventListener("click", () => {
    const chap = parseInt(document.getElementById("chapterSelect").value);
    currentChapter = chap;
    chargerChapitre(currentChapter);
  });
  document.getElementById("resetChapterBtn").addEventListener("click", reinitialiserChapitre);
  document.getElementById("resetAllBtn").addEventListener("click", reinitialiserTout);
  
  remplirSelecteur();
  chargerChapitre(10);
</script>
