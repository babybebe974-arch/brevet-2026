<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>🌍 Flashcards Histoire-Géo & EMC – Brevet 2026</title>
  <script src="data-histgeo.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:#000000;font-family:'DM Sans',sans-serif;padding:1rem;color:#ffffff;}
    .container{max-width:1000px;margin:0 auto;background:#1a1a1a;border-radius:2rem;padding:1.5rem;border:1px solid #e74c3c;}
    h1{font-family:'Playfair Display',serif;font-size:2rem;color:#e74c3c;margin-bottom:0.25rem;}
    .sub{color:#aaa;margin-bottom:1rem;border-left:3px solid #e74c3c;padding-left:1rem;font-size:0.8rem;}
    .stats{background:#2a2a2a;border-radius:1rem;padding:0.8rem;margin-bottom:1rem;font-size:0.75rem;display:flex;justify-content:space-between;flex-wrap:wrap;}
    .selector-group{display:flex;flex-wrap:wrap;gap:1rem;margin-bottom:1rem;align-items:center;}
    select{background:#2a2a2a;border:1px solid #333;border-radius:40px;padding:0.5rem 1rem;color:white;font-size:0.8rem;flex:1;min-width:200px;}
    button{background:#1e2a3e;border:1px solid #5ecfb1;border-radius:40px;padding:0.5rem 1.2rem;font-size:0.8rem;color:#5ecfb1;cursor:pointer;}
    button:hover{background:#2a3652;}
    .flashcard{background:#2a2a2a;border:1px solid #333;border-radius:1.5rem;padding:2rem;text-align:center;cursor:pointer;min-height:280px;display:flex;align-items:center;justify-content:center;flex-direction:column;}
    .flashcard:hover{border-color:#e74c3c;}
    .question{font-size:1.1rem;margin-bottom:1rem;font-weight:500;}
    .answer{font-size:1rem;color:#e74c3c;margin-top:1rem;display:none;line-height:1.5;}
    .show-answer{color:#5ecfb1;font-size:0.8rem;margin-top:1rem;}
    .btn-group{display:flex;gap:1rem;justify-content:center;margin-top:1rem;flex-wrap:wrap;}
    .progress{background:#2a2a2a;border-radius:1rem;padding:0.6rem;margin-top:1rem;font-size:0.7rem;color:#aaa;text-align:center;}
    .back-link{display:inline-block;margin-top:1rem;text-decoration:none;color:#5ecfb1;font-size:0.8rem;}
    .chapitres-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;max-height:400px;overflow-y:auto;padding:4px;margin-bottom:1rem;background:#2a2a2a;border-radius:1rem;}
    .ch-item{display:flex;align-items:center;gap:8px;background:#111118;border:1px solid #333;border-radius:8px;padding:8px 12px;cursor:pointer;transition:.15s;font-size:12px;}
    .ch-item:hover{border-color:#e74c3c;}
    .ch-item.selected{border-color:#e74c3c;background:rgba(231,76,60,0.1);}
    .ch-num{font-family:'DM Mono',monospace;font-size:10px;color:#aaa;min-width:28px;}
    .btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:1rem;}
    .btn-primary{background:#ffcc00;border-color:#ffcc00;color:#000;font-weight:700;}
  </style>
</head>
<body>
<div class="container">
  <h1>🌍 Flashcards Histoire-Géo & EMC</h1>
  <div class="sub">Sélectionne plusieurs chapitres • 32 chapitres • 276 cartes</div>

  <div class="stats" id="stats">
    <span>📚 <b id="nbCartes">0</b> cartes sélectionnées</span>
    <span>✅ <b id="nbMaitrisees">0</b> maîtrisées</span>
    <span>📈 <b id="nbProgress">0</b>%</span>
  </div>

  <div class="chapitres-grid" id="chapitresGrid"></div>

  <div class="btn-row">
    <button onclick="selectAll(true)">✅ Tout sélectionner</button>
    <button onclick="selectAll(false)">❌ Tout désélectionner</button>
    <button onclick="resetProgression()" style="border-color:#e87a7a;color:#e87a7a;">🔄 Réinitialiser progression</button>
  </div>

  <div class="btn-row">
    <button id="btnStart" class="btn-primary" onclick="demarrerSession()" disabled>🎯 Démarrer la session</button>
  </div>

  <div id="card-area"></div>
  <div id="session-stats" class="progress"></div>

  <a href="index.html" class="back-link">← Retour au hub</a>
</div>

<script>
// ==================== LOGIQUE FLASHCARDS ====================
let progression = {};
let sessionCartes = [];
let currentIndex = 0;
let currentCard = null;

function getStorageKey() { return 'flashcards_histgeo_progression'; }
function sauvegarderProgression() { localStorage.setItem(getStorageKey(), JSON.stringify(progression)); }
function chargerProgression() {
  const saved = localStorage.getItem(getStorageKey());
  if (saved) progression = JSON.parse(saved);
  else progression = {};
}

function getCardKey(carte) { return `${carte.chapitre}_${carte.q.substring(0,50)}`; }

function getNiveau(carteId) { return progression[carteId]?.score || 0; }
function setNiveau(carteId, val) { 
  progression[carteId] = { score: Math.min(3, val), etat: val >= 3 ? "maitrisee" : (val > 0 ? "en_cours" : "nouvelle") }; 
  sauvegarderProgression(); 
}

function getSelectedChapitres() {
  let selected = [];
  for (let i = 1; i <= 32; i++) {
    const el = document.getElementById(`ch_${i}`);
    if (el && el.classList.contains('selected')) selected.push(i);
  }
  return selected;
}

function getCartesSelectionnees() {
  const selected = getSelectedChapitres();
  let cartes = [];
  for (let ch of selected) {
    if (CHAPITRES_HG[ch] && CHAPITRES_HG[ch].cartes) {
      for (let c of CHAPITRES_HG[ch].cartes) {
        cartes.push({ ...c, chapitre: ch, chapitreTitre: CHAPITRES_HG[ch].titre });
      }
    }
  }
  return cartes;
}

function mettreAJourStats() {
  const cartes = getCartesSelectionnees();
  let total = cartes.length;
  let maitrisees = 0;
  for (let c of cartes) {
    if (getNiveau(getCardKey(c)) >= 3) maitrisees++;
  }
  const pct = total > 0 ? Math.round(maitrisees / total * 100) : 0;
  document.getElementById('nbCartes').textContent = total;
  document.getElementById('nbMaitrisees').textContent = maitrisees;
  document.getElementById('nbProgress').textContent = pct + '%';
  document.getElementById('btnStart').disabled = total === 0;
}

function buildChapitresGrid() {
  const grid = document.getElementById('chapitresGrid');
  grid.innerHTML = '';
  for (let i = 1; i <= 32; i++) {
    if (!CHAPITRES_HG[i]) continue;
    const div = document.createElement('div');
    div.className = 'ch-item';
    div.id = `ch_${i}`;
    div.onclick = () => { div.classList.toggle('selected'); mettreAJourStats(); };
    div.innerHTML = `<span class="ch-num">${i}</span><span>${CHAPITRES_HG[i].titre}</span>`;
    grid.appendChild(div);
  }
}

function selectAll(val) {
  for (let i = 1; i <= 32; i++) {
    const el = document.getElementById(`ch_${i}`);
    if (el) {
      if (val) el.classList.add('selected');
      else el.classList.remove('selected');
    }
  }
  mettreAJourStats();
}

function resetProgression() {
  if (confirm('⚠️ Supprimer toute la progression des flashcards histoire-géo ?')) {
    localStorage.removeItem(getStorageKey());
    progression = {};
    mettreAJourStats();
    alert('✅ Progression réinitialisée');
  }
}

function melanger(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function selectionnerCartesDuJour() {
  const toutes = getCartesSelectionnees();
  const nouvelles = toutes.filter(c => getNiveau(getCardKey(c)) === 0).slice(0, 20);
  const erreurs = toutes.filter(c => getNiveau(getCardKey(c)) > 0 && getNiveau(getCardKey(c)) < 3).slice(0, 10);
  const revoir = toutes.filter(c => getNiveau(getCardKey(c)) >= 3).slice(0, 5);
  let selected = [...nouvelles, ...erreurs, ...revoir];
  const ids = new Set();
  selected = selected.filter(c => { const k = getCardKey(c); if (ids.has(k)) return false; ids.add(k); return true; });
  return melanger(selected);
}

function demarrerSession() {
  sessionCartes = selectionnerCartesDuJour();
  if (sessionCartes.length === 0) {
    alert('Aucune carte disponible pour les chapitres sélectionnés.');
    return;
  }
  currentIndex = 0;
  document.getElementById('card-area').style.display = 'block';
  document.getElementById('session-stats').style.display = 'block';
  afficherCarte();
}

function afficherCarte() {
  if (currentIndex >= sessionCartes.length) {
    document.getElementById('card-area').innerHTML = '<div class="progress">🎉 Bravo ! Session terminée.</div>';
    document.getElementById('session-stats').innerHTML = `✅ Session terminée ! ${sessionCartes.length} cartes revues.`;
    mettreAJourStats();
    return;
  }
  currentCard = sessionCartes[currentIndex];
  const niveau = getNiveau(getCardKey(currentCard));
  document.getElementById('card-area').innerHTML = `
    <div class="flashcard" onclick="revelerReponse()">
      <div style="font-size:0.7rem;color:#aaa;margin-bottom:8px;">${currentCard.chapitreTitre}</div>
      <div class="question">📖 ${currentCard.q}</div>
      <div class="answer" id="answer">📌 ${currentCard.r}</div>
      <div class="show-answer">👆 Cliquez pour voir la réponse</div>
    </div>
    <div class="btn-group" id="btns" style="display:none;">
      <button onclick="repondre(true)">✅ Je sais (${niveau}/3)</button>
      <button onclick="repondre(false)">❌ Je ne sais pas</button>
    </div>
  `;
  document.getElementById('session-stats').innerHTML = `📌 Carte ${currentIndex+1}/${sessionCartes.length} · Score: ${niveau}/3`;
}

window.revelerReponse = function() {
  document.getElementById("answer").style.display = "block";
  document.getElementById("btns").style.display = "flex";
};

window.repondre = function(reussi) {
  const key = getCardKey(currentCard);
  let niveau = getNiveau(key);
  if (reussi) niveau = Math.min(niveau + 1, 3);
  else niveau = Math.max(0, niveau - 1);
  setNiveau(key, niveau);
  currentIndex++;
  afficherCarte();
  mettreAJourStats();
};

// INIT
chargerProgression();
buildChapitresGrid();
mettreAJourStats();
</script>
</body>
</html>
