function afficherSujets() {
  const container = document.getElementById('sujets');
  container.innerHTML = '';
  SUJETS.forEach((s, idx) => {
    const num = idx + 1;
    const div = document.createElement('div');
    div.className = 'sujet';
    
    let html = `<h3>Sujet ${num} – Session ${s.annee} (${s.session})</h3>`;
    
    // HISTOIRE
    html += `<div class="exercice"><strong>📜 Exercice 1 – Histoire</strong><br><strong>Thème : ${s.histoire.titre}</strong>`;
    s.histoire.documents.forEach((doc, i) => {
      html += `<div class="document">${doc.doc}</div>`;
    });
    s.histoire.questions.forEach((q, i) => {
      html += `<div class="question"><strong>Question ${i+1}</strong> (${q.pts} points)<br>${q.q}</div>`;
      html += `<textarea id="hist-${num}-${i}" class="reponse" placeholder="Votre réponse..."></textarea>`;
      html += `<button onclick="corrigerExo('hist-${num}-${i}', '${q.rep.replace(/'/g, "\\'")}', ${q.pts})">Corriger avec IA</button>`;
      html += `<button onclick="afficherCorrection('corr-hist-${num}-${i}')">Voir correction</button>`;
      html += `<div id="corr-hist-${num}-${i}" class="correction">${q.rep}</div>`;
    });
    html += `</div>`;
    
    // GÉOGRAPHIE
    html += `<div class="exercice"><strong>🌍 Exercice 2 – Géographie</strong><br><strong>Thème : ${s.geo.titre}</strong>`;
    s.geo.questions.forEach((q, i) => {
      html += `<div class="question"><strong>Question ${i+1}</strong> (${q.pts} points)<br>${q.q}</div>`;
      html += `<textarea id="geo-${num}-${i}" class="reponse" placeholder="Votre réponse..."></textarea>`;
      html += `<button onclick="corrigerExo('geo-${num}-${i}', '${q.rep.replace(/'/g, "\\'")}', ${q.pts})">Corriger avec IA</button>`;
      html += `<button onclick="afficherCorrection('corr-geo-${num}-${i}')">Voir correction</button>`;
      html += `<div id="corr-geo-${num}-${i}" class="correction">${q.rep}</div>`;
    });
    html += `</div>`;
    
    // EMC
    html += `<div class="exercice"><strong>⚖️ Exercice 3 – Enseignement Moral et Civique</strong><br><strong>Thème : ${s.emc.titre}</strong>`;
    if (s.emc.documents && s.emc.documents.length > 0) {
      s.emc.documents.forEach((doc, i) => {
        html += `<div class="document">${doc.doc}</div>`;
      });
    }
    s.emc.questions.forEach((q, i) => {
      html += `<div class="question"><strong>Question ${i+1}</strong> (${q.pts} points)<br>${q.q}</div>`;
      html += `<textarea id="emc-${num}-${i}" class="reponse" placeholder="Votre réponse..."></textarea>`;
      html += `<button onclick="corrigerExo('emc-${num}-${i}', '${q.rep.replace(/'/g, "\\'")}', ${q.pts})">Corriger avec IA</button>`;
      html += `<button onclick="afficherCorrection('corr-emc-${num}-${i}')">Voir correction</button>`;
      html += `<div id="corr-emc-${num}-${i}" class="correction">${q.rep}</div>`;
    });
    html += `</div>`;
    
    html += `<hr>`;
    div.innerHTML = html;
    container.appendChild(div);
  });
}

async function corrigerExo(idTextarea, reponseAttendue, pts) {
  const texte = document.getElementById(idTextarea).value.trim();
  if (!texte) { alert("Écris ta réponse avant de corriger."); return; }
  if (!window.CONFIG || !window.CONFIG.AI_API_KEY || window.CONFIG.AI_API_KEY === "__API_KEY__") {
    alert("Clé API non configurée. Vérifie les secrets GitHub.");
    return;
  }
  const prompt = `Corrige cette réponse d'élève (histoire-géo-EMC). Réponse attendue : "${reponseAttendue}". Réponse élève : "${texte}". Note sur ${pts}. Réponds en JSON : {"note": nombre, "commentaire": "explication courte"}`;
  try {
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json", "x-api-key": window.CONFIG.AI_API_KEY, "anthropic-version": "2023-06-01" },
      body: JSON.stringify({ model: "claude-sonnet-4-6", max_tokens: 400, system: prompt, messages: [{ role: "user", content: prompt }] })
    });
    const data = await res.json();
    const json = JSON.parse(data.content[0].text);
    alert(`Note : ${json.note}/${pts}\n${json.commentaire}`);
  } catch(e) { alert("Erreur IA : " + e.message); }
}

function afficherCorrection(id) {
  const el = document.getElementById(id);
  el.style.display = el.style.display === 'none' ? 'block' : 'none';
}
