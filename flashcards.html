<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flashcards – Brevet 2026</title>
<script src="config.js"></script>
<style>
  body { background: #09090f; color: #f0ede8; font-family: 'DM Sans', sans-serif; padding: 2rem; }
  .container { max-width: 1200px; margin: 0 auto; }
  .matiere-selector { display: flex; gap: 1rem; margin-bottom: 2rem; flex-wrap: wrap; }
  .matiere-btn { background: #111118; border: 1px solid rgba(255,255,255,0.1); padding: 0.6rem 1.2rem; border-radius: 40px; cursor: pointer; transition: all 0.2s; }
  .matiere-btn.active { background: #5ecfb1; color: #09090f; border-color: #5ecfb1; }
  .flashcard { background: #181820; border-radius: 24px; padding: 2rem; margin: 1rem 0; cursor: pointer; transition: all 0.2s; min-height: 250px; display: flex; flex-direction: column; justify-content: center; text-align: center; }
  .flashcard:hover { transform: scale(1.01); background: #1f1f2a; }
  .question { font-size: 1.4rem; font-weight: 600; margin-bottom: 1rem; }
  .reponse { font-size: 1.2rem; color: #aaa; margin-top: 1rem; display: none; }
  .explication { font-size: 0.9rem; color: #5ecfb1; margin-top: 0.5rem; display: none; }
  .nav { display: flex; justify-content: space-between; align-items: center; margin-top: 1rem; }
  button { background: #5ecfb1; border: none; padding: 0.5rem 1rem; border-radius: 8px; cursor: pointer; }
  .counter { font-family: monospace; font-size: 0.9rem; }
  hr { border-color: #2a2a35; margin: 2rem 0; }
</style>
</head>
<body>
<div class="container">
  <h1>📇 Flashcards – Brevet 2026</h1>
  <div class="matiere-selector" id="matiereSelector"></div>
  <div id="flashcardContainer"></div>
  <div class="nav">
    <button id="prevBtn">◀ Précédent</button>
    <span class="counter" id="counter">0 / 0</span>
    <button id="nextBtn">Suivant ▶</button>
  </div>
</div>
<script>
  const matieres = [
    { id: 'francais', nom: 'Français', fichier: 'data/francais.json' },
    { id: 'maths', nom: 'Mathématiques', fichier: 'data/maths.json' },
    { id: 'sciences', nom: 'Sciences', fichier: 'data/physique-svt.json' },
    { id: 'histgeo', nom: 'Histoire-Géo & EMC', fichier: 'data/histgeo-emc.json' }
  ];
  let cartes = [];
  let currentIndex = 0;
  let currentMatiere = 'francais';
  let afficherReponse = false;

  async function chargerCartes(matiereId) {
    const matiere = matieres.find(m => m.id === matiereId);
    if (!matiere) return;
    const response = await fetch(matiere.fichier);
    const data = await response.json();
    cartes = data.cartes || [];
    currentIndex = 0;
    afficherReponse = false;
    afficherCarte();
    document.getElementById('counter').innerText = `0 / ${cartes.length}`;
  }

  function afficherCarte() {
    if (!cartes.length) {
      document.getElementById('flashcardContainer').innerHTML = '<div class="flashcard">Aucune carte pour cette matière.</div>';
      return;
    }
    const carte = cartes[currentIndex];
    document.getElementById('flashcardContainer').innerHTML = `
      <div class="flashcard" onclick="toggleReponse()">
        <div class="question">${carte.question}</div>
        <div class="reponse" id="reponse">${carte.reponse}</div>
        <div class="explication" id="explication">${carte.explication || ''}</div>
      </div>
    `;
    document.getElementById('counter').innerText = `${currentIndex+1} / ${cartes.length}`;
    if (!afficherReponse) {
      document.getElementById('reponse').style.display = 'none';
      document.getElementById('explication').style.display = 'none';
    } else {
      document.getElementById('reponse').style.display = 'block';
      if (document.getElementById('explication').innerText.trim()) 
        document.getElementById('explication').style.display = 'block';
    }
  }

  window.toggleReponse = function() {
    afficherReponse = !afficherReponse;
    afficherCarte();
  };

  function nextCard() {
    if (cartes.length === 0) return;
    currentIndex = (currentIndex + 1) % cartes.length;
    afficherReponse = false;
    afficherCarte();
  }

  function prevCard() {
    if (cartes.length === 0) return;
    currentIndex = (currentIndex - 1 + cartes.length) % cartes.length;
    afficherReponse = false;
    afficherCarte();
  }

  function init() {
    const selector = document.getElementById('matiereSelector');
    selector.innerHTML = matieres.map(m => `<div class="matiere-btn ${m.id === currentMatiere ? 'active' : ''}" data-matiere="${m.id}">${m.nom}</div>`).join('');
    document.querySelectorAll('.matiere-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.matiere-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentMatiere = btn.dataset.matiere;
        chargerCartes(currentMatiere);
      });
    });
    document.getElementById('prevBtn').addEventListener('click', prevCard);
    document.getElementById('nextBtn').addEventListener('click', nextCard);
    chargerCartes(currentMatiere);
  }
  init();
</script>
</body>
</html>
