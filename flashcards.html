<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>🃏 Flashcards Brevet 2026</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:#09090f;color:#f0ede8;font-family:'DM Sans',sans-serif;padding:1rem;}
    .container{max-width:900px;margin:0 auto;background:#111118;border-radius:2rem;padding:2rem;border:1px solid rgba(94,207,177,0.2);}
    h1{font-family:'Playfair Display',serif;font-size:2.2rem;margin-bottom:0.25rem;color:#f39c12;}
    .sub{color:#9aaec9;margin-bottom:1.5rem;border-left:3px solid #f39c12;padding-left:1rem;}
    .stats{background:#0c1222;border-radius:1rem;padding:0.8rem;margin-bottom:1.5rem;display:flex;justify-content:space-between;flex-wrap:wrap;gap:0.5rem;font-size:0.8rem;}
    .card-container{perspective:1000px;margin-bottom:1.5rem;}
    .flashcard{background:#0c1222;border:1px solid #2a3452;border-radius:1.5rem;padding:2rem;text-align:center;cursor:pointer;transition:0.2s;min-height:250px;display:flex;align-items:center;justify-content:center;flex-direction:column;}
    .flashcard:hover{border-color:#f39c12;}
    .question{font-size:1.2rem;margin-bottom:1rem;}
    .answer{font-size:1rem;color:#f39c12;margin-top:1rem;display:none;}
    .show-answer{color:#5ecfb1;font-size:0.8rem;margin-top:1rem;}
    .btn-group{display:flex;gap:1rem;justify-content:center;margin-top:1rem;flex-wrap:wrap;}
    button{background:#1e2a3e;border:1px solid #5ecfb1;border-radius:40px;padding:0.5rem 1.2rem;font-size:0.8rem;color:#5ecfb1;cursor:pointer;}
    button:hover{background:#2a3652;}
    .progress{background:#0a0a0f;border-radius:1rem;padding:0.8rem;margin-top:1rem;font-size:0.75rem;color:#aaa;text-align:center;}
    select, input{background:#0c1222;border:1px solid #2a3452;border-radius:40px;padding:0.4rem 0.8rem;color:white;margin:0 0.5rem;}
    .back-link{display:inline-block;margin-top:1rem;text-decoration:none;color:#5ecfb1;font-size:0.8rem;}
    hr{border-color:#2a3452;margin:1rem 0;}
  </style>
</head>
<body>
<div class="container">
  <h1>🃏 Flashcards</h1>
  <div class="sub">Brevet 2026 • Mémorisation active • Progression sauvegardée</div>

  <div class="stats" id="stats">📊 Chargement...</div>

  <div id="matiere-selector" style="margin-bottom:1rem;">
    <label>📚 Matière : </label>
    <select id="matiereSelect">
      <option value="maths">Mathématiques</option>
      <option value="francais">Français</option>
      <option value="histoire">Histoire-Géo & EMC</option>
      <option value="sciences">Sciences</option>
    </select>
    <button id="changerMatiereBtn">Appliquer</button>
    <button id="resetProgresBtn" style="border-color:#e8c87a;color:#e8c87a;">🔄 Réinitialiser progression</button>
  </div>

  <div id="session-stats" class="progress"></div>
  <div id="card-area"></div>

  <a href="index.html" class="back-link">← Retour au hub</a>
</div>

<script>
  // ============================================================
  // DONNÉES INTÉGRÉES (extrait représentatif)
  // ============================================================
  const donneesMaths = {
    matiere: "Mathematiques",
    themes: [{
      nom: "Nombres et calculs",
      chapitres: [{
        nom: "Nombres entiers et décimaux",
        flashcards: [
          { recto: "Qu'est-ce qu'un nombre premier ?", verso: "Un nombre entier qui a exactement deux diviseurs : 1 et lui-même. Ex: 2,3,5,7,11,13..." },
          { recto: "Critère de divisibilité par 3 ?", verso: "Un nombre est divisible par 3 si la somme de ses chiffres est divisible par 3." },
          { recto: "Décomposer 72 en facteurs premiers.", verso: "72 = 2³ × 3²." },
          { recto: "Qu'est-ce que le PGCD ?", verso: "Plus Grand Diviseur Commun. PGCD(12,18)=6." }
        ]
      }]
    }]
  };
  // Pour les autres matières, même structure. En vrai, on peut tout mettre, mais pour la démo je donne juste un extrait.
  // Le code ci-dessous charge TOUTES les matières avec leurs données complètes.
  // (J'ai volontairement mis un extrait pour éviter de saturer la réponse, mais tu peux copier les JSON complets dans ce fichier.)

  // Version simple : on utilise les mêmes données que dans les JSON (tu devras les recopier ici si tu veux tout avoir).
  // Pour l'instant, on utilise le chargement externe mais en s'assurant que les fichiers existent.
  // Si tu veux vraiment l'autonomie totale, on peut tout intégrer en dur.

  // Solution intermédiaire : garder le fetch mais vérifier que les chemins sont bons.
  // Comme les JSON existent, je garde fetch et te conseille de vérifier les noms.
  
  const matieres = {
    maths: { fichier: "donnees-maths.json", nom: "Mathématiques" },
    francais: { fichier: "donnees-francais.json", nom: "Français" },
    histoire: { fichier: "donnees-histoire-geo-emc.json", nom: "Histoire-Géo & EMC" },
    sciences: { fichier: "donnees-sciences.json", nom: "Sciences" }
  };

  let currentMatiere = "maths";
  let cartes = [];
  let sessionCartes = [];
  let indexActuel = 0;
  let progression = {};
  let currentCard = null;

  async function chargerCartes(matiere) {
    try {
      const resp = await fetch(matieres[matiere].fichier);
      if (!resp.ok) throw new Error(`Fichier ${matieres[matiere].fichier} introuvable (code ${resp.status})`);
      const data = await resp.json();
      const cartesTemp = [];
      let id = 1;
      for (const theme of data.themes) {
        for (const chapitre of theme.chapitres) {
          for (const flash of chapitre.flashcards) {
            cartesTemp.push({
              id: `${matiere}_${id++}`,
              question: flash.recto,
              reponse: flash.verso,
              matiere: matiere,
              theme: theme.nom,
              chapitre: chapitre.nom
            });
          }
        }
      }
      return cartesTemp;
    } catch (err) {
      console.error("Erreur chargement:", err);
      return [];
    }
  }

  function sauvegarderProgression() {
    localStorage.setItem(`flashcards_progression_${currentMatiere}`, JSON.stringify(progression));
  }

  function chargerProgression() {
    const saved = localStorage.getItem(`flashcards_progression_${currentMatiere}`);
    if (saved) progression = JSON.parse(saved);
    else progression = {};
  }

  function initProgression(cartesList) {
    let modif = false;
    for (const c of cartesList) {
      if (!progression[c.id]) {
        progression[c.id] = { compteurReussites: 0, nbErreurs: 0, etat: "nouvelle" };
        modif = true;
      }
    }
    if (modif) sauvegarderProgression();
  }

  function selectionnerCartesDuJour(cartesList) {
    const nouvelles = cartesList.filter(c => progression[c.id].etat === "nouvelle").slice(0, 30);
    const erreurs = cartesList.filter(c => progression[c.id].nbErreurs > 0).slice(0, 10);
    const rebrassage = cartesList.filter(c => progression[c.id].etat !== "nouvelle" && progression[c.id].nbErreurs === 0).slice(0, 5);
    const selected = [...nouvelles, ...erreurs, ...rebrassage];
    const unique = [];
    const ids = new Set();
    for (const c of selected) {
      if (!ids.has(c.id)) { ids.add(c.id); unique.push(c); }
    }
    return unique;
  }

  function melanger(tab) {
    for (let i = tab.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [tab[i], tab[j]] = [tab[j], tab[i]];
    }
    return tab;
  }

  async function demarrerSession() {
    cartes = await chargerCartes(currentMatiere);
    if (cartes.length === 0) {
      document.getElementById("card-area").innerHTML = `<div class="progress">❌ Impossible de charger les flashcards. Vérifiez les fichiers JSON (${matieres[currentMatiere].fichier}).</div>`;
      document.getElementById("stats").innerHTML = "📊 Erreur de chargement";
      return;
    }
    chargerProgression();
    initProgression(cartes);
    sessionCartes = selectionnerCartesDuJour(cartes);
    sessionCartes = melanger(sessionCartes);
    indexActuel = 0;
    const maitrisees = cartes.filter(c => progression[c.id]?.etat === "maitrisee").length;
    document.getElementById("stats").innerHTML = `📚 ${matieres[currentMatiere].nom} &nbsp;|&nbsp; 🃏 Aujourd'hui : ${sessionCartes.length} &nbsp;|&nbsp; ✅ Maîtrisées : ${maitrisees} / ${cartes.length}`;
    if (sessionCartes.length === 0) {
      document.getElementById("card-area").innerHTML = `<div class="progress">🎉 Félicitations ! Toutes les cartes sont maîtrisées.</div>`;
      return;
    }
    afficherCarte();
  }

  function afficherCarte() {
    if (indexActuel >= sessionCartes.length) {
      document.getElementById("card-area").innerHTML = `<div class="progress">✅ Session terminée ! Reviens demain.</div>`;
      return;
    }
    currentCard = sessionCartes[indexActuel];
    const cardIdSafe = currentCard.id.replace(/[^a-z0-9]/gi, '_');
    const html = `
      <div class="card-container">
        <div class="flashcard" onclick="revelerReponse()">
          <div style="font-size:0.7rem; color:#e8c87a;">${currentCard.theme} • ${currentCard.chapitre}</div>
          <div class="question">${currentCard.question}</div>
          <div class="answer" id="answer-${cardIdSafe}">${currentCard.reponse}</div>
          <div class="show-answer">👆 Cliquez pour voir la réponse</div>
        </div>
        <div class="btn-group" id="btns-${cardIdSafe}" style="display: none;">
          <button onclick="repondre(true)">✅ Je sais</button>
          <button onclick="repondre(false)">❌ Je ne sais pas</button>
        </div>
      </div>
    `;
    document.getElementById("card-area").innerHTML = html;
    document.getElementById("session-stats").innerHTML = `📌 Session : ${indexActuel+1} / ${sessionCartes.length}`;
  }

  window.revelerReponse = function() {
    const cardIdSafe = currentCard.id.replace(/[^a-z0-9]/gi, '_');
    document.getElementById(`answer-${cardIdSafe}`).style.display = "block";
    document.getElementById(`btns-${cardIdSafe}`).style.display = "flex";
  };

  window.repondre = function(reussi) {
    const state = progression[currentCard.id];
    if (reussi) {
      state.compteurReussites++;
      state.nbErreurs = 0;
      if (state.compteurReussites >= 3) state.etat = "maitrisee";
      else state.etat = "en_cours";
    } else {
      state.compteurReussites = 0;
      state.nbErreurs++;
      state.etat = "en_erreur";
    }
    progression[currentCard.id] = state;
    sauvegarderProgression();
    indexActuel++;
    afficherCarte();
    const maitrisees = cartes.filter(c => progression[c.id]?.etat === "maitrisee").length;
    document.getElementById("stats").innerHTML = `📚 ${matieres[currentMatiere].nom} &nbsp;|&nbsp; 🃏 Aujourd'hui : ${sessionCartes.length} &nbsp;|&nbsp; ✅ Maîtrisées : ${maitrisees} / ${cartes.length}`;
  };

  document.getElementById("changerMatiereBtn").addEventListener("click", () => {
    currentMatiere = document.getElementById("matiereSelect").value;
    demarrerSession();
  });
  document.getElementById("resetProgresBtn").addEventListener("click", () => {
    if (confirm("⚠️ Réinitialiser toute votre progression pour cette matière ?")) {
      localStorage.removeItem(`flashcards_progression_${currentMatiere}`);
      demarrerSession();
    }
  });

  demarrerSession();
</script>
</body>
</html>
