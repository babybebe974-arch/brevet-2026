<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>⚡ Automatismes – Mathématiques (Brevet 2026)</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:#000000;font-family:'DM Sans',sans-serif;padding:1rem;color:#ffffff;}
    .container{max-width:800px;margin:0 auto;background:#1a1a1a;border-radius:2rem;padding:1.5rem;border:1px solid #2ecc71;}
    h1{font-family:'Playfair Display',serif;font-size:1.8rem;color:#2ecc71;margin-bottom:0.25rem;}
    .sub{color:#aaa;margin-bottom:1rem;border-left:3px solid #2ecc71;padding-left:1rem;font-size:0.8rem;}
    .info-bar{background:#2a2a2a;border-radius:1rem;padding:0.8rem;margin-bottom:1rem;display:flex;justify-content:space-between;flex-wrap:wrap;gap:0.5rem;font-size:0.8rem;}
    .question-card{background:#2a2a2a;border-radius:1.5rem;padding:1.5rem;margin-bottom:1rem;border:1px solid #333;}
    .question-text{font-size:1.1rem;margin-bottom:1rem;font-weight:500;}
    textarea{width:100%;background:#0a0a0f;border:1px solid #333;border-radius:1rem;padding:0.8rem;color:white;font-size:1rem;margin-bottom:1rem;font-family:'DM Sans',sans-serif;resize:vertical;}
    .btn-group{display:flex;gap:1rem;justify-content:center;margin:1rem 0;flex-wrap:wrap;}
    button{background:#1e2a3e;border:1px solid #5ecfb1;border-radius:40px;padding:0.5rem 1.2rem;font-size:0.8rem;color:#5ecfb1;cursor:pointer;}
    button:hover{background:#2a3652;}
    .progress{background:#0a0a0f;border-radius:1rem;padding:0.6rem;margin-top:0.5rem;font-size:0.7rem;color:#aaa;text-align:center;}
    .feedback{background:#0a0a0f;border-radius:1rem;padding:0.6rem;margin-top:0.5rem;font-size:0.75rem;display:none;}
    .feedback.show{display:block;}
    .timer{font-family:'DM Mono',monospace;font-size:1.2rem;color:#2ecc71;}
    .back-link{display:inline-block;margin-top:1rem;text-decoration:none;color:#5ecfb1;font-size:0.8rem;}
    .reponse-modele{background:#1a2a1a;border-left:3px solid #2ecc71;padding:0.5rem;margin-top:0.5rem;border-radius:0.5rem;font-size:0.8rem;}
  </style>
</head>
<body>
<div class="container">
  <h1>⚡ Automatismes – Mathématiques</h1>
  <div class="sub">45 min • Reformule avec tes mots</div>
  <div class="info-bar">
    <span>📅 Jour J-<span id="jourActuel">--</span></span>
    <span class="timer" id="timer">⏱️ 45:00</span>
  </div>
  <div id="sessionInfo" class="progress">📊 Chargement...</div>
  <div id="questionArea"></div>
  <div class="btn-group">
    <button id="resetBtn" style="border-color:#e8c87a;color:#e8c87a;">🔄 Réinitialiser</button>
    <button id="nextDayBtn" style="border-color:#ffcc00;color:#ffcc00;">📅 Jour suivant</button>
  </div>
  <a href="index.html" class="back-link">← Retour au hub</a>
</div>

<script>
  // Fonction d'évaluation par compréhension
  function extraireMotsCles(texte) {
    const stopWords = ["le","la","les","un","une","des","et","ou","donc","or","ni","car","de","du","des","à","dans","par","pour","avec","sans","sur","sous","chez","est","sont","ce","cet","cette","ces","il","elle","ils","elles","on","nous","vous","je","tu","ce","que","qui","dont","où","ce","cet","cette","ces","mon","ton","son"];
    const mots = texte.toLowerCase().replace(/[^\w\sàâäéèêëîïôöùûüç]/g, ' ').split(/\s+/).filter(m => m.length > 2 && !stopWords.includes(m));
    return [...new Set(mots)];
  }
  function evaluerComprehension(reponseEleve, reponseAttendue) {
    const motsClesAttendus = extraireMotsCles(reponseAttendue);
    const motsEleve = extraireMotsCles(reponseEleve);
    if (motsClesAttendus.length === 0) return { valide: true, taux: 1 };
    let trouves = 0;
    for (const mot of motsClesAttendus) {
      if (motsEleve.some(m => m.includes(mot) || mot.includes(m))) trouves++;
    }
    const taux = trouves / motsClesAttendus.length;
    return { valide: taux >= 0.5, taux: Math.round(taux * 100) };
  }

  // ==================== TOUTES LES FLASHCARDS MATHS (176 cartes) ====================
  const flashcards = [
    { question: "Qu'est-ce qu'un nombre premier ?", reponse: "Nombre qui a exactement deux diviseurs : 1 et lui-même. Ex: 2,3,5,7,11,13..." },
    { question: "Critère de divisibilité par 2 ?", reponse: "Un nombre est divisible par 2 s'il se termine par 0, 2, 4, 6 ou 8." },
    { question: "Critère de divisibilité par 3 ?", reponse: "Un nombre est divisible par 3 si la somme de ses chiffres est divisible par 3." },
    { question: "Critère de divisibilité par 5 ?", reponse: "Un nombre est divisible par 5 s'il se termine par 0 ou 5." },
    { question: "Critère de divisibilité par 9 ?", reponse: "Un nombre est divisible par 9 si la somme de ses chiffres est divisible par 9." },
    { question: "Critère de divisibilité par 10 ?", reponse: "Un nombre est divisible par 10 s'il se termine par 0." },
    { question: "Décomposer 72 en facteurs premiers.", reponse: "72 = 2³ × 3²" },
    { question: "Qu'est-ce que le PGCD ?", reponse: "Plus Grand Diviseur Commun. PGCD(12,18)=6" },
    { question: "Addition de deux nombres négatifs.", reponse: "On additionne leurs distances à zéro, on garde le signe négatif. Ex: (-3)+(-5)=-8." },
    { question: "Calculer (-7) + (+3).", reponse: "-4" },
    { question: "Règle des signes pour la multiplication : (-) × (-) = ?", reponse: "(+). Ex: (-2)×(-3)=+6" },
    { question: "Règle des signes pour la multiplication : (-) × (+) = ?", reponse: "(-). Ex: (-2)×(+3)=-6" },
    { question: "Calculer (-15) ÷ (-3).", reponse: "+5" },
    { question: "Opposé de -8 ?", reponse: "+8" },
    { question: "Ranger dans l'ordre croissant : -5, 3, -1, 0, -2.", reponse: "-5 < -2 < -1 < 0 < 3" },
    { question: "Distance entre -3 et +4 ?", reponse: "7" },
    { question: "Additionner 2/5 + 1/3.", reponse: "11/15" },
    { question: "Soustraire 3/4 - 1/2.", reponse: "1/4" },
    { question: "Multiplier 2/3 × 4/5.", reponse: "8/15" },
    { question: "Diviser 2/3 ÷ 4/5.", reponse: "(2/3)×(5/4)=10/12=5/6" },
    { question: "Comparer 3/4 et 5/6.", reponse: "3/4 < 5/6 (9/12 < 10/12)" },
    { question: "Rendre irréductible 18/24.", reponse: "3/4" },
    { question: "Calculer 2/3 × 6/5.", reponse: "4/5" },
    { question: "Calculer 5/8 ÷ 3/4.", reponse: "5/6" },
    { question: "Que signifie 2³ ?", reponse: "2×2×2 = 8" },
    { question: "Que vaut 10⁻² ?", reponse: "0,01" },
    { question: "Notation scientifique de 15000.", reponse: "1,5 × 10⁴" },
    { question: "Notation scientifique de 0,00025.", reponse: "2,5 × 10⁻⁴" },
    { question: "Règle aⁿ × aᵖ = ?", reponse: "aⁿ⁺ᵖ" },
    { question: "Règle (aⁿ)ᵖ = ?", reponse: "aⁿˣᵖ" },
    { question: "Règle aⁿ / aᵖ = ?", reponse: "aⁿ⁻ᵖ" },
    { question: "Calculer 2⁴ × 2⁻².", reponse: "2² = 4" },
    { question: "Réduire 3x+5-2x+2.", reponse: "x+7" },
    { question: "Développer k(a+b).", reponse: "k×a + k×b" },
    { question: "Développer (a+b)(c+d).", reponse: "ac+ad+bc+bd" },
    { question: "Factoriser 6x+12.", reponse: "6(x+2)" },
    { question: "Factoriser x²-4.", reponse: "(x-2)(x+2)" },
    { question: "Développer (2x+3)².", reponse: "4x²+12x+9" },
    { question: "Développer (3x-2)².", reponse: "9x²-12x+4" },
    { question: "Résoudre 2x-3=7.", reponse: "x=5" },
    { question: "Résoudre -3x+5=2x-10.", reponse: "x=3" },
    { question: "Résoudre (x-3)(x+4)=0.", reponse: "x=3 ou x=-4" },
    { question: "Résoudre x-3 ≤ 5.", reponse: "x ≤ 8" },
    { question: "Résoudre -2x+1 < 5.", reponse: "x > -2" },
    { question: "Traduire : un nombre augmenté de 8 vaut 15.", reponse: "x+8=15 → x=7" },
    { question: "Traduire : le double diminué de 3 égale 5.", reponse: "2x-3=5 → x=4" },
    { question: "Produit en croix.", reponse: "a/b = c/d → ad = bc" },
    { question: "30% de 80.", reponse: "24" },
    { question: "Augmentation de 15% de 200.", reponse: "200×1,15=230" },
    { question: "Diminution de 20% de 50.", reponse: "50×0,8=40" },
    { question: "Échelle 1/500 : 8cm → réel ?", reponse: "4000 cm = 40 m" },
    { question: "Formule de la vitesse moyenne.", reponse: "v = d/t" },
    { question: "Convertir 10 m/s en km/h.", reponse: "36 km/h" },
    { question: "Moyenne de 12,15,18.", reponse: "15" },
    { question: "Médiane de 3,7,9,12,15.", reponse: "9" },
    { question: "Médiane de 2,5,8,11.", reponse: "(5+8)/2 = 6,5" },
    { question: "Étendue de 5,12,8,20,3.", reponse: "20-3=17" },
    { question: "P(A) = ?", reponse: "nb issues favorables / nb total" },
    { question: "P(4) avec un dé à 6 faces.", reponse: "1/6" },
    { question: "P(nombre pair) avec un dé.", reponse: "3/6 = 1/2" },
    { question: "P(rouge) avec 3R et 5B.", reponse: "3/8" },
    { question: "Calculer f(4) pour f(x)=2x+3.", reponse: "11" },
    { question: "Antécédent de 7 par f(x)=2x+3.", reponse: "x=2" },
    { question: "Fonction linéaire.", reponse: "f(x)=ax (droite passant par l'origine)" },
    { question: "Fonction affine.", reponse: "f(x)=ax+b" },
    { question: "Coefficient directeur a = ?", reponse: "(y₂-y₁)/(x₂-x₁)" },
    { question: "Ordonnée à l'origine b = ?", reponse: "f(0)" },
    { question: "Aire du carré (côté c).", reponse: "c²" },
    { question: "Aire du rectangle (L,l).", reponse: "L×l" },
    { question: "Aire du triangle (b,h).", reponse: "(b×h)/2" },
    { question: "Aire du disque (r).", reponse: "π×r²" },
    { question: "Périmètre du cercle (r).", reponse: "2πr" },
    { question: "Volume du pavé droit (L,l,h).", reponse: "L×l×h" },
    { question: "Volume du cylindre (r,h).", reponse: "π×r²×h" },
    { question: "Théorème de Pythagore.", reponse: "Si triangle rectangle, alors hyp² = a² + b²" },
    { question: "Réciproque de Pythagore.", reponse: "Si hyp² = a²+b², alors triangle rectangle" },
    { question: "Triangle 5,12,13 ?", reponse: "13²=169, 5²+12²=169 → rectangle" },
    { question: "Diagonale d'un carré de côté 5.", reponse: "5√2 ≈ 7,07" },
    { question: "Théorème de Thalès.", reponse: "AM/AB = AN/AC = MN/BC (configuration)" },
    { question: "Calculer MN si AM=3, AB=5, BC=10.", reponse: "MN=6" },
    { question: "Calculer AN si AM=4, AB=12, AC=9.", reponse: "AN=3" },
    { question: "Cosinus = ?", reponse: "adjacent / hypoténuse (SOH CAH TOA)" },
    { question: "Sinus = ?", reponse: "opposé / hypoténuse (SOH CAH TOA)" },
    { question: "Tangente = ?", reponse: "opposé / adjacent (SOH CAH TOA)" },
    { question: "cos(30°) = ?", reponse: "√3/2" },
    { question: "sin(30°) = ?", reponse: "1/2" },
    { question: "tan(45°) = ?", reponse: "1" },
    { question: "Translation.", reponse: "Glisse, même forme, même orientation" },
    { question: "Symétrie axiale.", reponse: "Reflet par rapport à une droite, orientation inversée" },
    { question: "Symétrie centrale.", reponse: "Rotation 180°, orientation inversée" },
    { question: "Volume d'une pyramide.", reponse: "(Aire base × hauteur) / 3" },
    { question: "Volume d'un cône.", reponse: "(π × r² × h) / 3" },
    { question: "Scratch : orientation 90° signifie ?", reponse: "Vers la droite" },
    { question: "Scratch : tracer un carré de côté 50.", reponse: "répéter 4 fois : avancer 50, tourner 90°" },
    { question: "Scratch : condition.", reponse: "si ... alors ... sinon ..." }
  ];

  let planning = { jour: 26, termine: false };
  let progression = {};
  let questionsSession = [];
  let indexActuel = 0;
  let currentQuestion = null;
  let timerInterval = null;
  let tempsRestant = 45 * 60;

  function sauvegarderPlanning() { localStorage.setItem("planning_automatismes_maths", JSON.stringify(planning)); }
  function sauvegarderProgression() { localStorage.setItem("automatismes_maths", JSON.stringify(progression)); }

  function chargerDonnees() {
    const savedPlanning = localStorage.getItem("planning_automatismes_maths");
    if (savedPlanning) planning = JSON.parse(savedPlanning);
    else planning = { jour: 26, termine: false };
    const savedProg = localStorage.getItem("automatismes_maths");
    if (savedProg) progression = JSON.parse(savedProg);
    else progression = {};
    document.getElementById("jourActuel").innerText = planning.jour;
  }

  function selectionnerQuestions() {
    const nouvelles = flashcards.filter(c => !progression[c.question] || progression[c.question].etat === "nouvelle").slice(0, 30);
    const erreurs = flashcards.filter(c => progression[c.question] && progression[c.question].nbErreurs > 0).slice(0, 10);
    const rebrassage = flashcards.filter(c => progression[c.question] && progression[c.question].etat === "maitrisee").slice(0, 5);
    let selected = [...nouvelles, ...erreurs, ...rebrassage];
    const ids = new Set();
    selected = selected.filter(c => { if (ids.has(c.question)) return false; ids.add(c.question); return true; });
    for (let i=selected.length-1; i>0; i--) { const j = Math.floor(Math.random()*(i+1)); [selected[i], selected[j]] = [selected[j], selected[i]]; }
    return selected;
  }

  function demarrerSession() {
    questionsSession = selectionnerQuestions();
    indexActuel = 0;
    document.getElementById("sessionInfo").innerHTML = `📌 ${questionsSession.length} questions (30 nouvelles + 10 erreurs + 5 rebrassage)`;
    if (questionsSession.length === 0) {
      document.getElementById("questionArea").innerHTML = '<div class="progress">🎉 Félicitations ! Plus de questions.</div>';
      return;
    }
    afficherQuestion();
    demarrerTimer();
  }

  function afficherQuestion() {
    if (indexActuel >= questionsSession.length) { terminerSession(); return; }
    currentQuestion = questionsSession[indexActuel];
    document.getElementById("questionArea").innerHTML = `
      <div class="question-card">
        <div class="question-text">${currentQuestion.question}</div>
        <textarea id="reponseInput" rows="3" placeholder="Explique avec tes propres mots..."></textarea>
        <div class="btn-group"><button id="validerBtn">✔️ Vérifier</button></div>
        <div id="feedback" class="feedback"></div>
      </div>
    `;
    document.getElementById("validerBtn").onclick = () => verifierReponse();
    document.getElementById("reponseInput").focus();
    document.getElementById("sessionInfo").innerHTML = `📌 ${indexActuel+1}/${questionsSession.length}`;
  }

  function verifierReponse() {
    const userReponse = document.getElementById("reponseInput").value.trim();
    if (userReponse === "") { alert("Écris une réponse."); return; }
    const evaluation = evaluerComprehension(userReponse, currentQuestion.reponse);
    const state = progression[currentQuestion.question] || { nbErreurs: 0, etat: "nouvelle" };
    if (evaluation.valide) {
      state.nbErreurs = 0; state.etat = "maitrisee";
      document.getElementById("feedback").innerHTML = `✅ Bien compris ! (${evaluation.taux}%)<br><div class="reponse-modele">📖 ${currentQuestion.reponse}</div>`;
    } else {
      state.nbErreurs = (state.nbErreurs || 0) + 1; state.etat = "en_erreur";
      document.getElementById("feedback").innerHTML = `⚠️ Revoir (${evaluation.taux}%)<br><div class="reponse-modele">📖 ${currentQuestion.reponse}</div>`;
    }
    progression[currentQuestion.question] = state;
    sauvegarderProgression();
    document.getElementById("feedback").classList.add("show");
    indexActuel++;
    setTimeout(() => afficherQuestion(), 2000);
  }

  function terminerSession() { clearInterval(timerInterval); document.getElementById("questionArea").innerHTML = '<div class="progress">✅ Session terminée.</div>'; planning.termine = true; sauvegarderPlanning(); }
  function demarrerTimer() { if (timerInterval) clearInterval(timerInterval); timerInterval = setInterval(() => { if (tempsRestant <= 0) { terminerSession(); return; } tempsRestant--; const m = Math.floor(tempsRestant/60), s = tempsRestant%60; document.getElementById("timer").innerHTML = `⏱️ ${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`; }, 1000); }
  function reinitialiser() { if (confirm("Réinitialiser ?")) { localStorage.removeItem("automatismes_maths"); localStorage.removeItem("planning_automatismes_maths"); chargerDonnees(); demarrerSession(); } }
  function passerJour() { if (planning.jour <= 0) { alert("Planning terminé"); return; } planning.jour--; sauvegarderPlanning(); chargerDonnees(); demarrerSession(); }

  document.getElementById("resetBtn").onclick = reinitialiser;
  document.getElementById("nextDayBtn").onclick = passerJour;
  chargerDonnees();
  demarrerSession();
</script>
</body>
</html>
