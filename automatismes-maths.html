.stat-l{font-size:10px;color:#9090a8;text-transform:uppercase;}

.ch:hover{border-color:#e8c87a;}

.btn-go{background:#e8c87a;border-color:#e8c87a;color:#09090f;font-weight:700;font-size:14px;padding:10px 28px;border-radius:10px;}

.prog{flex:1;height:5px;background:#2a2a38;border-radius:3px;margin:0 16px;overflow:hidden;}
.prog-f{height:100%;background:#e8c87a;border-radius:3px;transition:width .3s;}

.qmeta{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;}

.qbadge.r{border-color:rgba(232,66,74,.4);color:#e84249;}
.qbadge.v{border-color:rgba(94,207,177,.4);color:#5ecfb1;}
.qbadge.b{border-color:rgba(232,200,122,.4);color:#e8c87a;}
.qtxt{font-size:15px;font-weight:500;margin-bottom:12px;line-height:1.5;}
textarea{width:100%;background:#0a0a12;border:1px solid #2a2a38;border-radius:8px;color:#e8e8f0;font-size:14px;padding:10px;resize:vertical;min-height:60px;outline:none;}
textarea:focus{border-color:#e8c87a;}
.btn-v{background:#e8c87a;color:#09090f;border:none;border-radius:7px;font-weight:700;font-size:12px;padding:7px 18px;cursor:pointer;margin-top:8px;}
.btn-v:disabled{opacity:.4;}
.fb{display:none;margin-top:10px;border-radius:8px;overflow:hidden;}
.fb.show{display:block;}
.fb-ok{padding:10px 14px;background:rgba(94,207,177,.1);border-left:3px solid #5ecfb1;color:#5ecfb1;font-weight:600;font-size:13px;}
.fb-bad{padding:10px 14px;background:rgba(232,66,74,.1);border-left:3px solid #e84249;color:#e87a7a;font-weight:600;font-size:13px;}

.fb-rep b{color:#e8c87a;display:block;font-size:11px;margin-bottom:3px;}
.btn-next{background:#e8c87a;color:#09090f;border:none;border-radius:7px;font-weight:700;font-size:12px;padding:7px 18px;cursor:pointer;margin-top:8px;}
.res{background:#1a1a24;border:1px solid #2a2a38;border-radius:14px;padding:2rem;text-align:center;}

.faibles h4{color:#e84249;font-size:12px;margin-bottom:6px;}
.faibles li{font-size:12px;color:#9090a8;padding:2px 0;}

// ══════ APP ══════
var eleve = 'wassil', session = [], idx = 0;
var scoreOk = 0, scoreTotal = 0, chTaux = {};
var timerInt = null, tps = 2700;

function kProg()  { return 'ama_p_' + eleve; }
function kRat()   { return 'ama_r_' + eleve; }
function kSuivi() { return 'suivi_sessions_maths_' + eleve; }
function getProg(){ try{return JSON.parse(localStorage.getItem(kProg())||'{}');}catch(e){return{};} }
function getRat() { try{return JSON.parse(localStorage.getItem(kRat()) ||'{}');}catch(e){return{};} }
function getScore(ch,q){ return (getProg()[ch+'_'+q.substring(0,25)]||{score:0}).score; }
function setScore(ch,q,v){ var p=getProg(); p[ch+'_'+q.substring(0,25)]={score:Math.min(3,Math.max(0,v))}; localStorage.setItem(kProg(),JSON.stringify(p)); }

function getFaibles(){
  try{
    var ss=JSON.parse(localStorage.getItem(kSuivi())||'[]').slice(0,5);
    var t={};
    ss.forEach(function(s){ if(s.chapitresTaux) Object.keys(s.chapitresTaux).forEach(function(ch){ if(!t[ch])t[ch]=[]; t[ch].push(s.chapitresTaux[ch]); }); });
    return Object.keys(t).filter(function(ch){ return t[ch].reduce(function(a,b){return a+b},0)/t[ch].length<60; }).map(Number);
  }catch(e){return[];}
}

function setEleve(e){
  eleve=e;
  document.getElementById('btnW').className='ebtn'+(e==='wassil'?' w':'');
  document.getElementById('btnN').className='ebtn'+(e==='nawal'?' n':'');
  buildGrid(); updateStats();
}

function buildGrid(){
  var faibles=getFaibles();
  var g=document.getElementById('chapGrid'); g.innerHTML='';
  Object.keys(CHAPITRES_MA).forEach(function(n){
    var ch=CHAPITRES_MA[n];
    var d=document.createElement('div');
    var isFaible=faibles.indexOf(parseInt(n))>=0;
    d.className='ch'+(isFaible?' faible':'');
    d.id='ci'+n;
    d.innerHTML='<span class="chn">'+n+'</span><span>'+ch.titre+'</span>'+(isFaible?'<span style="margin-left:auto;font-size:10px;color:#e84249">⚠</span>':'');
    d.onclick=function(){this.classList.toggle('sel');updateStats();}.bind(d);
    g.appendChild(d);
  });
}

function getSel(){ return Array.from(document.querySelectorAll('#chapGrid .ch.sel')).map(function(el){return parseInt(el.id.replace('ci',''));}); }
function selectAll(v){ Object.keys(CHAPITRES_MA).forEach(function(n){var el=document.getElementById('ci'+n);if(el){if(v)el.classList.add('sel');else el.classList.remove('sel');}}); updateStats(); }
function selFaibles(){ selectAll(false); getFaibles().forEach(function(n){var el=document.getElementById('ci'+n);if(el)el.classList.add('sel');}); updateStats(); }
function resetProg(){ if(confirm('Reset progression maths ?')){ localStorage.removeItem(kProg()); localStorage.removeItem(kRat()); updateStats(); } }

function updateStats(){
  var sel=getSel();
  var toutes=[];
  sel.forEach(function(n){(CHAPITRES_MA[n]||{cartes:[]}).cartes.forEach(function(c){toutes.push({ch:n,q:c.q});});});
  var mait=toutes.filter(function(c){return getScore(c.ch,c.q)>=3;}).length;
  var pct=toutes.length?Math.round(mait/toutes.length*100):0;
  document.getElementById('stC').textContent=toutes.length;
  document.getElementById('stM').textContent=mait;
  document.getElementById('stP').textContent=pct+'%';
  document.getElementById('btnGo').disabled=toutes.length===0;
}

function melanger(a){ for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;} return a; }

function genSession(){
  var sel=getSel();
  var principal=[];
  sel.forEach(function(n){(CHAPITRES_MA[n]||{cartes:[]}).cartes.forEach(function(c){principal.push({q:c.q,r:c.r,ch:n,type:'p'});});});
  var ids={}; var uniq=[];
  principal.forEach(function(c){if(!ids[c.q]){ids[c.q]=1;uniq.push(c);}});
  if(uniq.length<=40) return melanger(uniq);

  var nouv=uniq.filter(function(c){return getScore(c.ch,c.q)===0;});
  var enc=uniq.filter(function(c){var s=getScore(c.ch,c.q);return s>0&&s<3;});
  var mait=uniq.filter(function(c){return getScore(c.ch,c.q)>=3;});
  var vingt=melanger(nouv.concat(enc).concat(mait)).slice(0,20);

  var rat=getRat();
  var dixR=[];
  Object.keys(rat).sort(function(a,b){return rat[b].count-rat[a].count;}).slice(0,10).forEach(function(id){if(rat[id]&&rat[id].carte)dixR.push(Object.assign({},rat[id].carte,{type:'r'}));});
  if(dixR.length<10){var deja={};vingt.concat(dixR).forEach(function(c){deja[c.q]=1;});enc.filter(function(c){return !deja[c.q];}).slice(0,10-dixR.length).forEach(function(c){dixR.push(Object.assign({},c,{type:'r'}));});}

  var autresSel={};sel.forEach(function(n){autresSel[n]=1;});
  var autres=[];
  Object.keys(CHAPITRES_MA).forEach(function(n){if(!autresSel[n])CHAPITRES_MA[n].cartes.forEach(function(c){autres.push({q:c.q,r:c.r,ch:parseInt(n),type:'v'});});});
  var dixV=melanger(autres).slice(0,10);
  if(dixV.length<10){var deja2={};vingt.concat(dixR).forEach(function(c){deja2[c.q]=1;});uniq.filter(function(c){return !deja2[c.q];}).slice(0,10-dixV.length).forEach(function(c){dixV.push(Object.assign({},c,{type:'v'}));});}

  var all=vingt.concat(dixR).concat(dixV);
  var ids2={};var res=[];
  all.forEach(function(c){if(!ids2[c.q]){ids2[c.q]=1;res.push(c);}});
  return melanger(res).slice(0,40);
}

function evaluer(rep,att){
  if(!rep||rep.length<2) return{ok:false,t:0,m:'Écris une réponse.'};
  var r=rep.toLowerCase().trim(), a=att.toLowerCase();
  if(r===a) return{ok:true,t:100,m:'Parfait !'};
  var mA=a.split(/[\s,;.=+÷x²³()]+/).filter(function(m){return m.length>1;});
  var mR=r.split(/[\s,;.=+÷x²³()]+/);
  var ok=0;
  mA.forEach(function(ma){if(mR.some(function(mr){return mr===ma||mr.indexOf(ma.slice(0,3))>=0;}))ok++;});
  var t=mA.length?Math.round(ok/mA.length*100):50;
  if(mR.length<=3&&t>=35) t=Math.min(100,t+25);
  if(t>=55) return{ok:true,t:t,m:t>=80?'Parfait !':t>=70?'Bien !':'Presque !'};
  return{ok:false,t:t,m:'À retravailler.'};
}

function show(id){['phaseSelect','phaseSession','phaseRes'].forEach(function(p){document.getElementById(p).style.display=p===id?'block':'none';});}

function demarrer(){
  session=genSession();
  if(!session.length){alert('Sélectionne des chapitres.');return;}
  idx=0;scoreOk=0;scoreTotal=0;chTaux={};tps=2700;
  show('phaseSession');startTimer();affQ();
}

function affQ(){
  if(idx>=session.length){fin();return;}
  var c=session[idx];
  var pct=Math.round(idx/session.length*100);
  document.getElementById('progF').style.width=pct+'%';
  document.getElementById('qCnt').textContent='Q '+(idx+1)+'/'+session.length;
  var tLabel=c.type==='r'?'🔴 À retravailler':c.type==='v'?'🔵 Révision':'🟡 Chapitre choisi';
  var tCls=c.type==='r'?'r':c.type==='v'?'v':'b';
  var nom=CHAPITRES_MA[c.ch]?CHAPITRES_MA[c.ch].titre:'Ch'+c.ch;
  document.getElementById('qArea').innerHTML=
    '<div class="qcard">'
    +'<div class="qmeta"><span class="qbadge b">'+nom+'</span><span class="qbadge '+tCls+'">'+tLabel+'</span></div>'
    +'<div class="qtxt">'+c.q+'</div>'
    +'<textarea id="repIn" placeholder="Ta réponse..." rows="2"></textarea>'
    +'<button class="btn-v" id="btnV">✔ Vérifier</button>'
    +'</div>';
  document.getElementById('fbArea').innerHTML='';
  document.getElementById('nextWrap').style.display='none';
  document.getElementById('btnV').onclick=verif;
  setTimeout(function(){var el=document.getElementById('repIn');if(el)el.focus();},80);
}

function verif(){
  var repEl=document.getElementById('repIn');
  if(!repEl)return;
  var rep=repEl.value.trim();
  if(!rep){alert('Écris une réponse.');return;}
  var c=session[idx];
  var ev=evaluer(rep,c.r);
  if(ev.ok)scoreOk++;
  scoreTotal++;
  if(!chTaux[c.ch])chTaux[c.ch]={ok:0,t:0};
  chTaux[c.ch].t++;
  if(ev.ok)chTaux[c.ch].ok++;

  var s=getScore(c.ch,c.q);
  setScore(c.ch,c.q,ev.ok?Math.min(s+1,3):Math.max(0,s-1));

  var rat=getRat();
  var id=c.q.slice(0,38);
  if(!ev.ok){rat[id]={count:((rat[id]||{count:0}).count)+1,carte:c};}
  else if(rat[id]){rat[id].count=Math.max(0,rat[id].count-1);if(!rat[id].count)delete rat[id];}
  localStorage.setItem(kRat(),JSON.stringify(rat));

  var cls=ev.t>=65?'fb-ok':ev.t>=40?'fb-mid':'fb-bad';
  var ico=ev.t>=65?'✅':ev.t>=40?'⚠️':'❌';
  document.getElementById('fbArea').innerHTML=
    '<div class="fb show"><div class="'+cls+'">'+ico+' '+ev.m+' — '+ev.t+'%</div>'
    +'<div class="fb-rep"><b>Réponse attendue</b>'+c.r+'</div></div>';
  idx++;
  document.getElementById('nextWrap').style.display='block';
  document.getElementById('btnV').disabled=true;
}

function startTimer(){
  clearInterval(timerInt);
  timerInt=setInterval(function(){
    if(tps<=0){clearInterval(timerInt);fin();return;}
    tps--;
    var m=Math.floor(tps/60),s=tps%60;
    var el=document.getElementById('timerVal');
    if(el)el.textContent=(m<10?'0':'')+m+':'+(s<10?'0':'')+s;
  },1000);
}

function fin(){
  clearInterval(timerInt);
  var pct=scoreTotal?Math.round(scoreOk/scoreTotal*100):0;
  var chapitres=getSel().map(function(n){return CHAPITRES_MA[n]?CHAPITRES_MA[n].titre:'Ch'+n;});
  var chapitresTaux={};
  Object.keys(chTaux).forEach(function(ch){
    chapitresTaux[CHAPITRES_MA[ch]?CHAPITRES_MA[ch].titre:'Ch'+ch]=Math.round(chTaux[ch].ok/chTaux[ch].t*100);
  });

  var sessions=[];
  try{sessions=JSON.parse(localStorage.getItem(kSuivi())||'[]');}catch(e){}
  sessions.unshift({id:Date.now(),date:new Date().toISOString(),matiere:'maths',eleve:eleve,pourcentage:pct,chapitres:chapitres,chapitresTaux:chapitresTaux});
  localStorage.setItem(kSuivi(),JSON.stringify(sessions.slice(0,200)));

  show('phaseRes');
  var cls=pct>=80?'#5ecfb1':pct>=60?'#e8c87a':'#e84249';
  var msg=pct>=80?'🌟 Excellent !':pct>=60?'👍 Bien joué !':pct>=40?'💪 Courage !':'📚 Continue.';
  document.getElementById('resScore').style.color=cls;
  document.getElementById('resScore').textContent=pct+'%';
  document.getElementById('resDetail').textContent=scoreOk+' bonnes réponses sur '+scoreTotal+' — '+msg;
  var faibles=Object.keys(chapitresTaux).filter(function(ch){return chapitresTaux[ch]<60;});
  if(faibles.length){
    document.getElementById('resFaibles').innerHTML='<div class="faibles"><h4>⚠ À retravailler (&lt;60%)</h4><ul>'+faibles.map(function(f){return '<li>• '+f+'</li>';}).join('')+'</ul></div>';
  }
}

window.onload=function(){
  document.getElementById('btnW').addEventListener('click',function(){setEleve('wassil');});
  document.getElementById('btnN').addEventListener('click',function(){setEleve('nawal');});
  document.getElementById('btnAll').addEventListener('click',function(){selectAll(true);});
  document.getElementById('btnNone').addEventListener('click',function(){selectAll(false);});
  document.getElementById('btnFaibles').addEventListener('click',selFaibles);
  document.getElementById('btnReset').addEventListener('click',resetProg);
  document.getElementById('btnGo').addEventListener('click',demarrer);
  document.getElementById('btnNext').addEventListener('click',function(){document.getElementById('nextWrap').style.display='none';affQ();});
  document.getElementById('btnNouv').addEventListener('click',function(){location.reload();});
  document.getElementById('btnSuivi').addEventListener('click',function(){window.location.href='suivi-parent.html';});
  setEleve('wassil');
};
</script>
