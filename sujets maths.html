<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📐 Sujets Blancs Maths — Brevet 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#09090f;--bg2:#111118;--bg3:#181820;--border:rgba(255,255,255,0.06);--border2:rgba(255,255,255,0.12);--text:#f0ede8;--muted:rgba(240,237,232,0.45);--muted2:rgba(240,237,232,0.2);--gold:#e8c87a;--gold2:#f5dfa0;--blue:#6ab4f5;--green:#7ecf8a;--coral:#f07a5a;--red:#f55a5a;--purple:#a98af5;--teal:#5ecfb1;--r:14px;--r-sm:8px;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;}
#home{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;background:radial-gradient(ellipse at 50% 0%,rgba(106,180,245,0.08) 0%,transparent 55%);}
.badge{font-family:'DM Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:2px;color:var(--blue);border:1px solid rgba(106,180,245,0.3);background:rgba(106,180,245,0.06);padding:5px 14px;border-radius:999px;margin-bottom:20px;}
h1{font-family:'Syne',sans-serif;font-size:clamp(32px,6vw,54px);font-weight:800;text-align:center;line-height:1.05;letter-spacing:-1px;margin-bottom:8px;}
h1 span{color:var(--blue);}
.sub{color:var(--muted);font-size:14px;text-align:center;max-width:480px;line-height:1.7;margin-bottom:32px;}
.sujets-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;max-width:600px;width:100%;margin-bottom:28px;}
.sujet-card{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r);padding:18px;cursor:pointer;transition:all 0.2s;position:relative;}
.sujet-card:hover{border-color:rgba(106,180,245,0.4);transform:translateY(-2px);}
.sc-num{font-family:'DM Mono',monospace;font-size:10px;color:var(--blue);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;}
.sc-title{font-family:'Syne',sans-serif;font-size:15px;font-weight:700;margin-bottom:4px;}
.sc-info{font-size:11px;color:var(--muted);font-family:'DM Mono',monospace;}
.sc-done{position:absolute;top:12px;right:12px;width:18px;height:18px;border-radius:50%;background:var(--green);display:none;align-items:center;justify-content:center;font-size:9px;color:#060f0a;}

.who-row{display:flex;gap:10px;margin-bottom:20px;}
.who-btn{padding:8px 22px;border-radius:999px;border:1px solid var(--border2);background:var(--bg2);color:var(--muted);cursor:pointer;font-family:'DM Sans',sans-serif;font-weight:600;font-size:13px;transition:all 0.18s;}
.who-btn.aw{border-color:#7eb8f5;background:rgba(126,184,245,0.1);color:#7eb8f5;}
.who-btn.an{border-color:#f59eb8;background:rgba(245,158,184,0.1);color:#f59eb8;}

/* SUJET PAGE */
#sujet-page{display:none;max-width:760px;margin:0 auto;padding:0;}
.s-header{position:sticky;top:0;z-index:10;background:rgba(9,9,15,0.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;gap:14px;}
.s-logo{font-family:'Syne',sans-serif;font-weight:800;font-size:14px;color:var(--blue);}
.s-meta{font-size:11px;color:var(--muted);font-family:'DM Mono',monospace;}
.back{margin-left:auto;background:none;border:1px solid var(--border2);border-radius:var(--r-sm);padding:7px 14px;color:var(--muted);cursor:pointer;font-size:11px;font-family:'DM Mono',monospace;transition:all 0.15s;text-transform:uppercase;}
.back:hover{background:rgba(255,255,255,0.04);}
.chrono-bar{background:rgba(232,200,122,0.08);border-bottom:1px solid rgba(232,200,122,0.2);padding:8px 24px;display:flex;align-items:center;justify-content:space-between;}
.chrono-label{font-size:11px;color:var(--gold);font-family:'DM Mono',monospace;text-transform:uppercase;letter-spacing:1px;}
.chrono-time{font-family:'DM Mono',monospace;font-size:18px;font-weight:700;color:var(--gold);}
.chrono-time.urgent{color:var(--red);animation:blink 0.8s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}
.chrono-btns{display:flex;gap:8px;}
.chrono-btn{font-size:11px;padding:4px 12px;border-radius:999px;border:1px solid rgba(232,200,122,0.3);background:rgba(232,200,122,0.07);color:var(--gold);cursor:pointer;font-family:'DM Mono',monospace;transition:all 0.15s;}
.chrono-btn:hover{background:rgba(232,200,122,0.15);}

.s-body{padding:24px;}

/* Parties */
.partie{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r);margin-bottom:20px;overflow:hidden;}
.partie-header{background:var(--bg3);padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;}
.partie-label{font-family:'Syne',sans-serif;font-size:13px;font-weight:800;color:var(--blue);}
.partie-pts{font-family:'DM Mono',monospace;font-size:11px;color:var(--gold);margin-left:auto;}
.partie-time{font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);}
.partie-body{padding:20px;}

/* Exercice */
.exo{margin-bottom:24px;padding-bottom:24px;border-bottom:1px solid var(--border);}
.exo:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0;}
.exo-title{font-family:'Syne',sans-serif;font-size:14px;font-weight:700;color:var(--text);margin-bottom:6px;display:flex;align-items:center;gap:10px;}
.exo-pts{font-family:'DM Mono',monospace;font-size:10px;color:var(--gold);border:1px solid rgba(232,200,122,0.3);background:rgba(232,200,122,0.07);padding:2px 8px;border-radius:999px;}
.context{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r-sm);padding:14px 16px;margin-bottom:14px;font-size:13px;color:var(--muted);line-height:1.7;border-left:2px solid var(--blue);}
.context strong{color:var(--text);}

/* Questions */
.q-block{margin-bottom:14px;}
.q-line{display:flex;align-items:flex-start;gap:10px;margin-bottom:8px;}
.q-label{font-family:'DM Mono',monospace;font-size:11px;color:var(--blue);font-weight:700;min-width:24px;margin-top:2px;}
.q-text{font-size:13px;color:var(--text);line-height:1.6;flex:1;}
.q-pts-sm{font-size:10px;color:var(--gold);font-family:'DM Mono',monospace;white-space:nowrap;}
.answer-ta{width:100%;min-height:64px;background:var(--bg);border:1px solid var(--border2);border-radius:var(--r-sm);padding:10px 12px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;line-height:1.6;outline:none;resize:vertical;transition:border-color 0.2s;margin-bottom:6px;}
.answer-ta:focus{border-color:rgba(106,180,245,0.4);}
.corr-btn{font-size:11px;padding:5px 12px;border-radius:999px;border:1px solid rgba(94,207,177,0.25);background:rgba(94,207,177,0.06);color:var(--teal);cursor:pointer;font-family:'DM Mono',monospace;transition:all 0.15s;}
.corr-btn:hover{background:rgba(94,207,177,0.12);}
.corr-box{display:none;margin-top:8px;padding:12px 14px;background:rgba(126,207,138,0.06);border:1px solid rgba(126,207,138,0.2);border-radius:var(--r-sm);font-size:13px;color:var(--muted);line-height:1.7;}
.corr-box.show{display:block;}
.corr-box strong{color:var(--text);}

/* Auto-éval */
.auto-eval{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r);padding:20px;margin-top:20px;}
.ae-title{font-family:'DM Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:2px;color:var(--muted);margin-bottom:16px;}
.ae-row{display:flex;align-items:center;gap:12px;margin-bottom:10px;}
.ae-label{font-size:13px;flex:1;}
.ae-input{width:60px;background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r-sm);padding:6px 10px;color:var(--text);font-family:'DM Mono',monospace;font-size:14px;text-align:center;outline:none;}
.ae-max{font-size:12px;color:var(--muted);font-family:'DM Mono',monospace;}
.ae-total{background:linear-gradient(135deg,rgba(232,200,122,0.12),rgba(232,200,122,0.06));border:1px solid rgba(232,200,122,0.3);border-radius:var(--r-sm);padding:14px 18px;text-align:center;margin-top:14px;}
.ae-total-num{font-family:'Syne',sans-serif;font-size:36px;font-weight:800;color:var(--gold);}
.ae-total-lbl{font-size:11px;color:var(--muted);font-family:'DM Mono',monospace;}

.save-btn{width:100%;background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r);padding:12px;color:var(--muted);cursor:pointer;font-family:'DM Sans',sans-serif;font-size:13px;transition:all 0.15s;margin-top:12px;}
.save-btn:hover{background:rgba(255,255,255,0.04);color:var(--text);}
.nav-btns{display:flex;gap:10px;margin-top:12px;}
.nav-btn{flex:1;padding:12px;border-radius:var(--r);border:1px solid var(--border2);background:var(--bg2);color:var(--muted);cursor:pointer;font-family:'DM Sans',sans-serif;font-size:13px;transition:all 0.15s;}
.nav-btn:hover{background:rgba(255,255,255,0.04);color:var(--text);}
.nav-btn.primary{background:linear-gradient(135deg,var(--blue),#4a8fd4);border:none;color:#fff;font-weight:700;}

.toast{position:fixed;bottom:24px;right:24px;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r-sm);padding:12px 20px;font-size:12px;z-index:200;opacity:0;transform:translateY(10px);transition:all 0.3s;pointer-events:none;font-family:'DM Mono',monospace;}
.toast.show{opacity:1;transform:translateY(0);}
.toast.ok{border-color:rgba(94,207,177,0.4);color:var(--teal);}
.toast.err{border-color:rgba(245,90,90,0.4);color:var(--red);}
@media(max-width:480px){.sujets-grid{grid-template-columns:1fr;}.ae-row{flex-wrap:wrap;}}
</style>
</head>
<body>

<div id="home">
  <div class="badge">📐 Sujets blancs complets — Mathématiques</div>
  <h1>Brevet Blanc <span>Maths</span></h1>
  <p class="sub">10 sujets complets format DNB 2026. Partie 1 automatismes (20 min) + Partie 2 problèmes (1h40). Corrections intégrales.</p>
  <div style="font-size:11px;color:var(--muted);font-family:'DM Mono',monospace;text-transform:uppercase;letter-spacing:1px;margin-bottom:12px">Qui révise ?</div>
  <div class="who-row">
    <button class="who-btn" id="wb-w" onclick="selWho('W')">Wassil</button>
    <button class="who-btn" id="wb-n" onclick="selWho('N')">Nawal</button>
  </div>
  <div class="sujets-grid" id="sujets-grid"></div>
  <a href="index.html" style="font-size:12px;color:var(--muted);font-family:'DM Mono',monospace;text-decoration:none;margin-top:8px;">← Hub Central</a>
</div>

<div id="sujet-page">
  <div class="s-header">
    <div><div class="s-logo">📐 Brevet Blanc Maths</div><div class="s-meta" id="s-meta">—</div></div>
    <button class="back" onclick="goHome()">← Retour</button>
  </div>
  <div class="chrono-bar">
    <div class="chrono-label">⏱ Chronomètre</div>
    <div class="chrono-time" id="chrono">2:00:00</div>
    <div class="chrono-btns">
      <button class="chrono-btn" onclick="startChrono()">▶ Démarrer</button>
      <button class="chrono-btn" onclick="resetChrono()">↺ Reset</button>
    </div>
  </div>
  <div class="s-body" id="s-body"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const SHEETS={W:'https://script.google.com/macros/s/AKfycbyak5HZqHjMtAUB2lsfA_tKHmQipCjpfFUE6jN0OTf0GmlFt7ScHrOHkcitGw_5sZc2/exec',N:'https://script.google.com/macros/s/AKfycbxf_F8OOvL7QvtWFcNEHw-ErjYOw7MkQn3d7X-QeS6aqkEDZlVVytTxw3KVbhhszfcs/exec'};

const SUJETS=[
{id:1,titre:'Pythagore, probabilités et fonctions',themes:['Pythagore','Probabilités','Fonctions affines'],
partie1:{titre:'Automatismes',pts:6,temps:'20 min',
questions:[
  {n:'1',pts:0.5,q:'Quel est le carré de 13 ?',c:'13² = 169'},
  {n:'2',pts:0.5,q:'Simplifier la fraction 18/24.',c:'18/24 = 3/4 (on divise par 6)'},
  {n:'3',pts:0.5,q:'Calculer 15% de 80.',c:'15% × 80 = 0,15 × 80 = 12'},
  {n:'4',pts:0.5,q:'Vrai ou faux : √25 = 5',c:'Vrai. 5 × 5 = 25 donc √25 = 5'},
  {n:'5',pts:0.5,q:'Quel est le périmètre d\'un carré de côté 7 cm ?',c:'P = 4 × 7 = 28 cm'},
  {n:'6',pts:0.5,q:'Résoudre : 3x = 21',c:'x = 21/3 = 7'},
  {n:'7',pts:0.5,q:'Donner les coordonnées de l\'origine d\'un repère.',c:'O(0 ; 0)'},
  {n:'8',pts:0.5,q:'Un dé à 6 faces. Quelle est la probabilité d\'obtenir un nombre impair ?',c:'P = 3/6 = 1/2. Nombres impairs : 1, 3, 5'},
  {n:'9',pts:0.5,q:'Convertir 2,5 heures en minutes.',c:'2,5 × 60 = 150 minutes'},
  {n:'10',pts:0.5,q:'Calculer l\'aire d\'un rectangle de longueur 9 cm et largeur 4 cm.',c:'A = 9 × 4 = 36 cm²'},
  {n:'11',pts:0.5,q:'Vrai ou faux : 0 est un nombre pair.',c:'Vrai. 0 = 2 × 0, donc divisible par 2'},
  {n:'12',pts:0.5,q:'Combien y a-t-il de faces dans un cube ?',c:'6 faces'},
]},
partie2:{titre:'Résolution de problèmes',pts:14,temps:'1h40',
exercices:[
  {titre:'Exercice 1 — Pythagore',pts:5,
  context:'Un terrain de football rectangulaire mesure 90 m de longueur et 60 m de largeur.',
  questions:[
    {n:'1.',pts:2,q:'Calculer la longueur de la diagonale du terrain.',c:'diagonale² = 90² + 60² = 8100 + 3600 = 11700. diagonale = √11700 ≈ 108,2 m'},
    {n:'2.',pts:3,q:'Un joueur court du coin A au coin B (diagonale), puis du coin B au coin C (largeur). Quelle distance totale parcourt-il ? Arrondir au dixième.',c:'Distance = diagonale + largeur = 108,2 + 60 = 168,2 m'},
  ]},
  {titre:'Exercice 2 — Probabilités',pts:4,
  context:'Une urne contient 4 boules rouges, 3 boules bleues et 2 boules vertes. On tire une boule au hasard.',
  questions:[
    {n:'1.',pts:1,q:'Calculer P(rouge).',c:'P(rouge) = 4/9'},
    {n:'2.',pts:1,q:'Calculer P(verte).',c:'P(verte) = 2/9'},
    {n:'3.',pts:2,q:'On tire 2 boules successivement avec remise. Calculer la probabilité d\'obtenir 2 boules rouges.',c:'P = 4/9 × 4/9 = 16/81 ≈ 0,198'},
  ]},
  {titre:'Exercice 3 — Fonctions',pts:5,
  context:'Une piscine se remplit à raison de 3 m³ par heure. Au départ, elle contient déjà 5 m³ d\'eau.',
  questions:[
    {n:'1.',pts:1,q:'Exprimer le volume V (en m³) en fonction du temps t (en heures).',c:'V(t) = 3t + 5'},
    {n:'2.',pts:2,q:'Quel est le volume d\'eau après 4 heures ? Après 10 heures ?',c:'V(4) = 3×4+5 = 17 m³. V(10) = 3×10+5 = 35 m³'},
    {n:'3.',pts:2,q:'La piscine a une capacité de 50 m³. Au bout de combien d\'heures sera-t-elle pleine ?',c:'3t + 5 = 50 → 3t = 45 → t = 15 heures'},
  ]},
]}},

{id:2,titre:'Statistiques, géométrie et proportionnalité',themes:['Statistiques','Aires et volumes','Proportionnalité'],
partie1:{titre:'Automatismes',pts:6,temps:'20 min',
questions:[
  {n:'1',pts:0.5,q:'Calculer la moyenne de : 8, 12, 6, 14, 10',c:'Moyenne = (8+12+6+14+10)/5 = 50/5 = 10'},
  {n:'2',pts:0.5,q:'Donner la médiane de : 3, 7, 9, 11, 15',c:'Médiane = 9 (valeur centrale, 5 valeurs)'},
  {n:'3',pts:0.5,q:'Un article coûte 80 €. Après 20% de réduction, quel est son prix ?',c:'80 × 0,8 = 64 €'},
  {n:'4',pts:0.5,q:'Quelle est la formule de l\'aire d\'un triangle ?',c:'A = (base × hauteur) / 2'},
  {n:'5',pts:0.5,q:'Calculer 2³ × 3²',c:'8 × 9 = 72'},
  {n:'6',pts:0.5,q:'Vrai ou faux : tout carré est un rectangle.',c:'Vrai. Un carré est un rectangle particulier (4 côtés égaux).'},
  {n:'7',pts:0.5,q:'Résoudre : 2x + 3 = 11',c:'2x = 8 → x = 4'},
  {n:'8',pts:0.5,q:'Combien vaut x si x/4 = 7 ?',c:'x = 28'},
  {n:'9',pts:0.5,q:'Convertir 3 km en mètres.',c:'3 km = 3000 m'},
  {n:'10',pts:0.5,q:'Quel est le volume d\'un cube de côté 4 cm ?',c:'V = 4³ = 64 cm³'},
  {n:'11',pts:0.5,q:'Calculer 3/4 + 1/2',c:'3/4 + 2/4 = 5/4'},
  {n:'12',pts:0.5,q:'Donner le double de 37.',c:'74'},
]},
partie2:{titre:'Résolution de problèmes',pts:14,temps:'1h40',
exercices:[
  {titre:'Exercice 1 — Statistiques',pts:6,
  context:'Les notes de 10 élèves à un contrôle sont : 8, 12, 15, 7, 11, 14, 9, 13, 10, 11.',
  questions:[
    {n:'1.',pts:2,q:'Calculer la moyenne de la classe.',c:'Somme = 110. Moyenne = 110/10 = 11'},
    {n:'2.',pts:2,q:'Déterminer la médiane.',c:'Valeurs triées : 7,8,9,10,11,11,12,13,14,15. Médiane = (11+11)/2 = 11'},
    {n:'3.',pts:2,q:'Quel est l\'étendue de cette série ?',c:'Étendue = max - min = 15 - 7 = 8'},
  ]},
  {titre:'Exercice 2 — Géométrie',pts:4,
  context:'Un cône a une hauteur de 12 cm et un rayon de base de 5 cm. (V = πr²h/3)',
  questions:[
    {n:'1.',pts:2,q:'Calculer le volume du cône. (π ≈ 3,14)',c:'V = π × 5² × 12 / 3 = 3,14 × 25 × 4 = 314 cm³'},
    {n:'2.',pts:2,q:'Un cylindre de même rayon et même hauteur. Quel est le rapport de leurs volumes ?',c:'V_cylindre = π×25×12 = 942 cm³. Rapport = 942/314 = 3. Le cylindre a un volume 3 fois plus grand.'},
  ]},
  {titre:'Exercice 3 — Proportionnalité',pts:4,
  context:'Pour fabriquer 5 gâteaux, une recette nécessite 750 g de farine, 6 œufs et 300 g de beurre.',
  questions:[
    {n:'1.',pts:2,q:'Calculer les quantités nécessaires pour 8 gâteaux.',c:'Coefficient : 8/5 = 1,6. Farine : 750 × 1,6 = 1200 g. Œufs : 6 × 1,6 = 9,6 ≈ 10 œufs. Beurre : 300 × 1,6 = 480 g.'},
    {n:'2.',pts:2,q:'On dispose de 1 kg de farine. Combien de gâteaux peut-on faire ?',c:'1000/750 × 5 = 6,67 → 6 gâteaux (on arrondit à l\'entier inférieur).'},
  ]},
]}},

{id:3,titre:'Nombres relatifs, puissances et équations',themes:['Nombres relatifs','Puissances','Équations 2nd degré'],
partie1:{titre:'Automatismes',pts:6,temps:'20 min',
questions:[
  {n:'1',pts:0.5,q:'Calculer : (-3) × (-5)',c:'(-3) × (-5) = +15. Deux négatifs → positif.'},
  {n:'2',pts:0.5,q:'Calculer : (-8) + 3',c:'-8 + 3 = -5'},
  {n:'3',pts:0.5,q:'Donner le résultat de 10⁰',c:'10⁰ = 1. Tout nombre (non nul) à la puissance 0 vaut 1.'},
  {n:'4',pts:0.5,q:'Écrire en notation scientifique : 45 000',c:'4,5 × 10⁴'},
  {n:'5',pts:0.5,q:'Résoudre : x² = 49',c:'x = 7 ou x = -7'},
  {n:'6',pts:0.5,q:'Calculer : 2⁵',c:'2⁵ = 32'},
  {n:'7',pts:0.5,q:'Vrai ou faux : (-2)² = -4',c:'Faux. (-2)² = (-2)×(-2) = +4'},
  {n:'8',pts:0.5,q:'Simplifier : 5x + 3x - 2x',c:'6x'},
  {n:'9',pts:0.5,q:'Développer : 3(2x - 5)',c:'6x - 15'},
  {n:'10',pts:0.5,q:'Factoriser : 4x + 12',c:'4(x + 3)'},
  {n:'11',pts:0.5,q:'Calculer : 3/5 × 10/9',c:'30/45 = 2/3'},
  {n:'12',pts:0.5,q:'Donner le PGCD de 24 et 36.',c:'PGCD = 12. (24 = 12×2, 36 = 12×3)'},
]},
partie2:{titre:'Résolution de problèmes',pts:14,temps:'1h40',
exercices:[
  {titre:'Exercice 1 — Nombres relatifs et cotations',pts:4,
  context:'Un plongeur se trouve à -15 m sous la surface. Un sous-marin est à -48 m. Un bateau est à +3 m.',
  questions:[
    {n:'1.',pts:1,q:'Quelle est la distance entre le plongeur et le sous-marin ?',c:'|-15 - (-48)| = |-15 + 48| = |33| = 33 m'},
    {n:'2.',pts:1,q:'Quelle est la distance entre le bateau et le plongeur ?',c:'|3 - (-15)| = |18| = 18 m'},
    {n:'3.',pts:2,q:'Le plongeur descend de 12 m puis remonte de 5 m. Quelle est sa nouvelle position ?',c:'-15 - 12 + 5 = -22 m'},
  ]},
  {titre:'Exercice 2 — Puissances et notation scientifique',pts:4,
  context:'La distance Terre-Soleil est d\'environ 1,5 × 10⁸ km. La lumière parcourt 3 × 10⁵ km/s.',
  questions:[
    {n:'1.',pts:2,q:'Calculer le temps (en secondes) que met la lumière pour aller du Soleil à la Terre.',c:'t = d/v = (1,5 × 10⁸)/(3 × 10⁵) = 0,5 × 10³ = 500 secondes'},
    {n:'2.',pts:2,q:'Convertir ce temps en minutes et secondes.',c:'500 s = 8 min 20 s'},
  ]},
  {titre:'Exercice 3 — Équations et inéquations',pts:6,
  context:'Un rectangle a un périmètre de 56 cm. Sa longueur est le double de sa largeur.',
  questions:[
    {n:'1.',pts:2,q:'En notant x la largeur, écrire une équation traduisant le problème.',c:'Périmètre = 2(longueur + largeur) = 2(2x + x) = 6x = 56'},
    {n:'2.',pts:2,q:'Résoudre l\'équation et donner les dimensions.',c:'6x = 56 → x = 56/6 ≈ 9,33 cm. Largeur ≈ 9,33 cm, Longueur ≈ 18,67 cm.'},
    {n:'3.',pts:2,q:'Calculer l\'aire du rectangle.',c:'A = longueur × largeur ≈ 18,67 × 9,33 ≈ 174,2 cm²'},
  ]},
]}},

{id:4,titre:'Trigonométrie, suites et statistiques',themes:['Trigonométrie','Suites','Statistiques'],
partie1:{titre:'Automatismes',pts:6,temps:'20 min',
questions:[
  {n:'1',pts:0.5,q:'Dans un triangle rectangle, cos(angle) = adjacent/hypoténuse. Vrai ou faux ?',c:'Vrai. C\'est la définition du cosinus dans un triangle rectangle.'},
  {n:'2',pts:0.5,q:'Calculer sin(30°).',c:'sin(30°) = 0,5 = 1/2'},
  {n:'3',pts:0.5,q:'Donner cos(0°).',c:'cos(0°) = 1'},
  {n:'4',pts:0.5,q:'Quelle est la somme des angles d\'un triangle ?',c:'180°'},
  {n:'5',pts:0.5,q:'Un triangle équilatéral a des angles de combien de degrés ?',c:'60° chacun (180/3 = 60)'},
  {n:'6',pts:0.5,q:'Calculer la médiane de : 2, 5, 8, 11, 14',c:'Médiane = 8 (valeur centrale)'},
  {n:'7',pts:0.5,q:'Donner le premier terme et la raison de la suite : 3, 7, 11, 15...',c:'Premier terme : 3. Raison : 4 (on ajoute 4 à chaque fois). Suite arithmétique.'},
  {n:'8',pts:0.5,q:'Quel est le 5ème terme de cette suite ?',c:'15 + 4 = 19'},
  {n:'9',pts:0.5,q:'Calculer 5! (factorielle 5)',c:'5! = 5×4×3×2×1 = 120'},
  {n:'10',pts:0.5,q:'Simplifier : (3x²)/(x)',c:'3x'},
  {n:'11',pts:0.5,q:'Vrai ou faux : tan(45°) = 1',c:'Vrai. tan(45°) = sin(45°)/cos(45°) = 1'},
  {n:'12',pts:0.5,q:'Convertir 90° en radians.',c:'π/2 radians'},
]},
partie2:{titre:'Résolution de problèmes',pts:14,temps:'1h40',
exercices:[
  {titre:'Exercice 1 — Trigonométrie',pts:6,
  context:'Une échelle de 5 m fait un angle de 65° avec le sol.',
  questions:[
    {n:'1.',pts:2,q:'Calculer la hauteur h atteinte par le haut de l\'échelle. (sin 65° ≈ 0,906)',c:'sin(65°) = h/5 → h = 5 × 0,906 = 4,53 m'},
    {n:'2.',pts:2,q:'Calculer la distance d entre le pied de l\'échelle et le mur. (cos 65° ≈ 0,423)',c:'cos(65°) = d/5 → d = 5 × 0,423 = 2,115 m'},
    {n:'3.',pts:2,q:'Vérifier par Pythagore que les résultats sont cohérents.',c:'h² + d² = 4,53² + 2,115² = 20,52 + 4,47 ≈ 25 = 5² ✓'},
  ]},
  {titre:'Exercice 2 — Suites arithmétiques',pts:4,
  context:'Un nageur s\'entraîne chaque jour. Il nage 500 m le premier jour, puis augmente de 50 m chaque jour.',
  questions:[
    {n:'1.',pts:1,q:'Quelle distance nage-t-il le 7ème jour ?',c:'u₇ = 500 + (7-1)×50 = 500 + 300 = 800 m'},
    {n:'2.',pts:3,q:'Quelle est la distance totale nage sur 10 jours ?',c:'Somme = n/2 × (u₁ + u₁₀). u₁₀ = 500 + 9×50 = 950. Somme = 10/2 × (500+950) = 5 × 1450 = 7250 m'},
  ]},
  {titre:'Exercice 3 — Statistiques avancées',pts:4,
  context:'Tableau de notes d\'une classe : Note 6(2 élèves), 8(4), 10(6), 12(8), 14(5), 16(3), 18(2)',
  questions:[
    {n:'1.',pts:2,q:'Calculer la moyenne pondérée.',c:'Total élèves = 30. Somme = 6×2+8×4+10×6+12×8+14×5+16×3+18×2 = 12+32+60+96+70+48+36 = 354. Moyenne = 354/30 = 11,8'},
    {n:'2.',pts:2,q:'Déterminer la classe modale.',c:'La classe modale est 12 (8 élèves, fréquence maximale).'},
  ]},
]}},

{id:5,titre:'Algèbre, géométrie dans l\'espace et probabilités',themes:['Identités remarquables','Volume sphère','Probabilités conditionnelles'],
partie1:{titre:'Automatismes',pts:6,temps:'20 min',
questions:[
  {n:'1',pts:0.5,q:'Développer (x+4)²',c:'x² + 8x + 16'},
  {n:'2',pts:0.5,q:'Factoriser x² - 9',c:'(x-3)(x+3). Identité : a²-b² = (a-b)(a+b)'},
  {n:'3',pts:0.5,q:'Calculer l\'aire d\'un disque de rayon 3 cm. (π≈3,14)',c:'A = π×3² = 9π ≈ 28,26 cm²'},
  {n:'4',pts:0.5,q:'Quelle est la formule du volume d\'une sphère de rayon r ?',c:'V = (4/3)πr³'},
  {n:'5',pts:0.5,q:'Résoudre : x/3 = 5',c:'x = 15'},
  {n:'6',pts:0.5,q:'Vrai ou faux : un losange est un parallélogramme.',c:'Vrai. Un losange est un parallélogramme avec 4 côtés égaux.'},
  {n:'7',pts:0.5,q:'Calculer : 4/5 ÷ 2/3',c:'4/5 × 3/2 = 12/10 = 6/5'},
  {n:'8',pts:0.5,q:'Donner l\'équation d\'une droite passant par (0,2) avec une pente de 3.',c:'y = 3x + 2'},
  {n:'9',pts:0.5,q:'Résoudre : |x| = 6',c:'x = 6 ou x = -6'},
  {n:'10',pts:0.5,q:'Calculer le discriminant de x² + 2x - 3 (Δ = b²-4ac)',c:'Δ = 4 - 4×1×(-3) = 4+12 = 16'},
  {n:'11',pts:0.5,q:'Donner les solutions de x² + 2x - 3 = 0',c:'x = (-2±4)/2. x₁ = 1, x₂ = -3'},
  {n:'12',pts:0.5,q:'Donner un multiple commun de 4 et 6.',c:'PPCM = 12 (4×3 = 6×2 = 12)'},
]},
partie2:{titre:'Résolution de problèmes',pts:14,temps:'1h40',
exercices:[
  {titre:'Exercice 1 — Identités remarquables',pts:4,
  context:'Soit l\'expression E = (2x+3)² - (x-1)(x+1)',
  questions:[
    {n:'1.',pts:2,q:'Développer et réduire E.',c:'E = 4x²+12x+9 - (x²-1) = 4x²+12x+9-x²+1 = 3x²+12x+10'},
    {n:'2.',pts:2,q:'Calculer E pour x = 2.',c:'E = 3×4+12×2+10 = 12+24+10 = 46'},
  ]},
  {titre:'Exercice 2 — Volume et surface sphère',pts:4,
  context:'Une boule de pétanque est une sphère de rayon 3,5 cm. (V=(4/3)πr³, S=4πr²)',
  questions:[
    {n:'1.',pts:2,q:'Calculer le volume de la boule. (π≈3,14)',c:'V = (4/3)×3,14×3,5³ = (4/3)×3,14×42,875 ≈ 179,5 cm³'},
    {n:'2.',pts:2,q:'Calculer l\'aire de la surface de la boule.',c:'S = 4×3,14×3,5² = 4×3,14×12,25 ≈ 153,9 cm²'},
  ]},
  {titre:'Exercice 3 — Problème ouvert',pts:6,
  context:'Une voiture roule à 90 km/h. Elle freine et s\'arrête en 4 secondes.',
  questions:[
    {n:'1.',pts:2,q:'Convertir 90 km/h en m/s.',c:'90 km/h = 90000/3600 = 25 m/s'},
    {n:'2.',pts:2,q:'En supposant le freinage uniforme, calculer la distance de freinage.',c:'Distance = (v_ini + v_fin)/2 × temps = (25+0)/2 × 4 = 50 m'},
    {n:'3.',pts:2,q:'À 130 km/h dans les mêmes conditions (4s), quelle serait la distance d\'arrêt ?',c:'130 km/h ≈ 36,1 m/s. Distance = 36,1/2 × 4 ≈ 72,2 m. Nettement plus dangereux.'},
  ]},
]}},

{id:6,titre:'Suites géométriques, repérage et systèmes',themes:['Suites géométriques','Repérage dans le plan','Systèmes d\'équations'],
partie1:{titre:'Automatismes',pts:6,temps:'20 min',
questions:[
  {n:'1',pts:0.5,q:'Donner le terme suivant : 2, 6, 18, 54, ...',c:'162 (on multiplie par 3 — suite géométrique de raison 3)'},
  {n:'2',pts:0.5,q:'Calculer la distance entre A(0,0) et B(3,4).',c:'AB = √(3²+4²) = √25 = 5'},
  {n:'3',pts:0.5,q:'Donner les coordonnées du milieu de [AB] avec A(2,4) et B(6,8).',c:'M = ((2+6)/2 ; (4+8)/2) = (4 ; 6)'},
  {n:'4',pts:0.5,q:'Résoudre le système : x+y=10 et x-y=4',c:'x=7, y=3 (addition des équations : 2x=14)'},
  {n:'5',pts:0.5,q:'Une suite géométrique a u₁=5 et raison q=2. Donner u₃.',c:'u₃ = 5×2² = 20'},
  {n:'6',pts:0.5,q:'Vrai ou faux : f(x)=x² est une fonction linéaire.',c:'Faux. f(x)=x² est une fonction du 2nd degré, pas linéaire.'},
  {n:'7',pts:0.5,q:'Donner l\'image de -3 par f(x) = x² - 1',c:'f(-3) = 9 - 1 = 8'},
  {n:'8',pts:0.5,q:'Résoudre : 5x - 8 > 2',c:'5x > 10 → x > 2'},
  {n:'9',pts:0.5,q:'Calculer le taux d\'évolution de 80 à 100.',c:'(100-80)/80 × 100 = 25%'},
  {n:'10',pts:0.5,q:'Donner l\'antécédent de 7 par f(x) = 2x + 1',c:'2x+1=7 → x=3'},
  {n:'11',pts:0.5,q:'Quelle est la pente de la droite y = -3x + 5 ?',c:'Pente = -3'},
  {n:'12',pts:0.5,q:'Calculer : √(16×25)',c:'√400 = 20 (ou √16 × √25 = 4×5 = 20)'},
]},
partie2:{titre:'Résolution de problèmes',pts:14,temps:'1h40',
exercices:[
  {titre:'Exercice 1 — Géométrie analytique',pts:5,
  context:'Dans un repère orthonormé, on donne A(1,2), B(5,2) et C(3,6).',
  questions:[
    {n:'1.',pts:2,q:'Calculer les longueurs AB, BC et AC.',c:'AB = |5-1| = 4. BC = √((5-3)²+(2-6)²) = √(4+16) = √20 ≈ 4,47. AC = √((1-3)²+(2-6)²) = √20 ≈ 4,47'},
    {n:'2.',pts:1,q:'Quel type de triangle est ABC ?',c:'BC = AC donc triangle isocèle en C.'},
    {n:'3.',pts:2,q:'Calculer l\'aire du triangle ABC.',c:'Base AB = 4. Hauteur depuis C = |6-2| = 4. Aire = (4×4)/2 = 8 unités²'},
  ]},
  {titre:'Exercice 2 — Systèmes d\'équations',pts:5,
  context:'Un marchand vend des pommes à 2€ la pièce et des poires à 3€ la pièce. Il en vend 20 au total pour 48€.',
  questions:[
    {n:'1.',pts:2,q:'Écrire le système d\'équations (x = pommes, y = poires).',c:'x + y = 20 et 2x + 3y = 48'},
    {n:'2.',pts:3,q:'Résoudre le système et interpréter.',c:'De la 1ère : x = 20-y. Substituer : 2(20-y)+3y=48 → 40+y=48 → y=8. x=12. Il vend 12 pommes et 8 poires.'},
  ]},
  {titre:'Exercice 3 — Suite géométrique',pts:4,
  context:'Une bactérie se divise en 2 toutes les heures. Au départ, il y en a 10.',
  questions:[
    {n:'1.',pts:1,q:'Combien y a-t-il de bactéries après 5 heures ?',c:'u₅ = 10 × 2⁵ = 10 × 32 = 320 bactéries'},
    {n:'2.',pts:3,q:'Au bout de combien d\'heures dépassera-t-on 1000 bactéries ?',c:'10 × 2ⁿ > 1000 → 2ⁿ > 100. 2⁶=64, 2⁷=128 > 100. Donc après 7 heures.'},
  ]},
]}},

{id:7,titre:'Cercles, angles et transformations',themes:['Cercles et angles inscrits','Transformations','Vecteurs'],
partie1:{titre:'Automatismes',pts:6,temps:'20 min',
questions:[
  {n:'1',pts:0.5,q:'Quelle est la mesure d\'un angle inscrit qui intercepte un demi-cercle ?',c:'90° (angle droit). Théorème de l\'angle inscrit dans un demi-cercle.'},
  {n:'2',pts:0.5,q:'Un angle au centre mesure 80°. Quel est l\'angle inscrit interceptant le même arc ?',c:'40° (l\'angle inscrit = moitié de l\'angle au centre)'},
  {n:'3',pts:0.5,q:'Décrire la symétrie centrale de centre O d\'un point A.',c:'A\' est tel que O est le milieu de [AA\']. O = milieu de AA\'.'},
  {n:'4',pts:0.5,q:'Un vecteur AB a pour coordonnées (3,-2). Donner les coordonnées de BA.',c:'BA = (-3, 2). BA = -AB'},
  {n:'5',pts:0.5,q:'Calculer la norme du vecteur v(4,3).',c:'||v|| = √(16+9) = √25 = 5'},
  {n:'6',pts:0.5,q:'Quelle transformation conserve les distances mais pas les angles ?',c:'Aucune — les isométries conservent distances ET angles. (Les homothéties conservent les angles mais pas les distances)'},
  {n:'7',pts:0.5,q:'Vrai ou faux : une translation conserve les longueurs.',c:'Vrai. Une translation est une isométrie.'},
  {n:'8',pts:0.5,q:'Calculer l\'angle manquant dans un triangle avec 40° et 75°.',c:'180 - 40 - 75 = 65°'},
  {n:'9',pts:0.5,q:'Donner les coordonnées de l\'image de A(3,5) par la translation de vecteur (2,-1).',c:'A\' = (3+2 ; 5-1) = (5 ; 4)'},
  {n:'10',pts:0.5,q:'La circonférence d\'un cercle est 31,4 cm. Quel est son rayon ? (π≈3,14)',c:'2πr = 31,4 → r = 5 cm'},
  {n:'11',pts:0.5,q:'Donner l\'image de (2,3) par la symétrie d\'axe x.',c:'(2,-3). Axe x = axe des abscisses, on change le signe de y.'},
  {n:'12',pts:0.5,q:'Calculer AB + BC si A(0,0), B(3,1), C(5,4).',c:'AB=(3,1), BC=(2,3). AB+BC = (5,4) = AC. ✓'},
]},
partie2:{titre:'Résolution de problèmes',pts:14,temps:'1h40',
exercices:[
  {titre:'Exercice 1 — Cercle et angles',pts:5,
  context:'Dans un cercle de centre O et rayon 5 cm, AB est un diamètre. C est un point du cercle tel que AC = 3 cm.',
  questions:[
    {n:'1.',pts:1,q:'Quelle est la mesure de l\'angle ACB ?',c:'ACB = 90° car AB est diamètre (théorème de l\'angle inscrit dans un demi-cercle)'},
    {n:'2.',pts:2,q:'Calculer BC.',c:'BC² = AB² - AC² = 10² - 3² = 100-9 = 91. BC = √91 ≈ 9,54 cm'},
    {n:'3.',pts:2,q:'Calculer cos(BAC).',c:'cos(BAC) = AC/AB = 3/10 = 0,3. Angle BAC ≈ 72,5°'},
  ]},
  {titre:'Exercice 2 — Vecteurs et translations',pts:5,
  context:'ABCD est un parallélogramme avec A(1,1), B(4,2), C(5,5).',
  questions:[
    {n:'1.',pts:2,q:'Calculer les coordonnées de D.',c:'Dans un parallélogramme, AB = DC. AB = (3,1). D = C - AB = (5-3 ; 5-1) = (2,4)'},
    {n:'2.',pts:3,q:'Calculer les coordonnées du centre du parallélogramme (intersection des diagonales).',c:'Milieu de AC = ((1+5)/2 ; (1+5)/2) = (3,3). Vérification : milieu de BD = ((4+2)/2 ; (2+4)/2) = (3,3) ✓'},
  ]},
  {titre:'Exercice 3 — Transformations',pts:4,
  context:'Un triangle ABC a pour sommets A(0,0), B(4,0), C(2,3).',
  questions:[
    {n:'1.',pts:2,q:'Donner les coordonnées des images A\', B\', C\' par la symétrie d\'axe y.',c:'A\'(0,0), B\'(-4,0), C\'(-2,3). On change le signe de x.'},
    {n:'2.',pts:2,q:'Donner les coordonnées des images par la translation de vecteur (1,2).',c:'A\'\'(1,2), B\'\'(5,2), C\'\'(3,5).'},
  ]},
]}},

{id:8,titre:'Fonctions du 2nd degré et statistiques bivariées',themes:['Fonctions 2nd degré','Nuage de points','Droite des moindres carrés'],
partie1:{titre:'Automatismes',pts:6,temps:'20 min',
questions:[
  {n:'1',pts:0.5,q:'Signe du discriminant si f(x)=x²+1 (a>0). Combien de racines ?',c:'Δ = 0 - 4×1 = -4 < 0. Pas de racine réelle. La parabole ne coupe pas l\'axe x.'},
  {n:'2',pts:0.5,q:'Donner les racines de x² - 5x + 6 = 0',c:'Δ = 25-24 = 1. x = (5±1)/2. x₁=3, x₂=2'},
  {n:'3',pts:0.5,q:'Pour f(x)=2x²-8, donner les antécédents de 0.',c:'2x²=8 → x²=4 → x=2 ou x=-2'},
  {n:'4',pts:0.5,q:'Donner les coordonnées du sommet de f(x)=x²-4x+3.',c:'Sommet : x_s = -b/2a = 4/2 = 2. y_s = f(2) = 4-8+3 = -1. Sommet (2,-1)'},
  {n:'5',pts:0.5,q:'Une parabole a-t-elle un axe de symétrie ?',c:'Oui — l\'axe de symétrie passe par le sommet, équation x = -b/2a'},
  {n:'6',pts:0.5,q:'Vrai ou faux : si a<0, la parabole est tournée vers le bas.',c:'Vrai. Si a>0 → U (bas), a<0 → ∩ (haut)'},
  {n:'7',pts:0.5,q:'Calculer la corrélation (sens) : quand x augmente, y diminue.',c:'Corrélation négative'},
  {n:'8',pts:0.5,q:'Qu\'est-ce qu\'un nuage de points ?',c:'Représentation graphique d\'une série statistique à deux variables (xi, yi) dans un repère.'},
  {n:'9',pts:0.5,q:'Donner le tableau des signes de f(x) = (x-2)(x+3)',c:'f<0 pour x∈]-3;2[, f>0 pour x<-3 ou x>2, f=0 en x=-3 et x=2'},
  {n:'10',pts:0.5,q:'Résoudre x²-4 ≥ 0',c:'(x-2)(x+2)≥0 → x≤-2 ou x≥2'},
  {n:'11',pts:0.5,q:'Donner le maximum de f(x) = -x² + 6x - 5',c:'x_s = 3. f(3) = -9+18-5 = 4. Maximum = 4 en x=3'},
  {n:'12',pts:0.5,q:'Calculer 3/4 - 1/6',c:'9/12 - 2/12 = 7/12'},
]},
partie2:{titre:'Résolution de problèmes',pts:14,temps:'1h40',
exercices:[
  {titre:'Exercice 1 — Fonction du 2nd degré',pts:6,
  context:'Un projectile suit la trajectoire h(t) = -5t² + 20t + 2 (h en mètres, t en secondes).',
  questions:[
    {n:'1.',pts:1,q:'Quelle est la hauteur initiale du projectile (t=0) ?',c:'h(0) = 2 m'},
    {n:'2.',pts:2,q:'À quel moment le projectile atteint-il sa hauteur maximale ?',c:'t_max = -b/2a = -20/(2×(-5)) = 2 secondes'},
    {n:'3.',pts:2,q:'Quelle est la hauteur maximale ?',c:'h(2) = -5×4+20×2+2 = -20+40+2 = 22 m'},
    {n:'4.',pts:1,q:'Le projectile touche-t-il le sol avant t=5s ?',c:'h(5) = -125+100+2 = -23 < 0. Oui, il touche le sol avant t=5s.'},
  ]},
  {titre:'Exercice 2 — Statistiques bivariées',pts:4,
  context:'Tableau taille/poids : (160cm,55kg), (165cm,60kg), (170cm,65kg), (175cm,72kg), (180cm,78kg).',
  questions:[
    {n:'1.',pts:2,q:'Calculer les moyennes x̄ et ȳ.',c:'x̄ = (160+165+170+175+180)/5 = 170 cm. ȳ = (55+60+65+72+78)/5 = 66 kg'},
    {n:'2.',pts:2,q:'Le point moyen G est-il sur la droite y = 1,2x - 138 ? Vérifier.',c:'y = 1,2×170 - 138 = 204-138 = 66 = ȳ. Oui, G(170,66) est sur la droite. ✓'},
  ]},
  {titre:'Exercice 3 — Étude complète de fonction',pts:4,
  context:'f(x) = x² - 6x + 5',
  questions:[
    {n:'1.',pts:1,q:'Trouver les racines de f(x) = 0.',c:'Δ = 36-20 = 16. x = (6±4)/2. x₁=5, x₂=1'},
    {n:'2.',pts:1,q:'Donner les coordonnées du sommet.',c:'x_s = 3. f(3) = 9-18+5 = -4. Sommet S(3,-4)'},
    {n:'3.',pts:2,q:'Résoudre f(x) ≤ 0.',c:'f(x) ≤ 0 entre les racines : solution x ∈ [1;5]'},
  ]},
]}},

{id:9,titre:'Arithmétique, fractions et démonstrations',themes:['Divisibilité','Fractions','Démonstrations'],
partie1:{titre:'Automatismes',pts:6,temps:'20 min',
questions:[
  {n:'1',pts:0.5,q:'Décomposer 360 en facteurs premiers.',c:'360 = 2³ × 3² × 5'},
  {n:'2',pts:0.5,q:'Calculer PPCM(12, 18).',c:'PPCM = 36. (12=2²×3, 18=2×3². PPCM=2²×3²=36)'},
  {n:'3',pts:0.5,q:'Est-ce que 147 est divisible par 7 ?',c:'147 ÷ 7 = 21. Oui.'},
  {n:'4',pts:0.5,q:'Simplifier : (2x² + 4x)/(2x)',c:'(2x(x+2))/(2x) = x+2'},
  {n:'5',pts:0.5,q:'Calculer : 3/7 + 2/7',c:'5/7'},
  {n:'6',pts:0.5,q:'Démontrer que 2n+2n est pair pour tout entier n.',c:'2n+2n = 4n = 2×(2n). C\'est un multiple de 2 → pair.'},
  {n:'7',pts:0.5,q:'Vrai ou faux : la somme de deux nombres impairs est impaire.',c:'Faux. (2k+1) + (2m+1) = 2k+2m+2 = 2(k+m+1) → pair.'},
  {n:'8',pts:0.5,q:'Calculer : 5/6 × 3/10',c:'15/60 = 1/4'},

let who=null, currentIdx=0;
let chronoInterval=null, chronoSecs=7200, running=false;

function selWho(w){
  who=w;
  document.getElementById('wb-w').className='who-btn'+(w==='W'?' aw':'');
  document.getElementById('wb-n').className='who-btn'+(w==='N'?' an':'');
  renderHome();
}

function renderHome(){
  const g=document.getElementById('sujets-grid');
  g.innerHTML='';
  const done=JSON.parse(localStorage.getItem('maths_done_'+(who||'X'))||'[]');
  SUJETS.forEach((s,i)=>{
    const d=document.createElement('div');
    d.className='sujet-card';
    d.onclick=()=>openSujet(i);
    const isDone=done.includes(s.id);
    d.innerHTML=`<div class="sc-num">Sujet ${s.id} / 10</div>
    <div class="sc-title">${s.titre}</div>
    <div class="sc-info">${s.themes.join(' · ')}</div>
    <div class="sc-done" style="display:${isDone?'flex':'none'}">✓</div>`;
    g.appendChild(d);
  });
}

function openSujet(idx){
  currentIdx=idx;
  const s=SUJETS[idx];
  document.getElementById('home').style.display='none';
  document.getElementById('sujet-page').style.display='block';
  document.getElementById('s-meta').textContent='Sujet '+s.id+'/10 — '+(who==='W'?'Wassil':'Nawal');
  renderSujet(s);
  chronoSecs=7200;running=false;
  clearInterval(chronoInterval);
  updateChrono();
  window.scrollTo(0,0);
}

function goHome(){
  document.getElementById('sujet-page').style.display='none';
  document.getElementById('home').style.display='flex';
  clearInterval(chronoInterval);
}

function renderSujet(s){
  let html='';
  // PARTIE 1
  html+=`<div class="partie">
    <div class="partie-header">
      <span class="partie-label">PARTIE 1 — ${s.partie1.titre}</span>
      <span class="partie-time">${s.partie1.temps}</span>
      <span class="partie-pts">${s.partie1.pts} pts</span>
    </div>
    <div class="partie-body">
      <p style="font-size:13px;color:var(--muted);margin-bottom:16px;font-family:'DM Mono',monospace;">Sans calculatrice · Réponses directes · 0,5 point par question</p>
      <div class="questions-list" style="display:grid;gap:12px;">`;

  s.partie1.questions.forEach((q,i)=>{
    html+=`<div class="q-block">
      <div class="q-line">
        <span class="q-label">${q.n}.</span>
        <span class="q-text">${q.q}</span>
        <span class="q-pts-sm">${q.pts}pt</span>
      </div>
      <textarea class="answer-ta" style="min-height:44px" id="p1-${i}" placeholder="Réponse..."></textarea>
      <button class="corr-btn" onclick="toggleCorr('c1-${i}')">Correction</button>
      <div class="corr-box" id="c1-${i}"><strong>✓</strong> ${q.c}</div>
    </div>`;
  });
  html+=`</div></div></div>`;

  // PARTIE 2
  html+=`<div class="partie">
    <div class="partie-header">
      <span class="partie-label">PARTIE 2 — ${s.partie2.titre}</span>
      <span class="partie-time">${s.partie2.temps}</span>
      <span class="partie-pts">${s.partie2.pts} pts</span>
    </div>
    <div class="partie-body">`;

  s.partie2.exercices.forEach((e,ei)=>{
    html+=`<div class="exo">
      <div class="exo-title">${e.titre} <span class="exo-pts">${e.pts} pts</span></div>`;
    if(e.context) html+=`<div class="context">${e.context}</div>`;
    e.questions.forEach((q,qi)=>{
      html+=`<div class="q-block">
        <div class="q-line">
          <span class="q-label">${q.n}</span>
          <span class="q-text">${q.q}</span>
          <span class="q-pts-sm">${q.pts}pt${q.pts>1?'s':''}</span>
        </div>
        <textarea class="answer-ta" id="p2-${ei}-${qi}" placeholder="Détaille ta démarche..."></textarea>
        <button class="corr-btn" onclick="toggleCorr('c2-${ei}-${qi}')">Correction</button>
        <div class="corr-box" id="c2-${ei}-${qi}"><strong>✓</strong> ${q.c}</div>
      </div>`;
    });
    html+=`</div>`;
  });
  html+=`</div></div>`;

  // AUTO-ÉVAL
  html+=`<div class="auto-eval">
    <div class="ae-title">— Auto-évaluation — Note ce sujet</div>
    <div class="ae-row"><span class="ae-label">Partie 1 — Automatismes</span><input type="number" class="ae-input" id="ae1" min="0" max="6" value="0" oninput="updateTotal()"><span class="ae-max">/ 6</span></div>
    <div class="ae-row"><span class="ae-label">Partie 2 — Problèmes</span><input type="number" class="ae-input" id="ae2" min="0" max="14" value="0" oninput="updateTotal()"><span class="ae-max">/ 14</span></div>
    <div class="ae-total"><div class="ae-total-lbl">Note totale</div><div class="ae-total-num" id="ae-total">0/20</div></div>
  </div>`;

  // NAV
  html+=`<div class="nav-btns">
    ${currentIdx>0?`<button class="nav-btn" onclick="openSujet(${currentIdx-1})">← Sujet précédent</button>`:''}
    <button class="save-btn" onclick="saveSujet()">💾 Sauvegarder ma note</button>
    ${currentIdx<SUJETS.length-1?`<button class="nav-btn primary" onclick="openSujet(${currentIdx+1})">Sujet suivant →</button>`:`<button class="nav-btn primary" onclick="goHome()">🏠 Retour accueil</button>`}
  </div>`;

  document.getElementById('s-body').innerHTML=html;
}

function toggleCorr(id){
  const b=document.getElementById(id);
  b.classList.toggle('show');
}

function updateTotal(){
  const a=parseInt(document.getElementById('ae1').value)||0;
  const b=parseInt(document.getElementById('ae2').value)||0;
  const t=Math.min(a,6)+Math.min(b,14);
  const el=document.getElementById('ae-total');
  el.textContent=t+'/20';
  el.style.color=t>=14?'var(--green)':t>=10?'var(--gold)':t>=8?'var(--coral)':'var(--red)';
}

async function saveSujet(){
  const a=parseInt(document.getElementById('ae1').value)||0;
  const b=parseInt(document.getElementById('ae2').value)||0;
  const t=Math.min(a,6)+Math.min(b,14);
  const s=SUJETS[currentIdx];

  // Marquer comme fait
  const done=JSON.parse(localStorage.getItem('maths_done_'+(who||'X'))||'[]');
  if(!done.includes(s.id)){done.push(s.id);localStorage.setItem('maths_done_'+(who||'X'),JSON.stringify(done));}

  const url=SHEETS[who];
  try{
    const res=await fetch(url,{method:'POST',mode:'cors',body:JSON.stringify({action:'logAnnale',matiere:'Mathématiques',annee:'Sujet blanc '+s.id,exercice:s.titre,score:t,pointsPerdus:'Partie1:'+a+'/6 Partie2:'+b+'/14',bloque:'',aRetravailler:''})});
    if(res.ok)showToast('✓ Note '+t+'/20 sauvegardée','ok');
    else throw 0;
  }catch(e){showToast('⚠ Sauvegarde impossible','err');}
}

// CHRONO
function startChrono(){
  if(running)return;
  running=true;
  chronoInterval=setInterval(()=>{
    if(chronoSecs<=0){clearInterval(chronoInterval);running=false;showToast('⏱ Temps écoulé !','err');return;}
    chronoSecs--;updateChrono();
  },1000);
}

function resetChrono(){clearInterval(chronoInterval);running=false;chronoSecs=7200;updateChrono();}

function updateChrono(){
  const h=Math.floor(chronoSecs/3600);
  const m=Math.floor((chronoSecs%3600)/60);
  const s=chronoSecs%60;
  const el=document.getElementById('chrono');
  el.textContent=`${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  el.className='chrono-time'+(chronoSecs<600?' urgent':'');
}

function showToast(msg,t){const el=document.getElementById('toast');el.textContent=msg;el.className='toast show '+t;setTimeout(()=>el.className='toast',3500);}

window.addEventListener('DOMContentLoaded',()=>renderHome());
</script>
</body>
