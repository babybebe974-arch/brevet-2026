<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧮 Mathématiques — Brevet 2026</title>
<script src="config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;1,700&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#09090f;--bg2:#111118;--bg3:#181820;--border:rgba(255,255,255,0.06);--border2:rgba(255,255,255,0.12);--text:#f0ede8;--muted:rgba(240,237,232,0.45);--gold:#e8c87a;--teal:#5ecfb1;--coral:#f07a5a;--red:#f55a5a;--green:#7ecf8a;--math:#f5a97f;--r:14px;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;}
#home{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;background:radial-gradient(ellipse at 50% 0%,rgba(245,169,127,0.08) 0%,transparent 55%);}
.badge{font-family:'DM Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:2px;color:var(--math);border:1px solid rgba(245,169,127,0.3);background:rgba(245,169,127,0.06);padding:5px 14px;border-radius:999px;margin-bottom:20px;}
h1{font-family:'Playfair Display',serif;font-size:clamp(32px,6vw,54px);font-weight:800;text-align:center;line-height:1.05;margin-bottom:8px;}
h1 em{color:var(--math);font-style:italic;}
.sub{color:var(--muted);font-size:14px;text-align:center;max-width:480px;line-height:1.7;margin-bottom:32px;}
.sujets-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;max-width:600px;width:100%;margin-bottom:28px;}
.sujet-card{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r);padding:18px;cursor:pointer;transition:all 0.2s;position:relative;}
.sujet-card:hover{border-color:rgba(245,169,127,0.4);transform:translateY(-2px);}
.sc-num{font-family:'DM Mono',monospace;font-size:10px;color:var(--math);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;}
.sc-title{font-family:'Playfair Display',serif;font-size:15px;font-weight:700;margin-bottom:4px;}
.sc-info{font-size:11px;color:var(--muted);font-family:'DM Mono',monospace;}
.sc-done{position:absolute;top:12px;right:12px;width:18px;height:18px;border-radius:50%;background:var(--green);display:none;align-items:center;justify-content:center;font-size:9px;color:#060f0a;}
.who-row{display:flex;gap:10px;margin-bottom:20px;}
.who-btn{padding:8px 22px;border-radius:999px;border:1px solid var(--border2);background:var(--bg2);color:var(--muted);cursor:pointer;font-weight:600;font-size:13px;}
.who-btn.aw{border-color:#7eb8f5;background:rgba(126,184,245,0.1);color:#7eb8f5;}
.who-btn.an{border-color:#f59eb8;background:rgba(245,158,184,0.1);color:#f59eb8;}
#sujet-page{display:none;max-width:760px;margin:0 auto;padding:0;}
.s-header{position:sticky;top:0;z-index:10;background:rgba(9,9,15,0.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;gap:14px;}
.s-logo{font-family:'Playfair Display',serif;font-weight:700;font-size:15px;color:var(--math);}
.s-meta{font-size:11px;color:var(--muted);font-family:'DM Mono',monospace;}
.back{margin-left:auto;background:none;border:1px solid var(--border2);border-radius:8px;padding:7px 14px;color:var(--muted);cursor:pointer;font-size:11px;font-family:'DM Mono',monospace;}
.chrono-bar{background:rgba(245,169,127,0.06);border-bottom:1px solid rgba(245,169,127,0.15);padding:8px 24px;display:flex;align-items:center;justify-content:space-between;}
.chrono-time{font-family:'DM Mono',monospace;font-size:18px;font-weight:700;color:var(--math);}
.chrono-btns{display:flex;gap:8px;}
.chrono-btn{font-size:11px;padding:4px 12px;border-radius:999px;border:1px solid rgba(245,169,127,0.3);background:rgba(245,169,127,0.07);color:var(--math);cursor:pointer;}
.s-body{padding:24px;}
.partie{background:var(--bg2);border:1px solid var(--border2);border-radius:14px;margin-bottom:20px;}
.partie-header{background:var(--bg3);padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;}
.partie-label{font-family:'Playfair Display',serif;font-size:14px;font-weight:700;color:var(--math);}
.partie-pts{font-family:'DM Mono',monospace;font-size:11px;color:var(--gold);margin-left:auto;}
.partie-body{padding:20px;}
.q-block{margin-bottom:16px;}
.q-line{display:flex;align-items:flex-start;gap:10px;margin-bottom:8px;}
.q-label{font-family:'DM Mono',monospace;font-size:11px;color:var(--math);font-weight:700;min-width:24px;margin-top:2px;}
.q-text{font-size:13px;color:var(--text);line-height:1.6;flex:1;}
.q-pts-sm{font-size:10px;color:var(--gold);font-family:'DM Mono',monospace;}
.answer-ta{width:100%;min-height:80px;background:var(--bg);border:1px solid var(--border2);border-radius:8px;padding:10px 12px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;resize:vertical;margin-bottom:6px;}
.corr-btn{font-size:11px;padding:5px 12px;border-radius:999px;border:1px solid rgba(245,169,127,0.25);background:rgba(245,169,127,0.06);color:var(--math);cursor:pointer;}
.corr-box{display:none;margin-top:8px;padding:12px 14px;background:rgba(126,207,138,0.06);border:1px solid rgba(126,207,138,0.2);border-radius:8px;font-size:13px;color:var(--muted);}
.corr-box.show{display:block;}
.auto-eval{background:var(--bg3);border:1px solid var(--border2);border-radius:14px;padding:20px;margin-top:20px;}
.ae-title{font-family:'DM Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:2px;color:var(--muted);margin-bottom:16px;}
.ae-row{display:flex;align-items:center;gap:12px;margin-bottom:10px;}
.ae-label{font-size:13px;flex:1;}
.ae-input{width:60px;background:var(--bg2);border:1px solid var(--border2);border-radius:8px;padding:6px 10px;color:var(--text);font-family:'DM Mono',monospace;text-align:center;}
.ae-total{background:linear-gradient(135deg,rgba(245,169,127,0.1),rgba(245,169,127,0.05));border:1px solid rgba(245,169,127,0.25);border-radius:8px;padding:14px;text-align:center;margin-top:14px;}
.ae-total-num{font-family:'Playfair Display',serif;font-size:36px;font-weight:800;color:var(--math);}
.save-btn{width:100%;background:var(--bg2);border:1px solid var(--border2);border-radius:14px;padding:12px;color:var(--muted);cursor:pointer;margin-top:12px;}
.nav-btns{display:flex;gap:10px;margin-top:12px;}
.nav-btn{flex:1;padding:12px;border-radius:14px;border:1px solid var(--border2);background:var(--bg2);color:var(--muted);cursor:pointer;}
.nav-btn.primary{background:linear-gradient(135deg,var(--math),#e8895a);border:none;color:#060f0a;font-weight:700;}
.toast{position:fixed;bottom:24px;right:24px;background:var(--bg3);border:1px solid var(--border2);border-radius:8px;padding:12px 20px;font-size:12px;z-index:200;opacity:0;transform:translateY(10px);transition:all 0.3s;}
.toast.show{opacity:1;transform:translateY(0);}
.ai-btn{width:100%;margin-top:8px;background:linear-gradient(135deg,#e8c87a,#d4a840);border:none;border-radius:8px;padding:12px;color:#080600;font-weight:800;font-size:14px;cursor:pointer;}
.ai-btn:disabled{opacity:0.4;cursor:not-allowed;}
.ai-loading{display:none;text-align:center;padding:16px;background:rgba(232,200,122,0.04);border:1px solid rgba(232,200,122,0.12);border-radius:8px;margin-top:8px;}
.ai-spin{width:24px;height:24px;border:2px solid rgba(232,200,122,0.2);border-top-color:#e8c87a;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto;}
@keyframes spin{to{transform:rotate(360deg)}}
.ai-result{display:none;margin-top:10px;border-radius:10px;overflow:hidden;border:1px solid rgba(255,255,255,0.08);}
.ai-score-bar{padding:14px 18px;display:flex;align-items:center;gap:14px;}
.ai-score-num{font-size:38px;font-weight:800;line-height:1;}
.ai-score-info{flex:1;font-size:11px;}
.ai-pbar-bg{height:4px;background:rgba(255,255,255,0.08);border-radius:999px;overflow:hidden;margin-top:5px;}
.ai-pbar-fill{height:100%;border-radius:999px;transition:width 1s ease;}
.ai-body{padding:14px 18px;background:rgba(0,0,0,0.2);font-size:12px;}
.ai-sec{margin-bottom:10px;}
.ai-sec-t{font-family:'DM Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:4px;border-bottom:1px solid rgba(255,255,255,0.06);}
</style>
</head>
<body>
<div id="home">
  <div class="badge">🧮 Sujets blancs complets — Mathématiques</div>
  <h1>Brevet Blanc <em>Mathématiques</em></h1>
  <p class="sub">10 sujets complets format DNB. Calculs, algèbre, géométrie, probabilités, scratch.</p>
  <div class="who-row"><button class="who-btn" id="wb-w" onclick="selWho('W')">Wassil</button><button class="who-btn" id="wb-n" onclick="selWho('N')">Nawal</button></div>
  <div class="sujets-grid" id="sujets-grid"></div>
  <a href="index.html" style="font-size:12px;color:var(--muted);font-family:'DM Mono',monospace;text-decoration:none;">← Hub Central</a>
</div>
<div id="sujet-page"><div class="s-header"><div><div class="s-logo">🧮 Brevet Blanc Maths</div><div class="s-meta" id="s-meta">—</div></div><button class="back" onclick="goHome()">← Retour</button></div><div class="chrono-bar"><span>⏱ Chronomètre</span><div class="chrono-time" id="chrono">2:00:00</div><div class="chrono-btns"><button class="chrono-btn" onclick="startChrono()">▶ Démarrer</button><button class="chrono-btn" onclick="resetChrono()">↺ Reset</button></div></div><div class="s-body" id="s-body"></div></div>
<div class="toast" id="toast"></div>
<script>
const SUJETS = [
  {id:1,titre:"Calcul littéral et équations",questions:[{n:"1",pts:3,q:"Développe et réduis : 3(2x - 5) - 2(4x + 1)",c:"6x - 15 - 8x - 2 = -2x - 17"},{n:"2",pts:3,q:"Factorise : (x+3)² - 25",c:"(x+3-5)(x+3+5) = (x-2)(x+8)"},{n:"3",pts:4,q:"Résous : 5x - 3 = 2x + 12",c:"5x - 2x = 12 + 3 → 3x = 15 → x = 5"}]},
  {id:2,titre:"Théorème de Pythagore",questions:[{n:"1",pts:2,q:"Rappelle le théorème de Pythagore.",c:"Dans triangle rectangle, carré hypoténuse = somme carrés des 2 autres côtés."},{n:"2",pts:4,q:"ABC rectangle en B, AB=6cm, BC=8cm. Calcule AC.",c:"AC² = AB² + BC² = 36+64=100 → AC=10cm"},{n:"3",pts:4,q:"DEF rectangle en E, DE=5cm, DF=13cm. Calcule EF.",c:"EF² = DF² - DE² = 169-25=144 → EF=12cm"}]},
  {id:3,titre:"Fonctions et images",questions:[{n:"1",pts:3,q:"f(x)=3x-5. Calcule f(2) et f(-4).",c:"f(2)=6-5=1, f(-4)=-12-5=-17"},{n:"2",pts:3,q:"Trouve l'antécédent de 7 par f.",c:"3x-5=7 → 3x=12 → x=4"},{n:"3",pts:4,q:"La fonction est-elle affine ? Linéaire ?",c:"Affine (de forme ax+b avec b≠0). Non linéaire."}]},
  {id:4,titre:"Probabilités",questions:[{n:"1",pts:2,q:"Définition d'un événement certain.",c:"Événement qui se réalise toujours, probabilité 1."},{n:"2",pts:4,q:"On lance dé équilibré. Probabilité d'avoir un nombre pair.",c:"Nombres pairs : 2,4,6 → 3/6 = 1/2 = 0,5"},{n:"3",pts:4,q:"Probabilité d'avoir un nombre > 4.",c:"5 et 6 → 2/6 = 1/3 ≈ 0,333"}]},
  {id:5,titre:"Trigonométrie",questions:[{n:"1",pts:2,q:"Formule du cosinus dans triangle rectangle.",c:"cos(angle) = adjacent / hypoténuse"},{n:"2",pts:4,q:"ABC rect en B, AB=5, BC=12. Calcule cos(Â).",c:"AC=13, cos(Â)=AB/AC=5/13≈0,3846"},{n:"3",pts:4,q:"Calcule la longueur du côté adjacent à angle 30° si hypoténuse=10.",c:"adjacent = 10×cos(30°) = 10×0,866 = 8,66"}]},
  {id:6,titre:"Statistiques",questions:[{n:"1",pts:2,q:"Définition de la médiane.",c:"Valeur qui partage la série ordonnée en deux parts égales."},{n:"2",pts:4,q:"Série : 5,8,12,15,20. Calcule moyenne et médiane.",c:"Moyenne=(5+8+12+15+20)/5=12. Médiane=12."},{n:"3",pts:4,q:"Ajoute 25. Nouvelle moyenne ?",c:"(60+25)/6=85/6≈14,17"}]},
  {id:7,titre:"Thalès",questions:[{n:"1",pts:3,q:"Rappelle le théorème de Thalès.",c:"Dans triangle, droite parallèle à un côté, les rapports sont égaux."},{n:"2",pts:4,q:"ABC, M sur AB, N sur AC, MN//BC. AM=3, AB=9, AN=4. Calcule AC.",c:"AM/AB=AN/AC → 3/9=4/AC → AC=12"},{n:"3",pts:3,q:"Calcule MN si BC=15.",c:"MN/BC=AM/AB=1/3 → MN=5"}]},
  {id:8,titre:"Algorithmique (Scratch)",questions:[{n:"1",pts:2,q:"Que fait : 'répéter 5 fois → avancer de 100, tourner de 72 degrés' ?",c:"Pentagone régulier (somme angles = 360/5=72°)"},{n:"2",pts:4,q:"Programme : demander x, mettre y à x², dire y. Quelle fonction ?",c:"Fonction carré : affiche le carré du nombre entré."},{n:"3",pts:4,q:"Modifie pour afficher x²+2x-3.",c:"Mettre y à (x*x)+2*x-3."}]},
  {id:9,titre:"Puissances et notation scientifique",questions:[{n:"1",pts:3,q:"Calcule 10³ × 10⁻⁵.",c:"10^(3-5)=10⁻²=0,01"},{n:"2",pts:3,q:"Écris 4500×10⁶ en notation scientifique.",c:"4,5×10³×10⁶ = 4,5×10⁹"},{n:"3",pts:4,q:"Calcule (3×10⁴)².",c:"9×10⁸"}]},
  {id:10,titre:"Géométrie dans l'espace",questions:[{n:"1",pts:2,q:"Volume d'un cube d'arête 5 cm.",c:"125 cm³"},{n:"2",pts:4,q:"Volume d'un cylindre rayon 3cm, hauteur 10cm (π=3,14).",c:"π×3²×10 = 3,14×90 = 282,6 cm³"},{n:"3",pts:4,q:"Combien de litres (1L=1000cm³) ?",c:"0,2826 L"}]}
];

let who = null, currentIdx = 0, chronoSecs = 7200, running = false, chronoInterval = null;

function selWho(w) { who = w; document.getElementById('wb-w').className = 'who-btn' + (w === 'W' ? ' aw' : ''); document.getElementById('wb-n').className = 'who-btn' + (w === 'N' ? ' an' : ''); renderHome(); }
function renderHome() { const g = document.getElementById('sujets-grid'); g.innerHTML = ''; const done = JSON.parse(localStorage.getItem('maths_done_' + (who || 'X')) || '[]'); SUJETS.forEach((s, i) => { const d = document.createElement('div'); d.className = 'sujet-card'; d.onclick = () => openSujet(i); d.innerHTML = `<div class="sc-num">Sujet ${s.id}/10</div><div class="sc-title">${s.titre}</div><div class="sc-info">Exercices</div><div class="sc-done" style="display:${done.includes(s.id) ? 'flex' : 'none'}">✓</div>`; g.appendChild(d); }); }
function openSujet(idx) { currentIdx = idx; const s = SUJETS[idx]; document.getElementById('home').style.display = 'none'; document.getElementById('sujet-page').style.display = 'block'; document.getElementById('s-meta').textContent = 'Sujet ' + s.id + '/10 — ' + (who === 'W' ? 'Wassil' : 'Nawal'); renderSujet(s); chronoSecs = 7200; running = false; clearInterval(chronoInterval); updateChrono(); }
function goHome() { document.getElementById('sujet-page').style.display = 'none'; document.getElementById('home').style.display = 'flex'; clearInterval(chronoInterval); }

function renderSujet(s) {
  let h = `<div class="partie"><div class="partie-header"><span class="partie-label">Exercices</span><span class="partie-pts">20 pts</span></div><div class="partie-body">`;
  s.questions.forEach((q, i) => {
    h += `<div class="q-block"><div class="q-line"><span class="q-label">${i+1}.</span><span class="q-text">${q.q}</span><span class="q-pts-sm">${q.pts}pts</span></div><textarea class="answer-ta" id="q${i}" placeholder="Ta réponse..."></textarea><button class="ai-btn" id="ai-q${i}" onclick="corrigerIA('ai-q${i}','q${i}','${q.q.replace(/'/g, "\\'")}','maths',${q.pts},'Maths')">🧮 Corriger avec l'IA</button><div class="ai-loading" id="ai-q${i}_load"><div class="ai-spin"></div></div><div class="ai-result" id="ai-q${i}_result"></div><button class="corr-btn" onclick="tog('c${i}')">Voir correction</button><div class="corr-box" id="c${i}"><strong>✓</strong> ${q.c}</div></div>`;
  });
  h += `</div></div><div class="auto-eval"><div class="ae-title">Auto-évaluation</div><div class="ae-row"><span class="ae-label">Note sur 20</span><input type="number" class="ae-input" id="ae1" min="0" max="20" value="0" oninput="updateTotal()"><span class="ae-max">/ 20</span></div><div class="ae-total"><div class="ae-total-lbl">Note</div><div class="ae-total-num" id="ae-total">0/20</div></div></div><div class="nav-btns">${currentIdx > 0 ? `<button class="nav-btn" onclick="openSujet(${currentIdx - 1})">← Précédent</button>` : ''}<button class="save-btn" onclick="saveSujet()">💾 Sauvegarder</button>${currentIdx < SUJETS.length - 1 ? `<button class="nav-btn primary" onclick="openSujet(${currentIdx + 1})">Sujet suivant →</button>` : `<button class="nav-btn primary" onclick="goHome()">🏠 Accueil</button>`}</div>`;
  document.getElementById('s-body').innerHTML = h;
}

function tog(id) { document.getElementById(id).classList.toggle('show'); }
function updateTotal() { const a = parseInt(document.getElementById('ae1').value) || 0; document.getElementById('ae-total').textContent = Math.min(a, 20) + '/20'; }
async function saveSujet() { if (!who) { showToast('Sélectionne Wassil ou Nawal d\'abord', 'err'); return; } const s = SUJETS[currentIdx]; const note = Math.min(parseInt(document.getElementById('ae1').value) || 0, 20); const done = JSON.parse(localStorage.getItem('maths_done_' + who) || '[]'); if (!done.includes(s.id)) { done.push(s.id); localStorage.setItem('maths_done_' + who, JSON.stringify(done)); } if (window.CONFIG && window.CONFIG.SHEETS) { const url = window.CONFIG.SHEETS[who]; try { await fetch(url, { method: 'POST', mode: 'cors', body: JSON.stringify({ action: 'logAnnale', matiere: 'Mathématiques', annee: 'Sujet blanc ' + s.id, exercice: s.titre, score: note, pointsPerdus: 'Note:' + note + '/20', bloque: '', aRetravailler: '' }) }); showToast('✓ Note sauvegardée', 'ok'); } catch(e) { showToast('⚠ Sauvegarde impossible', 'err'); } } else { showToast('Config non chargée, sauvegarde locale uniquement', 'err'); } }
function startChrono() { if (running) return; running = true; chronoInterval = setInterval(() => { if (chronoSecs <= 0) { clearInterval(chronoInterval); running = false; showToast('⏱ Temps écoulé !', 'err'); return; } chronoSecs--; updateChrono(); }, 1000); }
function resetChrono() { clearInterval(chronoInterval); running = false; chronoSecs = 7200; updateChrono(); }
function updateChrono() { const h = Math.floor(chronoSecs / 3600); const m = Math.floor((chronoSecs % 3600) / 60); const s = chronoSecs % 60; document.getElementById('chrono').textContent = `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`; }
function showToast(msg, t) { const el = document.getElementById('toast'); el.textContent = msg; el.className = 'toast show ' + t; setTimeout(() => el.className = 'toast', 3500); }
window.addEventListener('DOMContentLoaded', () => renderHome());

async function corrigerIA(btnId, taId, question, typeExo, pts, matiere) {
  const texte = document.getElementById(taId).value.trim();
  if (!texte) { alert('Écris ta réponse.'); return; }
  if (!window.CONFIG || !window.CONFIG.AI_API_KEY) { alert('Clé API non configurée (fichier config.js absent ou secret non injecté).'); return; }
  const btn = document.getElementById(btnId);
  const loadEl = document.getElementById(btnId + '_load');
  const resEl = document.getElementById(btnId + '_result');
  btn.disabled = true;
  if (loadEl) loadEl.style.display = 'block';
  if (resEl) resEl.style.display = 'none';
  const prompt = `Tu es correcteur DNB Maths. Corrige sur ${pts} pts. Critères: démarche, calculs, résultat. JSON: {"noteTotal":X,"maxTotal":${pts},"sousNotes":"Démarche X, Calculs X, Résultat X","annotations":[],"erreurs":["..."],"methodologie":"<p>Attendu</p>","conseil":"Conseil"}`;
  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST', headers: { 'Content-Type': 'application/json', 'x-api-key': window.CONFIG.AI_API_KEY, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
      body: JSON.stringify({ model: 'claude-sonnet-4-6', max_tokens: 1200, system: prompt, messages: [{ role: 'user', content: 'Question: ' + question + '\n\nRéponse élève:\n\n' + texte + '\n\nJSON uniquement.' }] })
    });
    const data = await res.json();
    const json = JSON.parse(data.content[0].text.replace(/```json|```/g, '').trim());
    renderAIRes(resEl, json);
  } catch(e) { alert('Erreur: ' + e.message); }
  if (loadEl) loadEl.style.display = 'none';
  btn.disabled = false;
}

function renderAIRes(el, j) {
  const pct = Math.round(j.noteTotal / j.maxTotal * 100);
  const col = pct >= 75 ? '#7ecf8a' : pct >= 55 ? '#e8c87a' : '#f55a5a';
  const bg = pct >= 75 ? 'rgba(126,207,138,0.08)' : pct >= 55 ? 'rgba(232,200,122,0.08)' : 'rgba(245,85,85,0.08)';
  const barCol = pct >= 75 ? 'linear-gradient(90deg,#7ecf8a,#5ecfb1)' : pct >= 55 ? 'linear-gradient(90deg,#e8c87a,#f07a5a)' : 'linear-gradient(90deg,#f55a5a,#f07a5a)';
  let html = `<div class="ai-score-bar" style="background:${bg}"><div class="ai-score-num" style="color:${col}">${j.noteTotal}/${j.maxTotal}</div><div class="ai-score-info"><div>${pct >= 75 ? 'Excellent' : pct >= 55 ? 'À améliorer' : 'Insuffisant'}</div><div class="ai-pbar-bg"><div class="ai-pbar-fill" id="${el.id}_pb" style="width:0%;background:${barCol}"></div></div></div></div><div class="ai-body">`;
  if (j.erreurs && j.erreurs.length) html += `<div class="ai-sec"><div class="ai-sec-t">Erreurs</div><div class="ai-sec-b"><ul>${j.erreurs.map(e => '<li>' + e + '</li>').join('')}</ul></div></div>`;
  if (j.methodologie) html += `<div class="ai-sec"><div class="ai-sec-t">Méthodologie</div><div class="ai-sec-b">${j.methodologie}</div></div>`;
  if (j.conseil) html += `<div class="ai-sec"><div class="ai-sec-t">Conseil</div><div class="ai-sec-b"><strong>${j.conseil}</strong></div></div>`;
  html += `</div>`;
  el.innerHTML = html;
  el.style.display = 'block';
  setTimeout(() => { const b = document.getElementById(el.id + '_pb'); if (b) b.style.width = pct + '%'; }, 100);
}
</script>
</body>
</html>
