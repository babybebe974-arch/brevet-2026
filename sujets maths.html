function afficherSujets() {
  const container = document.getElementById('sujets');
  container.innerHTML = '';
  SUJETS.forEach((s, idx) => {
    const num = idx + 1;
    const div = document.createElement('div');
    div.className = 'sujet';
    div.innerHTML = `<h3>Sujet ${num} – ${s.titre} <span class="badge">${s.annee}</span></h3>`;
    
    // Partie 1 - Automatismes propres au sujet
    div.innerHTML += `<div class="partie1"><strong>⚡ Partie 1 – Automatismes (20 min, calculatrice interdite, 6 points)</strong>`;
    s.automatismes.forEach((auto, j) => {
      div.innerHTML += `<div class="exercice">${auto.q}</div>`;
      div.innerHTML += `<textarea id="auto-${num}-${j}" class="reponse" placeholder="Votre réponse..."></textarea>`;
      div.innerHTML += `<button onclick="corrigerExo('auto-${num}-${j}', '${auto.rep.replace(/'/g, "\\'")}', ${auto.pts})">Corriger avec IA</button>`;
      div.innerHTML += `<button onclick="afficherCorrection('corr-auto-${num}-${j}')">Voir correction</button>`;
      div.innerHTML += `<div id="corr-auto-${num}-${j}" class="correction">${auto.rep}</div>`;
    });
    div.innerHTML += `</div>`;
    
    // Partie 2 - Exercices
    div.innerHTML += `<div class="partie2"><strong>📐 Partie 2 – Exercices (1h40, calculatrice autorisée, 14 points)</strong>`;
    s.exercices.forEach((ex, k) => {
      div.innerHTML += `<div class="exercice">${ex.q}</div>`;
      div.innerHTML += `<textarea id="exo-${num}-${k}" class="reponse" placeholder="Votre réponse..."></textarea>`;
      div.innerHTML += `<button onclick="corrigerExo('exo-${num}-${k}', '${ex.rep.replace(/'/g, "\\'")}', ${ex.pts})">Corriger avec IA</button>`;
      div.innerHTML += `<button onclick="afficherCorrection('corr-exo-${num}-${k}')">Voir correction</button>`;
      div.innerHTML += `<div id="corr-exo-${num}-${k}" class="correction">${ex.rep}</div>`;
    });
    div.innerHTML += `</div>`;
    div.innerHTML += `<hr>`;
    container.appendChild(div);
  });
}

async function corrigerExo(idTextarea, reponseAttendue, pts) {
  const texte = document.getElementById(idTextarea).value.trim();
  if (!texte) { alert("Écris ta réponse avant de corriger."); return; }
  if (!window.CONFIG || !window.CONFIG.AI_API_KEY || window.CONFIG.AI_API_KEY === "__API_KEY__") {
    alert("Clé API non configurée. Vérifie les secrets GitHub.");
    return;
  }
  const prompt = `Corrige cet exercice de maths. Réponse attendue : "${reponseAttendue}". Réponse élève : "${texte}". Note sur ${pts}. Réponds uniquement en JSON : {"note": nombre, "commentaire": "explication courte"}`;
  try {
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json", "x-api-key": window.CONFIG.AI_API_KEY, "anthropic-version": "2023-06-01" },
      body: JSON.stringify({ model: "claude-sonnet-4-6", max_tokens: 400, system: prompt, messages: [{ role: "user", content: prompt }] })
    });
    const data = await res.json();
    const json = JSON.parse(data.content[0].text);
    alert(`Note : ${json.note}/${pts}\n${json.commentaire}`);
  } catch(e) { alert("Erreur IA : " + e.message); }
}

function afficherCorrection(id) {
  const el = document.getElementById(id);
  el.style.display = el.style.display === 'none' ? 'block' : 'none';
}

afficherSujets();
