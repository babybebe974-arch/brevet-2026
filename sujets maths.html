<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mathématiques - 10 sujets blancs DNB</title>
<style>
  body { background: #09090f; color: #f0ede8; font-family: 'DM Sans', sans-serif; padding: 2rem; }
  .container { max-width: 1000px; margin: 0 auto; }
  .sujet { background: #111118; border-left: 5px solid #2ecc71; margin: 2rem 0; padding: 1.5rem; border-radius: 12px; }
  .texte { background: #0a0a12; padding: 1rem; border-radius: 8px; margin: 1rem 0; white-space: pre-wrap; font-family: 'DM Mono', monospace; font-size: 0.9rem; }
  .document { background: #0a1a1a; padding: 0.8rem; margin: 0.5rem 0; border-radius: 6px; border-left: 3px solid #2ecc71; white-space: pre-wrap; }
  textarea { width: 100%; background: #181820; border: 1px solid #2a2a35; color: #f0ede8; padding: 0.8rem; margin: 0.5rem 0; border-radius: 8px; font-size: 0.95rem; line-height: 1.5; font-family: 'DM Mono', monospace; resize: vertical; }
  textarea.reponse { min-height: 120px; }
  button { background: #2ecc71; border: none; padding: 0.4rem 0.8rem; border-radius: 6px; cursor: pointer; margin-right: 0.5rem; margin-top: 0.3rem; font-size: 0.8rem; color: #09090f; font-weight: 600; }
  button:hover { background: #3edd81; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .correction { display: none; margin-top: 0.5rem; background: #0a0a12; padding: 0.8rem; border-radius: 8px; font-size: 0.9rem; white-space: pre-wrap; }
  .feedback-buttons { margin-top: 0.4rem; display: flex; gap: 0.5rem; }
  .btn-copy, .btn-pdf { background: #1a1a26; border: 1px solid #2ecc71; color: #2ecc71; padding: 0.3rem 0.6rem; border-radius: 6px; font-size: 0.75rem; cursor: pointer; transition: 0.1s; }
  .btn-copy:hover, .btn-pdf:hover { background: #2a2a36; }
  hr { border-color: #2a2a35; margin: 1rem 0; }
  h3 { color: #2ecc71; }
  .badge { display: inline-block; background: #2ecc7120; color: #2ecc71; padding: 0.2rem 0.6rem; border-radius: 999px; font-size: 0.7rem; margin-left: 0.5rem; }
  .question { margin-top: 1rem; }
  .loading { color: #2ecc71; font-style: italic; }
  .erreur { color: #e87a7a; }
  
  @media print {
    body * { visibility: hidden; }
    .print-correction, .print-correction * { visibility: visible; }
    .print-correction { position: absolute; top: 0; left: 0; width: 100%; }
    .no-print { display: none; }
    button { display: none; }
    textarea { display: none; }
  }
</style>
</head>
<body>
<div class="container">
  <h1>Mathématiques — 10 sujets blancs (DNB)</h1>
  <div id="sujets"></div>
</div>
<script>

const PROXY_URL = 'https://script.google.com/macros/s/AKfycbwOGUebP39z8WqcGgsNz0lmxFe3dQPW6gy3fV9KcmbbojP2RUpsbXiO0I7s8OQzuTGrsw/exec';

async function callIA(prompt, system) {
  const response = await fetch(PROXY_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify({ prompt, system }),
    redirect: 'follow'
  });
  if (!response.ok) throw new Error('HTTP ' + response.status);
  const result = await response.json();
  if (result.success && result.content) return result.content;
  throw new Error(result.error || 'Réponse inattendue');
}

function safeParseJSON(txt) {
  try {
    return JSON.parse(txt.replace(/```json|```/g, '').trim());
  } catch(e) { return null; }
}

// ============================================================
// FONCTIONS POUR LES BOUTONS COPIE ET PDF
// ============================================================
async function copierCorrection(texte, btn) {
  try {
    await navigator.clipboard.writeText(texte);
    const originalText = btn.textContent;
    btn.textContent = '✓ Copié !';
    setTimeout(() => { btn.textContent = originalText; }, 1500);
  } catch(e) { alert('Impossible de copier'); }
}

function genererNomPDF(annee, session, type, numQuestion) {
  const sessionClean = session.replace(/[()]/g, '').replace(/ /g, '_');
  return `${annee}_${sessionClean}_${type}_Q${numQuestion}.pdf`;
}

async function imprimerCorrection(contenu, titreDocument, annee, session, type, numQuestion) {
  const printDiv = document.createElement('div');
  printDiv.className = 'print-correction';
  printDiv.style.cssText = 'padding: 20px; font-family: "DM Sans", sans-serif; line-height: 1.6;';
  printDiv.innerHTML = `
    <h2>${titreDocument}</h2>
    <hr>
    <div style="white-space: pre-wrap;">${contenu}</div>
    <hr>
    <p style="font-size: 0.8rem; color: #666;">Correction générée le ${new Date().toLocaleDateString()}</p>
  `;
  document.body.appendChild(printDiv);
  const nomFichier = genererNomPDF(annee, session, type, numQuestion);
  document.title = nomFichier;
  window.print();
  document.body.removeChild(printDiv);
  document.title = "Mathématiques - 10 sujets blancs DNB";
}

// ============================================================
// SUJETS MATHS (10 sujets complets)
// ============================================================
const SUJETS = [
  { id:1, annee:"2024", session:"Métropole (juin)", titre:"Exercice 1 - Statistiques",
    enonce:"Voici les prix en euros d'un vêtement relevés dans différents magasins : 12 ; 15 ; 10 ; 7 ; 13.<br><br>1) Affirmation A : La moyenne des prix est 11,40 €. Vrai ou faux ? Justifier.<br>2) Affirmation B : La médiane des prix est 10 €. Vrai ou faux ? Justifier.<br>3) Un élève court 20 m en 6 secondes. Affirmation C : Sa vitesse moyenne était de 14 km/h. Vrai ou faux ? Justifier.<br>4) Une urne contient 15 boules de 1 à 15. Affirmation D : Probabilité d'un nombre premier = 7/15. Vrai ou faux ? Justifier.<br>5) Homothétie de rapport -3. Affirmation E : L'aire du triangle A'B'C' est 3 fois l'aire de ABC. Vrai ou faux ? Justifier.",
    reponses: [
      "A = Vraie (12+15+10+7+13)/5 = 57/5 = 11,4",
      "B = Fausse. Médiane = 12 (ordre : 7,10,12,13,15)",
      "C = Fausse. v = d/t = 20/6 = 3,33 m/s = 12 km/h",
      "D = Fausse. Nombres premiers : 2,3,5,7,11,13 → 6/15",
      "E = Fausse. L'aire est multipliée par k² = 9"
    ] },
  { id:2, annee:"2024", session:"Asie Pacifique", titre:"QCM - Nombres et géométrie",
    enonce:"1) Lequel de ces nombres est premier ? (1, 21, 37, 54)<br>2) Aire totale du patron d'un cube d'arête 5 cm ? (125, 150, 120, 100 cm²)<br>3) Forme factorisée de 4x²-9 ?<br>4) Écran 16:9, longueur 110 cm, largeur ? (62, 103, 196, 94 cm)<br>5) Médiane de 4,1 ; 3,67 ; 4,23 ; 4,5 ; 3,4 ?",
    reponses: [
      "37 est premier",
      "150 cm² (6 faces × 25 cm²)",
      "(2x-3)(2x+3)",
      "110 × 9/16 = 61,875 ≈ 62 cm",
      "Médiane = 4,1"
    ] },
  { id:3, annee:"2023", session:"Métropole (juin)", titre:"Tableur et géométrie",
    enonce:"1) Étendue des prix de lunettes (75 à 160 €) = 85 €<br>2) Formule SOMME(B2:F2) pour le total<br>3) Montant total des ventes : 364 250 €, moyenne = 101,89 €<br>4) Théorème de Pythagore : AE = 5,6 cm<br>5) Aire rectangle BCDE = 29,4 cm²",
    reponses: [
      "Étendue = 160 - 75 = 85",
      "=SOMME(B2:F2)",
      "Moyenne = 364250/3575 = 101,89",
      "AE² = BE² - AB² = 49 - 17,64 = 31,36 → AE = 5,6",
      "Aire = 4,2 × 7 = 29,4"
    ] },
  { id:4, annee:"2023", session:"Amérique du Nord", titre:"Trigonométrie et Thalès",
    enonce:"1) Démontrer que AEF est rectangle en E (AE=8, AF=10, EF=6)<br>2) Calculer l'angle EAF au degré près<br>3) Les droites (EF) et (RT) sont-elles parallèles ?",
    reponses: [
      "8²+6²=64+36=100=10² → rectangle",
      "sin(EAF)=EF/AF=6/10=0,6 → angle ≈ 37°",
      "AE/AR=8/12=2/3, AF/AT=10/14=5/7 ≠ 2/3 → non parallèles"
    ] },
  { id:5, annee:"2023", session:"Polynésie", titre:"Statistiques et probabilités",
    enonce:"1) Effectif des 12 ans dans le tableau<br>2) Nombre total d'élèves<br>3) Formule de la cellule H2<br>4) Calcul de la moyenne d'âge",
    reponses: [
      "8 élèves",
      "1+3+8+12+4+2 = 30",
      "=SOMME(B2:G2)",
      "(10×1 + 11×3 + 12×8 + 13×12 + 14×4 + 15×2)/30 = 12,7 ans"
    ] },
  { id:6, annee:"2023", session:"Centres étrangers", titre:"Fonctions affines",
    enonce:"1) Décomposition de 120 en facteurs premiers<br>2) Formule tableur = -4*A1-12<br>3) Rapport d'homothétie<br>4) Factorisation 4x²-1",
    reponses: [
      "120 = 2³ × 3 × 5",
      "A1=5 → -32, B1=2 → -20",
      "Rapport = 0,5",
      "(2x-1)(2x+1)"
    ] },
  { id:7, annee:"2022", session:"Métropole (juin)", titre:"Probabilités et arithmétique",
    enonce:"1) Probabilité boule bleue dans l'urne A (20 boules, 8 bleues)<br>2) Probabilité boule bleue dans l'urne B (11 bleues, 14 vertes)<br>3) Médiane de la série 14;12;3;14;7;11;7;12;14",
    reponses: [
      "P(A) = 8/20 = 0,4",
      "P(B) = 11/25 = 0,44",
      "Médiane = 12"
    ] },
  { id:8, annee:"2022", session:"Amérique du Nord", titre:"Géométrie et Scratch",
    enonce:"1) Démontrer que le triangle ABC est équilatéral (AB=240, angles 60°)<br>2) Montrer que (DE)//(AB)<br>3) Compléter le script Scratch",
    reponses: [
      "Triangle ABC a deux angles de 60° donc 3×60° → équilatéral",
      "CA/CE = CB/CD = 3 → parallèles",
      "Mettre côté à 240"
    ] },
  { id:9, annee:"2022", session:"Amérique du Sud", titre:"Arithmétique et statistiques",
    enonce:"1) Décomposer 390 en facteurs premiers<br>2) Probabilité nombre ≤5 dans une urne de 1 à 12<br>3) Fonction f : tableau de valeurs, est-elle linéaire ?",
    reponses: [
      "390 = 2 × 3 × 5 × 13",
      "P = 5/12",
      "Non, f(0)=1 donc pas linéaire"
    ] },
  { id:10, annee:"2022", session:"Polynésie", titre:"Volumes et algorithmique",
    enonce:"1) Volume d'un pavé droit 5×2,5×1,5 cm<br>2) Masse volumique<br>3) Programme Scratch pour un hexagone",
    reponses: [
      "V = 5 × 2,5 × 1,5 = 18,75 cm³",
      "ρ = m/V = 19/18,75 ≈ 1,01 g/cm³",
      "Répéter 6 fois : avancer 50, tourner 60°"
    ] }
];

// ============================================================
// CORRECTION EXERCICE MATHS
// ============================================================
async function corrigerExercice(idTextarea, reponseAttendue, pts, annee, session, numQuestion, numSujet) {
  const texte = document.getElementById(idTextarea).value.trim();
  if (!texte) { alert("Écris ta réponse avant de corriger."); return; }
  const btn = event.target;
  btn.disabled = true;
  btn.textContent = '⏳...';
  const system = 'Tu es un professeur de mathématiques bienveillant. Corrige cette réponse d\'élève (mathématiques DNB). Réponds UNIQUEMENT en JSON valide sans balises markdown : {"note": nombre, "commentaire": "explication courte", "conseil": "conseil pour progresser"}';
  const prompt = 'Réponse attendue : "' + reponseAttendue + '"\nRéponse élève : "' + texte + '"\nNote sur ' + pts + ' points.';
  try {
    const txt = await callIA(prompt, system);
    const json = safeParseJSON(txt);
    let contenu = '';
    if (json) {
      contenu = 'Note : ' + json.note + '/' + pts + '\n\n' + json.commentaire + '\n\n💡 Conseil : ' + json.conseil;
      alert(contenu);
    } else {
      contenu = txt;
      alert(txt);
    }
    const corrDiv = document.getElementById('corr-' + idTextarea);
    if (corrDiv) {
      const btnContainer = document.createElement('div');
      btnContainer.className = 'feedback-buttons';
      btnContainer.innerHTML = `
        <button class="btn-copy" onclick="copierCorrection(\`${contenu.replace(/`/g, '\\`')}\`, this)">📋 Copier</button>
        <button class="btn-pdf" onclick="imprimerCorrection(\`${contenu.replace(/`/g, '\\`')}\`, 'Exercice ${numQuestion} (Sujet ${numSujet})', '${annee}', '${session}', 'Exo', ${numQuestion})">🖨️ PDF</button>
      `;
      corrDiv.appendChild(btnContainer);
      corrDiv.style.display = 'block';
    }
  } catch(e) {
    alert('Erreur : ' + e.message);
  }
  btn.disabled = false;
  btn.textContent = 'Corriger avec IA';
}

function afficherCorrection(id) {
  const el = document.getElementById(id);
  el.style.display = (el.style.display === 'block') ? 'none' : 'block';
}

// ============================================================
// RENDU DES SUJETS
// ============================================================
function afficherSujets() {
  const container = document.getElementById('sujets');
  container.innerHTML = '';
  SUJETS.forEach((s, idx) => {
    const num = idx + 1;
    const div = document.createElement('div');
    div.className = 'sujet';
    let html = '<h3>Sujet ' + num + ' – ' + s.annee + ' (' + s.session + ') <span class="badge">' + s.titre + '</span></h3>';
    html += '<div class="texte"><strong>Énoncé :</strong><br>' + s.enonce + '</div>';
    
    // Pour chaque question de l'exercice
    const questions = s.enonce.split('<br><br>');
    const reponses = s.reponses;
    
    for (let i = 0; i < reponses.length; i++) {
      const qText = questions[i] || 'Question ' + (i+1);
      const repEsc = reponses[i].replace(/\\/g, '\\\\').replace(/'/g, "\\'");
      const taId = 'exo-' + num + '-' + i;
      const corrId = 'corr-' + taId;
      html += '<div class="question"><strong>Question ' + (i+1) + '</strong> (4 pts)<br>' + qText + '</div>';
      html += '<textarea id="' + taId + '" class="reponse" rows="4" placeholder="Votre réponse..."></textarea>';
      html += '<button onclick="corrigerExercice(\'' + taId + '\', \'' + repEsc + '\', 4, \'' + s.annee + '\', \'' + s.session + '\', ' + (i+1) + ', ' + num + ')">🤖 Corriger avec IA</button>';
      html += '<button onclick="afficherCorrection(\'corr-officielle-' + taId + '\')">📖 Voir correction officielle</button>';
      html += '<div id="corr-officielle-' + taId + '" class="correction"><strong>✓ Correction :</strong><br>' + reponses[i] + '</div>';
      html += '<div id="' + corrId + '" class="correction"></div>';
    }
    
    html += '<hr>';
    div.innerHTML = html;
    container.appendChild(div);
  });
}

afficherSujets();
</script>
</body>
</html>
