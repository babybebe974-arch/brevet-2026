<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✨ Correcteur IA — Brevet 2026</title>
<script src="config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;1,700&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#09090f;--bg2:#111118;--bg3:#181820;--border:rgba(255,255,255,0.06);--border2:rgba(255,255,255,0.12);--text:#f0ede8;--muted:rgba(240,237,232,0.45);--muted2:rgba(240,237,232,0.2);--gold:#e8c87a;--teal:#5ecfb1;--coral:#f07a5a;--red:#f55a5a;--green:#7ecf8a;--purple:#a98af5;--r:14px;--r-sm:8px;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;}
.container{max-width:900px;margin:0 auto;padding:40px 24px;}
.badge{font-family:'DM Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:2px;color:var(--purple);border:1px solid rgba(169,138,245,0.3);background:rgba(169,138,245,0.06);padding:5px 14px;border-radius:999px;display:inline-block;margin-bottom:24px;}
h1{font-family:'Playfair Display',serif;font-size:clamp(32px,6vw,48px);font-weight:800;margin-bottom:12px;}
h1 em{color:var(--purple);font-style:italic;}
.sub{color:var(--muted);font-size:14px;margin-bottom:32px;line-height:1.6;}
.card{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r);padding:24px;margin-bottom:24px;}
.label{font-family:'DM Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--purple);margin-bottom:12px;display:block;}
select, textarea{width:100%;background:var(--bg);border:1px solid var(--border2);border-radius:var(--r-sm);padding:12px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;outline:none;transition:border-color 0.2s;}
select:focus, textarea:focus{border-color:rgba(169,138,245,0.4);}
textarea{min-height:200px;resize:vertical;margin-bottom:16px;line-height:1.6;}
.ai-btn{width:100%;background:linear-gradient(135deg,#e8c87a,#d4a840);border:none;border-radius:8px;padding:14px;color:#080600;font-weight:800;font-size:15px;cursor:pointer;transition:all 0.2s;margin-bottom:16px;}
.ai-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(232,200,122,0.3);}
.ai-btn:disabled{opacity:0.4;cursor:not-allowed;transform:none;}
.ai-loading{display:none;text-align:center;padding:20px;background:rgba(232,200,122,0.04);border:1px solid rgba(232,200,122,0.12);border-radius:8px;margin-bottom:16px;}
.ai-spin{width:28px;height:28px;border:2px solid rgba(232,200,122,0.2);border-top-color:#e8c87a;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 10px;}
@keyframes spin{to{transform:rotate(360deg)}}
.ai-result{display:none;margin-top:16px;border-radius:12px;overflow:hidden;border:1px solid rgba(255,255,255,0.08);}
.ai-score-bar{padding:16px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
.ai-score-num{font-size:42px;font-weight:800;line-height:1;flex-shrink:0;}
.ai-score-info{flex:1;min-width:150px;}
.ai-pbar-bg{height:5px;background:rgba(255,255,255,0.08);border-radius:999px;overflow:hidden;margin-top:6px;}
.ai-pbar-fill{height:100%;border-radius:999px;transition:width 1s ease;}
.ai-body{padding:16px 20px;background:rgba(0,0,0,0.2);font-size:13px;}
.ai-annote{line-height:1.8;margin-bottom:16px;padding:14px;background:rgba(255,255,255,0.03);border-radius:8px;}
.ar{background:rgba(245,85,85,0.15);border-bottom:2px solid #f55a5a;cursor:help;position:relative;}
.av{background:rgba(126,207,138,0.12);border-bottom:2px solid #7ecf8a;}
.ar .tt{display:none;position:absolute;bottom:calc(100%+5px);left:0;background:#1a1a26;border:1px solid rgba(255,255,255,0.12);border-radius:6px;padding:8px 12px;font-size:11px;color:#f0ede8;line-height:1.5;z-index:20;min-width:180px;max-width:280px;white-space:normal;}
.ar:hover .tt{display:block;}
.ai-sec{margin-bottom:14px;}
.ai-sec-t{font-family:'DM Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:5px;padding-bottom:3px;border-bottom:1px solid rgba(255,255,255,0.06);}
.ai-sec-b{color:rgba(240,237,232,0.65);line-height:1.6;}
.ai-sec-b ul{margin-left:16px;}
.ai-sec-b li{margin-bottom:3px;}
.ai-r .ai-sec-t{color:#f55a5a;}.ai-v .ai-sec-t{color:#7ecf8a;}.ai-g .ai-sec-t{color:#e8c87a;}.ai-p .ai-sec-t{color:#a98af5;}
.back-link{display:inline-block;margin-top:20px;font-size:12px;color:var(--muted);font-family:'DM Mono',monospace;text-decoration:none;border:1px solid var(--border2);padding:8px 16px;border-radius:999px;transition:all 0.15s;}
.back-link:hover{background:rgba(255,255,255,0.04);color:var(--text);}
.wc{text-align:right;font-size:11px;color:var(--muted2);font-family:'DM Mono',monospace;margin-top:-12px;margin-bottom:16px;}
</style>
</head>
<body>
<div class="container">
  <div class="badge">✨ Intelligence Artificielle</div>
  <h1>Correcteur <em>IA</em></h1>
  <p class="sub">Collez votre texte (rédaction, paragraphe, réponse) et obtenez une correction détaillée avec note, annotations et conseils.</p>

  <div class="card">
    <div class="label">📚 Type d'exercice</div>
    <select id="typeExo">
      <option value="redac">Rédaction / Paragraphe argumenté</option>
      <option value="science">Sciences (réponse scientifique)</option>
      <option value="histgeo">Histoire-Géographie & EMC</option>
      <option value="maths">Mathématiques (démarche)</option>
    </select>
  </div>

  <div class="card">
    <div class="label">✏️ Votre texte</div>
    <textarea id="texte" placeholder="Écrivez ou collez votre texte ici...&#10;&#10;Exemple pour une rédaction :&#10;Introduction, développement structuré (arguments + exemples), conclusion.&#10;&#10;Exemple pour les maths :&#10;Détaillez votre raisonnement, posez les calculs, donnez le résultat final avec l'unité."></textarea>
    <div class="wc" id="wc">0 mots</div>
    <div class="label">🎯 Points (sur 20 par défaut)</div>
    <select id="ptsSelect">
      <option value="20">20 points</option>
      <option value="10">10 points</option>
      <option value="15">15 points</option>
      <option value="30">30 points</option>
    </select>
  </div>

  <button class="ai-btn" id="corrigerBtn">✨ Corriger avec l'IA</button>
  <div class="ai-loading" id="loading"><div class="ai-spin"></div><div style="font-size:12px">L'IA analyse votre travail...</div></div>
  <div class="ai-result" id="result"></div>

  <a href="index.html" class="back-link">← Retour au Hub Central</a>
</div>

<script>
const typeExoSelect = document.getElementById('typeExo');
const texteArea = document.getElementById('texte');
const ptsSelect = document.getElementById('ptsSelect');
const corrigerBtn = document.getElementById('corrigerBtn');
const loadingDiv = document.getElementById('loading');
const resultDiv = document.getElementById('result');
const wcSpan = document.getElementById('wc');

texteArea.addEventListener('input', () => {
  const mots = texteArea.value.trim().split(/\s+/).filter(m => m.length > 0).length;
  wcSpan.textContent = mots + ' mot' + (mots > 1 ? 's' : '');
});

async function corriger() {
  const texte = texteArea.value.trim();
  if (!texte || texte.length < 20) {
    alert('Écrivez un texte d\'au moins 20 caractères avant de corriger.');
    return;
  }
  if (!window.CONFIG || !window.CONFIG.AI_API_KEY) {
    alert('Clé API non configurée. Vérifiez que config.js est chargé et que le secret a été injecté par GitHub Actions.');
    return;
  }

  const typeExo = typeExoSelect.value;
  const pts = parseInt(ptsSelect.value);

  corrigerBtn.disabled = true;
  loadingDiv.style.display = 'block';
  resultDiv.style.display = 'none';

  let systemPrompt = '';
  if (typeExo === 'redac') {
    systemPrompt = `Tu es correcteur DNB 2026 Français. Corrige cette rédaction sur ${pts} pts. Barème: Fond ${Math.round(pts*0.35)}pts, Forme ${Math.round(pts*0.35)}pts, Ortho ${Math.round(pts*0.3)}pts. JSON uniquement: {"noteTotal":X,"maxTotal":${pts},"sousNotes":"Fond X/Y, Forme X/Y, Ortho X/Y","annotations":[{"t":"extrait 8-15 mots","type":"rouge","c":"commentaire"},{"t":"extrait","type":"vert","c":"commentaire"}],"pointsForts":["..."],"aAmeliorer":["..."],"methodologie":"<p>Ce qui manque...</p>","conseil":"Conseil concret."}`;
  } else if (typeExo === 'science') {
    systemPrompt = `Tu es correcteur DNB 2026 Sciences. Corrige cette réponse scientifique sur ${pts} pts. Critères: mots-clés, exactitude, logique. JSON: {"noteTotal":X,"maxTotal":${pts},"sousNotes":"Mots-clés X, Exactitude X, Logique X","annotations":[{"t":"extrait","type":"rouge","c":"erreur"},{"t":"extrait","type":"vert","c":"correct"}],"motsClesManquants":["..."],"erreurLogique":"description ou null","methodologie":"<p>Cheminement attendu...</p>","conseil":"Conseil."}`;
  } else if (typeExo === 'histgeo') {
    systemPrompt = `Tu es correcteur DNB 2026 Histoire-Géo & EMC. Corrige ce paragraphe argumenté sur ${pts} pts. Critères: intro, arguments+exemples, connecteurs, conclusion. JSON: {"noteTotal":X,"maxTotal":${pts},"sousNotes":"Intro X, Arguments X, Connecteurs X, Conclusion X","annotations":[{"t":"extrait","type":"rouge","c":"problème"},{"t":"extrait","type":"vert","c":"point fort"}],"exemplesManquants":["..."],"pointsForts":["..."],"aAmeliorer":["..."],"methodologie":"<p>Structure attendue...</p>","conseil":"Conseil."}`;
  } else if (typeExo === 'maths') {
    systemPrompt = `Tu es correcteur DNB 2026 Maths. Corrige cette démarche sur ${pts} pts. Critères: compréhension, démarche+calculs, présentation, résultat+unité. JSON: {"noteTotal":X,"maxTotal":${pts},"sousNotes":"Démarche X, Calculs X, Présentation X, Résultat X","annotations":[{"t":"extrait","type":"rouge","c":"erreur"},{"t":"extrait","type":"vert","c":"correct"}],"erreurs":["..."],"methodologie":"<p>Présentation attendue...</p>","conseil":"Conseil."}`;
  }

  try {
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': window.CONFIG.AI_API_KEY,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 2000,
        system: systemPrompt,
        messages: [{ role: 'user', content: 'Texte à corriger:\n\n' + texte + '\n\nJSON uniquement.' }]
      })
    });
    const data = await response.json();
    let jsonText = data.content[0].text;
    jsonText = jsonText.replace(/```json|```/g, '').trim();
    const correction = JSON.parse(jsonText);
    afficherResultat(correction, texte);
  } catch (erreur) {
    alert('Erreur: ' + erreur.message);
  } finally {
    corrigerBtn.disabled = false;
    loadingDiv.style.display = 'none';
  }
}

function afficherResultat(corr, texteOriginal) {
  const pct = Math.round(corr.noteTotal / corr.maxTotal * 100);
  let couleur = '#f55a5a';
  let message = 'Insuffisant';
  if (pct >= 75) { couleur = '#7ecf8a'; message = 'Excellent !'; }
  else if (pct >= 55) { couleur = '#e8c87a'; message = 'À améliorer'; }
  
  let texteAnnote = texteOriginal.replace(/\n/g, '<br>');
  if (corr.annotations && corr.annotations.length) {
    corr.annotations.forEach(ann => {
      if (!ann.t || ann.t.length < 4) return;
      try {
        const escaped = ann.t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        const remplacement = ann.type === 'rouge' 
          ? `<span class="ar">${ann.t}<span class="tt">${ann.c}</span></span>`
          : `<span class="av">${ann.t}</span>`;
        texteAnnote = texteAnnote.replace(new RegExp(escaped, 'g'), remplacement);
      } catch(e) {}
    });
  }

  let html = `<div class="ai-score-bar" style="background:${pct >= 75 ? 'rgba(126,207,138,0.08)' : pct >= 55 ? 'rgba(232,200,122,0.08)' : 'rgba(245,85,85,0.08)'}">
    <div class="ai-score-num" style="color:${couleur}">${corr.noteTotal}/${corr.maxTotal}</div>
    <div class="ai-score-info">
      <div style="font-weight:700;color:${couleur}">${message}</div>
      <div style="color:rgba(240,237,232,0.45);font-size:11px">${corr.sousNotes || ''}</div>
      <div class="ai-pbar-bg"><div class="ai-pbar-fill" id="pbarFill" style="width:0%;background:${pct >= 75 ? 'linear-gradient(90deg,#7ecf8a,#5ecfb1)' : pct >= 55 ? 'linear-gradient(90deg,#e8c87a,#f07a5a)' : 'linear-gradient(90deg,#f55a5a,#f07a5a)'}"></div></div>
    </div>
  </div>
  <div class="ai-body">
    <div class="ai-sec ai-g"><div class="ai-sec-t">📝 Texte annoté</div><div class="ai-annote">${texteAnnote}</div></div>`;

  if (corr.pointsForts && corr.pointsForts.length) {
    html += `<div class="ai-sec ai-v"><div class="ai-sec-t">✅ Points forts</div><div class="ai-sec-b"><ul>${corr.pointsForts.map(p => `<li>${p}</li>`).join('')}</ul></div></div>`;
  }
  if (corr.aAmeliorer && corr.aAmeliorer.length) {
    html += `<div class="ai-sec ai-r"><div class="ai-sec-t">⚠️ À améliorer</div><div class="ai-sec-b"><ul>${corr.aAmeliorer.map(p => `<li>${p}</li>`).join('')}</ul></div></div>`;
  }
  if (corr.erreurs && corr.erreurs.length) {
    html += `<div class="ai-sec ai-r"><div class="ai-sec-t">❌ Erreurs</div><div class="ai-sec-b"><ul>${corr.erreurs.map(e => `<li>${e}</li>`).join('')}</ul></div></div>`;
  }
  if (corr.motsClesManquants && corr.motsClesManquants.length) {
    html += `<div class="ai-sec ai-r"><div class="ai-sec-t">🔑 Mots-clés manquants</div><div class="ai-sec-b">${corr.motsClesManquants.map(m => `<span style="display:inline-block;margin:3px;padding:3px 10px;border-radius:999px;border:1px solid rgba(245,85,85,0.3);background:rgba(245,85,85,0.07);font-size:11px;color:#f55a5a">${m}</span>`).join('')}</div></div>`;
  }
  if (corr.exemplesManquants && corr.exemplesManquants.length) {
    html += `<div class="ai-sec ai-r"><div class="ai-sec-t">📚 Exemples manquants</div><div class="ai-sec-b"><ul>${corr.exemplesManquants.map(e => `<li>${e}</li>`).join('')}</ul></div></div>`;
  }
  if (corr.erreurLogique) {
    html += `<div class="ai-sec ai-r"><div class="ai-sec-t">🧠 Erreur logique</div><div class="ai-sec-b">${corr.erreurLogique}</div></div>`;
  }
  if (corr.methodologie) {
    html += `<div class="ai-sec ai-g"><div class="ai-sec-t">📖 Méthodologie attendue</div><div class="ai-sec-b">${corr.methodologie}</div></div>`;
  }
  if (corr.conseil) {
    html += `<div class="ai-sec ai-p"><div class="ai-sec-t">💡 Conseil prioritaire</div><div class="ai-sec-b"><strong>${corr.conseil}</strong></div></div>`;
  }
  html += `</div>`;
  resultDiv.innerHTML = html;
  resultDiv.style.display = 'block';
  setTimeout(() => {
    const pbar = document.getElementById('pbarFill');
    if (pbar) pbar.style.width = pct + '%';
  }, 100);
  resultDiv.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

corrigerBtn.addEventListener('click', corriger);
</script>
</body>
</html>
