<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚡ Automatismes – Français</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#000;font-family:'DM Sans',sans-serif;padding:1rem;color:#fff;}
.container{max-width:1000px;margin:0 auto;background:#1a1a1a;border-radius:2rem;padding:1.5rem;border:1px solid #ffcc00;}
h1{font-family:'Playfair Display',serif;font-size:1.8rem;color:#ffcc00;}
.sub{color:#aaa;margin-bottom:1rem;border-left:3px solid #ffcc00;padding-left:1rem;}
.choix-eleve{background:#2a2a2a;border-radius:1rem;padding:1rem;margin-bottom:1.5rem;text-align:center;}
.choix-eleve button{padding:0.5rem 1.5rem;margin:0 0.5rem;border-radius:40px;cursor:pointer;font-weight:600;border:none;}
.btn-wassil{background:#7eb8f5;color:#000;}
.btn-nawal{background:#f59eb8;color:#000;}
.btn-wassil.active{background:#3a6ea5;color:#fff;border:2px solid #fff;}
.btn-nawal.active{background:#c06a8a;color:#fff;border:2px solid #fff;}
.chapitres-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:0.5rem;max-height:300px;overflow-y:auto;padding:0.5rem;background:#2a2a2a;border-radius:1rem;}
.chapitre-check{display:flex;align-items:center;gap:0.5rem;font-size:0.75rem;padding:0.3rem;}
button{background:#1e2a3e;border:1px solid #5ecfb1;border-radius:40px;padding:0.5rem 1.2rem;color:#5ecfb1;cursor:pointer;}
.btn-primary{background:#ffcc00;border-color:#ffcc00;color:#000;font-weight:700;}
.btn-group{display:flex;gap:1rem;justify-content:center;margin:1rem 0;}
.resultats{background:#0a0a0f;border-radius:1rem;padding:1rem;margin-top:1rem;text-align:center;}
.back-link{display:inline-block;margin-top:1rem;color:#5ecfb1;text-decoration:none;}
</style>
</head>
<body>
<div class="container">
  <h1>⚡ Automatismes – Français</h1>
  <div class="sub">Choisis ton prénom et tes chapitres</div>
  
  <!-- SÉLECTION DE L'ÉLÈVE -->
  <div class="choix-eleve">
    <p style="margin-bottom:0.5rem;">👤 Qui travaille ?</p>
    <button id="btnWassil" class="btn-wassil active">🌊 Wassil</button>
    <button id="btnNawal" class="btn-nawal">⚡ Nawal</button>
  </div>

  <div class="chapitres-grid" id="chapitresGrid">
    <div class="chapitre-check"><input type="checkbox" id="ch1"><label>1. Classes grammaticales</label></div>
    <div class="chapitre-check"><input type="checkbox" id="ch2"><label>2. Fonctions grammaticales</label></div>
    <div class="chapitre-check"><input type="checkbox" id="ch3"><label>3. La phrase</label></div>
    <div class="chapitre-check"><input type="checkbox" id="ch4"><label>4. Temps et modes verbaux</label></div>
    <div class="chapitre-check"><input type="checkbox" id="ch5"><label>5. Les accords</label></div>
    <div class="chapitre-check"><input type="checkbox" id="ch6"><label>6. Les homophones</label></div>
    <div class="chapitre-check"><input type="checkbox" id="ch7"><label>7. Conjugaison</label></div>
    <div class="chapitre-check"><input type="checkbox" id="ch8"><label>8. Valeurs des temps</label></div>
    <div class="chapitre-check"><input type="checkbox" id="ch9"><label>9. Formation des mots</label></div>
    <div class="chapitre-check"><input type="checkbox" id="ch10"><label>10. Figures de style</label></div>
    <div class="chapitre-check"><input type="checkbox" id="ch11"><label>11. Champs lexicaux</label></div>
    <div class="chapitre-check"><input type="checkbox" id="ch12"><label>12. Synonymes, antonymes</label></div>
    <div class="chapitre-check"><input type="checkbox" id="ch13"><label>13. Genres littéraires</label></div>
    <div class="chapitre-check"><input type="checkbox" id="ch14"><label>14. Mouvements littéraires</label></div>
    <div class="chapitre-check"><input type="checkbox" id="ch15"><label>15. Registres littéraires</label></div>
    <div class="chapitre-check"><input type="checkbox" id="ch16"><label>16. Le récit</label></div>
    <div class="chapitre-check"><input type="checkbox" id="ch17"><label>17. La rédaction</label></div>
    <div class="chapitre-check"><input type="checkbox" id="ch18"><label>18. Contraction de texte</label></div>
    <div class="chapitre-check"><input type="checkbox" id="ch19"><label>19. Commentaire composé</label></div>
    <div class="chapitre-check"><input type="checkbox" id="ch20"><label>20. Oral : présentation</label></div>
    <div class="chapitre-check"><input type="checkbox" id="ch21"><label>21. Oral : expression</label></div>
    <div class="chapitre-check"><input type="checkbox" id="ch22"><label>22. Oral : échange</label></div>
    <div class="chapitre-check"><input type="checkbox" id="ch23"><label>23. Dictée</label></div>
    <div class="chapitre-check"><input type="checkbox" id="ch24"><label>24. Grammaire (analyse)</label></div>
    <div class="chapitre-check"><input type="checkbox" id="ch25"><label>25. Réécriture</label></div>
    <div class="chapitre-check"><input type="checkbox" id="ch26"><label>26. Essai</label></div>
  </div>

  <div class="btn-group">
    <button id="selectAllBtn">✅ Tout sélectionner</button>
    <button id="deselectAllBtn">❌ Tout désélectionner</button>
  </div>

  <div class="btn-group">
    <button id="demarrerBtn" class="btn-primary">🎯 Démarrer la session (40 questions)</button>
  </div>

  <div id="resultatsArea" class="resultats" style="display:none;"></div>
  <a href="index.html" class="back-link">← Retour au hub</a>
</div>

<script>
let currentEleve = "Wassil";
let sessionScore = { bonnes: 0, total: 0 };

function setEleve(eleve) {
  currentEleve = eleve;
  const btnW = document.getElementById("btnWassil");
  const btnN = document.getElementById("btnNawal");
  if (eleve === "Wassil") {
    btnW.classList.add("active");
    btnN.classList.remove("active");
  } else {
    btnN.classList.add("active");
    btnW.classList.remove("active");
  }
}

function getChapitresSelectionnes() {
  const chapitres = [];
  for (let i = 1; i <= 26; i++) {
    const cb = document.getElementById(`ch${i}`);
    if (cb && cb.checked) chapitres.push(i);
  }
  return chapitres;
}

function demarrerSession() {
  const chapitres = getChapitresSelectionnes();
  if (chapitres.length === 0) { alert("Sélectionne au moins un chapitre !"); return; }
  
  // Simulation d'un score (à remplacer par le vrai quiz)
  sessionScore = { bonnes: Math.floor(Math.random() * 40), total: 40 };
  const pct = Math.round(sessionScore.bonnes / 40 * 100);
  
  // ==== ENVOI VERS SUIVI PARENTAL ====
  if (window.SuiviParental && window.SuiviParental.sauvegarderSession) {
    window.SuiviParental.sauvegarderSession(
      `francais_${currentEleve.toLowerCase()}`,  // "francais_wassil" ou "francais_nawal"
      chapitres.map(n => `Chapitre ${n}`),
      { bonnes: sessionScore.bonnes, total: 40 }
    );
  }
  
  const ra = document.getElementById("resultatsArea");
  ra.style.display = "block";
  ra.innerHTML = `<h3>🎉 Session terminée !</h3><p style="font-size:1.5rem;">${sessionScore.bonnes}/40</p><p>Soit ${pct}% de bonnes réponses</p><p>👤 Élève : <strong>${currentEleve}</strong><br>📖 Chapitres : ${chapitres.join(', ')}</p><p style="color:#5ecfb1;">✅ Score envoyé au suivi parental !</p><button id="reloadBtn" class="btn-primary">📚 Nouvelle session</button>`;
  document.getElementById("reloadBtn").onclick = () => location.reload();
}

document.getElementById("btnWassil").onclick = () => setEleve("Wassil");
document.getElementById("btnNawal").onclick = () => setEleve("Nawal");
document.getElementById("selectAllBtn").onclick = () => { for(let i=1;i<=26;i++){let cb=document.getElementById(`ch${i}`);if(cb)cb.checked=true;} };
document.getElementById("deselectAllBtn").onclick = () => { for(let i=1;i<=26;i++){let cb=document.getElementById(`ch${i}`);if(cb)cb.checked=false;} };
document.getElementById("demarrerBtn").onclick = demarrerSession;
setEleve("Wassil");
</script>
</body>
</html>
