<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>⚡ Automatismes – Français (Brevet 2026)</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:#000000;font-family:'DM Sans',sans-serif;padding:1rem;color:#ffffff;}
    .container{max-width:1000px;margin:0 auto;background:#1a1a1a;border-radius:2rem;padding:1.5rem;border:1px solid #ffcc00;}
    h1{font-family:'Playfair Display',serif;font-size:1.8rem;color:#ffcc00;margin-bottom:0.25rem;}
    .sub{color:#aaa;margin-bottom:1rem;border-left:3px solid #ffcc00;padding-left:1rem;font-size:0.8rem;}
    .info-bar{background:#2a2a2a;border-radius:1rem;padding:0.8rem;margin-bottom:1rem;display:flex;justify-content:space-between;flex-wrap:wrap;gap:0.5rem;font-size:0.8rem;}
    .timer{font-family:'DM Mono',monospace;font-size:1.2rem;color:#ffcc00;}
    .chapitre-selector{background:#2a2a2a;border-radius:1rem;padding:1rem;margin-bottom:1.5rem;}
    .chapitre-selector h3{font-size:0.9rem;margin-bottom:0.8rem;color:#ffcc00;}
    .chapitres-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:0.5rem;max-height:300px;overflow-y:auto;padding:0.5rem;}
    .chapitre-check{display:flex;align-items:center;gap:0.5rem;font-size:0.75rem;padding:0.3rem;}
    .chapitre-check input{cursor:pointer;}
    .chapitre-check label{cursor:pointer;}
    .question-card{background:#2a2a2a;border-radius:1.5rem;padding:1.5rem;margin-bottom:1rem;border:1px solid #333;}
    .question-text{font-size:1rem;margin-bottom:1rem;font-weight:500;}
    textarea{width:100%;min-height:100px;background:#0a0a0f;border:1px solid #333;border-radius:1rem;padding:0.8rem;color:white;font-size:0.9rem;font-family:'DM Sans',sans-serif;resize:vertical;margin-bottom:1rem;}
    .progress{background:#2a2a2a;border-radius:1rem;padding:0.8rem;margin-top:1rem;font-size:0.75rem;color:#aaa;text-align:center;}
    .feedback{background:#0a0a0f;border-radius:1rem;padding:0.6rem;margin-top:0.5rem;font-size:0.75rem;display:none;}
    .feedback.show{display:block;}
    .reponse-modele{background:#1a2a1a;border-left:3px solid #ffcc00;padding:0.5rem;margin-top:0.5rem;border-radius:0.5rem;font-size:0.75rem;}
    button{background:#1e2a3e;border:1px solid #5ecfb1;border-radius:40px;padding:0.5rem 1.2rem;font-size:0.8rem;color:#5ecfb1;cursor:pointer;}
    button:hover{background:#2a3652;}
    .btn-group{display:flex;gap:1rem;justify-content:center;margin:1rem 0;flex-wrap:wrap;}
    .btn-primary{background:#ffcc00;border-color:#ffcc00;color:#000;font-weight:700;}
    .back-link{display:inline-block;margin-top:1rem;text-decoration:none;color:#5ecfb1;font-size:0.8rem;}
    .resultats{background:#0a0a0f;border-radius:1rem;padding:1rem;margin-top:1rem;text-align:center;}
  </style>
</head>
<body>
<div class="container">
  <h1>⚡ Automatismes – Français</h1>
  <div class="sub">30-45 min • Choisis tes chapitres • L'IA adapte les questions</div>
  <div class="info-bar">
    <span>📅 Session <span id="sessionDate">--</span></span>
    <span class="timer" id="timer">⏱️ 45:00</span>
  </div>
  <div class="chapitre-selector" id="chapitreSelector">
    <h3>📚 Choisis les chapitres à réviser aujourd'hui :</h3>
    <div class="chapitres-grid" id="chapitresGrid"></div>
    <div class="btn-group" style="margin-top:1rem;">
      <button id="selectAllBtn">✅ Tout sélectionner</button>
      <button id="deselectAllBtn">❌ Tout désélectionner</button>
    </div>
  </div>
  <div class="btn-group">
    <button id="demarrerBtn" class="btn-primary">🎯 Démarrer la session (40 questions)</button>
  </div>
  <div id="sessionArea" style="display:none;">
    <div id="questionArea"></div>
    <div id="sessionStats" class="progress"></div>
  </div>
  <div id="resultatsArea" style="display:none;" class="resultats"></div>
  <a href="index.html" class="back-link">← Retour au hub</a>
</div>
<script>
const FLASHCARDS={1:{titre:"Classes grammaticales",cartes:[{id:"f1_1",q:"Quelles sont les 9 classes grammaticales ?",r:"Nom, déterminant, adjectif, pronom, verbe, adverbe, préposition, conjonction, interjection."},{id:"f1_2",q:"Donnez 3 déterminants.",r:"le, la, les / un, une, des / mon, ton, son"},{id:"f1_3",q:"Citez les 7 conjonctions de coordination.",r:"Mais, ou, et, donc, or, ni, car."}]},2:{titre:"Fonctions grammaticales",cartes:[{id:"f2_1",q:"Qu'est-ce que le COD ?",r:"Complément d'objet direct. Répond à 'quoi ?' ou 'qui ?'"},{id:"f2_2",q:"Qu'est-ce que le COI ?",r:"Complément d'objet indirect. Répond à 'à qui ?' ou 'de quoi ?'"}]},3:{titre:"La phrase",cartes:[{id:"f3_1",q:"Qu'est-ce qu'une phrase simple ?",r:"Une seule proposition (un verbe)."},{id:"f3_2",q:"Qu'est-ce qu'une subordonnée relative ?",r:"Introduite par qui, que, dont, où."}]},4:{titre:"Temps et modes verbaux",cartes:[{id:"f4_1",q:"À quoi sert l'imparfait ?",r:"Description ou habitude dans le passé."},{id:"f4_2",q:"À quoi sert le passé composé ?",r:"Action ponctuelle ou bilan (oral)."}]},5:{titre:"Les accords",cartes:[{id:"f5_1",q:"Règle d'accord sujet-verbe.",r:"Le verbe s'accorde en personne et nombre avec le sujet."},{id:"f5_2",q:"Participe passé avec avoir ?",r:"S'accorde avec le COD si placé avant."}]},6:{titre:"Les homophones",cartes:[{id:"f6_1",q:"Différence a/à ?",r:"a = avoir ; à = préposition"},{id:"f6_2",q:"Différence ou/où ?",r:"ou = conjonction ; où = pronom/adverbe"}]},7:{titre:"Conjugaison",cartes:[{id:"f7_1",q:"Terminaisons du présent (1er groupe).",r:"e, es, e, ons, ez, ent"},{id:"f7_2",q:"Conjuguez 'être' au présent.",r:"suis, es, est, sommes, êtes, sont"}]},8:{titre:"Valeurs des temps",cartes:[{id:"f8_1",q:"Valeur du présent.",r:"Actualité, vérité générale, habitude."},{id:"f8_2",q:"Valeur du conditionnel.",r:"Hypothèse, condition, souhait."}]},9:{titre:"Formation des mots",cartes:[{id:"f9_1",q:"Qu'est-ce qu'un préfixe ?",r:"Élément avant le radical."},{id:"f9_2",q:"Qu'est-ce qu'un suffixe ?",r:"Élément après le radical."}]},10:{titre:"Figures de style",cartes:[{id:"f10_1",q:"Qu'est-ce qu'une métaphore ?",r:"Analogie sans outil."},{id:"f10_2",q:"Qu'est-ce qu'une personnification ?",r:"Qualités humaines à un objet."}]},11:{titre:"Champs lexicaux",cartes:[{id:"f11_1",q:"Qu'est-ce qu'un champ lexical ?",r:"Ensemble des mots liés à un même thème."}]},12:{titre:"Synonymes, antonymes",cartes:[{id:"f12_1",q:"Qu'est-ce qu'un synonyme ?",r:"Mot de sens proche."},{id:"f12_2",q:"Qu'est-ce qu'un antonyme ?",r:"Mot de sens contraire."}]},13:{titre:"Genres littéraires",cartes:[{id:"f13_1",q:"Citez 4 genres littéraires.",r:"Roman, théâtre, poésie, argumentation."}]},14:{titre:"Mouvements littéraires",cartes:[{id:"f14_1",q:"Citez un mouvement du XVIIIe.",r:"Les Lumières."}]},15:{titre:"Registres littéraires",cartes:[{id:"f15_1",q:"Qu'est-ce que le registre comique ?",r:"Provoque le rire."}]},16:{titre:"Le récit",cartes:[{id:"f16_1",q:"Étapes du schéma narratif.",r:"SI → perturbateur → péripéties → résolution → SF."}]},17:{titre:"La rédaction",cartes:[{id:"f17_1",q:"Structure d'une introduction.",r:"Amorce, présentation, problématique, annonce du plan."}]},18:{titre:"Contraction de texte",cartes:[{id:"f18_1",q:"Règle d'or de la contraction.",r:"Ne pas commenter, ne pas juger."}]},19:{titre:"Commentaire composé",cartes:[{id:"f19_1",q:"Structure du commentaire.",r:"Introduction, développement (2-3 axes), conclusion."}]},20:{titre:"Oral : présentation",cartes:[{id:"f20_1",q:"Durée de l'oral du brevet.",r:"5 min exposé + 10 min échange."}]},21:{titre:"Oral : expression",cartes:[{id:"f21_1",q:"Posture à l'oral.",r:"Debout, gestes naturels, regarder le jury."}]},22:{titre:"Oral : échange",cartes:[{id:"f22_1",q:"Que faire si on ne sait pas ?",r:"L'admettre honnêtement."}]},23:{titre:"Dictée",cartes:[{id:"f23_1",q:"Que vérifier en priorité ?",r:"Accords, homophones, terminaisons."}]},24:{titre:"Grammaire (analyse)",cartes:[{id:"f24_1",q:"Différence nature/fonction ?",r:"Nature = classe, fonction = rôle dans la phrase."}]},25:{titre:"Réécriture",cartes:[{id:"f25_1",q:"Changer 'je' en 'nous' ?",r:"Verbe à la 1ère personne du pluriel."}]},26:{titre:"Essai",cartes:[{id:"f26_1",q:"Structure de l'essai.",r:"Introduction, développement (thèse/antithèse), conclusion."}]}};
function getAllCartes(){let c=[];for(let ch in FLASHCARDS)for(let ca of FLASHCARDS[ch].cartes)c.push({...ca,chapitre:parseInt(ch),chapitreTitre:FLASHCARDS[ch].titre});return c}
const TOUTES_CARTES=getAllCartes(),CHAPITRES_LISTE=Object.keys(FLASHCARDS).map(n=>({numero:parseInt(n),titre:FLASHCARDS[n].titre}));
let progression={},sessionCartes=[],sessionIndex=0,sessionScore={bonnes:0,total:0},currentCard=null,tempsRestant=45*60,timerInterval=null;
function chargerProgression(){let s=localStorage.getItem("automatismes_progression_francais");if(s)try{progression=JSON.parse(s)}catch(e){progression={}}else progression={}}
function sauvegarderProgression(){localStorage.setItem("automatismes_progression_francais",JSON.stringify(progression))}
function getNiveauCarte(id){return progression[id]?.niveau||0}
function getDernierEssai(id){return progression[id]?.dernierEssai||"1970-01-01"}
function mettreAJourCarte(id,reussi){if(!progression[id])progression[id]={niveau:0,reussitesConsecutives:0};let c=progression[id];if(reussi){c.reussitesConsecutives=(c.reussitesConsecutives||0)+1;if(c.reussitesConsecutives>=3&&c.niveau<3){c.niveau++;c.reussitesConsecutives=0}}else{c.niveau=Math.max(0,(c.niveau||0)-1);c.reussitesConsecutives=0}c.dernierEssai=new Date().toISOString();sauvegarderProgression()}
function melanger(t){for(let i=t.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[t[i],t[j]]=[t[j],t[i]]}return t}
function getCartesParChapitres(ch){return TOUTES_CARTES.filter(c=>ch.includes(c.chapitre))}
function getQuestionsNonReussies(l){let nr=TOUTES_CARTES.filter(c=>getNiveauCarte(c.id)<3);nr.sort((a,b)=>getDernierEssai(a.id).localeCompare(getDernierEssai(b.id)));return nr.slice(0,l)}
function getQuestionsReussiesEspacees(l){let r=TOUTES_CARTES.filter(c=>getNiveauCarte(c.id)>=3),auj=new Date(),ap=r.map(c=>{let j=Math.max(0,Math.floor((auj-new Date(getDernierEssai(c.id)))/(86400000)));return{carte:c,poids:1/(j+1)}});ap.sort((a,b)=>b.poids-a.poids);return ap.slice(0,l).map(i=>i.carte)}
function genererSession(ch){let v=melanger([...getCartesParChapitres(ch)]).slice(0,20),d=getQuestionsNonReussies(10),r=getQuestionsReussiesEspacees(10),s=[...v,...d,...r],ids=new Set();s=s.filter(c=>{if(ids.has(c.id))return false;ids.add(c.id);return true});return s.length?melanger(s):getCartesParChapitres(ch).slice(0,20)}
function afficherChapitres(){let g=document.getElementById("chapitresGrid");if(!g)return;g.innerHTML="";for(let ch of CHAPITRES_LISTE){let d=document.createElement("div");d.className="chapitre-check";d.innerHTML=`<input type="checkbox" id="ch_${ch.numero}" value="${ch.numero}"><label for="ch_${ch.numero}">${ch.numero}. ${ch.titre}</label>`;g.appendChild(d)}}
function getChapitresSelectionnes(){let c=document.querySelectorAll("#chapitresGrid input:checked");return Array.from(c).map(cb=>parseInt(cb.value))}
function extraireMotsCles(t){let stop=["le","la","les","un","une","des","et","ou","donc","or","ni","car","de","du","des","à","dans","par","pour","avec","sans","sur","sous","chez","est","sont","ce","cet","cette","ces","il","elle","ils","elles","on","nous","vous","je","tu"];return[...new Set(t.toLowerCase().replace(/[^\w\sàâäéèêëîïôöùûüç]/g,' ').split(/\s+/).filter(m=>m.length>2&&!stop.includes(m)))]}
function evaluerComprehension(e,a){let mcAtt=extraireMotsCles(a),mcEl=extraireMotsCles(e);if(mcAtt.length===0)return{valide:true,taux:100};let t=0;for(let m of mcAtt)if(mcEl.some(el=>el.includes(m)||m.includes(el)))t++;let tx=Math.round(t/mcAtt.length*100);return{valide:tx>=40,taux:tx}}
function afficherQuestion(){if(sessionIndex>=sessionCartes.length){terminerSession();return}currentCard=sessionCartes[sessionIndex];let niv=getNiveauCarte(currentCard.id),qa=document.getElementById("questionArea");if(qa){qa.innerHTML=`<div class="question-card"><div class="question-text">📖 ${currentCard.q}</div><textarea id="reponseInput" rows="3" placeholder="Écris ta réponse..."></textarea><div class="btn-group"><button id="validerBtn">✔️ Vérifier</button></div><div id="feedback" class="feedback"></div></div>`;document.getElementById("validerBtn").onclick=()=>verifierReponse();document.getElementById("reponseInput").focus()}let ss=document.getElementById("sessionStats");if(ss)ss.innerHTML=`📌 Question ${sessionIndex+1}/${sessionCartes.length} · Niveau: ${niv}/3`}
function verifierReponse(){let r=document.getElementById("reponseInput")?.value.trim();if(!r){alert("Écris une réponse.");return}let ev=evaluerComprehension(r,currentCard.r);if(ev.valide)sessionScore.bonnes++;sessionScore.total++;mettreAJourCarte(currentCard.id,ev.valide);let fb=document.getElementById("feedback");if(fb){fb.innerHTML=ev.valide?`✅ Bonne réponse ! (${ev.taux}%)<br><div class="reponse-modele">📖 ${currentCard.r}</div>`:`⚠️ À revoir (${ev.taux}%)<br><div class="reponse-modele">📖 ${currentCard.r}</div>`;fb.classList.add("show")}sessionIndex++;setTimeout(()=>afficherQuestion(),1800)}
function arreterTimer(){if(timerInterval)clearInterval(timerInterval);timerInterval=null}
function demarrerTimer(){arreterTimer();timerInterval=setInterval(()=>{if(tempsRestant<=0){arreterTimer();terminerSession();return}tempsRestant--;let m=Math.floor(tempsRestant/60),s=tempsRestant%60,te=document.getElementById("timer");if(te)te.innerHTML=`⏱️ ${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`},1000)}
function terminerSession(){arreterTimer();let pct=sessionScore.total>0?Math.round(sessionScore.bonnes/sessionScore.total*100):0,chEtudies=getChapitresSelectionnes(),chNoms=chEtudies.map(n=>FLASHCARDS[n]?.titre||`Chapitre ${n}`),ra=document.getElementById("resultatsArea");if(ra){ra.style.display="block";ra.innerHTML=`<h3>🎉 Session terminée !</h3><p style="font-size:1.5rem;">${sessionScore.bonnes}/${sessionScore.total}</p><p>Soit ${pct}% de bonnes réponses</p><p style="font-size:0.8rem;">Chapitres révisés : ${chNoms.join(', ')}</p><button id="nouvelleSessionBtn" class="btn-primary">📚 Nouvelle session</button>`;document.getElementById("nouvelleSessionBtn").onclick=()=>{ra.style.display="none";document.getElementById("chapitreSelector").style.display="block";document.getElementById("demarrerBtn").style.display="inline-block";document.getElementById("sessionArea").style.display="none"}}if(window.SuiviParental?.sauvegarderSession)window.SuiviParental.sauvegarderSession("francais",chNoms,{bonnes:sessionScore.bonnes,total:sessionScore.total});let chKey="automatismes_chapitres_francais",ex=JSON.parse(localStorage.getItem(chKey)||"[]"),nv=chNoms.filter(c=>!ex.includes(c));if(nv.length)localStorage.setItem(chKey,JSON.stringify([...ex,...nv]))}
function demarrerSession(){let ch=getChapitresSelectionnes();if(ch.length===0){alert("Sélectionne au moins un chapitre !");return}chargerProgression();sessionCartes=genererSession(ch);if(sessionCartes.length===0){alert("Aucune question disponible.");return}sessionIndex=0;sessionScore={bonnes:0,total:0};tempsRestant=45*60;document.getElementById("chapitreSelector").style.display="none";document.getElementById("demarrerBtn").style.display="none";document.getElementById("sessionArea").style.display="block";document.getElementById("resultatsArea").style.display="none";document.getElementById("sessionDate").innerText=new Date().toLocaleDateString();demarrerTimer();afficherQuestion()}
document.addEventListener("DOMContentLoaded",()=>{afficherChapitres();chargerProgression();document.getElementById("selectAllBtn").onclick=()=>document.querySelectorAll("#chapitresGrid input").forEach(cb=>cb.checked=true);document.getElementById("deselectAllBtn").onclick=()=>document.querySelectorAll("#chapitresGrid input").forEach(cb=>cb.checked=false);document.getElementById("demarrerBtn").onclick=demarrerSession});
</script>
</body>
</html>
