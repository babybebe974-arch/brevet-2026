    .eleve-btn.aw{background:#7eb8f5;color:#000;}
    .eleve-btn.an{background:#f59eb8;color:#000;}

    .chapitre-selector h3{font-size:0.9rem;margin-bottom:0.8rem;color:#ffcc00;}
    .chapitres-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:0.5rem;max-height:320px;overflow-y:auto;padding:0.5rem;}
    .ch-item{display:flex;align-items:center;gap:8px;background:#111118;border:1px solid #333;border-radius:8px;padding:8px 12px;cursor:pointer;transition:.15s;font-size:12px;}
    .ch-item:hover{border-color:#ffcc00;}
    .ch-item.selected{border-color:#ffcc00;background:rgba(255,204,0,0.1);}
    .ch-num{font-family:'DM Mono',monospace;font-size:10px;color:#aaa;min-width:28px;}

    button:hover{background:#2a3652;}
    .btn-primary{background:#ffcc00;border-color:#ffcc00;color:#000;font-weight:700;}
    .btn-primary:disabled{opacity:0.4;cursor:not-allowed;}
    .btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:1rem;}

    .question-card{background:#2a2a2a;border-radius:1.5rem;padding:1.5rem;margin-bottom:1rem;border:1px solid #333;}
    .question-text{font-size:1rem;margin-bottom:1rem;font-weight:500;}
    textarea{width:100%;min-height:100px;background:#0a0a0f;border:1px solid #333;border-radius:1rem;padding:0.8rem;color:white;font-size:0.9rem;font-family:'DM Sans',sans-serif;resize:vertical;margin-bottom:1rem;}
    .progress{background:#2a2a2a;border-radius:1rem;padding:0.8rem;margin-top:1rem;font-size:0.75rem;color:#aaa;text-align:center;}
    .feedback{background:#0a0a0f;border-radius:1rem;padding:0.6rem;margin-top:0.5rem;font-size:0.75rem;display:none;}
    .feedback.show{display:block;}
    .reponse-modele{background:#1a2a1a;border-left:3px solid #ffcc00;padding:0.5rem;margin-top:0.5rem;border-radius:0.5rem;font-size:0.75rem;}
    .resultats{background:#0a0a0f;border-radius:1rem;padding:1rem;margin-top:1rem;text-align:center;}
    .back-link{display:inline-block;margin-top:1rem;text-decoration:none;color:#5ecfb1;font-size:0.8rem;}
    .stats{background:#2a2a2a;border-radius:1rem;padding:0.8rem;margin-bottom:1rem;font-size:0.75rem;display:flex;justify-content:space-between;flex-wrap:wrap;}

// ==================== ÉLÈVE ====================
let eleve = 'wassil';
let progression = {};
let sessionCartes = [];
let currentIndex = 0;
let currentCard = null;
let sessionScore = { bonnes: 0, total: 0 };
let tempsRestant = 45 * 60;
let timerInterval = null;

// ==================== PROGRESSION ====================
function getStorageKey() { return `automatismes_progression_francais_${eleve}`; }
function sauvegarderProgression() { localStorage.setItem(getStorageKey(), JSON.stringify(progression)); }
function chargerProgression() {
  const saved = localStorage.getItem(getStorageKey());
  if (saved) progression = JSON.parse(saved);
  else progression = {};
}

function getCardKey(carte) { return `${carte.chapitre}_${carte.q.substring(0,40)}`; }
function getNiveau(carteId) { return progression[carteId]?.score || 0; }
function setNiveau(carteId, val) {
  progression[carteId] = { score: Math.min(3, val), derniereRevision: new Date().toISOString() };
  sauvegarderProgression();
}

// ==================== INTERFACE ====================
function setEleve(e) {
  eleve = e;
  const btnW = document.getElementById('btnWassil');
  const btnN = document.getElementById('btnNawal');
  if (e === 'wassil') {
    btnW.className = 'eleve-btn aw';
    btnN.className = 'eleve-btn';
  } else {
    btnN.className = 'eleve-btn an';
    btnW.className = 'eleve-btn';
  }
  chargerProgression();
  mettreAJourStats();
}

function getSelectedChapitres() {
  let selected = [];
  for (let i = 1; i <= 26; i++) {
    const el = document.getElementById(`ch_${i}`);
    if (el && el.classList.contains('selected')) selected.push(i);
  }
  return selected;
}

function getCartesSelectionnees() {
  const selected = getSelectedChapitres();
  let cartes = [];
  for (let ch of selected) {
    for (let c of CHAPITRES[ch].cartes) {
      cartes.push({ ...c, chapitre: ch, chapitreTitre: CHAPITRES[ch].titre });
    }
  }
  return cartes;
}

function mettreAJourStats() {
  const cartes = getCartesSelectionnees();
  let maitrisees = 0;
  for (let c of cartes) {
    if (getNiveau(getCardKey(c)) >= 3) maitrisees++;
  }
  const pct = cartes.length > 0 ? Math.round(maitrisees / cartes.length * 100) : 0;
  document.getElementById('nbCartes').textContent = cartes.length;
  document.getElementById('nbMaitrisees').textContent = maitrisees;
  document.getElementById('nbProgress').textContent = pct + '%';
  document.getElementById('demarrerBtn').disabled = cartes.length === 0;
}

function buildChapitresGrid() {
  const grid = document.getElementById('chapitresGrid');
  grid.innerHTML = '';
  for (let i = 1; i <= 26; i++) {
    const div = document.createElement('div');
    div.className = 'ch-item';
    div.id = `ch_${i}`;
    div.onclick = () => { div.classList.toggle('selected'); mettreAJourStats(); };
    div.innerHTML = `<span class="ch-num">${i}</span><span>${CHAPITRES[i].titre}</span>`;
    grid.appendChild(div);
  }
}

// ==================== GÉNÉRATION SESSION (20/10/10) ====================
function melanger(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function getQuestionsNouvelles(cartes, limit) {
  return cartes.filter(c => getNiveau(getCardKey(c)) === 0).slice(0, limit);
}

function getQuestionsErreurs(cartes, limit) {
  return cartes.filter(c => getNiveau(getCardKey(c)) > 0 && getNiveau(getCardKey(c)) < 3)
    .sort((a,b) => {
      const dateA = progression[getCardKey(a)]?.derniereRevision || '1970-01-01';
      const dateB = progression[getCardKey(b)]?.derniereRevision || '1970-01-01';
      return dateA.localeCompare(dateB);
    }).slice(0, limit);
}

function getQuestionsRevision(cartes, limit) {
  const reussies = cartes.filter(c => getNiveau(getCardKey(c)) >= 3);
  const aujourdhui = new Date();
  const avecPoids = reussies.map(c => {
    const derniere = progression[getCardKey(c)]?.derniereRevision;
    const jours = derniere ? Math.max(0, Math.floor((aujourdhui - new Date(derniere)) / (86400000))) : 0;
    return { carte: c, poids: 1 / (jours + 1) };
  });
  avecPoids.sort((a, b) => b.poids - a.poids);
  return avecPoids.slice(0, limit).map(item => item.carte);
}

function genererSession() {
  const toutes = getCartesSelectionnees();
  const selectedChapitres = getSelectedChapitres();
  
  // Cas particulier : uniquement chapitres 1,2,3
  const onlyThreeFirst = selectedChapitres.length === 3 && selectedChapitres.includes(1) && selectedChapitres.includes(2) && selectedChapitres.includes(3);
  
  if (onlyThreeFirst) {
    return melanger(toutes).slice(0, 30);
  }
  
  // Règle 20/10/10 normale
  const vingt = getQuestionsNouvelles(toutes, 20);
  const dixErreurs = getQuestionsErreurs(toutes, 10);
  const dixRevision = getQuestionsRevision(toutes, 10);
  
  let session = [...vingt, ...dixErreurs, ...dixRevision];
  const ids = new Set();
  session = session.filter(c => { const k = getCardKey(c); if (ids.has(k)) return false; ids.add(k); return true; });
  
  return melanger(session);
}

// ==================== ÉVALUATION ====================
function evaluerBienveillant(reponse, attendue) {
  if (!reponse || reponse.trim().length < 2) return { valide: false, taux: 0, message: "Écris une réponse." };
  const rep = reponse.toLowerCase().trim();
  const att = attendue.toLowerCase();
  
  if (rep === att) return { valide: true, taux: 100, message: "Parfait !" };
  
  // Raccourcis
  if (rep === "e es e ons ez ent" || rep === "e,es,e,ons,ez,ent") return { valide: true, taux: 100, message: "Parfait !" };
  if (rep === "habitude" && att.includes("habitude")) return { valide: true, taux: 85, message: "Bien !" };
  if (rep === "preposition" && att.includes("préposition")) return { valide: true, taux: 80, message: "Bien !" };
  
  const motsAtt = att.split(/[\s,;.]+/).filter(m => m.length > 3);
  const motsRep = rep.split(/[\s,;.]+/);
  let trouve = 0;
  for (let ma of motsAtt) {
    for (let mr of motsRep) {
      if (mr.includes(ma.substring(0,3)) || ma.includes(mr.substring(0,3))) { trouve++; break; }
    }
  }
  let taux = motsAtt.length ? Math.round(trouve / motsAtt.length * 100) : 50;
  
  if (taux >= 40) return { valide: true, taux: taux, message: taux >= 70 ? "Bien !" : "Presque ! Relis la correction." };
  return { valide: false, taux: taux, message: "À retravailler." };
}

// ==================== SESSION ====================
function demarrerSession() {
  sessionCartes = genererSession();
  if (sessionCartes.length === 0) { alert("Aucune carte disponible."); return; }
  currentIndex = 0;
  sessionScore = { bonnes: 0, total: sessionCartes.length };
  tempsRestant = 45 * 60;
  document.getElementById('chapitreSelector').style.display = 'none';
  document.getElementById('demarrerBtn').style.display = 'none';
  document.getElementById('sessionArea').style.display = 'block';
  document.getElementById('resultatsArea').style.display = 'none';
  document.getElementById('sessionDate').innerText = new Date().toLocaleDateString();
  demarrerTimer();
  afficherQuestion();
}

function afficherQuestion() {
  if (currentIndex >= sessionCartes.length) { terminerSession(); return; }
  currentCard = sessionCartes[currentIndex];
  const niveau = getNiveau(getCardKey(currentCard));
  document.getElementById('questionArea').innerHTML = `
    <div class="question-card">
      <div style="font-size:0.7rem;color:#aaa;margin-bottom:8px;">${currentCard.chapitreTitre} • Niveau: ${niveau}/3</div>
      <div class="question-text">📖 ${currentCard.q}</div>
      <textarea id="reponseInput" rows="3" placeholder="Écris ta réponse..."></textarea>
      <div class="btn-row"><button id="validerBtn">✔ Vérifier</button></div>
      <div id="feedback" class="feedback"></div>
    </div>
  `;
  document.getElementById('validerBtn').onclick = () => verifierReponse();
  document.getElementById('reponseInput').focus();
  document.getElementById('sessionStats').innerHTML = `📌 Question ${currentIndex+1}/${sessionCartes.length}`;
}

function verifierReponse() {
  const reponse = document.getElementById('reponseInput').value.trim();
  if (!reponse) { alert("Écris une réponse."); return; }
  const ev = evaluerBienveillant(reponse, currentCard.r);
  if (ev.valide) sessionScore.bonnes++;
  sessionScore.total++;
  
  const key = getCardKey(currentCard);
  const niveauActuel = getNiveau(key);
  let nouveauNiveau = niveauActuel;
  if (ev.valide) nouveauNiveau = Math.min(nouveauNiveau + 1, 3);
  else nouveauNiveau = Math.max(0, nouveauNiveau - 1);
  setNiveau(key, nouveauNiveau);
  
  const fbDiv = document.getElementById('feedback');
  fbDiv.innerHTML = ev.valide 
    ? `<div class="feedback show"><span style="color:#2ecc71;">✅ ${ev.message} (${ev.taux}%)</span><div class="reponse-modele">📖 ${currentCard.r}</div></div>`
    : `<div class="feedback show"><span style="color:#ffcc00;">⚠️ ${ev.message} (${ev.taux}%)</span><div class="reponse-modele">📖 ${currentCard.r}</div></div>`;
  fbDiv.classList.add('show');
  
  currentIndex++;
  setTimeout(() => afficherQuestion(), 1800);
}

function demarrerTimer() {
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    if (tempsRestant <= 0) { clearInterval(timerInterval); terminerSession(); return; }
    tempsRestant--;
    const m = Math.floor(tempsRestant / 60), s = tempsRestant % 60;
    const timerEl = document.getElementById('timer');
    if (timerEl) timerEl.innerHTML = `⏱️ ${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
  }, 1000);
}

function terminerSession() {
  clearInterval(timerInterval);
  const pct = sessionScore.total > 0 ? Math.round(sessionScore.bonnes / sessionScore.total * 100) : 0;
  const chapitresNoms = getSelectedChapitres().map(n => CHAPITRES[n].titre);
  
  // Envoi vers suivi-parental
  const keyP = `suivi_sessions_francais_${eleve}`;
  const sessions = JSON.parse(localStorage.getItem(keyP) || '[]');
  sessions.unshift({
    id: Date.now(),
    date: new Date().toISOString(),
    chapitres: chapitresNoms,
    score: { bonnes: sessionScore.bonnes, total: sessionScore.total },
    pourcentage: pct
  });
  localStorage.setItem(keyP, JSON.stringify(sessions.slice(0, 200)));
  
  // Sauvegarde des chapitres étudiés
  const chapitresKey = `automatismes_chapitres_francais_${eleve}`;
  const existants = JSON.parse(localStorage.getItem(chapitresKey) || '[]');
  const nouveaux = chapitresNoms.filter(c => !existants.includes(c));
  if (nouveaux.length) localStorage.setItem(chapitresKey, JSON.stringify([...existants, ...nouveaux]));
  
  document.getElementById('sessionArea').style.display = 'none';
  const ra = document.getElementById('resultatsArea');
  ra.style.display = 'block';
  const msg = pct >= 70 ? '🌟 Excellent !' : (pct >= 50 ? '👍 Bien joué !' : (pct >= 30 ? '💪 Courage !' : '📚 Continue à t\'entraîner.'));
  ra.innerHTML = `
    <h3>🎉 Session terminée !</h3>
    <p style="font-size:2rem;">${sessionScore.bonnes}/${sessionScore.total}</p>
    <p>Soit ${pct}% de bonnes réponses</p>
    <p style="color:#ffcc00;">${msg}</p>
    <p>👤 Élève : <strong>${eleve === 'wassil' ? 'Wassil' : 'Nawal'}</strong><br>📖 Chapitres révisés : ${chapitresNoms.join(', ')}</p>
    <button id="reloadBtn" class="btn-primary">📚 Nouvelle session</button>
  `;
  document.getElementById('reloadBtn').onclick = () => location.reload();
}

};

  document.querySelectorAll('#chapitresGrid .ch-item').forEach(el => el.classList.remove('selected'));
  mettreAJourStats();
};
document.getElementById('demarrerBtn').onclick = demarrerSession;

buildChapitresGrid();
chargerProgression();
mettreAJourStats();
setEleve('wassil');
