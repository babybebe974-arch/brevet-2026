<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚡ Automatismes – Français</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:#000;font-family:'DM Sans',sans-serif;padding:1rem;color:#fff;}
    .container{max-width:900px;margin:0 auto;background:#1a1a1a;border-radius:2rem;padding:1.5rem;border:1px solid #ffcc00;}
    h1{font-size:1.6rem;color:#ffcc00;margin-bottom:0.5rem;}
    .sub{color:#aaa;font-size:0.8rem;margin-bottom:1rem;}
    .eleve-bar{display:flex;gap:10px;margin-bottom:1rem;}
    .eleve-btn{padding:6px 20px;border-radius:40px;border:none;cursor:pointer;font-weight:700;background:transparent;color:#aaa;}
    .eleve-btn.aw{background:#7eb8f5;color:#000;}
    .eleve-btn.an{background:#f59eb8;color:#000;}
    .chapitres-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:6px;margin-bottom:1rem;max-height:300px;overflow-y:auto;}
    .ch-item{background:#111118;border:1px solid #333;border-radius:8px;padding:8px 12px;cursor:pointer;font-size:12px;}
    .ch-item.selected{border-color:#ffcc00;background:rgba(255,204,0,0.1);}
    button{background:#1e2a3e;border:1px solid #5ecfb1;border-radius:40px;padding:8px 16px;color:#5ecfb1;cursor:pointer;margin-top:8px;}
    .btn-primary{background:#ffcc00;border-color:#ffcc00;color:#000;font-weight:700;}
    .question-card{background:#2a2a2a;border-radius:1rem;padding:1rem;margin-bottom:1rem;}
    textarea{width:100%;min-height:80px;background:#0a0a0f;border:1px solid #333;border-radius:0.5rem;padding:8px;color:#fff;resize:vertical;}
    .feedback{margin-top:8px;padding:8px;background:#0a0a0f;border-radius:0.5rem;display:none;}
    .reponse-modele{margin-top:6px;padding:6px;background:#1a2a1a;border-left:3px solid #ffcc00;border-radius:0.5rem;}
    .resultats{background:#0a0a0f;border-radius:1rem;padding:1rem;text-align:center;}
    .back-link{display:block;margin-top:1rem;color:#5ecfb1;text-decoration:none;font-size:0.8rem;}
  </style>
</head>
<body>
<div class="container">
  <h1>⚡ Automatismes – Français</h1>
  <div class="sub">Choisis tes chapitres • 20/10/10 • Évaluation bienveillante</div>

  <div class="eleve-bar">
    <button id="btnW" class="eleve-btn aw">🌊 Wassil</button>
    <button id="btnN" class="eleve-btn">⚡ Nawal</button>
  </div>

  <div id="chapitresGrid" class="chapitres-grid"></div>

  <div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:1rem;">
    <button id="selectAll">✅ Tout sélectionner</button>
    <button id="deselectAll">❌ Tout désélectionner</button>
    <button id="resetProg" style="border-color:#e87a7a;color:#e87a7a;">🔄 Reset progression</button>
  </div>

  <button id="demarrer" class="btn-primary" disabled>🎯 Démarrer la session</button>

  <div id="sessionArea" style="display:none; margin-top:1rem;">
    <div style="display:flex; justify-content:space-between; margin-bottom:0.5rem;">
      <span>⏱️ <span id="timer">45:00</span></span>
      <span id="qCount">Q 0/0</span>
    </div>
    <div id="questionArea"></div>
    <div id="sessionStats" style="background:#2a2a2a; padding:6px; border-radius:0.5rem; text-align:center; font-size:0.7rem;"></div>
  </div>

  <div id="resultatsArea" style="display:none;"></div>

  <a href="index.html" class="back-link">← Retour au hub</a>
</div>

<script>
// ==================== CHAPITRES (titres uniquement) ====================
const CHAPITRES = {
  1:"Classes grammaticales",2:"Fonctions grammaticales",3:"La phrase",4:"Temps et modes verbaux",
  5:"Les accords",6:"Les homophones",7:"Conjugaison",8:"Valeurs des temps",9:"Formation des mots",
  10:"Figures de style",11:"Champs lexicaux",12:"Synonymes, antonymes",13:"Genres littéraires",
  14:"Mouvements littéraires",15:"Registres littéraires",16:"Le récit",17:"La rédaction",
  18:"Contraction de texte",19:"Commentaire composé",20:"Oral : présentation",21:"Oral : expression",
  22:"Oral : échange",23:"Dictée",24:"Grammaire (analyse)",25:"Réécriture",26:"Essai"
};

// ==================== ÉTAT ====================
let eleve = 'wassil';
let progression = {};
let sessionCartes = [];
let currentIndex = 0;
let sessionScore = { bonnes: 0, total: 0 };
let timerInterval = null;
let tempsRestant = 45 * 60;
let currentCard = null;

// ==================== STOCKAGE ====================
function getStorageKey() { return `auto_fr_${eleve}`; }
function saveProgress() { localStorage.setItem(getStorageKey(), JSON.stringify(progression)); }
function loadProgress() {
  const saved = localStorage.getItem(getStorageKey());
  progression = saved ? JSON.parse(saved) : {};
}

function getCardKey(c) { return `${c.chapitre}_${c.q.substring(0,30)}`; }
function getScore(id) { return progression[id]?.score || 0; }
function setScore(id, val) { progression[id] = { score: Math.min(3, val), date: new Date().toISOString() }; saveProgress(); }

// ==================== CHARGEMENT DES CARTES DEPUIS flashcards-francais.html ====================
// ATTENTION : Ce script doit être exécuté APRÈS le chargement de flashcards-francais.html
// Pour que cela fonctionne, il faut que flashcards-francais.html ait déjà chargé les cartes dans localStorage
// Ou on utilise un fichier data-francais.js commun

// Version de secours : cartes minimales (pour que ça fonctionne immédiatement)
const CARTES_MINIMALES = {
  1: [
    { q: "Quelles sont les 9 classes grammaticales ?", r: "Nom, déterminant, adjectif, pronom, verbe, adverbe, préposition, conjonction, interjection." },
    { q: "Donnez 3 déterminants.", r: "le, la, les / un, une, des / mon, ton, son" },
    { q: "Citez les 7 conjonctions de coordination.", r: "Mais, ou, et, donc, or, ni, car." }
  ],
  2: [
    { q: "Qu'est-ce que le COD ?", r: "Complément d'objet direct. Répond à 'quoi ?' ou 'qui ?'" },
    { q: "Qu'est-ce que le COI ?", r: "Complément d'objet indirect. Répond à 'à qui ?' ou 'de quoi ?'" }
  ],
  3: [
    { q: "Qu'est-ce qu'une phrase simple ?", r: "Une seule proposition (un verbe)" },
    { q: "Qu'est-ce qu'une phrase complexe ?", r: "Plusieurs propositions" }
  ]
};
for (let i = 4; i <= 26; i++) {
  CARTES_MINIMALES[i] = [{ q: "Question du chapitre " + i, r: "Réponse du chapitre " + i }];
}

function getAllCartesFromChapitres(chapitres) {
  let cartes = [];
  for (let ch of chapitres) {
    let src = CARTES_MINIMALES[ch] || [];
    for (let c of src) {
      cartes.push({ ...c, chapitre: ch, chapitreTitre: CHAPITRES[ch] });
    }
  }
  return cartes;
}

// ==================== INTERFACE ====================
function setEleve(e) {
  eleve = e;
  const btnW = document.getElementById('btnW');
  const btnN = document.getElementById('btnN');
  if (e === 'wassil') {
    btnW.className = 'eleve-btn aw';
    btnN.className = 'eleve-btn';
  } else {
    btnN.className = 'eleve-btn an';
    btnW.className = 'eleve-btn';
  }
  loadProgress();
}

function getSelected() {
  const selected = [];
  for (let i = 1; i <= 26; i++) {
    const el = document.getElementById(`ch_${i}`);
    if (el && el.classList.contains('selected')) selected.push(i);
  }
  return selected;
}

function updateStartButton() {
  const selected = getSelected();
  document.getElementById('demarrer').disabled = selected.length === 0;
}

function buildGrid() {
  const grid = document.getElementById('chapitresGrid');
  grid.innerHTML = '';
  for (let i = 1; i <= 26; i++) {
    const div = document.createElement('div');
    div.className = 'ch-item';
    div.id = `ch_${i}`;
    div.onclick = () => { div.classList.toggle('selected'); updateStartButton(); };
    div.innerHTML = `<span style="font-family:'DM Mono',monospace;color:#aaa;margin-right:6px;">${i}</span>${CHAPITRES[i]}`;
    grid.appendChild(div);
  }
}

// ==================== GÉNÉRATION SESSION (20/10/10 avec spaced repetition) ====================
function melanger(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function genererSession() {
  const selected = getSelected();
  const toutes = getAllCartesFromChapitres(selected);
  
  // Supprimer doublons
  const uniques = [];
  const seen = new Set();
  for (let c of toutes) {
    if (!seen.has(c.q)) { seen.add(c.q); uniques.push(c); }
  }
  
  if (uniques.length === 0) return [];
  
  // Cas particulier : chapitres 1,2,3 uniquement → 30 questions
  const onlyThreeFirst = selected.length === 3 && selected.includes(1) && selected.includes(2) && selected.includes(3);
  if (onlyThreeFirst) {
    return melanger(uniques).slice(0, 30);
  }
  
  // Règle 20/10/10
  const nouvelles = uniques.filter(c => getScore(getCardKey(c)) === 0).slice(0, 20);
  const erreurs = uniques.filter(c => getScore(getCardKey(c)) > 0 && getScore(getCardKey(c)) < 3).slice(0, 10);
  const revision = uniques.filter(c => getScore(getCardKey(c)) >= 3).slice(0, 10);
  
  let session = [...nouvelles, ...erreurs, ...revision];
  const ids = new Set();
  session = session.filter(c => { const k = getCardKey(c); if (ids.has(k)) return false; ids.add(k); return true; });
  
  return melanger(session);
}

// ==================== ÉVALUATION (bienveillante, seuil 40%) ====================
function evaluer(reponse, attendue) {
  if (!reponse || reponse.length < 2) return { ok: false, taux: 0, msg: "Écris une réponse." };
  const r = reponse.toLowerCase().trim();
  const a = attendue.toLowerCase();
  if (r === a) return { ok: true, taux: 100, msg: "Parfait !" };
  const motsA = a.split(/[\s,;.]+/).filter(m => m.length > 3);
  const motsR = r.split(/[\s,;.]+/);
  let trouve = 0;
  for (let ma of motsA) {
    for (let mr of motsR) {
      if (mr.includes(ma.substring(0,3)) || ma.includes(mr.substring(0,3))) { trouve++; break; }
    }
  }
  let taux = motsA.length ? Math.round(trouve / motsA.length * 100) : 50;
  if (taux >= 40) return { ok: true, taux: taux, msg: taux >= 70 ? "Bien !" : "Presque !" };
  return { ok: false, taux: taux, msg: "À retravailler." };
}

// ==================== SESSION ====================
function startTimer() {
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    if (tempsRestant <= 0) { clearInterval(timerInterval); terminer(); return; }
    tempsRestant--;
    const m = Math.floor(tempsRestant / 60), s = tempsRestant % 60;
    document.getElementById('timer').textContent = `${m}:${s.toString().padStart(2,'0')}`;
  }, 1000);
}

function afficherQuestion() {
  if (currentIndex >= sessionCartes.length) { terminer(); return; }
  currentCard = sessionCartes[currentIndex];
  const niveau = getScore(getCardKey(currentCard));
  document.getElementById('questionArea').innerHTML = `
    <div class="question-card">
      <div style="font-size:0.7rem;color:#aaa;">${currentCard.chapitreTitre} • Niveau: ${niveau}/3</div>
      <div style="font-size:1rem; margin:8px 0;">📖 ${currentCard.q}</div>
      <textarea id="reponse" rows="3" placeholder="Écris ta réponse..."></textarea>
      <button id="validerBtn">✔ Vérifier</button>
      <div id="feedback" class="feedback"></div>
    </div>
  `;
  document.getElementById('validerBtn').onclick = () => verifierReponse();
  document.getElementById('reponse').focus();
  document.getElementById('qCount').textContent = `Q ${currentIndex+1}/${sessionCartes.length}`;
  document.getElementById('sessionStats').innerHTML = `📌 ${currentIndex+1}/${sessionCartes.length}`;
}

function verifierReponse() {
  const rep = document.getElementById('reponse').value.trim();
  if (!rep) { alert("Écris une réponse."); return; }
  const ev = evaluer(rep, currentCard.r);
  if (ev.ok) sessionScore.bonnes++;
  sessionScore.total++;
  
  const key = getCardKey(currentCard);
  let score = getScore(key);
  if (ev.ok) score = Math.min(score + 1, 3);
  else score = Math.max(0, score - 1);
  setScore(key, score);
  
  const fb = document.getElementById('feedback');
  fb.innerHTML = ev.ok 
    ? `<span style="color:#2ecc71;">✅ ${ev.msg} (${ev.taux}%)</span><div class="reponse-modele">📖 ${currentCard.r}</div>`
    : `<span style="color:#ffcc00;">⚠️ ${ev.msg} (${ev.taux}%)</span><div class="reponse-modele">📖 ${currentCard.r}</div>`;
  fb.classList.add('show');
  currentIndex++;
  setTimeout(() => afficherQuestion(), 1800);
}

function terminer() {
  clearInterval(timerInterval);
  const pct = sessionScore.total ? Math.round(sessionScore.bonnes / sessionScore.total * 100) : 0;
  const chapitresNoms = getSelected().map(n => CHAPITRES[n]);
  
  // Envoi vers suivi-parental
  const keyP = `suivi_sessions_francais_${eleve}`;
  const sessions = JSON.parse(localStorage.getItem(keyP) || '[]');
  sessions.unshift({
    id: Date.now(),
    date: new Date().toISOString(),
    chapitres: chapitresNoms,
    score: { bonnes: sessionScore.bonnes, total: sessionScore.total },
    pourcentage: pct
  });
  localStorage.setItem(keyP, JSON.stringify(sessions.slice(0, 200)));
  
  document.getElementById('sessionArea').style.display = 'none';
  const ra = document.getElementById('resultatsArea');
  ra.style.display = 'block';
  const msg = pct >= 70 ? '🌟 Excellent !' : (pct >= 50 ? '👍 Bien joué !' : (pct >= 30 ? '💪 Courage !' : '📚 Continue à t\'entraîner.'));
  ra.innerHTML = `
    <h3>🎉 Session terminée !</h3>
    <p style="font-size:2rem;">${sessionScore.bonnes}/${sessionScore.total}</p>
    <p>Soit ${pct}% de bonnes réponses</p>
    <p style="color:#ffcc00;">${msg}</p>
    <p>👤 Élève : <strong>${eleve === 'wassil' ? 'Wassil' : 'Nawal'}</strong><br>📖 Chapitres : ${chapitresNoms.join(', ')}</p>
    <button id="reloadBtn" class="btn-primary">📚 Nouvelle session</button>
  `;
  document.getElementById('reloadBtn').onclick = () => location.reload();
}

function demarrer() {
  sessionCartes = genererSession();
  if (!sessionCartes.length) { alert("Sélectionne des chapitres."); return; }
  currentIndex = 0;
  sessionScore = { bonnes: 0, total: sessionCartes.length };
  tempsRestant = 45 * 60;
  document.getElementById('chapitresGrid').style.display = 'none';
  document.getElementById('selectAll').style.display = 'none';
  document.getElementById('deselectAll').style.display = 'none';
  document.getElementById('resetProg').style.display = 'none';
  document.getElementById('demarrer').style.display = 'none';
  document.getElementById('sessionArea').style.display = 'block';
  startTimer();
  afficherQuestion();
}

function resetProgression() {
  if (confirm(`Supprimer toute la progression de ${eleve === 'wassil' ? 'Wassil' : 'Nawal'} ?`)) {
    localStorage.removeItem(getStorageKey());
    loadProgress();
  }
}

document.getElementById('btnW').onclick = () => setEleve('wassil');
document.getElementById('btnN').onclick = () => setEleve('nawal');
document.getElementById('selectAll').onclick = () => { document.querySelectorAll('#chapitresGrid .ch-item').forEach(el => el.classList.add('selected')); updateStartButton(); };
document.getElementById('deselectAll').onclick = () => { document.querySelectorAll('#chapitresGrid .ch-item').forEach(el => el.classList.remove('selected')); updateStartButton(); };
document.getElementById('resetProg').onclick = resetProgression;
document.getElementById('demarrer').onclick = demarrer;

buildGrid();
loadProgress();
updateStartButton();
setEleve('wassil');
</script>
</body>
</html>
