<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚡ Automatismes Français — Brevet 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#09090f; --s1:#111118; --s2:#1a1a24; --br:#2a2a38;
  --teal:#5ecfb1; --gold:#e8c87a; --red:#e87a7a;
  --blue-w:#7eb8f5; --pink-n:#f59eb8;
  --text:#e8e8f0; --dim:#9090a8; --muted:#5a5a72;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;padding:1.5rem;}
.container{max-width:860px;margin:0 auto;}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:2rem;flex-wrap:wrap;gap:1rem;}
.header h1{font-family:'Syne',sans-serif;font-size:1.8rem;font-weight:800;}
.header h1 span{color:var(--teal);}
.header p{color:var(--dim);font-size:13px;margin-top:2px;}
.back-link{color:var(--dim);text-decoration:none;font-size:13px;}
.back-link:hover{color:var(--teal);}

.eleve-bar{display:flex;gap:10px;margin-bottom:1.5rem;background:var(--s2);border-radius:50px;padding:5px;width:fit-content;}
.eleve-btn{padding:8px 24px;border-radius:50px;border:none;cursor:pointer;font-family:'Syne',sans-serif;font-weight:700;font-size:13px;transition:.2s;background:transparent;color:var(--dim);}
.eleve-btn.aw{background:var(--blue-w);color:#09090f;}
.eleve-btn.an{background:var(--pink-n);color:#09090f;}

.phase{display:none;}
.phase.active{display:block;}
.section-title{font-family:'Syne',sans-serif;font-weight:700;font-size:13px;color:var(--gold);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px;}
.chapitres-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;max-height:360px;overflow-y:auto;padding:4px;margin-bottom:1rem;}
.ch-item{display:flex;align-items:center;gap:8px;background:var(--s1);border:1px solid var(--br);border-radius:8px;padding:8px 12px;cursor:pointer;transition:.15s;font-size:13px;user-select:none;}
.ch-item:hover{border-color:var(--teal);}
.ch-item.selected{border-color:var(--teal);background:rgba(94,207,177,.08);}
.ch-num{font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);min-width:18px;}

.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:1rem;}
.btn{padding:8px 16px;border-radius:8px;border:1px solid var(--br);background:var(--s2);color:var(--dim);font-size:12px;cursor:pointer;transition:.15s;}
.btn:hover{border-color:var(--teal);color:var(--teal);}
.btn-primary{background:var(--teal);border-color:var(--teal);color:#09090f;font-family:'Syne',sans-serif;font-weight:700;font-size:13px;padding:10px 28px;border-radius:10px;}
.btn-primary:hover{background:#3aad91;}
.btn-primary:disabled{opacity:.4;cursor:not-allowed;}

.info-strip{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:1.5rem;}
.pill{background:var(--s2);border:1px solid var(--br);border-radius:20px;padding:5px 14px;font-size:12px;color:var(--dim);display:flex;align-items:center;gap:6px;}
.pill b{color:var(--text);}

.timer-bar{display:flex;align-items:center;justify-content:space-between;background:var(--s1);border:1px solid var(--br);border-radius:10px;padding:10px 16px;margin-bottom:1.5rem;}
.timer-val{font-family:'DM Mono',monospace;font-size:1.4rem;color:var(--teal);}
.timer-val.urgent{color:var(--red);animation:blink 1s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}
.prog-bar{flex:1;height:6px;background:var(--br);border-radius:3px;margin:0 16px;overflow:hidden;}
.prog-fill{height:100%;background:var(--teal);border-radius:3px;transition:width .3s;}

.q-card{background:var(--s1);border:1px solid var(--br);border-radius:14px;padding:1.5rem;margin-bottom:1rem;}
.q-meta{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
.q-badge{font-size:10px;padding:2px 8px;border-radius:4px;font-family:'DM Mono',monospace;background:var(--s2);border:1px solid var(--br);color:var(--dim);}
.q-text{font-size:15px;font-weight:500;margin-bottom:1rem;line-height:1.5;}
textarea.rep{width:100%;background:var(--s2);border:1px solid var(--br);border-radius:8px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;padding:10px 14px;resize:vertical;min-height:70px;outline:none;}
textarea.rep:focus{border-color:var(--teal);}
.feedback{display:none;margin-top:10px;border-radius:8px;overflow:hidden;}
.feedback.show{display:block;}
.fb-res{padding:10px 14px;font-size:13px;font-weight:600;}
.fb-res.ok{background:rgba(94,207,177,.1);color:var(--teal);border-left:3px solid var(--teal);}
.fb-res.mid{background:rgba(232,200,122,.1);color:var(--gold);border-left:3px solid var(--gold);}
.fb-res.bad{background:rgba(232,122,122,.1);color:var(--red);border-left:3px solid var(--red);}
.fb-corr{background:var(--s2);padding:10px 14px;font-size:13px;border-top:1px solid var(--br);}
.fb-corr strong{color:var(--gold);display:block;margin-bottom:4px;font-size:11px;}

.resultats{background:var(--s1);border:1px solid var(--br);border-radius:14px;padding:2rem;text-align:center;}
.score-big{font-family:'Syne',sans-serif;font-size:4rem;font-weight:800;margin:1rem 0;}
.score-big.ex{color:var(--teal);}
.score-big.bi{color:var(--gold);}
.score-big.ef{color:var(--red);}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div><h1>⚡ Automatismes <span>Français</span></h1><p>20-10-10 · Évaluation bienveillante</p></div>
    <a href="index.html" class="back-link">← Hub</a>
  </div>

  <div class="eleve-bar">
    <button class="eleve-btn aw" id="btnW" onclick="setEleve('wassil')">🌊 Wassil</button>
    <button class="eleve-btn" id="btnN" onclick="setEleve('nawal')">⚡ Nawal</button>
  </div>

  <div class="phase active" id="phaseSelect">
    <div class="section-title">📚 Choisis tes chapitres</div>
    <div class="chapitres-grid" id="chapGrid"></div>
    <div class="btn-row">
      <button class="btn" onclick="selectAll(true)">✅ Tout sélectionner</button>
      <button class="btn" onclick="selectAll(false)">❌ Tout désélectionner</button>
    </div>
    <div class="info-strip">
      <div class="pill">📚 <b id="nbCartes">0</b> cartes dispo</div>
      <div class="pill">🎯 <b id="nbQuestions">0</b> questions</div>
      <div class="pill">⏱ <b>45 min</b></div>
    </div>
    <button class="btn-primary" id="btnStart" onclick="demarrer()" disabled>🎯 Démarrer</button>
  </div>

  <div class="phase" id="phaseSession">
    <div class="timer-bar">
      <span class="timer-val" id="timerVal">45:00</span>
      <div class="prog-bar"><div class="prog-fill" id="progFill" style="width:0%"></div></div>
      <span id="qCount" style="font-family:'DM Mono',monospace;font-size:13px;color:var(--dim)">Q 0/0</span>
    </div>
    <div id="qArea"></div>
    <div id="fbArea"></div>
    <div id="nextWrap" style="display:none;margin-top:10px"><button class="btn-primary" onclick="suivante()">→ Question suivante</button></div>
  </div>

  <div class="phase" id="phaseRes">
    <div class="resultats">
      <p style="font-family:'Syne',sans-serif;font-weight:700;font-size:13px;color:var(--dim);text-transform:uppercase;letter-spacing:.1em">Session terminée</p>
      <div class="score-big" id="scoreBig">0%</div>
      <div id="scoreDetail" style="font-size:14px;color:var(--dim);margin-bottom:8px"></div>
      <div id="msgFin" style="font-size:15px;color:var(--dim);margin-bottom:1rem"></div>
      <div class="btn-row" style="justify-content:center;margin-top:1rem">
        <button class="btn-primary" onclick="location.reload()">📚 Nouvelle session</button>
        <button class="btn" onclick="window.location.href='suivi-parental.html'">📊 Suivi parental</button>
      </div>
    </div>
  </div>
</div>

<script>
// ==================== 26 CHAPITRES ====================
const CHAPITRES = {
  1:"Classes grammaticales",2:"Fonctions grammaticales",3:"La phrase",4:"Temps et modes verbaux",
  5:"Les accords",6:"Les homophones",7:"Conjugaison",8:"Valeurs des temps",9:"Formation des mots",
  10:"Figures de style",11:"Champs lexicaux",12:"Synonymes, antonymes",13:"Genres littéraires",
  14:"Mouvements littéraires",15:"Registres littéraires",16:"Le récit",17:"La rédaction",
  18:"Contraction de texte",19:"Commentaire composé",20:"Oral : présentation",21:"Oral : expression",
  22:"Oral : échange",23:"Dictée",24:"Grammaire (analyse)",25:"Réécriture",26:"Essai"
};

const CARTES = {
  1:{q:"Quelles sont les 9 classes grammaticales ?",r:"Nom, déterminant, adjectif, pronom, verbe, adverbe, préposition, conjonction, interjection."},
  2:{q:"Qu'est-ce que le COD ?",r:"Complément d'objet direct. Répond à 'quoi ?' ou 'qui ?'"},
  3:{q:"Qu'est-ce qu'une phrase simple ?",r:"Une seule proposition (un verbe)."},
  4:{q:"À quoi sert l'imparfait ?",r:"Description ou habitude dans le passé."},
  5:{q:"Règle d'accord sujet-verbe ?",r:"Le verbe s'accorde en personne et nombre avec le sujet."},
  6:{q:"Différence a/à ?",r:"a = avoir ; à = préposition"},
  7:{q:"Terminaisons du présent (1er groupe) ?",r:"e, es, e, ons, ez, ent"},
  8:{q:"Valeur du présent ?",r:"Actualité, vérité générale, habitude."},
  9:{q:"Qu'est-ce qu'un préfixe ?",r:"Élément avant le radical (re-, in-, dé-)."},
  10:{q:"Qu'est-ce qu'une métaphore ?",r:"Analogie sans outil."},
  11:{q:"Qu'est-ce qu'un champ lexical ?",r:"Ensemble des mots liés à un même thème."},
  12:{q:"Qu'est-ce qu'un synonyme ?",r:"Mot de sens proche."},
  13:{q:"Citez 4 genres littéraires.",r:"Roman, théâtre, poésie, argumentation."},
  14:{q:"Mouvement du XVIIIe siècle ?",r:"Les Lumières."},
  15:{q:"Registre comique ?",r:"Provoque le rire."},
  16:{q:"Étapes du schéma narratif ?",r:"SI → perturbateur → péripéties → résolution → SF."},
  17:{q:"Structure d'une introduction ?",r:"Amorce, présentation, problématique, annonce du plan."},
  18:{q:"Règle d'or de la contraction ?",r:"Ne pas commenter, ne pas juger."},
  19:{q:"Structure du commentaire ?",r:"Introduction, développement (2-3 axes), conclusion."},
  20:{q:"Durée de l'oral du brevet ?",r:"5 min exposé + 10 min échange."},
  21:{q:"Posture à l'oral ?",r:"Debout, gestes naturels, regarder le jury."},
  22:{q:"Que faire si on ne sait pas ?",r:"L'admettre honnêtement."},
  23:{q:"Que vérifier en priorité dans une dictée ?",r:"Accords, homophones, terminaisons."},
  24:{q:"Différence nature/fonction ?",r:"Nature = classe grammaticale, fonction = rôle."},
  25:{q:"Changer 'je' en 'nous' ?",r:"Verbe à la 1ère personne du pluriel."},
  26:{q:"Structure de l'essai ?",r:"Introduction, développement (thèse/antithèse), conclusion."}
};

let eleve = 'wassil';
let sessionCartes = [], idx = 0, score = { ok: 0, total: 0 };
let timerInt = null, tps = 45*60;

// Stockage des erreurs pour spaced repetition
let erreurs = {};

function setEleve(e) {
  eleve = e;
  document.getElementById('btnW').className = 'eleve-btn' + (e==='wassil' ? ' aw' : '');
  document.getElementById('btnN').className = 'eleve-btn' + (e==='nawal' ? ' an' : '');
  chargerErreurs();
}

function chargerErreurs() {
  const saved = localStorage.getItem(`auto_fr_erreurs_${eleve}`);
  if (saved) erreurs = JSON.parse(saved);
  else erreurs = {};
}

function sauverErreurs() {
  localStorage.setItem(`auto_fr_erreurs_${eleve}`, JSON.stringify(erreurs));
}

function buildGrid() {
  const g = document.getElementById('chapGrid');
  g.innerHTML = '';
  for (let i=1; i<=26; i++) {
    const d = document.createElement('div');
    d.className = 'ch-item';
    d.id = 'ci'+i;
    d.onclick = () => { d.classList.toggle('selected'); updateInfo(); };
    d.innerHTML = `<span class="ch-num">${i}.</span><span style="font-size:12px">${CHAPITRES[i]}</span>`;
    g.appendChild(d);
  }
  updateInfo();
}

function getSelected() {
  return Array.from(document.querySelectorAll('#chapGrid .ch-item.selected')).map(el => parseInt(el.id.replace('ci','')));
}

function updateInfo() {
  const sel = getSelected();
  let totalCartes = sel.length;
  document.getElementById('nbCartes').textContent = totalCartes;
  document.getElementById('nbQuestions').textContent = Math.min(40, totalCartes * 3);
  document.getElementById('btnStart').disabled = sel.length === 0;
}

function selectAll(v) { for(let i=1;i<=26;i++) document.getElementById('ci'+i)?.classList.toggle('selected', v); updateInfo(); }

function melanger(arr) { for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];} return arr; }

// ÉVALUATION BIENVEILLANTE : seuil à 40% pour valider
function evaluerBienveillant(reponse, attendue) {
  if (!reponse || reponse.trim().length < 2) return { valide: false, taux: 0, message: "Écris une réponse." };
  const rep = reponse.toLowerCase().trim();
  const att = attendue.toLowerCase();
  
  if (rep === att) return { valide: true, taux: 100, message: "Parfait !" };
  
  // Raccourcis spécifiques
  if (rep === "e es e ons ez ent" || rep === "e,es,e,ons,ez,ent") return { valide: true, taux: 100, message: "Parfait !" };
  if (rep === "habitude" && att.includes("habitude")) return { valide: true, taux: 85, message: "Bien !" };
  if (rep === "habituel" && att.includes("habitude")) return { valide: true, taux: 85, message: "Bien !" };
  if (rep === "preposition" && att.includes("préposition")) return { valide: true, taux: 80, message: "Bien !" };
  if (rep === "verbe" && att.includes("avoir")) return { valide: false, taux: 30, message: "Presque ! a = avoir, à = préposition" };
  
  // Mots-clés
  const motsAtt = att.split(/[\s,;.]+/).filter(m => m.length > 3);
  const motsRep = rep.split(/[\s,;.]+/);
  let trouve = 0;
  for (let ma of motsAtt) {
    for (let mr of motsRep) {
      if (mr.includes(ma.substring(0,3)) || ma.includes(mr.substring(0,3))) { trouve++; break; }
    }
  }
  let taux = motsAtt.length ? Math.round(trouve / motsAtt.length * 100) : 50;
  
  // SEUIL BIENVEILLANT : 40% au lieu de 60%
  if (taux >= 40) return { valide: true, taux: taux, message: taux >= 70 ? "Bien !" : "Presque ! Relis la correction." };
  return { valide: false, taux: taux, message: "À retravailler." };
}

// RÈGLE 20/10/10
function getQuestionsRatees(limit = 10) {
  const ratees = Object.entries(erreurs).filter(([,count]) => count >= 1)
    .sort((a,b) => b[1] - a[1]).slice(0, limit);
  return ratees.map(([id]) => {
    const parts = id.split('_');
    const ch = parseInt(parts[0]);
    return { ...CARTES[ch], ch: ch, chTitre: CHAPITRES[ch], id: id };
  });
}

function getQuestionsRevision(selected, limit = 10) {
  const toutes = Object.entries(CARTES).map(([ch, c]) => ({ ...c, ch: parseInt(ch), chTitre: CHAPITRES[ch] }));
  const autres = toutes.filter(c => !selected.includes(c.ch));
  return melanger(autres).slice(0, limit);
}

function genererSession(selected) {
  chargerErreurs();
  
  // CAS PARTICULIER : si seuls les 3 premiers chapitres sont sélectionnés
  const onlyThreeFirst = selected.length === 3 && selected.includes(1) && selected.includes(2) && selected.includes(3);
  
  if (onlyThreeFirst) {
    // Prendre 20 cartes aléatoires parmi les 3 premiers chapitres
    const cartesCh1 = CARTES[1] ? [{ ...CARTES[1], ch: 1, chTitre: CHAPITRES[1] }] : [];
    const cartesCh2 = CARTES[2] ? [{ ...CARTES[2], ch: 2, chTitre: CHAPITRES[2] }] : [];
    const cartesCh3 = CARTES[3] ? [{ ...CARTES[3], ch: 3, chTitre: CHAPITRES[3] }] : [];
    let toutes = [...cartesCh1, ...cartesCh2, ...cartesCh3];
    if (toutes.length === 0) return [];
    let session = melanger([...toutes]);
    while (session.length < 20 && toutes.length > 0) session.push(...melanger([...toutes]).slice(0, 5));
    return melanger(session).slice(0, 20);
  }
  
  // RÈGLE 20/10/10 NORMALE
  const principales = selected.flatMap(ch => CARTES[ch] ? [{ ...CARTES[ch], ch: ch, chTitre: CHAPITRES[ch] }] : []);
  const vingt = melanger([...principales]).slice(0, 20);
  const dixRatees = getQuestionsRatees(10);
  const dixRevision = getQuestionsRevision(selected, 10);
  
  let session = [...vingt, ...dixRatees, ...dixRevision];
  const ids = new Set();
  session = session.filter(c => { if (ids.has(c.q)) return false; ids.add(c.q); return true; });
  return melanger(session);
}

function demarrer() {
  const sel = getSelected();
  if (sel.length === 0) return;
  sessionCartes = genererSession(sel);
  if (sessionCartes.length === 0) return;
  idx = 0; score = { ok: 0, total: sessionCartes.length };
  tps = 45*60;
  showPhase('phaseSession');
  startTimer();
  afficherQuestion();
}

function afficherQuestion() {
  if (idx >= sessionCartes.length) { terminer(); return; }
  const c = sessionCartes[idx];
  const pct = Math.round(idx / sessionCartes.length * 100);
  document.getElementById('progFill').style.width = pct + '%';
  document.getElementById('qCount').textContent = `Q ${idx+1}/${sessionCartes.length}`;
  document.getElementById('qArea').innerHTML = `
    <div class="q-card">
      <div class="q-meta"><span class="q-badge">${c.chTitre}</span></div>
      <div class="q-text">${c.q}</div>
      <textarea class="rep" id="repIn" placeholder="Écris ta réponse..." rows="3"></textarea>
      <div class="btn-row" style="margin-top:10px"><button class="btn-primary" onclick="valider()">✔ Vérifier</button></div>
    </div>`;
  document.getElementById('fbArea').innerHTML = '';
  document.getElementById('nextWrap').style.display = 'none';
  setTimeout(() => document.getElementById('repIn')?.focus(), 100);
}

function valider() {
  const rep = document.getElementById('repIn')?.value.trim();
  if (!rep) { alert("Écris une réponse."); return; }
  const c = sessionCartes[idx];
  const ev = evaluerBienveillant(rep, c.r);
  if (ev.valide) score.ok++;
  score.total++;
  
  // Gestion des erreurs pour spaced repetition
  const id = `${c.ch}_${c.q.substring(0,30)}`;
  if (!ev.valide) {
    erreurs[id] = (erreurs[id] || 0) + 1;
  } else if (erreurs[id]) {
    erreurs[id] = Math.max(0, erreurs[id] - 1);
    if (erreurs[id] === 0) delete erreurs[id];
  }
  sauverErreurs();
  
  const cls = ev.taux >= 50 ? 'ok' : (ev.taux >= 30 ? 'mid' : 'bad');
  const ico = ev.taux >= 50 ? '✅' : (ev.taux >= 30 ? '⚠️' : '❌');
  document.getElementById('fbArea').innerHTML = `
    <div class="feedback show">
      <div class="fb-res ${cls}">${ico} ${ev.message} — ${ev.taux}%</div>
      <div class="fb-corr"><strong>📖 Réponse attendue</strong>${c.r}</div>
    </div>`;
  idx++;
  document.getElementById('nextWrap').style.display = 'block';
  const btn = document.querySelector('#qArea .btn-primary');
  if (btn) btn.disabled = true;
}

function suivante() {
  document.getElementById('nextWrap').style.display = 'none';
  afficherQuestion();
}

function startTimer() {
  clearInterval(timerInt);
  timerInt = setInterval(() => {
    if (tps <= 0) { clearInterval(timerInt); terminer(); return; }
    tps--;
    const m = Math.floor(tps/60), s = tps%60;
    const el = document.getElementById('timerVal');
    if (el) {
      el.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
      el.className = 'timer-val' + (tps < 300 ? ' urgent' : '');
    }
  }, 1000);
}

function terminer() {
  clearInterval(timerInt);
  const pct = score.total > 0 ? Math.round(score.ok / score.total * 100) : 0;
  const chapitresNoms = getSelected().map(n => CHAPITRES[n]);
  
  // Sauvegarde pour suivi-parental.html
  const keyP = `suivi_sessions_francais_${eleve}`;
  const sessionsExist = JSON.parse(localStorage.getItem(keyP) || '[]');
  sessionsExist.unshift({
    id: Date.now(), date: new Date().toISOString(),
    chapitres: chapitresNoms, score: { bonnes: score.ok, total: score.total },
    pourcentage: pct
  });
  localStorage.setItem(keyP, JSON.stringify(sessionsExist.slice(0, 200)));
  
  // Sauvegarde locale
  const keyL = `auto_fr_sessions_${eleve}`;
  const localSessions = JSON.parse(localStorage.getItem(keyL) || '[]');
  localSessions.unshift({ id: Date.now(), date: new Date().toISOString(),
    eleve, score: score.ok, total: score.total, pourcentage: pct, chapitres: chapitresNoms });
  localStorage.setItem(keyL, JSON.stringify(localSessions.slice(0, 100)));
  
  showPhase('phaseRes');
  const cls = pct >= 70 ? 'ex' : (pct >= 50 ? 'bi' : 'ef');
  const msg = pct >= 70 ? '🌟 Excellent !' : (pct >= 50 ? '👍 Bien joué !' : (pct >= 30 ? '💪 Courage !' : '📚 Continue à t\'entraîner.'));
  document.getElementById('scoreBig').className = 'score-big ' + cls;
  document.getElementById('scoreBig').textContent = pct + '%';
  document.getElementById('scoreDetail').textContent = `${score.ok} bonnes réponses sur ${score.total}`;
  document.getElementById('msgFin').textContent = msg;
}

function showPhase(id) {
  ['phaseSelect','phaseSession','phaseRes'].forEach(p => {
    document.getElementById(p).className = 'phase' + (p === id ? ' active' : '');
  });
}

buildGrid();
updateInfo();
chargerErreurs();
</script>
