<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>⚡ Automatismes – Français</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:#000000;font-family:'DM Sans',sans-serif;padding:1rem;color:#ffffff;}
    .container{max-width:1000px;margin:0 auto;background:#1a1a1a;border-radius:2rem;padding:1.5rem;border:1px solid #ffcc00;}
    h1{font-family:'Playfair Display',serif;font-size:1.8rem;color:#ffcc00;margin-bottom:0.25rem;}
    .sub{color:#aaa;margin-bottom:1rem;border-left:3px solid #ffcc00;padding-left:1rem;font-size:0.8rem;}
    .info-bar{background:#2a2a2a;border-radius:1rem;padding:0.8rem;margin-bottom:1rem;display:flex;justify-content:space-between;flex-wrap:wrap;gap:0.5rem;}
    .timer{font-family:'DM Mono',monospace;font-size:1.2rem;color:#ffcc00;}
    .eleve-bar{display:flex;gap:10px;margin-bottom:1.5rem;background:#2a2a2a;border-radius:50px;padding:5px;width:fit-content;}
    .eleve-btn{padding:8px 24px;border-radius:50px;border:none;cursor:pointer;font-weight:700;font-size:13px;background:transparent;color:#aaa;}
    .eleve-btn.aw{background:#7eb8f5;color:#000;}
    .eleve-btn.an{background:#f59eb8;color:#000;}
    .chapitres-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;max-height:320px;overflow-y:auto;padding:8px;background:#2a2a2a;border-radius:1rem;margin-bottom:1rem;}
    .ch-item{display:flex;align-items:center;gap:8px;background:#111118;border:1px solid #333;border-radius:8px;padding:8px 12px;cursor:pointer;}
    .ch-item.selected{border-color:#ffcc00;background:rgba(255,204,0,0.1);}
    .ch-num{font-family:'DM Mono',monospace;font-size:10px;color:#aaa;min-width:28px;}
    button{background:#1e2a3e;border:1px solid #5ecfb1;border-radius:40px;padding:8px 16px;font-size:12px;color:#5ecfb1;cursor:pointer;}
    .btn-primary{background:#ffcc00;border-color:#ffcc00;color:#000;font-weight:700;}
    .btn-primary:disabled{opacity:0.4;}
    .question-card{background:#2a2a2a;border-radius:1.5rem;padding:1.5rem;margin-bottom:1rem;}
    textarea{width:100%;min-height:100px;background:#0a0a0f;border:1px solid #333;border-radius:1rem;padding:10px;color:white;resize:vertical;}
    .feedback{background:#0a0a0f;border-radius:1rem;padding:8px;margin-top:8px;display:none;}
    .feedback.show{display:block;}
    .reponse-modele{background:#1a2a1a;border-left:3px solid #ffcc00;padding:8px;margin-top:8px;border-radius:8px;}
    .resultats{background:#0a0a0f;border-radius:1rem;padding:1rem;text-align:center;}
    .stats{background:#2a2a2a;border-radius:1rem;padding:8px;margin-bottom:1rem;display:flex;justify-content:space-between;}
    .back-link{display:inline-block;margin-top:1rem;color:#5ecfb1;text-decoration:none;}
  </style>
</head>
<body>
<div class="container">
  <h1>⚡ Automatismes – Français</h1>
  <div class="sub">Choisis tes chapitres • Questions adaptées</div>

  <div class="eleve-bar">
    <button id="btnW" class="eleve-btn aw">🌊 Wassil</button>
    <button id="btnN" class="eleve-btn">⚡ Nawal</button>
  </div>

  <div class="stats">
    <span>📚 <b id="nbCartes">0</b> cartes</span>
    <span>✅ <b id="nbMaitrisees">0</b> maîtrisées</span>
    <span>📈 <b id="nbProgress">0</b>%</span>
  </div>

  <div class="chapitres-grid" id="chapitresGrid"></div>

  <div class="btn-row" style="display:flex; gap:8px; margin-bottom:1rem;">
    <button id="selectAll">✅ Tout sélectionner</button>
    <button id="deselectAll">❌ Tout désélectionner</button>
  </div>

  <button id="demarrer" class="btn-primary" disabled>🎯 Démarrer la session</button>

  <div id="sessionArea" style="display:none; margin-top:1rem;">
    <div class="info-bar"><span>⏱️ <span id="timer">45:00</span></span><span id="qCount">Q 0/0</span></div>
    <div id="questionArea"></div>
    <div id="sessionStats" class="progress" style="background:#2a2a2a; padding:8px; margin-top:8px; text-align:center;"></div>
  </div>

  <div id="resultatsArea" class="resultats" style="display:none; margin-top:1rem;"></div>

  <a href="index.html" class="back-link">← Retour au hub</a>
</div>

<script>
// ==================== CARTES (identiques à flashcards-francais.html) ====================
const CHAPITRES = {
  1: { titre: "Classes grammaticales", cartes: [
    { q: "Quelles sont les 9 classes grammaticales ?", r: "Nom, déterminant, adjectif, pronom, verbe, adverbe, préposition, conjonction, interjection." },
    { q: "Donnez 3 déterminants.", r: "le, la, les / un, une, des / mon, ton, son" },
    { q: "Citez les 7 conjonctions de coordination.", r: "Mais, ou, et, donc, or, ni, car." },
    { q: "Différence entre adverbe et préposition ?", r: "Adverbe modifie un verbe/adjectif. Préposition introduit un complément." }
  ]},
  2: { titre: "Fonctions grammaticales", cartes: [
    { q: "Qu'est-ce que le COD ?", r: "Complément d'objet direct. Répond à 'quoi ?' ou 'qui ?'" },
    { q: "Qu'est-ce que le COI ?", r: "Complément d'objet indirect. Répond à 'à qui ?' ou 'de quoi ?'" },
    { q: "Qu'est-ce que l'attribut du sujet ?", r: "Donne une qualité au sujet, relié par verbe d'état" },
    { q: "Qu'est-ce qu'un complément circonstanciel de temps ?", r: "Indique quand l'action se passe" }
  ]},
  3: { titre: "La phrase", cartes: [
    { q: "Qu'est-ce qu'une phrase simple ?", r: "Une seule proposition (un verbe)" },
    { q: "Qu'est-ce qu'une phrase complexe ?", r: "Plusieurs propositions" },
    { q: "Qu'est-ce qu'une proposition indépendante ?", r: "Ne dépend d'aucune autre" },
    { q: "Qu'est-ce qu'une subordonnée relative ?", r: "Introduite par qui, que, dont, où" }
  ]}
};

for (let i = 4; i <= 26; i++) {
  CHAPITRES[i] = { titre: "Chapitre " + i, cartes: [
    { q: "Question 1 du chapitre " + i, r: "Réponse 1" },
    { q: "Question 2 du chapitre " + i, r: "Réponse 2" },
    { q: "Question 3 du chapitre " + i, r: "Réponse 3" },
    { q: "Question 4 du chapitre " + i, r: "Réponse 4" }
  ]};
}

// ==================== ÉTAT ====================
let eleve = 'wassil';
let progression = {};
let sessionCartes = [];
let currentIndex = 0;
let sessionScore = { bonnes: 0, total: 0 };
let timerInterval = null;
let tempsRestant = 45 * 60;

function getStorageKey() { return `auto_fr_${eleve}`; }
function saveProgress() { localStorage.setItem(getStorageKey(), JSON.stringify(progression)); }
function loadProgress() {
  const saved = localStorage.getItem(getStorageKey());
  progression = saved ? JSON.parse(saved) : {};
}

function getCardKey(c) { return `${c.chapitre}_${c.q.substring(0,30)}`; }
function getScore(cardId) { return progression[cardId]?.score || 0; }
function setScore(cardId, val) { progression[cardId] = { score: Math.min(3, val), date: new Date().toISOString() }; saveProgress(); }

// ==================== INTERFACE ====================
function setEleve(e) {
  eleve = e;
  const btnW = document.getElementById('btnW');
  const btnN = document.getElementById('btnN');
  if (e === 'wassil') {
    btnW.className = 'eleve-btn aw';
    btnN.className = 'eleve-btn';
  } else {
    btnN.className = 'eleve-btn an';
    btnW.className = 'eleve-btn';
  }
  loadProgress();
  updateStats();
}

function getSelected() {
  const selected = [];
  for (let i = 1; i <= 26; i++) {
    const el = document.getElementById(`ch_${i}`);
    if (el && el.classList.contains('selected')) selected.push(i);
  }
  return selected;
}

function getAllCartes() {
  const selected = getSelected();
  const cartes = [];
  for (let ch of selected) {
    for (let c of CHAPITRES[ch].cartes) {
      cartes.push({ ...c, chapitre: ch, chapitreTitre: CHAPITRES[ch].titre });
    }
  }
  return cartes;
}

function updateStats() {
  const cartes = getAllCartes();
  let maitrisees = 0;
  for (let c of cartes) {
    if (getScore(getCardKey(c)) >= 3) maitrisees++;
  }
  const pct = cartes.length ? Math.round(maitrisees / cartes.length * 100) : 0;
  document.getElementById('nbCartes').textContent = cartes.length;
  document.getElementById('nbMaitrisees').textContent = maitrisees;
  document.getElementById('nbProgress').textContent = pct + '%';
  document.getElementById('demarrer').disabled = cartes.length === 0;
}

function buildGrid() {
  const grid = document.getElementById('chapitresGrid');
  grid.innerHTML = '';
  for (let i = 1; i <= 26; i++) {
    const div = document.createElement('div');
    div.className = 'ch-item';
    div.id = `ch_${i}`;
    div.onclick = () => { div.classList.toggle('selected'); updateStats(); };
    div.innerHTML = `<span class="ch-num">${i}</span><span>${CHAPITRES[i].titre}</span>`;
    grid.appendChild(div);
  }
}

// ==================== GÉNÉRATION SESSION ====================
function melanger(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function genererSession() {
  const toutes = getAllCartes();
  const uniques = [];
  const seen = new Set();
  for (let c of toutes) {
    if (!seen.has(c.q)) { seen.add(c.q); uniques.push(c); }
  }
  if (uniques.length <= 20) return melanger(uniques);
  
  const nouvelles = uniques.filter(c => getScore(getCardKey(c)) === 0).slice(0, 20);
  const erreurs = uniques.filter(c => getScore(getCardKey(c)) > 0 && getScore(getCardKey(c)) < 3).slice(0, 10);
  const revision = uniques.filter(c => getScore(getCardKey(c)) >= 3).slice(0, 10);
  let session = [...nouvelles, ...erreurs, ...revision];
  const ids = new Set();
  session = session.filter(c => { const k = getCardKey(c); if (ids.has(k)) return false; ids.add(k); return true; });
  return melanger(session);
}

// ==================== ÉVALUATION ====================
function evaluer(reponse, attendue) {
  if (!reponse || reponse.length < 2) return { ok: false, taux: 0, msg: "Écris une réponse." };
  const r = reponse.toLowerCase().trim();
  const a = attendue.toLowerCase();
  if (r === a) return { ok: true, taux: 100, msg: "Parfait !" };
  const motsA = a.split(/[\s,;.]+/).filter(m => m.length > 3);
  const motsR = r.split(/[\s,;.]+/);
  let trouve = 0;
  for (let ma of motsA) {
    for (let mr of motsR) {
      if (mr.includes(ma.substring(0,3)) || ma.includes(mr.substring(0,3))) { trouve++; break; }
    }
  }
  let taux = motsA.length ? Math.round(trouve / motsA.length * 100) : 50;
  if (taux >= 40) return { ok: true, taux: taux, msg: taux >= 70 ? "Bien !" : "Presque !" };
  return { ok: false, taux: taux, msg: "À retravailler." };
}

// ==================== SESSION ====================
function startTimer() {
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    if (tempsRestant <= 0) { clearInterval(timerInterval); terminer(); return; }
    tempsRestant--;
    const m = Math.floor(tempsRestant / 60), s = tempsRestant % 60;
    document.getElementById('timer').textContent = `${m}:${s.toString().padStart(2,'0')}`;
  }, 1000);
}

function afficherQuestion() {
  if (currentIndex >= sessionCartes.length) { terminer(); return; }
  const c = sessionCartes[currentIndex];
  document.getElementById('questionArea').innerHTML = `
    <div class="question-card">
      <div style="font-size:0.7rem;color:#aaa;">${c.chapitreTitre}</div>
      <div class="question-text" style="margin-top:8px;">📖 ${c.q}</div>
      <textarea id="reponse" rows="3" placeholder="Écris ta réponse..."></textarea>
      <button id="valider" style="margin-top:8px;">✔ Vérifier</button>
      <div id="feedback" class="feedback"></div>
    </div>
  `;
  document.getElementById('valider').onclick = () => verifierReponse();
  document.getElementById('reponse').focus();
  document.getElementById('qCount').textContent = `Q ${currentIndex+1}/${sessionCartes.length}`;
}

function verifierReponse() {
  const rep = document.getElementById('reponse').value.trim();
  if (!rep) { alert("Écris une réponse."); return; }
  const c = sessionCartes[currentIndex];
  const ev = evaluer(rep, c.r);
  if (ev.ok) sessionScore.bonnes++;
  sessionScore.total++;
  
  const key = getCardKey(c);
  let score = getScore(key);
  if (ev.ok) score = Math.min(score + 1, 3);
  else score = Math.max(0, score - 1);
  setScore(key, score);
  
  const fb = document.getElementById('feedback');
  fb.innerHTML = ev.ok 
    ? `<span style="color:#2ecc71;">✅ ${ev.msg} (${ev.taux}%)</span><div class="reponse-modele">📖 ${c.r}</div>`
    : `<span style="color:#ffcc00;">⚠️ ${ev.msg} (${ev.taux}%)</span><div class="reponse-modele">📖 ${c.r}</div>`;
  fb.classList.add('show');
  currentIndex++;
  setTimeout(() => afficherQuestion(), 1800);
}

function terminer() {
  clearInterval(timerInterval);
  const pct = sessionScore.total ? Math.round(sessionScore.bonnes / sessionScore.total * 100) : 0;
  const chapitres = getSelected().map(n => CHAPITRES[n].titre);
  
  // Envoi vers suivi-parental
  const keyP = `suivi_sessions_francais_${eleve}`;
  const sessions = JSON.parse(localStorage.getItem(keyP) || '[]');
  sessions.unshift({ id: Date.now(), date: new Date().toISOString(), chapitres: chapitres, score: { bonnes: sessionScore.bonnes, total: sessionScore.total }, pourcentage: pct });
  localStorage.setItem(keyP, JSON.stringify(sessions.slice(0, 200)));
  
  document.getElementById('sessionArea').style.display = 'none';
  const ra = document.getElementById('resultatsArea');
  ra.style.display = 'block';
  ra.innerHTML = `<h3>🎉 Session terminée !</h3><p style="font-size:2rem;">${sessionScore.bonnes}/${sessionScore.total}</p><p>Soit ${pct}%</p><p>👤 ${eleve === 'wassil' ? 'Wassil' : 'Nawal'}<br>📖 ${chapitres.join(', ')}</p><button id="reload" class="btn-primary">📚 Nouvelle session</button>`;
  document.getElementById('reload').onclick = () => location.reload();
}

function demarrer() {
  sessionCartes = genererSession();
  if (!sessionCartes.length) { alert("Sélectionne des chapitres."); return; }
  currentIndex = 0;
  sessionScore = { bonnes: 0, total: sessionCartes.length };
  tempsRestant = 45 * 60;
  document.getElementById('chapitresGrid').parentElement.style.display = 'none';
  document.getElementById('selectAll').style.display = 'none';
  document.getElementById('deselectAll').style.display = 'none';
  document.getElementById('demarrer').style.display = 'none';
  document.getElementById('sessionArea').style.display = 'block';
  startTimer();
  afficherQuestion();
}

// ==================== INIT ====================
document.getElementById('btnW').onclick = () => setEleve('wassil');
document.getElementById('btnN').onclick = () => setEleve('nawal');
document.getElementById('selectAll').onclick = () => { document.querySelectorAll('#chapitresGrid .ch-item').forEach(el => el.classList.add('selected')); updateStats(); };
document.getElementById('deselectAll').onclick = () => { document.querySelectorAll('#chapitresGrid .ch-item').forEach(el => el.classList.remove('selected')); updateStats(); };
document.getElementById('demarrer').onclick = demarrer;

buildGrid();
loadProgress();
updateStats();
setEleve('wassil');
</script>
</body>
</html>
