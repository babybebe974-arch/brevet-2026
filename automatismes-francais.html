<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚡ Automatismes – Français</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#000;font-family:'DM Sans',sans-serif;padding:1rem;color:#fff;}
.container{max-width:1000px;margin:0 auto;background:#1a1a1a;border-radius:2rem;padding:1.5rem;border:1px solid #ffcc00;}
h1{font-family:'Playfair Display',serif;font-size:1.8rem;color:#ffcc00;}
.sub{color:#aaa;margin-bottom:1rem;border-left:3px solid #ffcc00;padding-left:1rem;}
.choix-eleve{background:#2a2a2a;border-radius:1rem;padding:1rem;margin-bottom:1.5rem;text-align:center;}
.choix-eleve button{padding:0.5rem 1.5rem;margin:0 0.5rem;border-radius:40px;cursor:pointer;font-weight:600;border:none;font-size:1rem;}
.btn-wassil{background:#7eb8f5;color:#000;}
.btn-nawal{background:#f59eb8;color:#000;}
.btn-wassil.active{background:#3a6ea5;color:#fff;border:2px solid #fff;}
.btn-nawal.active{background:#c06a8a;color:#fff;border:2px solid #fff;}
.chapitres-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:0.5rem;max-height:300px;overflow-y:auto;padding:0.5rem;background:#2a2a2a;border-radius:1rem;margin-bottom:1rem;}
.chapitre-check{display:flex;align-items:center;gap:0.5rem;font-size:0.75rem;padding:0.3rem;}
button{background:#1e2a3e;border:1px solid #5ecfb1;border-radius:40px;padding:0.5rem 1.2rem;color:#5ecfb1;cursor:pointer;}
.btn-primary{background:#ffcc00;border-color:#ffcc00;color:#000;font-weight:700;}
.btn-group{display:flex;gap:1rem;justify-content:center;margin:1rem 0;}
.resultats{background:#0a0a0f;border-radius:1rem;padding:1rem;margin-top:1rem;text-align:center;}
.back-link{display:inline-block;margin-top:1rem;color:#5ecfb1;text-decoration:none;}
.info-bar{background:#2a2a2a;border-radius:1rem;padding:0.8rem;margin-bottom:1rem;display:flex;justify-content:space-between;}
.question-card{background:#2a2a2a;border-radius:1.5rem;padding:1.5rem;margin-bottom:1rem;}
.question-text{font-size:1rem;margin-bottom:1rem;font-weight:500;}
textarea{width:100%;min-height:100px;background:#0a0a0f;border:1px solid #333;border-radius:1rem;padding:0.8rem;color:white;font-family:'DM Sans',sans-serif;resize:vertical;}
.feedback{background:#0a0a0f;border-radius:1rem;padding:0.6rem;margin-top:0.5rem;font-size:0.75rem;display:none;}
.feedback.show{display:block;}
.reponse-modele{background:#1a2a1a;border-left:3px solid #ffcc00;padding:0.5rem;margin-top:0.5rem;border-radius:0.5rem;}
.progress{background:#2a2a2a;border-radius:1rem;padding:0.8rem;margin-top:1rem;font-size:0.75rem;text-align:center;}
</style>
</head>
<body>
<div class="container">
  <h1>⚡ Automatismes – Français</h1>
  <div class="sub">Choisis ton prénom et tes chapitres</div>
  
  <!-- SÉLECTION DE L'ÉLÈVE (sans span en trop) -->
  <div class="choix-eleve">
    <p style="margin-bottom:0.5rem;">👤 Qui travaille ?</p>
    <button id="btnWassil" class="btn-wassil active">🌊 Wassil</button>
    <button id="btnNawal" class="btn-nawal">⚡ Nawal</button>
  </div>

  <div class="info-bar">
    <span>📅 Session <span id="sessionDate">--</span></span>
    <span class="timer" id="timer">⏱️ 45:00</span>
  </div>

  <div id="chapitreSelector">
    <div class="chapitres-grid" id="chapitresGrid">
      <!-- Les chapitres seront générés par JS -->
    </div>
    <div class="btn-group">
      <button id="selectAllBtn">✅ Tout sélectionner</button>
      <button id="deselectAllBtn">❌ Tout désélectionner</button>
    </div>
    <div class="btn-group">
      <button id="demarrerBtn" class="btn-primary">🎯 Démarrer la session (10 questions)</button>
    </div>
  </div>

  <div id="sessionArea" style="display:none;">
    <div id="questionArea"></div>
    <div id="sessionStats" class="progress"></div>
  </div>

  <div id="resultatsArea" class="resultats" style="display:none;"></div>

  <a href="index.html" class="back-link">← Retour au hub</a>
</div>

<script>
// ==================== FLASHCARDS ====================
const FLASHCARDS = {
  1: { titre: "Classes grammaticales", cartes: [
    { id: "f1_1", q: "Qu'est-ce qu'une phrase simple ?", r: "Une phrase avec un seul verbe conjugué." },
    { id: "f1_2", q: "Qu'est-ce qu'une phrase complexe ?", r: "Une phrase avec plusieurs verbes conjugués." }
  ]},
  2: { titre: "Fonctions grammaticales", cartes: [
    { id: "f2_1", q: "Qu'est-ce que le COD ?", r: "Complément d'objet direct. Répond à 'quoi ?' ou 'qui ?'" }
  ]},
  3: { titre: "La phrase", cartes: [
    { id: "f3_1", q: "Donnez un exemple de phrase simple.", r: "Je mange une pomme." }
  ]}
};

const TOUTES_CARTES = [];
for (const ch in FLASHCARDS) {
  for (const c of FLASHCARDS[ch].cartes) {
    TOUTES_CARTES.push({ ...c, chapitre: parseInt(ch), chapitreTitre: FLASHCARDS[ch].titre });
  }
}

const CHAPITRES_LISTE = Object.keys(FLASHCARDS).map(n => ({ numero: parseInt(n), titre: FLASHCARDS[n].titre }));

let currentEleve = "Wassil";
let sessionCartes = [];
let sessionIndex = 0;
let sessionScore = { bonnes: 0, total: 0 };
let currentCard = null;

function setEleve(eleve) {
  currentEleve = eleve;
  const btnW = document.getElementById("btnWassil");
  const btnN = document.getElementById("btnNawal");
  if (eleve === "Wassil") {
    btnW.classList.add("active");
    btnN.classList.remove("active");
  } else {
    btnN.classList.add("active");
    btnW.classList.remove("active");
  }
}

function afficherChapitres() {
  const grid = document.getElementById("chapitresGrid");
  grid.innerHTML = "";
  for (const ch of CHAPITRES_LISTE) {
    const div = document.createElement("div");
    div.className = "chapitre-check";
    div.innerHTML = `<input type="checkbox" id="ch_${ch.numero}" value="${ch.numero}"><label for="ch_${ch.numero}">${ch.numero}. ${ch.titre}</label>`;
    grid.appendChild(div);
  }
}

function getChapitresSelectionnes() {
  const cbs = document.querySelectorAll("#chapitresGrid input:checked");
  return Array.from(cbs).map(cb => parseInt(cb.value));
}

function melanger(tab) {
  for (let i = tab.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [tab[i], tab[j]] = [tab[j], tab[i]];
  }
  return tab;
}

function genererSession(chapitresChoisis) {
  const cartesChoisies = TOUTES_CARTES.filter(c => chapitresChoisis.includes(c.chapitre));
  return melanger([...cartesChoisies]).slice(0, 10);
}

function evaluerReponse(reponse, attendue) {
  const motsAttendus = attendue.toLowerCase().split(/\s+/).filter(m => m.length > 3);
  const motsEleve = reponse.toLowerCase().split(/\s+/);
  let trouves = 0;
  for (const mot of motsAttendus) {
    if (motsEleve.some(m => m.includes(mot) || mot.includes(m))) trouves++;
  }
  const taux = motsAttendus.length > 0 ? Math.round(trouves / motsAttendus.length * 100) : 100;
  return { valide: taux >= 50, taux: taux };
}

function afficherQuestion() {
  if (sessionIndex >= sessionCartes.length) {
    terminerSession();
    return;
  }
  currentCard = sessionCartes[sessionIndex];
  const qa = document.getElementById("questionArea");
  qa.innerHTML = `
    <div class="question-card">
      <div class="question-text">📖 ${currentCard.q}</div>
      <textarea id="reponseInput" rows="3" placeholder="Écris ta réponse..."></textarea>
      <div class="btn-group"><button id="validerBtn">✔️ Vérifier</button></div>
      <div id="feedback" class="feedback"></div>
    </div>
  `;
  document.getElementById("validerBtn").onclick = () => verifierReponse();
  document.getElementById("reponseInput").focus();
  document.getElementById("sessionStats").innerHTML = `📌 Question ${sessionIndex+1}/${sessionCartes.length} · Élève: ${currentEleve}`;
}

function verifierReponse() {
  const reponse = document.getElementById("reponseInput")?.value.trim();
  if (!reponse) { alert("Écris une réponse."); return; }
  const ev = evaluerReponse(reponse, currentCard.r);
  if (ev.valide) sessionScore.bonnes++;
  sessionScore.total++;
  const fb = document.getElementById("feedback");
  fb.innerHTML = ev.valide 
    ? `✅ Bonne réponse ! (${ev.taux}%)<br><div class="reponse-modele">📖 ${currentCard.r}</div>`
    : `⚠️ À revoir (${ev.taux}%)<br><div class="reponse-modele">📖 ${currentCard.r}</div>`;
  fb.classList.add("show");
  sessionIndex++;
  setTimeout(() => afficherQuestion(), 1500);
}

function terminerSession() {
  const pct = sessionScore.total > 0 ? Math.round(sessionScore.bonnes / sessionScore.total * 100) : 0;
  const chapitresEtudies = getChapitresSelectionnes();
  const chapitresNoms = chapitresEtudies.map(n => FLASHCARDS[n]?.titre || `Chapitre ${n}`);
  
  // ==== ENVOI VERS SUIVI PARENTAL ====
  const sessionData = { bonnes: sessionScore.bonnes, total: sessionScore.total };
  console.log("Envoi vers suivi-parental:", `francais_${currentEleve.toLowerCase()}`, chapitresNoms, sessionData);
  
  if (window.SuiviParental && window.SuiviParental.sauvegarderSession) {
    window.SuiviParental.sauvegarderSession(
      `francais_${currentEleve.toLowerCase()}`,
      chapitresNoms,
      sessionData
    );
  } else {
    // Création de la fonction si elle n'existe pas (fallback)
    if (!window.SuiviParental) window.SuiviParental = {};
    window.SuiviParental.sauvegarderSession = function(matiere, chapitres, score) {
      const key = `automatismes_sessions_${matiere}`;
      const sessions = JSON.parse(localStorage.getItem(key) || "[]");
      sessions.unshift({
        id: Date.now(),
        date: new Date().toISOString(),
        chapitres: chapitres,
        score: score,
        pourcentage: Math.round(score.bonnes / score.total * 100)
      });
      localStorage.setItem(key, JSON.stringify(sessions.slice(0, 100)));
      console.log("Session sauvegardée dans localStorage:", key, sessions[0]);
    };
    window.SuiviParental.sauvegarderSession(
      `francais_${currentEleve.toLowerCase()}`,
      chapitresNoms,
      sessionData
    );
  }
  
  document.getElementById("sessionArea").style.display = "none";
  const ra = document.getElementById("resultatsArea");
  ra.style.display = "block";
  ra.innerHTML = `<h3>🎉 Session terminée !</h3>
    <p style="font-size:1.5rem;">${sessionScore.bonnes}/${sessionScore.total}</p>
    <p>Soit ${pct}% de bonnes réponses</p>
    <p>👤 Élève : <strong>${currentEleve}</strong><br>📖 Chapitres révisés : ${chapitresNoms.join(', ')}</p>
    <p style="color:#2ecc71;">✅ Score envoyé au suivi parental !</p>
    <button id="reloadBtn" class="btn-primary">📚 Nouvelle session</button>`;
  document.getElementById("reloadBtn").onclick = () => location.reload();
  
  // Sauvegarde des chapitres étudiés
  const chKey = `automatismes_chapitres_francais_${currentEleve.toLowerCase()}`;
  const existants = JSON.parse(localStorage.getItem(chKey) || "[]");
  const nouveaux = chapitresNoms.filter(c => !existants.includes(c));
  if (nouveaux.length) localStorage.setItem(chKey, JSON.stringify([...existants, ...nouveaux]));
}

function demarrerSession() {
  const chapitresChoisis = getChapitresSelectionnes();
  if (chapitresChoisis.length === 0) { alert("Sélectionne au moins un chapitre !"); return; }
  sessionCartes = genererSession(chapitresChoisis);
  if (sessionCartes.length === 0) { alert("Aucune question disponible."); return; }
  sessionIndex = 0;
  sessionScore = { bonnes: 0, total: 0 };
  document.getElementById("chapitreSelector").style.display = "none";
  document.getElementById("sessionArea").style.display = "block";
  document.getElementById("resultatsArea").style.display = "none";
  document.getElementById("sessionDate").innerText = new Date().toLocaleDateString();
  afficherQuestion();
}

document.addEventListener("DOMContentLoaded", () => {
  afficherChapitres();
  document.getElementById("btnWassil").onclick = () => setEleve("Wassil");
  document.getElementById("btnNawal").onclick = () => setEleve("Nawal");
  document.getElementById("selectAllBtn").onclick = () => document.querySelectorAll("#chapitresGrid input").forEach(cb => cb.checked = true);
  document.getElementById("deselectAllBtn").onclick = () => document.querySelectorAll("#chapitresGrid input").forEach(cb => cb.checked = false);
  document.getElementById("demarrerBtn").onclick = demarrerSession;
  setEleve("Wassil");
});
</script>
</body>
</html>
