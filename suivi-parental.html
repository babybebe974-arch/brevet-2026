<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suivi Parental — Brevet 2026</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#09090f;color:#e8e8f0;font-family:Arial,sans-serif;padding:1rem;}
.box{max-width:1000px;margin:0 auto;}

/* HEADER */
.header{background:#111118;border:1px solid #2a2a38;border-radius:12px;padding:1.2rem 1.5rem;margin-bottom:1.5rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem;}
.header h1{font-size:1.4rem;color:#e8c87a;}
.header p{font-size:12px;color:#9090a8;margin-top:3px;}
a.back{color:#5ecfb1;text-decoration:none;font-size:13px;}

/* ELEVE TABS */
.eleve-tabs{display:flex;gap:8px;margin-bottom:1.5rem;}
.etab{padding:8px 28px;border-radius:50px;border:2px solid #2a2a38;cursor:pointer;font-weight:700;font-size:13px;background:#111118;color:#9090a8;}
.etab.w{border-color:#7eb8f5;color:#7eb8f5;background:rgba(126,184,245,.08);}
.etab.n{border-color:#f59eb8;color:#f59eb8;background:rgba(245,158,184,.08);}

/* ALERTE */
.alerte{background:rgba(232,122,122,.1);border:1px solid rgba(232,122,122,.3);border-radius:10px;padding:12px 16px;margin-bottom:1.5rem;font-size:13px;color:#e87a7a;display:none;}

/* STATS */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-bottom:1.5rem;}
.stat{background:#111118;border:1px solid #2a2a38;border-radius:10px;padding:14px;text-align:center;}
.stat-v{font-size:1.8rem;font-weight:800;line-height:1;margin-bottom:4px;}
.stat-l{font-size:10px;color:#9090a8;text-transform:uppercase;letter-spacing:.05em;}

/* STREAK DAYS */
.streak-days{display:flex;gap:5px;margin-top:10px;justify-content:center;}
.sday{width:22px;height:22px;border-radius:5px;border:1px solid #2a2a38;display:flex;align-items:center;justify-content:center;font-size:9px;color:#5a5a72;}
.sday.done{background:#5ecfb1;border-color:#5ecfb1;color:#09090f;}
.sday.today{border-color:#e8c87a;}

/* SECTIONS */
.section{background:#111118;border:1px solid #2a2a38;border-radius:12px;margin-bottom:1.2rem;overflow:hidden;}
.section-head{padding:12px 18px;border-bottom:1px solid #2a2a38;display:flex;align-items:center;justify-content:space-between;}
.section-head h3{font-size:12px;color:#e8c87a;text-transform:uppercase;letter-spacing:.08em;}
.section-head span{font-size:11px;color:#5a5a72;}
.section-body{padding:16px 18px;}

/* PROGRESSION MATIERES */
.mat-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.mat-row:last-child{margin-bottom:0;}
.mat-nom{font-size:13px;min-width:110px;color:#9090a8;}
.mat-bar{flex:1;height:7px;background:#2a2a38;border-radius:4px;overflow:hidden;}
.mat-fill{height:100%;border-radius:4px;transition:width .5s;}
.mat-pct{font-size:12px;font-family:monospace;min-width:36px;text-align:right;}
.mat-nb{font-size:11px;color:#5a5a72;min-width:60px;text-align:right;}

/* GRAPHIQUE */
.graph{display:flex;align-items:flex-end;gap:5px;height:70px;padding:0 4px;}
.gbar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;}
.gbar{width:100%;border-radius:4px 4px 0 0;min-height:4px;transition:height .4s;}
.glabel{font-size:8px;color:#5a5a72;font-family:monospace;writing-mode:vertical-rl;transform:rotate(180deg);max-height:36px;overflow:hidden;}

/* CHAPITRES FAIBLES */
.faibles-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;}
.faible-item{background:#1a1a24;border:1px solid rgba(232,122,122,.3);border-radius:8px;padding:10px 12px;}
.faible-nom{font-size:12px;color:#e8e8f0;margin-bottom:3px;}
.faible-taux{font-size:11px;color:#e87a7a;font-family:monospace;}

/* SESSIONS TABLE */
.stab{width:100%;border-collapse:collapse;font-size:12px;}
.stab th{color:#e8c87a;font-size:10px;font-weight:400;text-align:left;padding:6px 10px;border-bottom:1px solid #2a2a38;text-transform:uppercase;letter-spacing:.05em;}
.stab td{padding:8px 10px;border-bottom:1px solid #1a1a24;color:#9090a8;}
.stab tr:last-child td{border-bottom:none;}
.stab tr:hover td{background:#1a1a24;}
.ok{color:#5ecfb1;font-weight:600;}
.mid{color:#e8c87a;font-weight:600;}
.bad{color:#e87a7a;font-weight:600;}

/* VIDE */
.vide{text-align:center;padding:2rem;color:#5a5a72;font-size:13px;}

/* BTNS */
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:1.5rem;}
.btn{padding:8px 18px;border-radius:8px;border:1px solid #2a2a38;background:#1a1a24;color:#9090a8;font-size:12px;cursor:pointer;}
.btn:hover{border-color:#5ecfb1;color:#5ecfb1;}
.btn-danger{border-color:rgba(232,122,122,.4);color:#e87a7a;}
.btn-danger:hover{background:rgba(232,122,122,.1);}
</style>
</head>
<body>
<div class="box">

  <div class="header">
    <div>
      <h1>📊 Suivi Parental — Brevet 2026</h1>
      <p>Progression des automatismes en temps réel</p>
    </div>
    <a href="index.html" class="back">← Hub</a>
  </div>

  <!-- ELEVE TABS -->
  <div class="eleve-tabs">
    <button class="etab w" id="tabW">🌊 Wassil</button>
    <button class="etab" id="tabN">⚡ Nawal</button>
  </div>

  <!-- ALERTE -->
  <div class="alerte" id="alerte"></div>

  <!-- STATS RAPIDES -->
  <div class="stats-grid" id="statsGrid"></div>

  <!-- STREAK + GRAPHIQUE -->
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:1.2rem;">
    <div class="section">
      <div class="section-head"><h3>🔥 Streak</h3></div>
      <div class="section-body" id="streakBody"></div>
    </div>
    <div class="section">
      <div class="section-head"><h3>📈 10 dernières sessions</h3></div>
      <div class="section-body" id="graphBody"></div>
    </div>
  </div>

  <!-- COMPARAISON MATIERES -->
  <div class="section">
    <div class="section-head"><h3>📚 Comparaison par matière</h3></div>
    <div class="section-body" id="matBody"></div>
  </div>

  <!-- CHAPITRES FAIBLES -->
  <div class="section">
    <div class="section-head">
      <h3>⚠ Chapitres faibles (&lt;60%)</h3>
      <span>Sur les 5 dernières sessions</span>
    </div>
    <div class="section-body" id="faiblesBody"></div>
  </div>

  <!-- SESSIONS RECENTES -->
  <div class="section">
    <div class="section-head"><h3>🕐 Sessions récentes</h3></div>
    <div class="section-body" id="sessionsBody"></div>
  </div>

  <div class="btn-row">
    <button class="btn" id="btnRefresh">🔄 Actualiser</button>
    <button class="btn" id="btnExport">📤 Exporter JSON</button>
    <button class="btn btn-danger" id="btnReset">⚠ Réinitialiser</button>
  </div>

</div>

<script>
var eleve = 'wassil';
var MATIERES = [
  {id:'francais', nom:'🇫🇷 Français',    couleur:'#5ecfb1'},
  {id:'maths',    nom:'📐 Maths',         couleur:'#e8c87a'},
  {id:'histoire', nom:'🌍 Histoire-Géo',  couleur:'#f5a623'},
  {id:'sciences', nom:'🔬 Sciences',      couleur:'#5eaacf'}
];

function getSessions(matiere) {
  try { return JSON.parse(localStorage.getItem('suivi_sessions_'+matiere+'_'+eleve)||'[]'); }
  catch(e){ return []; }
}

function getAllSessions() {
  var all = [];
  MATIERES.forEach(function(m){
    getSessions(m.id).forEach(function(s){ all.push(Object.assign({},s,{matiere:m.id})); });
  });
  all.sort(function(a,b){ return new Date(b.date)-new Date(a.date); });
  return all;
}

function calcStreak(sessions) {
  if(!sessions.length) return 0;
  var jours = {};
  sessions.forEach(function(s){ jours[new Date(s.date).toDateString()]=1; });
  var streak=0, d=new Date();
  while(jours[d.toDateString()]){ streak++; d.setDate(d.getDate()-1); }
  return streak;
}

function fmtDate(str) {
  try {
    var d = new Date(str);
    return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
  } catch(e){ return str; }
}

function setEleve(e) {
  eleve = e;
  document.getElementById('tabW').className = 'etab' + (e==='wassil'?' w':'');
  document.getElementById('tabN').className = 'etab' + (e==='nawal'?' n':'');
  render();
}

function render() {
  renderAlerte();
  renderStats();
  renderStreak();
  renderGraph();
  renderMatieres();
  renderFaibles();
  renderSessions();
}

function renderAlerte() {
  var all = getAllSessions();
  var el = document.getElementById('alerte');
  if(!all.length){ el.style.display='none'; return; }
  var diff = Math.floor((Date.now()-new Date(all[0].date))/(1000*60*60*24));
  if(diff>=2){
    el.style.display='block';
    el.textContent = '⚠️ Dernière session il y a '+diff+' jour'+(diff>1?'s':'')+'. '+(eleve==='wassil'?'Wassil':'Nawal')+' doit travailler aujourd\'hui !';
  } else {
    el.style.display='none';
  }
}

function renderStats() {
  var all = getAllSessions();
  var streak = calcStreak(all);
  var moy = all.length ? Math.round(all.slice(0,10).reduce(function(a,s){return a+s.pourcentage;},0)/Math.min(all.length,10)) : 0;
  var meilleur = all.length ? Math.max.apply(null,all.map(function(s){return s.pourcentage;})) : 0;
  var dern5 = all.slice(0,5).map(function(s){return s.pourcentage;});
  var tendance = dern5.length>=2 ? (dern5[0]>dern5[dern5.length-1]?'↑':dern5[0]<dern5[dern5.length-1]?'↓':'→') : '—';
  var tCoul = tendance==='↑'?'#5ecfb1':tendance==='↓'?'#e87a7a':'#9090a8';

  document.getElementById('statsGrid').innerHTML =
    '<div class="stat"><div class="stat-v" style="color:#e8c87a">'+streak+'</div><div class="stat-l">🔥 Streak</div></div>'
    +'<div class="stat"><div class="stat-v" style="color:#5ecfb1">'+(all.length?moy+'%':'—')+'</div><div class="stat-l">Moyenne</div></div>'
    +'<div class="stat"><div class="stat-v" style="color:#a07af5">'+(all.length?meilleur+'%':'—')+'</div><div class="stat-l">Meilleur</div></div>'
    +'<div class="stat"><div class="stat-v" style="color:#5eaacf">'+all.length+'</div><div class="stat-l">Sessions</div></div>'
    +'<div class="stat"><div class="stat-v" style="color:'+tCoul+'">'+tendance+'</div><div class="stat-l">Tendance</div></div>';
}

function renderStreak() {
  var all = getAllSessions();
  var streak = calcStreak(all);
  var jours = {};
  all.forEach(function(s){ jours[new Date(s.date).toDateString()]=1; });
  var msg = streak===0?'Commence dès aujourd\'hui !':streak<3?'Bon départ !':streak<7?'Continue !':'🔥 Incroyable !';

  var days = '';
  for(var i=6;i>=0;i--){
    var d=new Date(); d.setDate(d.getDate()-i);
    var done=jours[d.toDateString()]?'done':'';
    var today=i===0?' today':'';
    var letter=d.toLocaleDateString('fr-FR',{weekday:'short'}).charAt(0).toUpperCase();
    days+='<div class="sday '+done+today+'">'+letter+'</div>';
  }

  document.getElementById('streakBody').innerHTML =
    '<div style="display:flex;align-items:center;gap:12px;">'
    +'<div style="font-size:2.2rem;font-weight:800;color:#e8c87a;font-family:monospace">'+streak+'</div>'
    +'<div><div style="font-size:13px;color:#e8e8f0">jours consécutifs</div><div style="font-size:11px;color:#9090a8">'+msg+'</div></div>'
    +'</div>'
    +'<div class="streak-days" style="margin-top:12px">'+days+'</div>';
}

function renderGraph() {
  var all = getAllSessions().slice(0,10).reverse();
  if(!all.length){ document.getElementById('graphBody').innerHTML='<div class="vide">Pas encore de données.</div>'; return; }
  var bars = all.map(function(s){
    var col = s.pourcentage>=80?'#5ecfb1':s.pourcentage>=60?'#e8c87a':'#e87a7a';
    var h = Math.max(4, Math.round(s.pourcentage*0.65));
    var mat = MATIERES.filter(function(m){return m.id===s.matiere;})[0];
    var nom = mat ? mat.nom.slice(0,3) : '';
    return '<div class="gbar-wrap"><div class="gbar" style="height:'+h+'px;background:'+col+'" title="'+s.pourcentage+'%"></div><div class="glabel">'+nom+' '+s.pourcentage+'%</div></div>';
  }).join('');
  document.getElementById('graphBody').innerHTML='<div class="graph">'+bars+'</div>';
}

function renderMatieres() {
  var html = '';
  MATIERES.forEach(function(m){
    var sessions = getSessions(m.id);
    if(!sessions.length){
      html+='<div class="mat-row"><span class="mat-nom">'+m.nom+'</span><div class="mat-bar"><div class="mat-fill" style="width:0%;background:'+m.couleur+'"></div></div><span class="mat-pct" style="color:#5a5a72">—</span><span class="mat-nb">0 session</span></div>';
      return;
    }
    var moy = Math.round(sessions.slice(0,10).reduce(function(a,s){return a+s.pourcentage;},0)/Math.min(sessions.length,10));
    html+='<div class="mat-row"><span class="mat-nom">'+m.nom+'</span><div class="mat-bar"><div class="mat-fill" style="width:'+moy+'%;background:'+m.couleur+'"></div></div><span class="mat-pct" style="color:'+m.couleur+'">'+moy+'%</span><span class="mat-nb">'+sessions.length+' session'+(sessions.length>1?'s':'')+'</span></div>';
  });
  document.getElementById('matBody').innerHTML = html || '<div class="vide">Aucune session.</div>';
}

function renderFaibles() {
  var all = getAllSessions();
  if(!all.length){ document.getElementById('faiblesBody').innerHTML='<div class="vide">Pas encore de données.</div>'; return; }

  var taux = {};
  all.slice(0,5).forEach(function(s){
    if(s.chapitresTaux) Object.keys(s.chapitresTaux).forEach(function(ch){
      if(!taux[ch]) taux[ch]=[];
      taux[ch].push(s.chapitresTaux[ch]);
    });
  });

  var faibles = Object.keys(taux).filter(function(ch){
    return taux[ch].reduce(function(a,b){return a+b;},0)/taux[ch].length < 60;
  }).map(function(ch){
    return {ch:ch, moy:Math.round(taux[ch].reduce(function(a,b){return a+b;},0)/taux[ch].length)};
  }).sort(function(a,b){return a.moy-b.moy;});

  if(!faibles.length){ document.getElementById('faiblesBody').innerHTML='<div class="vide">✅ Aucun chapitre faible. Bravo !</div>'; return; }

  var html = '<div class="faibles-grid">';
  faibles.forEach(function(f){ html+='<div class="faible-item"><div class="faible-nom">'+f.ch+'</div><div class="faible-taux">'+f.moy+'% de réussite</div></div>'; });
  html+='</div>';
  document.getElementById('faiblesBody').innerHTML = html;
}

function renderSessions() {
  var all = getAllSessions().slice(0,15);
  if(!all.length){ document.getElementById('sessionsBody').innerHTML='<div class="vide">Aucune session.</div>'; return; }

  var rows = all.map(function(s){
    var pct = s.pourcentage;
    var cls = pct>=80?'ok':pct>=60?'mid':'bad';
    var mat = MATIERES.filter(function(m){return m.id===s.matiere;})[0];
    var matNom = mat?mat.nom:'—';
    var chapitres = Array.isArray(s.chapitres)?s.chapitres.slice(0,2).join(', ')+(s.chapitres.length>2?'…':''):'—';
    return '<tr><td>'+fmtDate(s.date)+'</td><td>'+matNom+'</td><td style="font-size:11px">'+chapitres+'</td><td class="'+cls+'">'+pct+'%</td></tr>';
  }).join('');

  document.getElementById('sessionsBody').innerHTML =
    '<table class="stab"><thead><tr><th>Date</th><th>Matière</th><th>Chapitres</th><th>Score</th></tr></thead><tbody>'+rows+'</tbody></table>';
}

function exporterJSON() {
  var data = {};
  MATIERES.forEach(function(m){ data[m.id]=getSessions(m.id); });
  var blob = new Blob([JSON.stringify({date:new Date().toISOString(),eleve:eleve,data:data},null,2)],{type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href=url; a.download='suivi_'+eleve+'_'+new Date().toISOString().slice(0,10)+'.json';
  a.click(); URL.revokeObjectURL(url);
}

function reinitialiser() {
  if(!confirm('Supprimer toutes les données de '+(eleve==='wassil'?'Wassil':'Nawal')+' ?')) return;
  MATIERES.forEach(function(m){ localStorage.removeItem('suivi_sessions_'+m.id+'_'+eleve); });
  render();
}

window.onload = function() {
  document.getElementById('tabW').addEventListener('click', function(){ setEleve('wassil'); });
  document.getElementById('tabN').addEventListener('click', function(){ setEleve('nawal'); });
  document.getElementById('btnRefresh').addEventListener('click', render);
  document.getElementById('btnExport').addEventListener('click', exporterJSON);
  document.getElementById('btnReset').addEventListener('click', reinitialiser);
  setEleve('wassil');
};
</script>
</body>
</html>
