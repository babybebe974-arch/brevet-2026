const PROXY_URL = 'https://script.google.com/macros/s/AKfycbx07YT4JAPT3BvJExw2MQW5Gpf0xUu832FBTqhHWdcsWr-vgnBW7i1HeN6OrY-Lg7BVAA/exec';

async function callIA(prompt, system) {
  const response = await fetch(PROXY_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ prompt, system })
  });
  if (!response.ok) throw new Error('HTTP ' + response.status);
  const result = await response.json();
  if (result.success && result.data && result.data.content) return result.data.content;
  if (result.content) return result.content;
  throw new Error('Réponse inattendue : ' + JSON.stringify(result));
}

function safeParseJSON(txt) {
  try {
    return JSON.parse(txt.replace(/```json|```/g, '').trim());
  } catch(e) { return null; }
}

// ── CORRECTION DICTÉE ──────────────────────────────────────────────────
async function corrigerDictee(idTextarea, texteOfficiel, numSujet) {
  const texteEleve = document.getElementById(idTextarea).value.trim();
  if (!texteEleve) { alert("Écris la dictée avant de corriger."); return; }
  const corrDiv = document.getElementById('correction-dictee-' + numSujet);
  corrDiv.innerHTML = '<span class="loading">⏳ Correction en cours...</span>';
  corrDiv.style.display = 'block';
  const system = 'Tu es un professeur de français bienveillant. Compare la dictée de l\'élève avec le texte officiel. Compte les erreurs (orthographe, grammaire, ponctuation, accords). Note sur 10 (chaque faute enlève 0.5 point). Réponds UNIQUEMENT en JSON valide sans balises markdown : {"note": nombre, "commentaire": "détail des erreurs", "conseil": "conseil pour progresser"}';
  const prompt = 'Texte officiel : "' + texteOfficiel + '"\nDictée élève : "' + texteEleve + '"';
  try {
    const txt = await callIA(prompt, system);
    const json = safeParseJSON(txt);
    if (json) {
      corrDiv.innerHTML = '<strong>Note : ' + json.note + '/10</strong><br><br>' + json.commentaire + '<br><br><strong>Conseil :</strong> ' + json.conseil;
    } else {
      corrDiv.innerHTML = txt;
    }
  } catch(e) {
    corrDiv.innerHTML = '<span class="erreur">Erreur : ' + e.message + '</span>';
  }
}

// ── CORRECTION EXERCICE ────────────────────────────────────────────────
async function corrigerExo(idTextarea, reponseAttendue, pts) {
  const texte = document.getElementById(idTextarea).value.trim();
  if (!texte) { alert("Écris ta réponse avant de corriger."); return; }
  const btn = event.target;
  btn.disabled = true;
  btn.textContent = '⏳...';
  const system = 'Tu es un professeur de français bienveillant. Corrige cette réponse d\'élève (français DNB). Réponds UNIQUEMENT en JSON valide sans balises markdown : {"note": nombre, "commentaire": "explication courte"}';
  const prompt = 'Réponse attendue : "' + reponseAttendue + '"\nRéponse élève : "' + texte + '"\nNote sur ' + pts + ' points.';
  try {
    const txt = await callIA(prompt, system);
    const json = safeParseJSON(txt);
    if (json) {
      alert('Note : ' + json.note + '/' + pts + '\n\n' + json.commentaire);
    } else {
      alert(txt);
    }
  } catch(e) {
    alert('Erreur : ' + e.message);
  }
  btn.disabled = false;
  btn.textContent = 'Corriger avec IA';
}

// ── CORRECTION RÉDACTION ───────────────────────────────────────────────
async function corrigerRedaction(idTextarea, pts) {
  const texte = document.getElementById(idTextarea).value.trim();
  if (!texte) { alert("Écris ta rédaction avant de corriger."); return; }
  const btn = event.target;
  btn.disabled = true;
  btn.textContent = '⏳...';

    } else {
      alert(txt);
    }
  } catch(e) {
    alert('Erreur : ' + e.message);
  }
  btn.disabled = false;
  btn.textContent = 'Corriger la rédaction avec IA';
}

function afficherCorrection(id) {
  const el = document.getElementById(id);
  el.style.display = (el.style.display === 'block') ? 'none' : 'block';
}

// ── RENDU ──────────────────────────────────────────────────────────────
function afficherSujets() {
  const container = document.getElementById('sujets');
  container.innerHTML = '';
  SUJETS.forEach((s, idx) => {
    const num = idx + 1;
    const div = document.createElement('div');
    div.className = 'sujet';
    let html = '<h3>Sujet ' + num + ' – ' + s.annee + ' (' + s.session + ') <span class="badge">' + s.titre + '</span></h3>';
    html += '<div class="texte"><strong>Texte :</strong><br>' + s.texte + '<br><em>' + s.auteur + '</em></div>';

    // DICTÉE
    const dicteeTexteEsc = s.dictee.texte.replace(/\\/g, '\\\\').replace(/`/g, '\\`');
    html += '<div class="document"><strong>Dictée (10 points)</strong><br>' + s.dictee.titre + '<br><em>Le professeur lira le texte à voix haute. Écoutez et écrivez.</em></div>';
    html += '<textarea id="dictee-' + num + '" class="dictee" placeholder="Écoutez et écrivez la dictée ici..."></textarea>';
    html += '<button onclick="corrigerDictee(\'dictee-' + num + '\', `' + dicteeTexteEsc + '`, ' + num + ')">Corriger la dictée avec IA</button>';
    html += '<div id="correction-dictee-' + num + '" class="correction"></div>';

    // COMPRÉHENSION
    const ptsComp = s.questions.reduce((a, q) => a + q.pts, 0);
    html += '<br><div><strong>📖 Compréhension (' + ptsComp + ' points)</strong></div>';
    s.questions.forEach((q, i) => {
      const repEsc = q.rep.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
      html += '<div class="question"><strong>Question ' + (i+1) + '</strong> (' + q.pts + ' points)<br>' + q.q + '</div>';
      html += '<textarea id="comp-' + num + '-' + i + '" rows="3" placeholder="Votre réponse..."></textarea>';
      html += '<button onclick="corrigerExo(\'comp-' + num + '-' + i + '\', \'' + repEsc + '\', ' + q.pts + ')">Corriger avec IA</button>';
      html += '<button onclick="afficherCorrection(\'corr-comp-' + num + '-' + i + '\')">Voir correction</button>';
      html += '<div id="corr-comp-' + num + '-' + i + '" class="correction">' + q.rep + '</div>';
    });

    // GRAMMAIRE
    const ptsGram = s.grammaire.reduce((a, g) => a + g.pts, 0);
    html += '<br><div><strong>📝 Grammaire (' + ptsGram + ' points)</strong></div>';
    s.grammaire.forEach((g, i) => {
      const repEsc = g.rep.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
      html += '<div class="question"><strong>Question ' + (i+1) + '</strong> (' + g.pts + ' points)<br>' + g.q + '</div>';
      html += '<textarea id="gram-' + num + '-' + i + '" rows="3" placeholder="Votre réponse..."></textarea>';
      html += '<button onclick="corrigerExo(\'gram-' + num + '-' + i + '\', \'' + repEsc + '\', ' + g.pts + ')">Corriger avec IA</button>';
      html += '<button onclick="afficherCorrection(\'corr-gram-' + num + '-' + i + '\')">Voir correction</button>';
      html += '<div id="corr-gram-' + num + '-' + i + '" class="correction">' + g.rep + '</div>';
    });

    // RÉDACTION
    html += '<br><div><strong>✍️ Rédaction (' + s.redaction.pts + ' points)</strong><br>';
    html += 'Choix A : ' + s.redaction.sujet1 + '<br>';
    html += 'Choix B : ' + s.redaction.sujet2 + '</div>';
    html += '<textarea id="redac-' + num + '" class="redaction" placeholder="Votre rédaction (environ 300 mots)..."></textarea>';
    html += '<button onclick="corrigerRedaction(\'redac-' + num + '\', ' + s.redaction.pts + ')">Corriger la rédaction avec IA</button>';
    html += '<hr>';

    div.innerHTML = html;
    container.appendChild(div);
  });
}

afficherSujets();
