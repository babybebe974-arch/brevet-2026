<script>
const PROXY_URL = 'https://script.google.com/macros/s/AKfycbwOGUebP39z8WqcGgsNz0lmxFe3dQPW6gy3fV9KcmbbojP2RUpsbXiO0I7s8OQzuTGrsw/exec';

async function callIA(prompt, system) {
  const response = await fetch(PROXY_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify({ prompt, system }),
    redirect: 'follow'
  });
  if (!response.ok) throw new Error('HTTP ' + response.status);
  const result = await response.json();
  if (result.success && result.content) return result.content;
  throw new Error(result.error || 'Réponse inattendue');
}

function safeParseJSON(txt) {
  try { return JSON.parse(txt.replace(/```json|```/g, '').trim()); } catch(e) { return null; }
}

let correctionsIA = {};

function stockerCorrection(sujetId, type, num, contenu) {
  if (!correctionsIA[sujetId]) correctionsIA[sujetId] = {};
  if (!correctionsIA[sujetId][type]) correctionsIA[sujetId][type] = {};
  correctionsIA[sujetId][type][num] = contenu;
}

async function copierTexte(texte, btn) {
  try {
    await navigator.clipboard.writeText(texte);
    btn.textContent = '✓ Copié !';
    setTimeout(() => btn.textContent = '📋 Copier', 1500);
  } catch(e) { alert('Impossible de copier'); }
}

async function sauvegarderTout(sujetId, annee, session, titre, questions, dictTexte, grammaire) {
  const data = {
    sujet: sujetId, annee, session, titre, date: new Date().toISOString(),
    corrections: {
      dictee: correctionsIA[sujetId]?.dictee?.[1] || "Non corrigée",
      comprehension: {},
      grammaire: {},
      redaction: correctionsIA[sujetId]?.redaction?.[1] || "Non corrigée"
    }
  };
  for (let i = 0; i < questions.length; i++) data.corrections.comprehension[i+1] = correctionsIA[sujetId]?.comprehension?.[i+1] || "Non corrigée";
  for (let i = 0; i < grammaire.length; i++) data.corrections.grammaire[i+1] = correctionsIA[sujetId]?.grammaire?.[i+1] || "Non corrigée";
  
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `Sujet_${sujetId}_${annee}_${session.replace(/[()]/g, '').replace(/ /g, '_')}.json`;
  a.click();
  URL.revokeObjectURL(url);
  
  const printDiv = document.createElement('div');
  printDiv.className = 'print-correction';
  printDiv.style.cssText = 'padding: 20px; font-family: "DM Sans", sans-serif;';
  let html = `<h1>Sujet ${sujetId} - ${annee} (${session})</h1><h2>${titre}</h2><hr>
    <h3>📝 Dictée</h3><p>🤖 IA: ${data.corrections.dictee}</p><p style="color:#e74c3c;">📖 Officiel: ${dictTexte}</p><hr>
    <h3>📖 Compréhension</h3>`;
  for (let i = 0; i < questions.length; i++) html += `<div><strong>Q${i+1}</strong><br>🤖: ${data.corrections.comprehension[i+1]}<br><span style="color:#e74c3c;">📖: ${questions[i].reponse}</span></div>`;
  html += `<h3>📝 Grammaire</h3>`;
  for (let i = 0; i < grammaire.length; i++) html += `<div><strong>Q${i+1}</strong><br>🤖: ${data.corrections.grammaire[i+1]}<br><span style="color:#e74c3c;">📖: ${grammaire[i].reponse}</span></div>`;
  html += `<h3>✍️ Rédaction</h3><p>🤖 IA: ${data.corrections.redaction}</p><p style="color:#e74c3c;">📖 Critères officiels: Pertinence (4), Structure (4), Richesse (4), Style (4), Orthographe (4)</p>`;
  printDiv.innerHTML = html;
  document.body.appendChild(printDiv);
  document.title = `Sujet_${sujetId}_${annee}_${session.replace(/[()]/g, '').replace(/ /g, '_')}.pdf`;
  window.print();
  document.body.removeChild(printDiv);
  alert(`✅ ${Object.keys(correctionsIA[sujetId] || {}).length} corrections sauvegardées`);
}

async function corrigerDictee(textareaId, texteOfficiel, sujetId) {
  const texte = document.getElementById(textareaId).value.trim();
  if (!texte) { alert("Écris la dictée"); return; }
  const btn = event.target;
  btn.disabled = true;
  btn.textContent = '⏳...';
  try {
    const txt = await callIA(`Compare la dictée de l'élève avec le texte officiel. Compte les erreurs. Note sur 10. Réponds UNIQUEMENT en JSON : {"note": nombre, "commentaire": "...", "conseil": "..."}.\n\nTexte officiel : "${texteOfficiel}"\n\nDictée élève : "${texte}"`, "");
    const json = safeParseJSON(txt);
    let contenu = json ? `Note : ${json.note}/10\n\n${json.commentaire}\n\n💡 Conseil : ${json.conseil}` : txt;
    stockerCorrection(sujetId, "dictee", 1, contenu);
    const div = document.getElementById(`corr-${textareaId}`);
    if (div) {
      div.innerHTML = contenu;
      const off = document.createElement('div');
      off.className = 'correction-officielle';
      off.innerHTML = `<strong>📖 Texte officiel :</strong><br>${texteOfficiel}`;
      div.appendChild(off);
      const btnCopy = document.createElement('button');
      btnCopy.className = 'btn-copy';
      btnCopy.textContent = '📋 Copier';
      btnCopy.onclick = () => copierTexte(contenu, btnCopy);
      div.appendChild(btnCopy);
      div.style.display = 'block';
    }
  } catch(e) { alert("Erreur: " + e.message); }
  btn.disabled = false;
  btn.textContent = 'Corriger la dictée';
}

async function corrigerQuestion(textareaId, reponseAttendue, pts, sujetId, type, num, texteQuestion) {
  const texte = document.getElementById(textareaId).value.trim();
  if (!texte) { alert("Écris ta réponse"); return; }
  const btn = event.target;
  btn.disabled = true;
  btn.textContent = '⏳...';
  try {
    const txt = await callIA(`Corrige cette réponse. Réponds en JSON : {"note": nombre, "commentaire": "...", "conseil": "..."}.\n\nQuestion : "${texteQuestion}"\nRéponse attendue : "${reponseAttendue}"\nRéponse élève : "${texte}"\nNote sur ${pts} points.`, "");
    const json = safeParseJSON(txt);
    let contenu = json ? `Note : ${json.note}/${pts}\n\n${json.commentaire}\n\n💡 Conseil : ${json.conseil}` : txt;
    stockerCorrection(sujetId, type, num, contenu);
    const div = document.getElementById(`corr-${textareaId}`);
    if (div) {
      div.innerHTML = contenu;
      const off = document.createElement('div');
      off.className = 'correction-officielle';
      off.innerHTML = `<strong>📖 Correction officielle :</strong><br>${reponseAttendue}`;
      div.appendChild(off);
      const btnCopy = document.createElement('button');
      btnCopy.className = 'btn-copy';
      btnCopy.textContent = '📋 Copier';
      btnCopy.onclick = () => copierTexte(contenu, btnCopy);
      div.appendChild(btnCopy);
      div.style.display = 'block';
    }
  } catch(e) { alert("Erreur: " + e.message); }
  btn.disabled = false;
  btn.textContent = 'Corriger avec IA';
}

async function corrigerRedaction(textareaId, pts, sujetId) {
  const texte = document.getElementById(textareaId).value.trim();
  if (!texte) { alert("Écris ta rédaction"); return; }
  const btn = event.target;
  btn.disabled = true;
  btn.textContent = '⏳...';
  try {
    const txt = await callIA(`Corrige cette rédaction DNB. Note sur ${pts} points. Critères: Pertinence (4), Structure (4), Richesse (4), Style (4), Orthographe (4). Réponds en JSON : {"note": nombre, "commentaire": "...", "conseil": "..."}.\n\nRédaction :\n${texte}`, "");
    const json = safeParseJSON(txt);
    let contenu = json ? `Note : ${json.note}/${pts}\n\n${json.commentaire}\n\n💡 Conseil : ${json.conseil}` : txt;
    stockerCorrection(sujetId, "redaction", 1, contenu);
    const div = document.getElementById(`corr-${textareaId}`);
    if (div) {
      div.innerHTML = contenu;
      const off = document.createElement('div');
      off.className = 'correction-officielle';
      off.innerHTML = `<strong>📖 Critères officiels :</strong><br>Pertinence (4) | Structure (4) | Richesse (4) | Style (4) | Orthographe (4) = 20 points`;
      div.appendChild(off);
      const btnCopy = document.createElement('button');
      btnCopy.className = 'btn-copy';
      btnCopy.textContent = '📋 Copier';
      btnCopy.onclick = () => copierTexte(contenu, btnCopy);
      div.appendChild(btnCopy);
      div.style.display = 'block';
    }
  } catch(e) { alert("Erreur: " + e.message); }
  btn.disabled = false;
  btn.textContent = 'Corriger la rédaction';
}

function afficherCorrection(id) {
  const el = document.getElementById(id);
  el.style.display = el.style.display === 'block' ? 'none' : 'block';
}

function afficherSujets() {
  const grid = document.getElementById('sujetsGrid');
  grid.innerHTML = '';
  SUJETS.forEach((s, idx) => {
    const card = document.createElement('div');
    card.className = 'sujet-card';
    card.innerHTML = `
      <div class="sujet-annee">${s.annee}</div>
      <div class="sujet-titre">${s.titre}</div>
      <div class="sujet-session">${s.session}</div>
      <div class="sujet-themes"><span class="tag">Dictée</span><span class="tag">Compréhension</span><span class="tag">Grammaire</span><span class="tag">Rédaction</span></div>
      <a href="${s.pdf}" target="_blank" class="pdf-link-small">📎 PDF officiel</a>
    `;
    card.onclick = (e) => { if (!e.target.classList.contains('pdf-link-small')) afficherSujet(idx); };
    grid.appendChild(card);
  });
}

function afficherSujet(index) {
  const s = SUJETS[index];
  document.getElementById('landingHero').style.display = 'none';
  document.getElementById('sujetsGrid').style.display = 'none';
  const container = document.getElementById('sujetPage');
  container.style.display = 'block';
  
  let html = `
    <div class="sujet-header">
      <div><div class="sujet-title"><span>${s.annee}</span> — ${s.session}</div>
      <div style="font-size:14px; margin-top:4px;">${s.titre}</div></div>
      <div><button class="btn-back" onclick="retourAccueil()">← Retour aux sujets</button>
      <a href="${s.pdf}" target="_blank" class="dl-btn-pdf">📎 PDF officiel</a></div>
    </div>
    <div class="texte"><strong>Texte :</strong><br>${s.texte}<div class="auteur">${s.auteur}</div></div>
    
    <div class="document"><strong>📝 Dictée (10 points)</strong><br><em>Le professeur lira le texte à voix haute.</em></div>
    <textarea id="dictee-${s.id}" class="dictee" placeholder="Écris la dictée..."></textarea>
    <button onclick="corrigerDictee('dictee-${s.id}', \`${s.dictee.replace(/`/g, '\\`')}\`, '${s.id}')">Corriger la dictée</button>
    <div id="corr-dictee-${s.id}" class="correction"></div>
    
    <div style="margin-top:20px;"><strong>📖 Compréhension (${s.questions.reduce((a,q)=>a+q.pts,0)} points)</strong></div>`;
  
  s.questions.forEach((q, i) => {
    const taId = `comp-${s.id}-${i}`;
    html += `<div class="question"><strong>Question ${i+1}</strong> (${q.pts} points)<br>${q.texte}</div>
      <textarea id="${taId}" rows="3" placeholder="Votre réponse..."></textarea>
      <button onclick="corrigerQuestion('${taId}', '${q.reponse.replace(/\\/g, '\\\\').replace(/'/g, "\\'")}', ${q.pts}, '${s.id}', 'comprehension', ${i+1}, '${q.texte.replace(/\\/g, '\\\\').replace(/'/g, "\\'")}')">Corriger avec IA</button>
      <button onclick="afficherCorrection('corr-off-${taId}')">📖 Voir correction officielle</button>
      <div id="corr-off-${taId}" class="correction"><strong>✓ Correction officielle :</strong><br>${q.reponse}</div>
      <div id="corr-${taId}" class="correction"></div>`;
  });
  
  html += `<div style="margin-top:20px;"><strong>📝 Grammaire (${s.grammaire.reduce((a,g)=>a+g.pts,0)} points)</strong></div>`;
  s.grammaire.forEach((g, i) => {
    const taId = `gram-${s.id}-${i}`;
    html += `<div class="question"><strong>Question ${i+1}</strong> (${g.pts} points)<br>${g.texte}</div>
      <textarea id="${taId}" rows="3" placeholder="Votre réponse..."></textarea>
      <button onclick="corrigerQuestion('${taId}', '${g.reponse.replace(/\\/g, '\\\\').replace(/'/g, "\\'")}', ${g.pts}, '${s.id}', 'grammaire', ${i+1}, '${g.texte.replace(/\\/g, '\\\\').replace(/'/g, "\\'")}')">Corriger avec IA</button>
      <button onclick="afficherCorrection('corr-off-${taId}')">📖 Voir correction officielle</button>
      <div id="corr-off-${taId}" class="correction"><strong>✓ Correction officielle :</strong><br>${g.reponse}</div>
      <div id="corr-${taId}" class="correction"></div>`;
  });
  
  html += `<div style="margin-top:20px;"><strong>✍️ Rédaction (20 points)</strong><br>Choix A : ${s.redaction.sujet1}<br>Choix B : ${s.redaction.sujet2}</div>
    <textarea id="redac-${s.id}" class="redaction" placeholder="Votre rédaction (environ 300 mots)..."></textarea>
    <button onclick="corrigerRedaction('redac-${s.id}', 20, '${s.id}')">Corriger la rédaction</button>
    <div id="corr-redac-${s.id}" class="correction"></div>
    <button class="save-all-btn" onclick="sauvegarderTout('${s.id}', '${s.annee}', '${s.session}', '${s.titre}', ${JSON.stringify(s.questions).replace(/"/g, '&quot;')}, \`${s.dictee.replace(/`/g, '\\`')}\`, ${JSON.stringify(s.grammaire).replace(/"/g, '&quot;')})">💾 Sauvegarder toutes les corrections (JSON + PDF)</button>
    <hr>`;
  
  container.innerHTML = html;
}

function retourAccueil() {
  document.getElementById('landingHero').style.display = 'block';
  document.getElementById('sujetsGrid').style.display = 'grid';
  document.getElementById('sujetPage').style.display = 'none';
  correctionsIA = {};
}

window.corrigerDictee = corrigerDictee;
window.corrigerQuestion = corrigerQuestion;
window.corrigerRedaction = corrigerRedaction;
window.afficherCorrection = afficherCorrection;
window.retourAccueil = retourAccueil;
