<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📖 Sujets Blancs Français — Brevet 2026</title>
<script src="config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;1,700&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#09090f;--bg2:#111118;--bg3:#181820;--border:rgba(255,255,255,0.06);--border2:rgba(255,255,255,0.12);--text:#f0ede8;--muted:rgba(240,237,232,0.45);--muted2:rgba(240,237,232,0.2);--gold:#e8c87a;--gold2:#f5dfa0;--teal:#5ecfb1;--coral:#f07a5a;--red:#f55a5a;--green:#7ecf8a;--r:14px;--r-sm:8px;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;}
#home{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;background:radial-gradient(ellipse at 50% 0%,rgba(94,207,177,0.08) 0%,transparent 55%);}
.badge{font-family:'DM Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:2px;color:var(--teal);border:1px solid rgba(94,207,177,0.3);background:rgba(94,207,177,0.06);padding:5px 14px;border-radius:999px;margin-bottom:20px;}
h1{font-family:'Playfair Display',serif;font-size:clamp(32px,6vw,54px);font-weight:800;text-align:center;line-height:1.05;margin-bottom:8px;}
h1 em{color:var(--teal);font-style:italic;}
.sub{color:var(--muted);font-size:14px;text-align:center;max-width:480px;line-height:1.7;margin-bottom:32px;}
.sujets-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;max-width:600px;width:100%;margin-bottom:28px;}
.sujet-card{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r);padding:18px;cursor:pointer;transition:all 0.2s;position:relative;}
.sujet-card:hover{border-color:rgba(94,207,177,0.4);transform:translateY(-2px);}
.sc-num{font-family:'DM Mono',monospace;font-size:10px;color:var(--teal);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;}
.sc-title{font-family:'Playfair Display',serif;font-size:15px;font-weight:700;margin-bottom:4px;}
.sc-info{font-size:11px;color:var(--muted);font-family:'DM Mono',monospace;}
.sc-done{position:absolute;top:12px;right:12px;width:18px;height:18px;border-radius:50%;background:var(--green);display:none;align-items:center;justify-content:center;font-size:9px;color:#060f0a;}
.who-row{display:flex;gap:10px;margin-bottom:20px;}
.who-btn{padding:8px 22px;border-radius:999px;border:1px solid var(--border2);background:var(--bg2);color:var(--muted);cursor:pointer;font-family:'DM Sans',sans-serif;font-weight:600;font-size:13px;transition:all 0.18s;}
.who-btn.aw{border-color:#7eb8f5;background:rgba(126,184,245,0.1);color:#7eb8f5;}
.who-btn.an{border-color:#f59eb8;background:rgba(245,158,184,0.1);color:#f59eb8;}
#sujet-page{display:none;max-width:760px;margin:0 auto;padding:0;}
.s-header{position:sticky;top:0;z-index:10;background:rgba(9,9,15,0.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;gap:14px;}
.s-logo{font-family:'Playfair Display',serif;font-weight:700;font-size:15px;color:var(--teal);}
.s-meta{font-size:11px;color:var(--muted);font-family:'DM Mono',monospace;}
.back{margin-left:auto;background:none;border:1px solid var(--border2);border-radius:var(--r-sm);padding:7px 14px;color:var(--muted);cursor:pointer;font-size:11px;font-family:'DM Mono',monospace;transition:all 0.15s;text-transform:uppercase;}
.back:hover{background:rgba(255,255,255,0.04);}
.chrono-bar{background:rgba(94,207,177,0.06);border-bottom:1px solid rgba(94,207,177,0.15);padding:8px 24px;display:flex;align-items:center;justify-content:space-between;}
.chrono-time{font-family:'DM Mono',monospace;font-size:18px;font-weight:700;color:var(--teal);}
.chrono-time.urgent{color:var(--red);animation:blink 0.8s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}
.chrono-btns{display:flex;gap:8px;}
.chrono-btn{font-size:11px;padding:4px 12px;border-radius:999px;border:1px solid rgba(94,207,177,0.3);background:rgba(94,207,177,0.07);color:var(--teal);cursor:pointer;font-family:'DM Mono',monospace;transition:all 0.15s;}
.s-body{padding:24px;}
.partie{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r);margin-bottom:20px;overflow:hidden;}
.partie-header{background:var(--bg3);padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;}
.partie-label{font-family:'Playfair Display',serif;font-size:14px;font-weight:700;color:var(--teal);}
.partie-pts{font-family:'DM Mono',monospace;font-size:11px;color:var(--gold);margin-left:auto;}
.partie-time{font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);}
.partie-body{padding:20px;}
.texte-box{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r-sm);padding:20px 22px;margin-bottom:20px;font-family:'Playfair Display',serif;font-size:15px;line-height:1.9;color:var(--text);border-left:2px solid var(--teal);}
.texte-box .auteur{font-size:12px;color:var(--muted);font-family:'DM Mono',monospace;margin-top:12px;text-align:right;}
.q-block{margin-bottom:16px;}
.q-line{display:flex;align-items:flex-start;gap:10px;margin-bottom:8px;}
.q-label{font-family:'DM Mono',monospace;font-size:11px;color:var(--teal);font-weight:700;min-width:24px;margin-top:2px;}
.q-text{font-size:13px;color:var(--text);line-height:1.6;flex:1;}
.q-pts-sm{font-size:10px;color:var(--gold);font-family:'DM Mono',monospace;white-space:nowrap;}
.answer-ta{width:100%;min-height:80px;background:var(--bg);border:1px solid var(--border2);border-radius:var(--r-sm);padding:10px 12px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;line-height:1.6;outline:none;resize:vertical;margin-bottom:6px;transition:border-color 0.2s;}
.answer-ta:focus{border-color:rgba(94,207,177,0.4);}
.redac-ta{min-height:300px;font-family:'Playfair Display',serif;font-size:15px;line-height:1.9;}
.corr-btn{font-size:11px;padding:5px 12px;border-radius:999px;border:1px solid rgba(94,207,177,0.25);background:rgba(94,207,177,0.06);color:var(--teal);cursor:pointer;font-family:'DM Mono',monospace;transition:all 0.15s;}
.corr-btn:hover{background:rgba(94,207,177,0.12);}
.corr-box{display:none;margin-top:8px;padding:12px 14px;background:rgba(126,207,138,0.06);border:1px solid rgba(126,207,138,0.2);border-radius:var(--r-sm);font-size:13px;color:var(--muted);line-height:1.7;}
.corr-box.show{display:block;}
.corr-box strong{color:var(--text);}
.auto-eval{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r);padding:20px;margin-top:20px;}
.ae-title{font-family:'DM Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:2px;color:var(--muted);margin-bottom:16px;}
.ae-row{display:flex;align-items:center;gap:12px;margin-bottom:10px;}
.ae-label{font-size:13px;flex:1;}
.ae-input{width:60px;background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r-sm);padding:6px 10px;color:var(--text);font-family:'DM Mono',monospace;font-size:14px;text-align:center;outline:none;}
.ae-max{font-size:12px;color:var(--muted);font-family:'DM Mono',monospace;}
.ae-total{background:linear-gradient(135deg,rgba(94,207,177,0.1),rgba(94,207,177,0.05));border:1px solid rgba(94,207,177,0.25);border-radius:var(--r-sm);padding:14px;text-align:center;margin-top:14px;}
.ae-total-num{font-family:'Playfair Display',serif;font-size:36px;font-weight:800;color:var(--teal);}
.ae-total-lbl{font-size:11px;color:var(--muted);font-family:'DM Mono',monospace;}
.save-btn{width:100%;background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r);padding:12px;color:var(--muted);cursor:pointer;font-family:'DM Sans',sans-serif;font-size:13px;transition:all 0.15s;margin-top:12px;}
.save-btn:hover{background:rgba(255,255,255,0.04);color:var(--text);}
.nav-btns{display:flex;gap:10px;margin-top:12px;}
.nav-btn{flex:1;padding:12px;border-radius:var(--r);border:1px solid var(--border2);background:var(--bg2);color:var(--muted);cursor:pointer;font-family:'DM Sans',sans-serif;font-size:13px;transition:all 0.15s;}
.nav-btn:hover{background:rgba(255,255,255,0.04);color:var(--text);}
.nav-btn.primary{background:linear-gradient(135deg,var(--teal),#3aad8a);border:none;color:#060f0a;font-weight:700;}
.toast{position:fixed;bottom:24px;right:24px;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r-sm);padding:12px 20px;font-size:12px;z-index:200;opacity:0;transform:translateY(10px);transition:all 0.3s;pointer-events:none;font-family:'DM Mono',monospace;}
.toast.show{opacity:1;transform:translateY(0);}
.toast.ok{border-color:rgba(94,207,177,0.4);color:var(--teal);}
.toast.err{border-color:rgba(245,90,90,0.4);color:var(--red);}
@media(max-width:480px){.sujets-grid{grid-template-columns:1fr;}}

.ai-btn{width:100%;margin-top:8px;background:linear-gradient(135deg,#e8c87a,#d4a840);border:none;border-radius:8px;padding:12px;color:#080600;font-family:'Syne',sans-serif;font-weight:800;font-size:14px;cursor:pointer;transition:all 0.2s;}
.ai-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(232,200,122,0.3);}
.ai-btn:disabled{opacity:0.4;cursor:not-allowed;transform:none;}
.ai-loading{display:none;text-align:center;padding:16px;background:rgba(232,200,122,0.04);border:1px solid rgba(232,200,122,0.12);border-radius:8px;margin-top:8px;}
.ai-spin{width:24px;height:24px;border:2px solid rgba(232,200,122,0.2);border-top-color:#e8c87a;border-radius:50%;animation:aiSp 0.8s linear infinite;margin:0 auto 8px;}
@keyframes aiSp{to{transform:rotate(360deg)}}
.ai-result{display:none;margin-top:10px;border-radius:10px;overflow:hidden;border:1px solid rgba(255,255,255,0.08);}
.ai-score-bar{padding:14px 18px;display:flex;align-items:center;gap:14px;}
.ai-score-num{font-family:'Syne',sans-serif;font-size:38px;font-weight:800;line-height:1;flex-shrink:0;}
.ai-score-info{flex:1;font-size:11px;}
.ai-pbar-bg{height:4px;background:rgba(255,255,255,0.08);border-radius:999px;overflow:hidden;margin-top:5px;}
.ai-pbar-fill{height:100%;border-radius:999px;transition:width 1s ease;}
.ai-body{padding:14px 18px;background:rgba(0,0,0,0.2);font-size:12px;}
.ai-annote{line-height:2;margin-bottom:12px;padding:12px;background:rgba(255,255,255,0.03);border-radius:6px;font-size:13px;}
.ar{background:rgba(245,85,85,0.15);border-bottom:2px solid #f55a5a;cursor:help;position:relative;}
.av{background:rgba(126,207,138,0.12);border-bottom:2px solid #7ecf8a;}
.ar .tt{display:none;position:absolute;bottom:calc(100%+5px);left:0;background:#1a1a26;border:1px solid rgba(255,255,255,0.12);border-radius:6px;padding:8px 12px;font-size:11px;color:#f0ede8;line-height:1.5;z-index:20;min-width:180px;max-width:280px;white-space:normal;}
.ar:hover .tt{display:block;}
.ai-sec{margin-bottom:10px;}
.ai-sec-t{font-family:'DM Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:4px;padding-bottom:3px;border-bottom:1px solid rgba(255,255,255,0.06);}
.ai-sec-b{color:rgba(240,237,232,0.55);line-height:1.6;}
.ai-sec-b ul{margin-left:12px;}.ai-sec-b li{margin-bottom:2px;}
.ai-sec-b strong{color:#f0ede8;}
.ai-r .ai-sec-t{color:#f55a5a;}.ai-v .ai-sec-t{color:#7ecf8a;}
.ai-g .ai-sec-t{color:#e8c87a;}.ai-p .ai-sec-t{color:#a98af5;}
</style>
</head>

  {id:8,titre:'La justice et l\'injustice',texte:`Ce jour-lÃ , Nora avait dÃ©cidÃ© de parler. Depuis des semaines, elle observait en silence. Elle voyait son camarade Alexis copier lors des contrÃ´les, se vanter de ses bonnes notes, pendant que les autres travaillaient dur pour dÃ©crocher des rÃ©sultats modestes.\n\nCe n'Ã©tait pas juste. Cette Ã©vidence la rongeait comme un acide. Et pourtant, parler, c'Ã©tait risquer d'Ãªtre isolÃ©e, d'Ãªtre traitÃ©e de "balance", ce mot terrible qui faisait plus peur que l'injustice elle-mÃªme.\n\nElle attendit la fin du cours et s'approcha du professeur. Sa voix tremblait lÃ©gÃ¨rement. "Monsieur, je dois vous dire quelque chose."\n\nEn sortant de la salle, elle ne savait pas si elle avait bien fait. Mais elle savait une chose : elle pouvait de nouveau se regarder dans un miroir sans se sentir complice.`,auteur:'Texte original — type DNB 2026',comprehension:[{n:'1',pts:2,q:'Quelle situation injuste Nora observe-t-elle ? Expliquez.',c:'Son camarade Alexis triche lors des contrÃ´les et obtient de bonnes notes, alors que les autres Ã©lÃ¨ves travaillent honnÃªtement pour des rÃ©sultats plus modestes.'},{n:'2',pts:3,q:'Quel dilemme vit Nora avant de dÃ©cider de parler ?',c:'Dilemme : parler = risquer l\'isolement social, Ãªtre traitÃ©e de "balance". Se taire = Ãªtre complice d\'une injustice. Elle doit choisir entre sa loyautÃ© envers ses pairs et ses valeurs morales.'},{n:'3',pts:3,q:'Comment interprÃ©tez-vous la derniÃ¨re phrase : "elle pouvait de nouveau se regarder dans un miroir" ?',c:'Se regarder dans un miroir = affronter son propre regard, avoir bonne conscience. "De nouveau" = elle se sentait coupable avant. En parlant, elle retrouve l\'estime d\'elle-mÃªme. MÃ©taphore de l\'intÃ©gritÃ© morale.'},{n:'4',pts:2,q:'Relevez la figure de style dans "Cette Ã©vidence la rongeait comme un acide" et expliquez son effet.',c:'Comparaison (rongeait comme un acide). Effet : montre l\'intensitÃ© douloureuse du sentiment d\'injustice, qui d     ${currentIdx < SUJETS.length - 1 ? `<button class="nav-btn primary" onclick="openSujet(${currentIdx + 1})">Sujet suivant â†’</button>` : `<button class="nav-btn primary" onclick="goHome()">ðŸ Accueil</button>`}
  </div>`;

function updateTotal() { const a = parseInt(document.getElementById('ae1').value) || 0; const b = parseInt(document.getElementById('ae2').value) || 0; const c = parseInt(document.getElementById('ae3').value) || 0; const t = Math.min(a, 20) + Math.min(b, 16) + Math.min(c, 20); const el = document.getElementById('ae-total'); el.textContent = t + '/56'; el.style.color = t >= 45 ? 'var(--green)' : t >= 36 ? 'var(--gold)' : t >= 28 ? 'var(--coral)' : 'var(--red)'; }

async function saveSujet() {
  if (!who) { showToast('SÃ©lectionne Wassil ou Nawal d\'abord', 'err'); return; }
  const s = SUJETS[currentIdx];
  const a = parseInt(document.getElementById('ae1').value) || 0;

  const c = parseInt(document.getElementById('ae3').value) || 0;
  const t = Math.min(a, 20) + Math.min(b, 16) + Math.min(c, 20);
  const done = JSON.parse(localStorage.getItem('fr_done_' + who) || '[]');
  if (!done.includes(s.id)) { done.push(s.id); localStorage.setItem('fr_done_' + who, JSON.stringify(done)); }

    const url = window.CONFIG.SHEETS[who];
    try {
      await fetch(url, { method: 'POST', mode: 'cors', body: JSON.stringify({ action: 'logAnnale', matiere: 'FranÃ§ais', annee: 'Sujet blanc ' + s.id, exercice: s.titre, score: Math.round(t / 56 * 20), pointsPerdus: 'C:' + a + '/20 G:' + b + '/16 R:' + c + '/20', bloque: '', aRetravailler: '' }) });
      showToast('âœ“ Note sauvegardÃ©e', 'ok');

  } else { showToast('Config non chargÃ©e, sauvegarde locale uniquement', 'err'); }

function startChrono() { if (running) return; running = true; chronoInterval = setInterval(() => { if (chronoSecs <= 0) { clearInterval(chronoInterval); running = false; showToast('â± Temps Ã©coulÃ© !', 'err'); return; } chronoSecs--; updateChrono(); }, 1000); }
function resetChrono() { clearInterval(chronoInterval); running = false; chronoSecs = 9000; updateChrono(); }
function updateChrono() { const h = Math.floor(chronoSecs / 3600); const m = Math.floor((chronoSecs % 3600) / 60); const s = chronoSecs % 60; const el = document.getElementById('chrono'); el.textContent = `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`; el.className = 'chrono-time' + (chronoSecs < 600 ? ' urgent' : ''); }
function showToast(msg, t) { const el = document.getElementById('toast'); el.textContent = msg; el.className = 'toast show ' + t; setTimeout(() => el.className = 'toast', 3500); }
window.addEventListener('DOMContentLoaded', () => renderHome());

async function corrigerIA(btnId, taId, question, typeExo, pts, matiere) {
  const texte = document.getElementById(taId).value.trim();
  if (!texte || texte.length < 15) { alert('Ecris ta rÃ©ponse avant de corriger !'); return; }
  if (!window.CONFIG || !window.CONFIG.AI_API_KEY) { alert('ClÃ© API non configurÃ©e (fichier config.js absent ou secret non injectÃ©).'); return; }
  const btn = document.getElementById(btnId);
  const loadEl = document.getElementById(btnId + '_load');
  const resEl = document.getElementById(btnId + '_result');
  btn.disabled = true;
  if (loadEl) loadEl.style.display = 'block';
  if (resEl) resEl.style.display = 'none';

  const prompt = `Tu es correcteur DNB 2026 ${matiere}. Corrige cette rÃ©ponse sur ${pts} pts. JSON uniquement: {"noteTotal":X,"maxTotal":${pts},"sousNotes":"...","annotations":[{"t":"extrait","type":"rouge","c":"commentaire"}],"pointsForts":["..."],"aAmeliorer":["..."],"methodologie":"<p>...</p>","conseil":"Conseil."}`;

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-api-key': window.CONFIG.AI_API_KEY, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
      body: JSON.stringify({ model: 'claude-sonnet-4-6', max_tokens: 1500, system: prompt, messages: [{ role: 'user', content: (question ? 'Question: ' + question + '\n\n' : '') + 'RÃ©ponse Ã©lÃ¨ve:\n\n' + texte + '\n\nJSON uniquement.' }] })
    });
    const data = await res.json();
    const json = JSON.parse(data.content[0].text.replace(/```json|```/g, '').trim());
    renderAIRes(resEl, json, texte);
  } catch(e) { alert('Erreur IA: ' + e.message); }
  if (loadEl) loadEl.style.display = 'none';
  btn.disabled = false;
}

function renderAIRes(el, j, orig) {
  const pct = Math.round(j.noteTotal / j.maxTotal * 100);
  const col = pct >= 75 ? '#7ecf8a' : pct >= 55 ? '#e8c87a' : '#f55a5a';
  const bg = pct >= 75 ? 'rgba(126,207,138,0.08)' : pct >= 55 ? 'rgba(232,200,122,0.08)' : 'rgba(245,85,85,0.08)';
  const barCol = pct >= 75 ? 'linear-gradient(90deg,#7ecf8a,#5ecfb1)' : pct >= 55 ? 'linear-gradient(90deg,#e8c87a,#f07a5a)' : 'linear-gradient(90deg,#f55a5a,#f07a5a)';
  let html = `<div class="ai-score-bar" style="background:${bg}"><div class="ai-score-num" style="color:${col}">${j.noteTotal}/${j.maxTotal}</div><div class="ai-score-info"><div style="font-weight:700;color:${col}">${pct >= 75 ? 'Excellent !' : pct >= 55 ? 'Ã€ amÃ©liorer' : 'Insuffisant'}</div><div style="color:rgba(240,237,232,0.45);margin-top:2px">${j.sousNotes || ''}</div><div class="ai-pbar-bg"><div class="ai-pbar-fill" id="${el.id}_pb" style="width:0%;background:${barCol}"></div></div></div></div><div class="ai-body">`;
  if (j.pointsForts && j.pointsForts.length) html += `<div class="ai-sec ai-v"><div class="ai-sec-t">Points forts</div><div class="ai-sec-b"><ul>${j.pointsForts.map(p => '<li>' + p + '</li>').join('')}</ul></div></div>`;
  if (j.aAmeliorer && j.aAmeliorer.length) html += `<div class="ai-sec ai-r"><div class="ai-sec-t">Ã€ amÃ©liorer</div><div class="ai-sec-b"><ul>${j.aAmeliorer.map(p => '<li>' + p + '</li>').join('')}</ul></div></div>`;
  if (j.methodologie) html += `<div class="ai-sec ai-g"><div class="ai-sec-t">MÃ©thodologie attendue</div><div class="ai-sec-b">${j.methodologie}</div></div>`;
  if (j.conseil) html += `<div class="ai-sec ai-p"><div class="ai-sec-t">Conseil prioritaire</div><div class="ai-sec-b"><strong>${j.conseil}</strong></div></div>`;
  html += `</div>`;
  el.innerHTML = html;
  el.style.display = 'block';
  setTimeout(() => { const b = document.getElementById(el.id + '_pb'); if (b) b.style.width = pct + '%'; }, 100);
}
