const SUJETS = [
  // SUJET 1
  { id:1, titre:"La nature et l'identité",
    texte:"La forêt était silencieuse ce matin-là, d'un silence épais et vivant. Thomas avançait entre les arbres centenaires, leurs troncs couverts de mousse humide, leurs branches formant une voûte impénétrable au-dessus de sa tête. Il avait fui la ville depuis trois jours maintenant, laissant derrière lui les écrans, les notifications, le bruit constant de la vie moderne.\nIci, dans ce sous-bois où la lumière filtrait à peine, il retrouvait quelque chose d'essentiel. Peut-être était-ce simplement le silence. Ou peut-être était-ce ce sentiment étrange d'être infiniment petit face à ces géants végétaux qui avaient vu passer des générations entières.\nIl posa sa main sur un chêne noueux, vieux de plusieurs siècles. 'Toi, tu as tout vu', murmura-t-il. L'arbre ne répondit pas, bien sûr. Mais Thomas eut l'impression, fugace et troublante, d'être entendu.",
    auteur:"Texte original – DNB 2026",
    dictee:"La forêt était silencieuse ce matin-là. Thomas avançait entre les arbres centenaires. Il avait fui la ville depuis trois jours. Ici, il retrouvait l'essentiel.",
    comprehension:[
      {q:"Où se trouve Thomas ? Relevez trois éléments du texte qui décrivent ce lieu.", pts:3, rep:"Thomas est dans une forêt. Éléments : 'arbres centenaires', 'troncs couverts de mousse humide', 'branches formant une voûte impénétrable'."},
      {q:"Pourquoi Thomas a-t-il quitté la ville ? Citez le texte.", pts:2, rep:"Il a fui la ville pour retrouver le calme. Citation : 'laissant derrière lui les écrans, les notifications, le bruit constant de la vie moderne.'"},
      {q:"Relevez une figure de style et nommez-la.", pts:2, rep:"Métaphore : 'voûte impénétrable' ou 'géants végétaux'."},
      {q:"Quel sentiment Thomas éprouve-t-il au contact de l'arbre ?", pts:3, rep:"Il se sent entendu, en communion avec la nature."}
    ],
    grammaire:[
      {q:"Donnez la nature et la fonction de 'silencieuse' dans la première phrase.", pts:2, rep:"Adjectif qualificatif – attribut du sujet 'la forêt'."},
      {q:"Réécrivez au passé simple : 'Il pose sa main sur un chêne noueux.'", pts:2, rep:"Il posa sa main sur un chêne noueux."},
      {q:"Identifiez la proposition subordonnée dans : 'Il avait fui la ville, laissant derrière lui les écrans.'", pts:2, rep:"'laissant derrière lui les écrans' = proposition participiale."},
      {q:"Relevez un exemple de discours direct.", pts:2, rep:"'Toi, tu as tout vu' – donne de l'émotion."}
    ],
    redaction:{ sujet1:"Comme Thomas, racontez un moment où vous avez ressenti le besoin de vous éloigner du bruit du monde.", sujet2:"Pensez-vous que la nature soit indispensable au bien-être de l'être humain ? Argumentez.", pts:20}
  },
  // SUJET 2 - Mémoire
  { id:2, titre:"La mémoire et le temps qui passe",
    texte:"Grand-mère avait quatre-vingt-deux ans et une mémoire extraordinaire. Non pas pour les événements récents — ceux-là, elle les oubliait aussi vite qu'ils arrivaient — mais pour les souvenirs anciens, ceux d'avant, quand le monde était différent.\nElle pouvait décrire avec une précision stupéfiante la robe qu'elle portait le jour de son premier bal, en 1958. Elle se souvenait de l'odeur exacte du pain frais que sa mère sortait du four chaque dimanche matin. Elle revoyait encore, les yeux fermés, le visage de son frère disparu à la guerre, un frère qu'elle n'avait plus vu depuis soixante ans.\n'Le passé est plus réel que le présent', disait-elle parfois avec un sourire mélancolique. Sa petite-fille Camille, assise en face d'elle, l'écoutait avec un mélange d'admiration et d'inquiétude.",
    auteur:"Texte original – DNB 2026",
    dictee:"Grand-mère avait quatre-vingt-deux ans et une mémoire extraordinaire. Elle se souvenait de chaque détail de sa jeunesse. 'Le passé est plus réel que le présent', disait-elle.",
    comprehension:[
      {q:"Quelle particularité a la mémoire de la grand-mère ?", pts:3, rep:"Elle se souvient très bien du passé lointain mais oublie les événements récents."},
      {q:"Citez trois souvenirs précis de la grand-mère.", pts:3, rep:"La robe du premier bal en 1958, l'odeur du pain frais, le visage de son frère disparu."},
      {q:"Quel sentiment Camille ressent-elle ?", pts:2, rep:"Admiration et inquiétude."},
      {q:"Expliquez la phrase : 'Le passé est plus réel que le présent'.", pts:2, rep:"Pour la grand-mère, ses souvenirs sont plus vivants que la réalité présente qu'elle oublie."}
    ],
    grammaire:[
      {q:"Analysez le GN 'sa petite-fille Camille'.", pts:2, rep:"'sa' = déterminant possessif, 'petite-fille' = nom, 'Camille' = nom propre en apposition."},
      {q:"Conjuguez 'disparaître' au plus-que-parfait, 3e pers. sing.", pts:2, rep:"il avait disparu"},
      {q:"Identifiez la subordonnée dans 'Mais ils l'empêchaient de vivre dans le présent'.", pts:2, rep:"'de vivre dans le présent' = proposition infinitive complément."},
      {q:"Mettez au discours indirect : Elle disait 'Le passé est plus réel que le présent'.", pts:2, rep:"Elle disait que le passé était plus réel que le présent."}
    ],
    redaction:{ sujet1:"Racontez une rencontre avec une personne âgée qui vous a marqué(e).", sujet2:"La mémoire fait-elle partie de l'identité d'une personne ? Argumentez.", pts:20}
  },
  // SUJET 3 - Engagement
  { id:3, titre:"L'engagement et la jeunesse",
    texte:"À seize ans, Léa avait décidé de changer le monde. Ses amis trouvaient cela amusant — parfois attendrissant, parfois irritant. 'Tu ne peux pas sauver la planète toute seule', lui répétait souvent son frère aîné avec une condescendance affectueuse.\nMais Léa ne voulait pas sauver la planète toute seule. Elle voulait juste faire sa part. Depuis six mois, elle organisait des collectes de nourriture pour les familles en difficulté de son quartier. Elle avait convaincu trois restaurants du centre-ville de donner leurs invendus chaque soir. Elle avait créé un groupe de vingt bénévoles, lycéens comme elle, qui se relayaient pour distribuer les repas.\nCe soir-là, en regardant une vieille dame sourire en recevant son plateau, Léa comprit quelque chose d'important : on ne change pas le monde en une fois. On le change repas par repas, sourire par sourire, geste par geste.",
    auteur:"Texte original – DNB 2026",
    dictee:"Léa avait décidé de changer le monde. Elle organisait des collectes de nourriture. Elle avait convaincu trois restaurants de donner leurs invendus. On change le monde geste par geste.",
    comprehension:[
      {q:"Comment les autres perçoivent-ils l'engagement de Léa ?", pts:2, rep:"Ses amis trouvent cela amusant, attendrissant ou irritant. Son frère le voit avec condescendance."},
      {q:"Quelles actions concrètes Léa a-t-elle menées ?", pts:3, rep:"Collectes de nourriture, convaincu trois restaurants de donner leurs invendus, créé un groupe de 20 bénévoles."},
      {q:"Quelle leçon Léa tire-t-elle de son expérience ?", pts:3, rep:"On change le monde petit à petit, repas par repas, geste par geste."},
      {q:"Relevez une figure de style dans la dernière phrase.", pts:2, rep:"Anaphore : 'repas par repas, sourire par sourire, geste par geste'."}
    ],
    grammaire:[
      {q:"Fonction de 'toute seule' dans 'Tu ne peux pas sauver la planète toute seule'.", pts:2, rep:"Attribut du sujet 'Tu'."},
      {q:"Mode et temps de 'avait décidé'.", pts:2, rep:"Plus-que-parfait de l'indicatif – action antérieure au récit."},
      {q:"Transformez à la voix passive : 'Elle avait convaincu trois restaurants'.", pts:2, rep:"Trois restaurants avaient été convaincus par elle."},
      {q:"Relevez une proposition subordonnée relative.", pts:2, rep:"'qui se relayaient pour distribuer les repas' – antécédent 'bénévoles'."}
    ],
    redaction:{ sujet1:"Racontez une action solidaire à laquelle vous avez participé ou aimeriez participer.", sujet2:"L'engagement citoyen est-il une responsabilité pour chaque individu ? Argumentez.", pts:20}
  },
  // SUJET 4 - Science
  { id:4, titre:"La science et le progrès",
    texte:"Le laboratoire était désert à cette heure-là. Seule Inès, vingt-huit ans, doctorante en biologie marine, travaillait encore sous la lumière froide des néons. Sur son écran s'affichaient des séquences d'ADN, colonnes de lettres incompréhensibles pour le commun des mortels, mais qui représentaient pour elle quelque chose d'extraordinaire : la possibilité de comprendre pourquoi certains coraux résistaient au blanchissement quand d'autres mouraient.\nTrois ans de travail. Des milliers d'heures passées à analyser des échantillons. Et peut-être, dans quelques semaines, une réponse.\nElle pensa à ses parents, pêcheurs en Bretagne, qui lui avaient appris à respecter la mer avant de lui apprendre à lire. 'La mer nourrit, mais elle se souvient', disait son père. Il avait raison, d'une façon qu'il n'imaginait pas : la mer se souvenait de chaque pollution, de chaque degré de réchauffement, de chaque erreur humaine.",
    auteur:"Texte original – DNB 2026",
    dictee:"Le laboratoire était désert. Seule Inès, doctorante en biologie marine, travaillait encore. Trois ans de travail. La mer se souvient de chaque pollution.",
    comprehension:[
      {q:"Qui est Inès et quel est son domaine de recherche ?", pts:2, rep:"Doctorante en biologie marine. Elle étudie la résistance des coraux au blanchissement."},
      {q:"Quels éléments montrent son investissement ?", pts:3, rep:"'Trois ans de travail', 'des milliers d'heures', 'travaillait encore sous les néons'."},
      {q:"Expliquez la phrase : 'la mer se souvient de chaque pollution'.", pts:3, rep:"La mer garde les traces des actions humaines. Inès mesure ces impacts grâce à la science."},
      {q:"Quel rôle jouent les parents d'Inès dans sa vocation ?", pts:2, rep:"Ils lui ont transmis le respect de la mer."}
    ],
    grammaire:[
      {q:"Analysez la proposition 'qui lui avaient appris à respecter la mer'.", pts:2, rep:"Proposition subordonnée relative, complément du nom 'parents'."},
      {q:"Donnez la nature et la fonction de 'doctorante en biologie marine'.", pts:2, rep:"Groupe nominal en apposition à 'Inès'."},
      {q:"Réécrivez avec 'elles' : 'Elle pensa à ses parents...'", pts:2, rep:"Elles pensèrent à leurs parents, pêcheurs en Bretagne."},
      {q:"Identifiez le temps et le mode de 's'affichaient'.", pts:2, rep:"Imparfait de l'indicatif – description dans le passé."}
    ],
    redaction:{ sujet1:"Racontez une découverte scientifique qui vous a marqué(e).", sujet2:"Progrès scientifique et respect de la nature sont-ils compatibles ? Argumentez.", pts:20}
  },
  // SUJET 5 - Amitié
  { id:5, titre:"L'amitié et la différence",
    texte:"Ils étaient amis depuis l'enfance, ce qui n'avait jamais empêché leurs désaccords. Mathieu était grand, sportif, peu bavard. Sofiane était petit, passionné de musique, incapable de rester silencieux plus de trois minutes. Ils n'avaient, en apparence, aucun point commun.\nEt pourtant. Depuis la sixième, ils se retrouvaient chaque mercredi midi au même banc, dans la cour du collège. Mathieu mangeait ses sandwichs en silence. Sofiane parlait. Parfois de ses rêves musicaux, parfois de ses peurs, parfois de ses colères. Mathieu écoutait, hochait la tête, et parfois, rarement, disait une phrase qui valait mieux que mille mots.\n'L'amitié, ce n'est pas d'avoir les mêmes goûts', avait dit un jour leur professeur de français. 'C'est de se choisir malgré les différences.'",
    auteur:"Texte original – DNB 2026",
    dictee:"Mathieu était grand et peu bavard. Sofiane était passionné de musique. Ils se retrouvaient chaque mercredi midi. L'amitié, c'est se choisir malgré les différences.",
    comprehension:[
      {q:"Décrivez les personnalités de Mathieu et Sofiane.", pts:2, rep:"Mathieu : grand, sportif, peu bavard. Sofiane : petit, passionné de musique, très bavard."},
      {q:"Comment leur amitié se manifeste-t-elle concrètement ?", pts:3, rep:"Chaque mercredi midi, même banc. Mathieu mange en silence, Sofiane parle. Mathieu écoute et dit parfois une phrase profonde."},
      {q:"Expliquez la citation du professeur.", pts:3, rep:"L'amitié repose sur le choix de s'apprécier malgré les différences, pas sur les points communs."},
      {q:"Relevez l'expression 'une phrase qui valait mieux que mille mots' et commentez-la.", pts:2, rep:"Hyperbole : les paroles rares de Mathieu sont très profondes."}
    ],
    grammaire:[
      {q:"Analysez la proposition 'ce qui n'avait jamais empêché leurs désaccords'.", pts:2, rep:"Proposition subordonnée relative, antécédent 'ce'."},
      {q:"Conjuguez 'se choisir' à l'imparfait du subjonctif, 3e pers. pl.", pts:2, rep:"qu'ils se choisissent (subjonctif présent)."},
      {q:"Analysez 'malgré les différences'.", pts:2, rep:"Groupe prépositionnel, CC de concession."},
      {q:"Mettez au discours direct : 'Sofiane avait dit qu'il ne savait pas encore.'", pts:2, rep:"Sofiane avait dit : 'Je ne sais pas encore.'"}
    ],
    redaction:{ sujet1:"Racontez une amitié importante. Qu'est-ce qui vous unit malgré les différences ?", sujet2:"La différence est-elle une richesse ou un obstacle dans les relations humaines ? Argumentez.", pts:20}
  },
  // SUJET 6 - Courage
  { id:6, titre:"Le courage et la peur",
    texte:"La peur est une chose étrange. Elle peut paralyser ou pousser à agir. Elle peut être la plus grande ennemie de l'homme ou, paradoxalement, sa meilleure alliée.\nAntoine, pompier depuis quinze ans, connaissait la peur intimement. Chaque intervention, même la plus banale, portait en elle ce frisson caractéristique dans la nuque, cette accélération du cœur, cette conscience aiguë du danger. 'Celui qui te dit qu'il n'a pas peur en entrant dans un bâtiment en feu, c'est soit un menteur, soit un fou', expliquait-il souvent.\nPourtant, il continuait. Non pas malgré la peur, mais grâce à elle. Elle le maintenait vigilant, attentif, présent. C'était elle qui lui avait sauvé la vie lors de cet effondrement à Lyon, en 2018 — ce pressentiment fulgurant qui l'avait fait reculer deux secondes avant que le plafond ne s'effondre.\nLa peur n'est pas le contraire du courage. Elle en est la condition.",
    auteur:"Texte original – DNB 2026",
    dictee:"La peur peut paralyser ou pousser à agir. Antoine, pompier, connaissait la peur. Non pas malgré la peur, mais grâce à elle. La peur n'est pas le contraire du courage.",
    comprehension:[
      {q:"Comment Antoine définit-il la peur chez un pompier ?", pts:2, rep:"'Frisson dans la nuque, accélération du cœur, conscience aiguë du danger'."},
      {q:"En quoi la peur est-elle présentée comme positive ?", pts:3, rep:"Elle maintient vigilant, attentif. Elle lui a sauvé la vie. 'La peur est la condition du courage.'"},
      {q:"Relevez deux figures de style dans le troisième paragraphe.", pts:2, rep:"Antithèse ('Non pas malgré, mais grâce'), métaphore ('pressentiment fulgurant')."},
      {q:"Que s'est-il passé à Lyon en 2018 ?", pts:3, rep:"Un plafond allait s'effondrer ; Antoine a reculé deux secondes avant, sauvant sa vie."}
    ],
    grammaire:[
      {q:"Nature et fonction de 'paradoxalement'.", pts:2, rep:"Adverbe de manière, CC de manière."},
      {q:"Réécrivez au pluriel : 'La peur est une chose étrange.'", pts:2, rep:"Les peurs sont des choses étranges."},
      {q:"Analysez 'qui l'avait fait reculer'.", pts:2, rep:"Proposition subordonnée relative, antécédent 'pressentiment'."},
      {q:"Conjuguez 's'effondrer' au conditionnel passé, 3e pers. sg.", pts:2, rep:"il/elle se serait effondré(e)"}
    ],
    redaction:{ sujet1:"Racontez un moment où vous avez surmonté une peur importante.", sujet2:"Le courage consiste-t-il à ne pas avoir peur ou à agir malgré la peur ? Argumentez.", pts:20}
  },
  // SUJET 7 - Exil
  { id:7, titre:"L'exil et les racines",
    texte:"Ma grand-mère gardait dans une boîte en fer-blanc, sous son lit, les seules choses qu'elle avait emportées de son pays. Une photo jaunie de ses parents, debout devant une maison que je n'ai jamais vue. Un petit carnet avec des adresses griffonnées à l'encre violette. Et une poignée de terre, sèche et rouge, enveloppée dans un carré de tissu.\n'Pourquoi tu gardes de la terre ?' lui avais-je demandé un jour, enfant.\nElle avait souri. 'Pour me souvenir que j'ai des racines, même quand je n'ai plus de sol sous les pieds.'\nJe n'avais pas compris, à l'époque. J'ai mis des années à comprendre : on peut perdre son pays, sa maison, ses habitudes, sa langue même — mais on ne perd jamais ce qu'on porte en soi. L'identité n'est pas un lieu. C'est une mémoire.",
    auteur:"Texte original – DNB 2026",
    dictee:"Ma grand-mère gardait une photo de ses parents et une poignée de terre. 'Pour me souvenir que j'ai des racines', disait-elle. L'identité n'est pas un lieu, c'est une mémoire.",
    comprehension:[
      {q:"Quels objets la grand-mère a-t-elle emportés ?", pts:2, rep:"Photo de ses parents, carnet d'adresses, terre. Ils représentent ses origines, son identité."},
      {q:"Expliquez la métaphore de la terre et des racines.", pts:3, rep:"La terre = pays natal, les racines = identité. Même sans 'sol', elle garde ses 'racines'."},
      {q:"Que comprend finalement le narrateur ?", pts:3, rep:"'L'identité n'est pas un lieu. C'est une mémoire.'"},
      {q:"Quel est le registre de ce texte ?", pts:2, rep:"Lyrique et autobiographique (1re personne, souvenirs, émotions)."}
    ],
    grammaire:[
      {q:"Analysez 'enveloppée dans un carré de tissu'.", pts:2, rep:"Participe passé épithète de 'terre'."},
      {q:"Réécrivez au style indirect : 'Pour me souvenir que j'ai des racines.'", pts:2, rep:"Elle répondit qu'elle le gardait pour se souvenir qu'elle avait des racines."},
      {q:"Identifiez les deux propositions de la dernière phrase.", pts:2, rep:"'L'identité n'est pas un lieu' (principale) ; 'C'est une mémoire' (principale juxtaposée)."},
      {q:"Relevez les connecteurs logiques du dernier paragraphe.", pts:2, rep:"'mais' (opposition), 'même' (insistance)."}
    ],
    redaction:{ sujet1:"Qu'est-ce qui constitue votre identité ? Racontez à l'aide d'un souvenir ou d'un objet.", sujet2:"Peut-on garder son identité quand on quitte son pays ou sa culture ? Argumentez.", pts:20}
  },
  // SUJET 8 - Justice
  { id:8, titre:"La justice et l'injustice",
    texte:"Ce jour-là, Nora avait décidé de parler. Depuis des semaines, elle observait en silence. Elle voyait son camarade Alexis copier lors des contrôles, se vanter de ses bonnes notes, pendant que les autres travaillaient dur pour décrocher des résultats modestes.\nCe n'était pas juste. Cette évidence la rongeait comme un acide. Et pourtant, parler, c'était risquer d'être isolée, d'être traitée de 'balance', ce mot terrible qui faisait plus peur que l'injustice elle-même.\nElle attendit la fin du cours et s'approcha du professeur. Sa voix tremblait légèrement. 'Monsieur, je dois vous dire quelque chose.'\nEn sortant de la salle, elle ne savait pas si elle avait bien fait. Mais elle savait une chose : elle pouvait de nouveau se regarder dans un miroir sans se sentir complice.",
    auteur:"Texte original – DNB 2026",
    dictee:"Nora observait son camarade copier. L'injustice la rongeait. Elle décida de parler. Elle pouvait de nouveau se regarder dans un miroir sans se sentir complice.",
    comprehension:[

      {q:"Quel dilemme vit Nora ?", pts:3, rep:"Parler = risque d'être isolée, traitée de 'balance'. Se taire = se sentir complice de l'injustice."},
      {q:"Interprétez 'elle pouvait de nouveau se regarder dans un miroir'.", pts:3, rep:"Elle a retrouvé l'estime de soi, la conscience tranquille. Métaphore de l'intégrité morale."},
      {q:"Relevez la figure de style dans 'Cette évidence la rongeait comme un acide'.", pts:2, rep:"Comparaison – montre la douleur intense de l'injustice."}
    ],
    grammaire:[
      {q:"Mode et temps de 'avait décidé'.", pts:2, rep:"Plus-que-parfait de l'indicatif – action antérieure au récit."},
      {q:"Analysez 'ce mot terrible qui faisait plus peur que l'injustice'.", pts:2, rep:"'ce mot terrible' = GN, 'qui faisait...' = subordonnée relative."},
      {q:"Transformez à la voix passive : 'Nora observait son camarade.'", pts:2, rep:"Son camarade était observé par Nora."},
      {q:"Réécrivez avec 'ils' (Nora et Marie).", pts:2, rep:"Ils avaient décidé de parler."}
    ],
    redaction:{ sujet1:"Racontez un moment où vous avez été confronté(e) à une injustice.", sujet2:"Faut-il toujours dénoncer une injustice, même si cela nous coûte ? Argumentez.", pts:20}
  },
  // SUJET 9 - Création
  { id:9, titre:"La liberté et la création",
    texte:"Peindre avait toujours été, pour Nina, une façon de respirer. Pas de parler — elle n'aimait pas les mots — mais de respirer. De laisser sortir ce qui s'accumulait silencieusement quelque part entre la gorge et le ventre.\nSa chambre était couverte de ses tableaux. Pas de belles scènes ordonnées, pas de paysages reconnaissables. Des couleurs qui se heurtaient, des formes qui semblaient chercher quelque chose sans jamais le trouver. Sa mère les regardait avec une perplexité bienveillante. Son professeur d'arts plastiques, lui, avait dit quelque chose qui avait tout changé : 'Quand je regarde tes tableaux, je ressens quelque chose de vrai.'\nNina avait répété cette phrase des dizaines de fois. Elle n'avait peut-être pas de talent académique. Mais elle avait quelque chose de plus rare : elle savait comment transformer la douleur en couleur.",

function afficherSujets() {
  const container = document.getElementById('sujets');
  container.innerHTML = '';
  SUJETS.forEach((s, i) => {
    const div = document.createElement('div');
    div.className = 'sujet';
    // Titre
    div.innerHTML = `<h3>Sujet ${i+1} : ${s.titre}</h3>`;
    // Texte
    div.innerHTML += `<div class="texte"><strong>Texte :</strong><br>${s.texte.replace(/\n/g,'<br>')}<br><em>${s.auteur}</em></div>`;
    
    // DICTÉE
    div.innerHTML += `<div><strong>Dictée (6 points)</strong></div>`;
    div.innerHTML += `<textarea id="dictee-${i}" class="dictee" placeholder="Écris la dictée ici... (le texte sera lu trois fois)"></textarea>`;
    div.innerHTML += `<button onclick="corrigerDictee('dictee-${i}', ${i})">Corriger la dictée avec IA</button>`;
    div.innerHTML += `<div id="correction-dictee-${i}" class="correction"></div>`;
    
    // COMPRÉHENSION
    div.innerHTML += `<div><strong>Compréhension (${s.comprehension.reduce((a,q)=>a+q.pts,0)} points)</strong></div>`;
    s.comprehension.forEach((q, j) => {
      div.innerHTML += `<div>${j+1}. ${q.q} (${q.pts}pts)</div>`;
      div.innerHTML += `<textarea id="comp-${i}-${j}" class="reponse" placeholder="Votre réponse..."></textarea>`;
      div.innerHTML += `<button onclick="corrigerReponse('comp-${i}-${j}', '${q.rep.replace(/'/g, "\\'")}', ${q.pts})">Corriger avec IA</button>`;
      div.innerHTML += `<button onclick="afficherCorrection('corr-comp-${i}-${j}')">Voir correction</button>`;
      div.innerHTML += `<div id="corr-comp-${i}-${j}" class="correction">${q.rep}</div>`;
    });
    
    // GRAMMAIRE
    div.innerHTML += `<div><strong>Grammaire (${s.grammaire.reduce((a,g)=>a+g.pts,0)} points)</strong></div>`;
    s.grammaire.forEach((g, k) => {
      div.innerHTML += `<div>${k+1}. ${g.q} (${g.pts}pts)</div>`;
      div.innerHTML += `<textarea id="gram-${i}-${k}" class="reponse" placeholder="Votre réponse..."></textarea>`;
      div.innerHTML += `<button onclick="corrigerReponse('gram-${i}-${k}', '${g.rep.replace(/'/g, "\\'")}', ${g.pts})">Corriger avec IA</button>`;
      div.innerHTML += `<button onclick="afficherCorrection('corr-gram-${i}-${k}')">Voir correction</button>`;
      div.innerHTML += `<div id="corr-gram-${i}-${k}" class="correction">${g.rep}</div>`;
    });
    
    // RÉDACTION
    div.innerHTML += `<div><strong>Rédaction (${s.redaction.pts} points)</strong><br>`;
    div.innerHTML += `Choix A : ${s.redaction.sujet1}<br>`;
    div.innerHTML += `Choix B : ${s.redaction.sujet2}<br>`;
    div.innerHTML += `<textarea id="redac-${i}" class="redaction" placeholder="Votre rédaction (environ 300 mots)..."></textarea>`;
    div.innerHTML += `<button onclick="corrigerRedaction('redac-${i}', ${s.redaction.pts})">Corriger la rédaction avec IA</button>`;
    
    div.innerHTML += `<hr>`;
    container.appendChild(div);
  });
}

// Correction dictée
async function corrigerDictee(idTextarea, sujetIndex) {
  const texteEleve = document.getElementById(idTextarea).value.trim();
  if (!texteEleve) { alert("Écris la dictée avant de corriger."); return; }
  if (!window.CONFIG || !window.CONFIG.AI_API_KEY || window.CONFIG.AI_API_KEY === "__API_KEY__") {
    alert("Clé API non configurée. Vérifie les secrets GitHub.");
    return;
  }
  const dicteeOfficielle = SUJETS[sujetIndex].dictee;
  const prompt = `Compare la dictée de l'élève avec le texte officiel. Compte les erreurs (orthographe, grammaire, ponctuation, accords). Note sur 6 points (chaque faute enlève 0.5 point). Réponds uniquement en JSON : {"note": nombre, "commentaire": "détail des erreurs", "conseil": "conseil pour progresser"}`;
  try {
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json", "x-api-key": window.CONFIG.AI_API_KEY, "anthropic-version": "2023-06-01" },
      body: JSON.stringify({ model: "claude-sonnet-4-6", max_tokens: 500, system: prompt, messages: [{ role: "user", content: `Texte officiel : "${dicteeOfficielle}"\nDictée élève : "${texteEleve}"` }] })
    });
    const data = await res.json();
    const json = JSON.parse(data.content[0].text);
    document.getElementById(`correction-dictee-${sujetIndex}`).innerHTML = `<strong>Note : ${json.note}/6</strong><br>${json.commentaire}<br><strong>Conseil :</strong> ${json.conseil}`;
    document.getElementById(`correction-dictee-${sujetIndex}`).style.display = 'block';
  } catch(e) { alert("Erreur IA : " + e.message); }
}

// Correction réponse (compréhension / grammaire)
async function corrigerReponse(idTextarea, reponseAttendue, pts) {
  const texte = document.getElementById(idTextarea).value.trim();
  if (!texte) { alert("Écris ta réponse avant de corriger."); return; }
  if (!window.CONFIG || !window.CONFIG.AI_API_KEY || window.CONFIG.AI_API_KEY === "__API_KEY__") {
    alert("Clé API non configurée.");
    return;
  }
  const prompt = `Corrige cette réponse d'élève. Réponse attendue : "${reponseAttendue}". Réponse élève : "${texte}". Attribue une note sur ${pts} et un commentaire court. Réponds en JSON : {"note": nombre, "commentaire": "texte"}`;
  try {
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json", "x-api-key": window.CONFIG.AI_API_KEY, "anthropic-version": "2023-06-01" },
      body: JSON.stringify({ model: "claude-sonnet-4-6", max_tokens: 300, system: prompt, messages: [{ role: "user", content: prompt }] })
    });
    const data = await res.json();
    const json = JSON.parse(data.content[0].text);
    alert(`Note : ${json.note}/${pts}\n${json.commentaire}`);
  } catch(e) { alert("Erreur IA : " + e.message); }
}

// Correction rédaction
async function corrigerRedaction(idTextarea, pts) {
  const texte = document.getElementById(idTextarea).value.trim();
  if (!texte) { alert("Écris ta rédaction avant de corriger."); return; }
  if (!window.CONFIG || !window.CONFIG.AI_API_KEY || window.CONFIG.AI_API_KEY === "__API_KEY__") {
    alert("Clé API non configurée.");
    return;
  }
  const prompt = `Corrige cette rédaction (brevet). Note sur ${pts} points selon : pertinence (4), structure (4), richesse (4), style (4), orthographe (4). Réponds en JSON : {"note": nombre, "commentaire": "détail des points forts et axes d'amélioration"}`;
  try {
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json", "x-api-key": window.CONFIG.AI_API_KEY, "anthropic-version": "2023-06-01" },
      body: JSON.stringify({ model: "claude-sonnet-4-6", max_tokens: 600, system: prompt, messages: [{ role: "user", content: "Rédaction:\n" + texte }] })
    });
    const data = await res.json();
    const json = JSON.parse(data.content[0].text);
    alert(`Note : ${json.note}/${pts}\n${json.commentaire}`);
  } catch(e) { alert("Erreur IA : " + e.message); }
}

function afficherCorrection(id) {
  const el = document.getElementById(id);
  el.style.display = el.style.display === 'none' ? 'block' : 'none';
}
