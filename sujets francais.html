<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Français - 10 sujets blancs DNB</title>
<style>
  body { background: #09090f; color: #f0ede8; font-family: 'DM Sans', sans-serif; padding: 2rem; }
  .container { max-width: 1000px; margin: 0 auto; }
  .sujet { background: #111118; border-left: 5px solid #5ecfb1; margin: 2rem 0; padding: 1.5rem; border-radius: 12px; }
  .texte { background: #0a0a12; padding: 1rem; border-radius: 8px; margin: 1rem 0; white-space: pre-wrap; }
  .document { background: #0a1a1a; padding: 0.8rem; margin: 0.5rem 0; border-radius: 6px; border-left: 3px solid #5ecfb1; white-space: pre-wrap; }
  textarea { width: 100%; background: #181820; border: 1px solid #2a2a35; color: #f0ede8; padding: 0.8rem; margin: 0.5rem 0; border-radius: 8px; font-size: 0.95rem; line-height: 1.5; font-family: 'DM Mono', monospace; resize: vertical; }
  textarea.dictee { min-height: 200px; }
  textarea.redaction { min-height: 250px; }
  button { background: #5ecfb1; border: none; padding: 0.4rem 0.8rem; border-radius: 6px; cursor: pointer; margin-right: 0.5rem; margin-top: 0.3rem; font-size: 0.8rem; color: #09090f; font-weight: 600; }
  button:hover { background: #7edcb8; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .correction { display: none; margin-top: 0.5rem; background: #0a0a12; padding: 0.8rem; border-radius: 8px; font-size: 0.9rem; white-space: pre-wrap; }
  .feedback-buttons { margin-top: 0.4rem; display: flex; gap: 0.5rem; }
  .btn-copy, .btn-pdf { background: #1a1a26; border: 1px solid #5ecfb1; color: #5ecfb1; padding: 0.3rem 0.6rem; border-radius: 6px; font-size: 0.75rem; cursor: pointer; transition: 0.1s; }
  .btn-copy:hover, .btn-pdf:hover { background: #2a2a36; }
  hr { border-color: #2a2a35; margin: 1rem 0; }
  h3 { color: #5ecfb1; }
  .badge { display: inline-block; background: #5ecfb120; color: #5ecfb1; padding: 0.2rem 0.6rem; border-radius: 999px; font-size: 0.7rem; margin-left: 0.5rem; }
  .question { margin-top: 1rem; }
  .loading { color: #5ecfb1; font-style: italic; }
  .erreur { color: #e87a7a; }
  
  @media print {
    body * { visibility: hidden; }
    .print-correction, .print-correction * { visibility: visible; }
    .print-correction { position: absolute; top: 0; left: 0; width: 100%; }
    .no-print { display: none; }
    button { display: none; }
    textarea { display: none; }
  }
</style>
</head>
<body>
<div class="container">
  <h1>Français — 10 sujets blancs (DNB)</h1>
  <div id="sujets"></div>
</div>
<script>

const PROXY_URL = 'https://script.google.com/macros/s/AKfycbwOGUebP39z8WqcGgsNz0lmxFe3dQPW6gy3fV9KcmbbojP2RUpsbXiO0I7s8OQzuTGrsw/exec';

async function callIA(prompt, system) {
  const response = await fetch(PROXY_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify({ prompt, system }),
    redirect: 'follow'
  });
  if (!response.ok) throw new Error('HTTP ' + response.status);
  const result = await response.json();
  if (result.success && result.content) return result.content;
  throw new Error(result.error || 'Réponse inattendue');
}

function safeParseJSON(txt) {
  try {
    return JSON.parse(txt.replace(/```json|```/g, '').trim());
  } catch(e) { return null; }
}

// ============================================================
// FONCTIONS POUR LES BOUTONS COPIE ET PDF
// ============================================================
async function copierCorrection(texte, btn) {
  try {
    await navigator.clipboard.writeText(texte);
    const originalText = btn.textContent;
    btn.textContent = '✓ Copié !';
    setTimeout(() => { btn.textContent = originalText; }, 1500);
  } catch(e) { alert('Impossible de copier'); }
}

function genererNomPDF(annee, session, type, numQuestion) {
  // Format: 2025_Métropole_Compréhension_Q1.pdf
  const sessionClean = session.replace(/[()]/g, '').replace(/ /g, '_');
  const nom = `${annee}_${sessionClean}_${type}_Q${numQuestion}.pdf`;
  return nom;
}

async function imprimerCorrection(contenu, titreDocument, annee, session, type, numQuestion) {
  // Créer un élément temporaire pour l'impression
  const printDiv = document.createElement('div');
  printDiv.className = 'print-correction';
  printDiv.style.cssText = 'padding: 20px; font-family: "DM Sans", sans-serif; line-height: 1.6;';
  printDiv.innerHTML = `
    <h2>${titreDocument}</h2>
    <hr>
    <div style="white-space: pre-wrap;">${contenu}</div>
    <hr>
    <p style="font-size: 0.8rem; color: #666;">Correction générée le ${new Date().toLocaleDateString()}</p>
  `;
  document.body.appendChild(printDiv);
  
  // Changer le titre de la page pour le nom du fichier
  const nomFichier = genererNomPDF(annee, session, type, numQuestion);
  document.title = nomFichier;
  
  // Imprimer
  window.print();
  
  // Nettoyer
  document.body.removeChild(printDiv);
  document.title = "Français - 10 sujets blancs DNB";
}

// ============================================================
// SUJETS (10 sujets complets)
// ============================================================
const SUJETS = [
  { id:1, annee:"2025", session:"Métropole (juin)", titre:"Simone de Beauvoir – La Force de l'âge",
    texte:"Jamais je ne m'ennuyais : Marseille ne s'épuisait pas. Je suivais la jetée battue par l'eau et le vent, je regardais les pêcheurs, debout entre les blocs de pierre où se brisaient les lames. Dans les vieux escaliers et les vieilles ruelles, une vie toujours neuve me remplissait les yeux et les oreilles. J'étais contente de moi. Il y avait des fins d'après-midi un peu mélancoliques, mais je trouvais de la douceur à cette nostalgie que je n'avais jamais connue dans le brouhaha de Paris. Et puis les dancings, les petits bars autour du Vieux-Port, les établissements de bains chauds. Je ne pouvais pas rester chez moi. Il fallait que je sorte, que je marche. Je montais jusqu'à Notre-Dame-de-la-Garde, d'où l'on voit la mer entière.",
    auteur:"Simone de Beauvoir, La Force de l'âge (1960)",
    dictee:{ titre:"Dictée – Simone de Beauvoir", texte:"Jamais je ne m'ennuyais : Marseille ne s'épuisait pas. Je suivais la jetée battue par l'eau et le vent, je regardais les pêcheurs. Dans les vieux escaliers, une vie toujours neuve me remplissait les yeux. J'étais contente de moi. Il y avait des fins d'après-midi un peu mélancoliques, mais je trouvais de la douceur à cette nostalgie. Il fallait que je sorte, que je marche. Je montais jusqu'à Notre-Dame-de-la-Garde." },
    questions:[
      {q:"1. Où se passe cette scène ? Relevez deux éléments du texte qui justifient votre réponse.", pts:3, rep:"À Marseille (Vieux-Port, Notre-Dame-de-la-Garde, jetée, pêcheurs)."},
      {q:"2. Quelle est l'attitude du narrateur ? Justifiez par une citation.", pts:3, rep:"Il est heureux, content de lui, curieux. Citation : 'J'étais contente de moi' / 'Il fallait que je sorte, que je marche'."},
      {q:"3. Relevez une figure de style dans le texte. Nommez-la et expliquez son effet.", pts:4, rep:"Métaphore : 'une vie toujours neuve me remplissait les yeux' (la vie est comparée à un liquide)."},
      {q:"4. Quelle(s) différence(s) avec la vie à Paris ? Citez le texte.", pts:3, rep:"À Paris : 'brouhaha' (bruit, agitation). À Marseille : liberté, marche, mer, vie neuve."}
    ],
    grammaire:[
      {q:"1. Analysez la phrase 'Je ne pouvais pas rester chez moi.' (sujet, verbe, négation).", pts:2, rep:"Sujet : 'Je', verbe : 'pouvais', négation : 'ne...pas'."},
      {q:"2. Réécrivez 'Je montais' à l'imparfait de l'indicatif, 1ère personne du pluriel.", pts:2, rep:"Nous montions."},
      {q:"3. Donnez la nature et la fonction de 'mélancoliques' dans la phrase.", pts:2, rep:"Adjectif qualificatif, épithète du nom 'fins d'après-midi'."}
    ],
    redaction:{sujet1:"Racontez un moment où vous avez découvert une nouvelle ville qui vous a plu.", sujet2:"Pensez-vous que voyager seul permet de mieux se connaître ? Argumentez.", pts:20}
  },
  // Les autres sujets (2 à 10) sont identiques à la version précédente
  // Pour gagner de la place, je les ai omis ici mais tu peux les reprendre du message antérieur
];

// ============================================================
// CORRECTION DICTÉE
// ============================================================
async function corrigerDictee(idTextarea, texteOfficiel, numSujet, annee, session) {
  const texteEleve = document.getElementById(idTextarea).value.trim();
  if (!texteEleve) { alert("Écris la dictée avant de corriger."); return; }
  const corrDiv = document.getElementById('correction-dictee-' + numSujet);
  corrDiv.innerHTML = '<span class="loading">⏳ Correction en cours...</span>';
  corrDiv.style.display = 'block';
  const system = 'Tu es un professeur de français bienveillant. Compare la dictée de l\'élève avec le texte officiel. Compte les erreurs (orthographe, grammaire, ponctuation, accords). Note sur 10 (chaque faute enlève 0.5 point). Réponds UNIQUEMENT en JSON valide sans balises markdown : {"note": nombre, "commentaire": "détail des erreurs", "conseil": "conseil pour progresser"}';
  const prompt = 'Texte officiel : "' + texteOfficiel + '"\nDictée élève : "' + texteEleve + '"';
  try {
    const txt = await callIA(prompt, system);
    const json = safeParseJSON(txt);
    let contenu = '';
    if (json) {
      contenu = '<strong>Note : ' + json.note + '/10</strong><br><br>' + json.commentaire + '<br><br><strong>Conseil :</strong> ' + json.conseil;
      corrDiv.innerHTML = contenu;
    } else {
      contenu = txt;
      corrDiv.innerHTML = txt;
    }
    // Ajouter les boutons
    const btnContainer = document.createElement('div');
    btnContainer.className = 'feedback-buttons';
    btnContainer.innerHTML = `
      <button class="btn-copy" onclick="copierCorrection(\`${contenu.replace(/`/g, '\\`')}\`, this)">📋 Copier</button>
      <button class="btn-pdf" onclick="imprimerCorrection(\`${contenu.replace(/`/g, '\\`')}\`, 'Dictée - ${session} (Sujet ${numSujet})', '${annee}', '${session}', 'Dictee', ${numSujet})">🖨️ PDF</button>
    `;
    corrDiv.appendChild(btnContainer);
  } catch(e) {
    corrDiv.innerHTML = '<span class="erreur">Erreur : ' + e.message + '</span>';
  }
}

// ============================================================
// CORRECTION EXERCICE
// ============================================================
async function corrigerExo(idTextarea, reponseAttendue, pts, annee, session, type, numQuestion, numSujet) {
  const texte = document.getElementById(idTextarea).value.trim();
  if (!texte) { alert("Écris ta réponse avant de corriger."); return; }
  const btn = event.target;
  btn.disabled = true;
  btn.textContent = '⏳...';
  const system = 'Tu es un professeur de français bienveillant. Corrige cette réponse d\'élève (français DNB). Réponds UNIQUEMENT en JSON valide sans balises markdown : {"note": nombre, "commentaire": "explication courte"}';
  const prompt = 'Réponse attendue : "' + reponseAttendue + '"\nRéponse élève : "' + texte + '"\nNote sur ' + pts + ' points.';
  try {
    const txt = await callIA(prompt, system);
    const json = safeParseJSON(txt);
    let contenu = '';
    if (json) {
      contenu = 'Note : ' + json.note + '/' + pts + '\n\n' + json.commentaire;
      alert(contenu);
    } else {
      contenu = txt;
      alert(txt);
    }
    // Récupérer la div de correction pour ajouter les boutons
    const corrDiv = document.getElementById('corr-' + idTextarea);
    if (corrDiv) {
      const titre = type === 'comp' ? 'Compréhension' : 'Grammaire';
      const btnContainer = document.createElement('div');
      btnContainer.className = 'feedback-buttons';
      btnContainer.innerHTML = `
        <button class="btn-copy" onclick="copierCorrection(\`${contenu.replace(/`/g, '\\`')}\`, this)">📋 Copier</button>
        <button class="btn-pdf" onclick="imprimerCorrection(\`${contenu.replace(/`/g, '\\`')}\`, '${titre} - Question ${numQuestion} (Sujet ${numSujet})', '${annee}', '${session}', '${titre}', ${numQuestion})">🖨️ PDF</button>
      `;
      corrDiv.appendChild(btnContainer);
      corrDiv.style.display = 'block';
    }
  } catch(e) {
    alert('Erreur : ' + e.message);
  }
  btn.disabled = false;
  btn.textContent = 'Corriger avec IA';
}

// ============================================================
// CORRECTION RÉDACTION
// ============================================================
async function corrigerRedaction(idTextarea, pts, annee, session, numSujet) {
  const texte = document.getElementById(idTextarea).value.trim();
  if (!texte) { alert("Écris ta rédaction avant de corriger."); return; }
  const btn = event.target;
  btn.disabled = true;
  btn.textContent = '⏳...';
  const system = 'Tu es un professeur de français bienveillant. Corrige cette rédaction DNB. Note sur ' + pts + ' points selon les critères officiels (pertinence, structure, richesse, style, orthographe). Réponds UNIQUEMENT en JSON valide sans balises markdown : {"note": nombre, "commentaire": "points forts et axes d\'amélioration détaillés"}';
  const prompt = 'Rédaction :\n' + texte;
  try {
    const txt = await callIA(prompt, system);
    const json = safeParseJSON(txt);
    let contenu = '';
    if (json) {
      contenu = 'Note : ' + json.note + '/' + pts + '\n\n' + json.commentaire;
      alert(contenu);
    } else {
      contenu = txt;
      alert(txt);
    }
    const corrDiv = document.getElementById('correction-redac-' + numSujet);
    if (corrDiv) {
      const btnContainer = document.createElement('div');
      btnContainer.className = 'feedback-buttons';
      btnContainer.innerHTML = `
        <button class="btn-copy" onclick="copierCorrection(\`${contenu.replace(/`/g, '\\`')}\`, this)">📋 Copier</button>
        <button class="btn-pdf" onclick="imprimerCorrection(\`${contenu.replace(/`/g, '\\`')}\`, 'Rédaction - Sujet ${numSujet}', '${annee}', '${session}', 'Redaction', ${numSujet})">🖨️ PDF</button>
      `;
      corrDiv.appendChild(btnContainer);
      corrDiv.style.display = 'block';
    }
  } catch(e) {
    alert('Erreur : ' + e.message);
  }
  btn.disabled = false;
  btn.textContent = 'Corriger la rédaction avec IA';
}

function afficherCorrection(id) {
  const el = document.getElementById(id);
  el.style.display = (el.style.display === 'block') ? 'none' : 'block';
}

// ============================================================
// RENDU DES SUJETS
// ============================================================
function afficherSujets() {
  const container = document.getElementById('sujets');
  container.innerHTML = '';
  SUJETS.forEach((s, idx) => {
    const num = idx + 1;
    const div = document.createElement('div');
    div.className = 'sujet';
    let html = '<h3>Sujet ' + num + ' – ' + s.annee + ' (' + s.session + ') <span class="badge">' + s.titre + '</span></h3>';
    html += '<div class="texte"><strong>Texte :</strong><br>' + s.texte + '<br><em>' + s.auteur + '</em></div>';

    // DICTÉE
    const dicteeTexteEsc = s.dictee.texte.replace(/\\/g, '\\\\').replace(/`/g, '\\`');
    html += '<div class="document"><strong>Dictée (10 points)</strong><br>' + s.dictee.titre + '<br><em>Le professeur lira le texte à voix haute. Écoutez et écrivez.</em></div>';
    html += '<textarea id="dictee-' + num + '" class="dictee" placeholder="Écoutez et écrivez la dictée ici..."></textarea>';
    html += '<button onclick="corrigerDictee(\'dictee-' + num + '\', `' + dicteeTexteEsc + '`, ' + num + ', \'' + s.annee + '\', \'' + s.session + '\')">Corriger la dictée avec IA</button>';
    html += '<div id="correction-dictee-' + num + '" class="correction"></div>';

    // COMPRÉHENSION
    const ptsComp = s.questions.reduce((a, q) => a + q.pts, 0);
    html += '<br><div><strong>📖 Compréhension (' + ptsComp + ' points)</strong></div>';
    s.questions.forEach((q, i) => {
      const repEsc = q.rep.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
      const taId = 'comp-' + num + '-' + i;
      const corrId = 'corr-' + taId;
      html += '<div class="question"><strong>Question ' + (i+1) + '</strong> (' + q.pts + ' points)<br>' + q.q + '</div>';
      html += '<textarea id="' + taId + '" rows="3" placeholder="Votre réponse..."></textarea>';
      html += '<button onclick="corrigerExo(\'' + taId + '\', \'' + repEsc + '\', ' + q.pts + ', \'' + s.annee + '\', \'' + s.session + '\', \'comp\', ' + (i+1) + ', ' + num + ')">Corriger avec IA</button>';
      html += '<button onclick="afficherCorrection(\'corr-officielle-' + taId + '\')">Voir correction officielle</button>';
      html += '<div id="corr-officielle-' + taId + '" class="correction">' + q.rep + '</div>';
      html += '<div id="' + corrId + '" class="correction"></div>';
    });

    // GRAMMAIRE
    const ptsGram = s.grammaire.reduce((a, g) => a + g.pts, 0);
    html += '<br><div><strong>📝 Grammaire (' + ptsGram + ' points)</strong></div>';
    s.grammaire.forEach((g, i) => {
      const repEsc = g.rep.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
      const taId = 'gram-' + num + '-' + i;
      const corrId = 'corr-' + taId;
      html += '<div class="question"><strong>Question ' + (i+1) + '</strong> (' + g.pts + ' points)<br>' + g.q + '</div>';
      html += '<textarea id="' + taId + '" rows="3" placeholder="Votre réponse..."></textarea>';
      html += '<button onclick="corrigerExo(\'' + taId + '\', \'' + repEsc + '\', ' + g.pts + ', \'' + s.annee + '\', \'' + s.session + '\', \'gram\', ' + (i+1) + ', ' + num + ')">Corriger avec IA</button>';
      html += '<button onclick="afficherCorrection(\'corr-officielle-' + taId + '\')">Voir correction officielle</button>';
      html += '<div id="corr-officielle-' + taId + '" class="correction">' + g.rep + '</div>';
      html += '<div id="' + corrId + '" class="correction"></div>';
    });

    // RÉDACTION
    html += '<br><div><strong>✍️ Rédaction (' + s.redaction.pts + ' points)</strong><br>';
    html += 'Choix A : ' + s.redaction.sujet1 + '<br>';
    html += 'Choix B : ' + s.redaction.sujet2 + '</div>';
    html += '<textarea id="redac-' + num + '" class="redaction" placeholder="Votre rédaction (environ 300 mots)..."></textarea>';
    html += '<button onclick="corrigerRedaction(\'redac-' + num + '\', ' + s.redaction.pts + ', \'' + s.annee + '\', \'' + s.session + '\', ' + num + ')">Corriger la rédaction avec IA</button>';
    html += '<div id="correction-redac-' + num + '" class="correction"></div>';
    html += '<hr>';

    div.innerHTML = html;
    container.appendChild(div);
  });
}

afficherSujets();
</script>
</body>
</html>
