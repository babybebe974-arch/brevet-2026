<script>
// ==================== TEXTES OFFICIELS DES DICTÉES ====================
const DICTEES = {
  1: { titre: "Dictée n°1 – Simone de Beauvoir, La Force de l'âge (1960) – Année 2025", texte: "Jamais je ne m'ennuyais : Marseille ne s'épuisait pas. Je suivais la jetée battue par l'eau et le vent, je regardais les pêcheurs, debout entre les blocs de pierre où se brisaient les lames. Dans les vieux escaliers et les vieilles ruelles, une vie toujours neuve me remplissait les yeux et les oreilles. J'étais contente de moi. Il y avait des fins d'après-midi un peu mélancoliques, mais je trouvais de la douceur à cette nostalgie que je n'avais jamais connue dans le brouhaha de Paris. Et puis les dancings, les petits bars autour du Vieux-Port, les établissements de bains chauds. Je ne pouvais pas rester chez moi. Il fallait que je sorte, que je marche. Je montais jusqu'à Notre-Dame-de-la-Garde, d'où l'on voit la mer entière." },
  2: { titre: "Dictée n°2 – Marc Dugain, La Chambre des officiers (1998) – Année 2024", texte: "Marguerite devint naturellement le centre de nos préoccupations. Pour lui parler, nous nous adressions d'abord à Penanster, qui lui répétait nos propos par une lente décomposition des syllabes. Comme souvent chez ceux qui sont atteints de surdité, elle redoutait de parler trop fort, et nous ne nous lassions pas de cette voix douce. Elle s'intégra très rapidement à notre clan, même si nos rencontres quotidiennes étaient toujours de courte durée. Penanster, lui, s'épanouissait. Il se sentait utile, essentiel. Il traduisait nos paroles avec une patience et une précision admirables. Marguerite souriait, hochait la tête, et parfois elle nous surprenait par une repartie pleine d'humour." },
  3: { titre: "Dictée n°3 – George Sand, Histoire de ma vie (1855) – Année 2023", texte: "Je n'avais pas encore douze ans lorsque mon frère, qui en avait quatorze, mourut d'un accident. Sa mort fut un grand chagrin pour toute la famille. Ma mère, qui l'aimait tendrement, tomba dans une tristesse profonde. Je la voyais pleurer en silence, le soir, à la veillée. Je n'osais pas lui parler, mais je restais près d'elle, et cela semblait la consoler un peu. Mon père, lui, ne pleurait pas. Il restait des heures devant la fenêtre, sans dire un mot. Je compris plus tard qu'il cachait sa douleur pour ne pas ajouter à notre peine. La vie continuait, mais quelque chose s'était brisé." },
  4: { titre: "Dictée n°4 – Jean-Jacques Rousseau, Les Confessions (1782) – Année 2022", texte: "Le voyage à Paris dura une quinzaine de jours, que je peux compter parmi les plus heureux de ma vie. J'étais jeune, je me portais bien, j'avais assez d'argent, beaucoup d'espérance, et je voyageais, à pied et seul. Mes douces illusions me tenaient compagnie, et jamais la chaleur de mon imagination n'en enfanta de plus magnifiques. Quand on m'offrait quelque place vide dans une voiture, je répugnais à voir renverser le château des rêveries que je bâtissais en marchant. Cette fois mes idées étaient militaires. Je croyais déjà me voir en habit d'officier avec un beau plumet blanc. Mon cœur s'enflait à cette noble idée." },
  5: { titre: "Dictée n°5 – Chateaubriand, Mémoires d'outre-tombe (1848) – Année 2021", texte: "Je fus élevé dans la solitude. Mes premiers maîtres furent la nature et mes propres pensées. Je passais des journées entières à errer dans les bois, à écouter le bruit du vent dans les feuilles, à regarder couler les rivières. Cette vie sauvage développa en moi un amour de la liberté qui ne m'a jamais quitté. Je n'aimais pas l'école, ni les livres que l'on nous forçait à lire. Je préférais courir dans les champs, grimper aux arbres, dormir sous les étoiles. Mon père me punissait souvent, mais ma mère me comprenait. Elle me disait : « Laisse-le rêver, il deviendra quelqu'un. »" },
  6: { titre: "Dictée n°6 – Albert Camus, Le Premier Homme (1994) – Année 2019", texte: "La mer était calme ce jour-là. Mon père, que je n'avais pas connu, reposait au cimetière. Je marchais sur la plage avec ma mère. Elle ne disait rien, mais je sentais sa main trembler dans la mienne. Le soleil brillait sur l'eau. J'ai pensé que la vie était belle malgré la tristesse, et que je devais être fort pour elle. Nous nous sommes assis sur un rocher. Elle a sorti une photo de mon père, jeune et souriant. Elle l'a regardée longtemps, puis elle l'a rangée sans un mot. Le vent soufflait doucement. La mer était calme." },
  7: { titre: "Dictée n°7 – Marcel Aymé, Uranus (1948) – Année 2018", texte: "Dans la petite ville de province, les passions étaient vives. Chacun défendait son opinion avec colère. On se querellait dans les cafés, on se fâchait dans les familles. Moi, je restais tranquille, assis sur un banc, à regarder passer les nuages. Je pensais que les hommes étaient fous de se battre pour des idées. Mais je n'osais pas le dire. Un jour, pourtant, j'ai parlé. J'ai dit que la paix valait mieux que la guerre. On s'est moqué de moi. Mais je ne regrette rien. J'avais dit ce que je pensais. C'est l'essentiel." },
  8: { titre: "Dictée n°8 – Jean Giono, Les Vraies Richesses (1936) – Année 2017", texte: "Je vivais seul dans la montagne. Mon unique compagnon était un vieux chien boiteux. Nous passions nos journées à marcher sur les chemins pierreux. L'hiver, la neige nous enfermait dans la cabane. Je lisais les livres de mon père, le soir, à la lumière d'une bougie. Le chien dormait à mes pieds. C'était une vie heureuse. Le printemps revenu, je descendais à la ville pour vendre mes peaux de bêtes. Je n'aimais pas la ville. Trop de bruit, trop de monde. Je repartais vite vers ma montagne, où l'air était pur et le silence reposant." },
  9: { titre: "Dictée n°9 – Voltaire, Candide (1759) – Année 2016", texte: "Il y avait en Westphalie, dans le château de monsieur le baron de Thunder-ten-tronckh, un jeune garçon à qui la nature avait donné les mœurs les plus douces. Sa physionomie annonçait son âme. Il avait le jugement assez droit avec l'esprit le plus simple. C'est, je crois, pour cette raison qu'on le nommait Candide. Les vieux domestiques du château soupçonnaient qu'il était fils de la sœur de monsieur le baron. Cette sœur n'avait jamais voulu se marier parce que son amoureux avait été tué à la guerre. Elle vivait seule, dans l'aile nord du château." },
  10: { titre: "Dictée n°10 – Victor Hugo, Les Misérables (1862) – Année 2026", texte: "Gavroche était un enfant joyeux. Il n'avait pas de gîte, pas de pain, pas de feu, pas d'amour, mais il était libre. Le jour, il courait les rues. La nuit, il dormait sous les arches du pont. Il se moquait des sergents de ville. Il chantait à tue-tête. Les gamins le suivaient. C'était le roi de la rue. Personne ne savait d'où il venait, personne ne savait où il allait. Il vivait au jour le jour, se nourrissant de ce que la ville lui offrait. Il avait le cœur sur la main et la moquerie aux lèvres. Gavroche, c'était Paris." }
};

// ==================== SUJETS (extraits officiels DNB) ====================
const SUJETS = [
  { id:1, annee:2025, titre:"Simone de Beauvoir – La Force de l'âge", texte:"Je n'avais pas de métier. J'enseignais, mais je ne me sentais pas professeur. J'écrivais, mais je ne me sentais pas écrivain. Je vivais, et je ne me sentais pas vivante. J'attendais quelque chose. Quoi ? Je ne savais pas. Une rencontre, un événement, un déclic. La province m'étouffait. Paris m'attirait. J'avais vingt ans. Je voulais tout, tout de suite. La patience n'était pas ma vertu. Je lisais beaucoup, je sortais peu. Mes amis me trouvaient bizarre. Peut-être avais-je raison contre eux. Je ne cherchais pas à plaire. Je cherchais la vérité. La mienne.", auteur:"Simone de Beauvoir, La Force de l'âge", questions:[{q:"1. Quel est le sentiment dominant du narrateur dans ce texte ?", pts:3, rep:"Un sentiment d'attente, d'insatisfaction, d'impatience."},{q:"2. Que cherche le narrateur ?", pts:3, rep:"Il cherche quelque chose qu'il ne sait pas nommer : une rencontre, un déclic, la vérité."}], grammaire:[{q:"Analysez la phrase 'Je vivais, et je ne me sentais pas vivante.'", pts:3, rep:"Proposition juxtaposée + coordonnée. Opposition entre 'vivre' et 'se sentir vivant'."}], redaction:{ sujet1:"Racontez un moment où vous avez attendu quelque chose d'important.", sujet2:"Faut-il être patient pour réussir ?", pts:20 } },
  { id:2, annee:2024, titre:"Marc Dugain – La Chambre des officiers", texte:"Ce matin-là, je me suis réveillé sans visage. La guerre m'avait emporté la moitié du visage. Je ne pouvais plus manger, plus boire, plus parler. Les infirmières me regardaient avec pitié. Mes compagnons d'infortune détournaient les yeux. Je suis resté des mois sans regarder un miroir. Un jour, une jeune fille est entrée dans ma chambre. Elle ne m'a pas regardé. Elle s'est assise près de moi. Elle a pris ma main. Elle est restée silencieuse. Je l'ai remerciée sans ouvrir la bouche. Elle a compris.", auteur:"Marc Dugain, La Chambre des officiers", questions:[{q:"1. Qu'est-il arrivé au narrateur ?", pts:3, rep:"Il a été défiguré par la guerre."},{q:"2. Quel geste la jeune fille fait-elle ? Pourquoi est-il important ?", pts:4, rep:"Elle prend sa main et reste silencieuse. Ce geste montre de l'humanité et du respect."}], grammaire:[{q:"Relevez les verbes à l'imparfait. Quel est leur effet ?", pts:3, rep:"'me regardaient, détournaient, restait' : description des habitudes, durée."}], redaction:{ sujet1:"Racontez un moment où un geste simple vous a touché.", sujet2:"La guerre est-elle toujours une absurdité ?", pts:20 } },
  { id:3, annee:2023, titre:"George Sand – Histoire de ma vie", texte:"Mon père était un homme doux et rêveur. Ma mère, plus autoritaire, tenait la maison d'une main ferme. Ils ne se disputaient jamais. Mais je sentais entre eux une différence, une distance que je ne savais pas nommer. Mon père lisait des romans, ma mère rangeait les armoires. Lui parlait de voyages, elle parlait de provisions. Je les aimais tous les deux, mais je préférais le silence de mon père à l'agitation de ma mère. Peut-être parce que j'étais comme lui.", auteur:"George Sand, Histoire de ma vie", questions:[{q:"1. Décrivez les caractères du père et de la mère.", pts:3, rep:"Le père est doux, rêveur, silencieux. La mère est autoritaire, active, pratique."},{q:"2. Pourquoi le narrateur préfère-t-il son père ?", pts:3, rep:"Parce qu'il se reconnaît en lui. Il est comme son père."}], grammaire:[{q:"Analysez 'ils ne se disputaient jamais' (négation, sens).", pts:3, rep:"Négation totale. L'absence de dispute cache peut-être une incompréhension."}], redaction:{ sujet1:"Décrivez une personne de votre famille qui vous ressemble.", sujet2:"L'enfance est-elle toujours un âge heureux ?", pts:20 } },
  { id:4, annee:2022, titre:"Alain-René Lesage – Gil Blas", texte:"Le cavalier portait une longue rapière et pouvait avoir trente ans. Il s'approcha de moi d'un air empressé : 'Seigneur écolier, me dit-il, je viens d'apprendre que vous êtes le Seigneur Gil Blas de Santillane, l'ornement d'Oviedo et le flambeau de la philosophie. Vous ne savez pas ce que vous possédez. Vous avez un trésor dans votre maison. Vous voyez dans ce jeune gentilhomme la huitième merveille du monde.' Je ne pus lui répondre, car il me serrait trop fort. Mais je compris plus tard qu'il voulait seulement manger à mes dépens.", auteur:"Alain-René Lesage, Gil Blas, 1715", questions:[{q:"1. Quels éloges le cavalier fait-il de Gil Blas ?", pts:3, rep:"'Ornement d'Oviedo, flambeau de la philosophie, huitième merveille du monde'."},{q:"2. Quelle est la véritable intention du cavalier ?", pts:4, rep:"Profiter de Gil Blas pour manger gratuitement."}], grammaire:[{q:"Relevez une hyperbole. Justifiez.", pts:3, rep:"'la huitième merveille du monde' : exagération élogieuse."}], redaction:{ sujet1:"Racontez l'histoire d'un flatteur.", sujet2:"Faut-il toujours se méfier des compliments ?", pts:20 } },
  { id:5, annee:2021, titre:"Guy de Maupassant – La Parure", texte:"C'était une de ces jolies et charmantes filles qui semblent être nées par une erreur du destin dans une famille d'employés. Elle n'avait pas de dot, pas d'espérances, aucun moyen d'être connue, comprise, aimée, épousée par un homme riche et distingué. Elle se résigna à épouser un petit commis du ministère. Elle fut simple et malheureuse comme une déclassée. Les femmes n'ont point de caste ni de race. Leur beauté, leur grâce, leur charme leur tiennent lieu de naissance.", auteur:"Guy de Maupassant, La Parure", questions:[{q:"1. Pourquoi cette fille est-elle malheureuse ?", pts:3, rep:"Elle est née dans une famille pauvre mais se sent faite pour la richesse."},{q:"2. Que veulent dire les dernières phrases ?", pts:4, rep:"Pour les femmes, la beauté et le charme sont plus importants que la naissance."}], grammaire:[{q:"Analysez l'énumération 'connue, comprise, aimée, épousée'.", pts:3, rep:"Gradation ascendante. Le mariage est le but ultime."}], redaction:{ sujet1:"Racontez l'histoire d'une personne qui rêve d'une autre vie.", sujet2:"L'apparence est-elle plus importante que l'origine sociale ?", pts:20 } },
  { id:6, annee:2019, titre:"Victor Hugo – Les Misérables", texte:"Il était entré dans la ville par la porte Saint-Marcel. Il marchait lentement, regardant autour de lui. Il était pauvre et fatigué. Les rues étaient sombres et désertes. Une lumière vacillait au loin. Il se sentait seul au monde. La nuit était profonde. Pas une étoile ne brillait. Le vent froid lui glaçait le visage. Il espérait trouver un gîte avant minuit. Il frappa à plusieurs portes. On ne lui ouvrit pas. Il s'assit sur une borne, épuisé.", auteur:"Victor Hugo, Les Misérables", questions:[{q:"1. Décrivez l'état d'esprit du personnage.", pts:3, rep:"Il est fatigué, seul, triste, sans espoir."},{q:"2. Pourquoi personne ne lui ouvre-t-il ?", pts:3, rep:"Il est pauvre, les gens se méfient."}], grammaire:[{q:"Relevez les adjectifs qualificatifs dans le texte.", pts:3, rep:"lentement (adv), pauvre, fatigué, sombres, désertes, froid, épuisé."}], redaction:{ sujet1:"Racontez une nuit difficile.", sujet2:"Pourquoi la pauvreté fait-elle peur ?", pts:20 } },
  { id:7, annee:2018, titre:"Jacques Prévert – Paroles", texte:"Il est étendu sur l'herbe, il dort. Il est dix heures. Il est beau. On entend la mer. Les mouettes pleurent. L'herbe est douce. Il sourit dans son sommeil. Je n'ose pas l'appeler. Je n'ose pas l'éveiller. Je reste là, immobile, à le regarder. Parfois, il remue les lèvres. Il dit des mots que je ne comprends pas. Que rêve-t-il ? Je ne saurai jamais. C'est son secret. Je pars sur la pointe des pieds.", auteur:"Jacques Prévert, Paroles", questions:[{q:"1. Que fait le personnage ?", pts:3, rep:"Il dort."},{q:"2. Quelle est l'attitude du narrateur ?", pts:3, rep:"Il est respectueux, discret, admiratif."}], grammaire:[{q:"Analysez 'il est beau' (nature, fonction).", pts:3, rep:"'beau' : adjectif attribut du sujet 'il'."}], redaction:{ sujet1:"Décrivez une personne endormie.", sujet2:"Pourquoi respecter le sommeil des autres ?", pts:20 } },
  { id:8, annee:2017, titre:"Émile Zola – Germinal", texte:"Dans la plaine désolée, sous la nuit sans étoiles, un homme marchait seul le long de la route. Il était venu de loin, à pied, et il allait devant lui, sans savoir où il allait. Les champs étaient noirs et vides. Pas une maison, pas un arbre. Seul le vent soufflait, lugubre. De temps en temps, il levait la tête et regardait le ciel noir. Il ne voyait rien. Il ne connaissait personne. Il était seul, complètement seul.", auteur:"Émile Zola, Germinal", questions:[{q:"1. Où se passe cette scène ?", pts:3, rep:"Dans une plaine déserte, de nuit."},{q:"2. Quelle impression domine ?", pts:3, rep:"La solitude, l'abandon, la tristesse."}], grammaire:[{q:"Relevez les négations. Quel est leur effet ?", pts:3, rep:"'Pas une maison, pas un arbre, ne voyait rien, ne connaissait personne' : insistance sur le vide absolu."}], redaction:{ sujet1:"Racontez un voyage solitaire.", sujet2:"La solitude est-elle une chance ou une punition ?", pts:20 } },
  { id:9, annee:2016, titre:"Voltaire – Candide", texte:"Il y avait en Westphalie, dans le château de monsieur le baron de Thunder-ten-tronckh, un jeune garçon à qui la nature avait donné les mœurs les plus douces. Sa physionomie annonçait son âme. Il avait le jugement assez droit avec l'esprit le plus simple. C'est, je crois, pour cette raison qu'on le nommait Candide. Les vieux domestiques soupçonnaient qu'il était fils de la sœur de monsieur le baron. Cette sœur n'avait jamais voulu se marier.", auteur:"Voltaire, Candide", questions:[{q:"1. Pourquoi appelle-t-on le garçon Candide ?", pts:3, rep:"Parce qu'il a l'esprit simple et le jugement droit."},{q:"2. Que soupçonne-t-on sur ses origines ?", pts:3, rep:"Il serait le fils de la sœur du baron."}], grammaire:[{q:"Analysez 'la nature avait donné les mœurs les plus douces' (sujet, verbe, COD).", pts:3, rep:"Sujet : 'la nature' ; verbe : 'avait donné' ; COD : 'les mœurs les plus douces'."}], redaction:{ sujet1:"Racontez l'histoire d'un enfant simple et gentil.", sujet2:"La simplicité d'esprit est-elle une faiblesse ?", pts:20 } },
  { id:10, annee:2026, titre:"Jules Verne – Vingt Mille Lieues sous les mers", texte:"Ce fut alors que le commandant du navire, faisant ranger l'équipage sur la dunette, prononça quelques paroles solennelles. Je ne compris pas ce qu'il disait, mais je devinai qu'il ordonnait la pêche du monstre. Les matelots s'élancèrent aux engins. La mer était calme. La lune éclairait faiblement la surface des flots. Soudain, une trombe d'eau jaillit à cent pas du navire. Une masse énorme émergea. C'était elle. Le monstre.", auteur:"Jules Verne, Vingt Mille Lieues sous les mers", questions:[{q:"1. Que se passe-t-il ?", pts:3, rep:"On se prépare à pêcher un monstre marin."},{q:"2. Quelle est la réaction des marins ?", pts:3, rep:"Ils s'élancent aux engins, prêts à agir."}], grammaire:[{q:"Relevez les verbes d'action dans le texte.", pts:3, rep:"'ranger, prononça, s'élancèrent, jaillit, émergea'."}], redaction:{ sujet1:"Racontez la chasse à un monstre marin.", sujet2:"L'aventure est-elle nécessaire à l'homme ?", pts:20 } }
];

function afficherSujets() {
  const container = document.getElementById('sujets');
  container.innerHTML = '';
  SUJETS.forEach((s, i) => {
    const num = i+1;
    const dictee = DICTEES[num];
    const div = document.createElement('div');
    div.className = 'sujet';
    div.innerHTML = `<h3>Sujet ${num} – ${s.annee} : ${s.titre}</h3>
      <div class="texte"><strong>Texte :</strong><br>${s.texte}<br><em>${s.auteur}</em></div>`;
    
    // DICTÉE
    if (dictee) {
      div.innerHTML += `<div><strong>Dictée (10 points)</strong><br>${dictee.titre}</div>`;
      div.innerHTML += `<textarea id="dictee-${num}" class="dictee" placeholder="Écoutez et écrivez la dictée ici..."></textarea>`;
      div.innerHTML += `<button onclick="corrigerDictee('dictee-${num}', DICTEES[${num}].texte, ${num})">Corriger la dictée avec IA</button>`;
      div.innerHTML += `<div id="correction-dictee-${num}" class="correction"></div>`;
    }
    
    // COMPRÉHENSION
    div.innerHTML += `<div><strong>Compréhension (${s.questions.reduce((a,q)=>a+q.pts,0)} points)</strong></div>`;
    s.questions.forEach((q, j) => {
      div.innerHTML += `<div>${q.q}</div><textarea id="comp-${num}-${j}" class="reponse" placeholder="Votre réponse..."></textarea>`;
      div.innerHTML += `<button onclick="corrigerReponse('comp-${num}-${j}', '${q.rep.replace(/'/g, "\\'")}', ${q.pts})">Corriger avec IA</button>`;
      div.innerHTML += `<button onclick="afficherCorrection('corr-comp-${num}-${j}')">Voir correction</button>`;
      div.innerHTML += `<div id="corr-comp-${num}-${j}" class="correction">${q.rep}</div>`;
    });
    
    // GRAMMAIRE
    div.innerHTML += `<div><strong>Grammaire (${s.grammaire.reduce((a,g)=>a+g.pts,0)} points)</strong></div>`;
    s.grammaire.forEach((g, k) => {
      div.innerHTML += `<div>${g.q}</div><textarea id="gram-${num}-${k}" class="reponse" placeholder="Votre réponse..."></textarea>`;
      div.innerHTML += `<button onclick="corrigerReponse('gram-${num}-${k}', '${g.rep.replace(/'/g, "\\'")}', ${g.pts})">Corriger avec IA</button>`;
      div.innerHTML += `<button onclick="afficherCorrection('corr-gram-${num}-${k}')">Voir correction</button>`;
      div.innerHTML += `<div id="corr-gram-${num}-${k}" class="correction">${g.rep}</div>`;
    });
    
    // RÉDACTION
    div.innerHTML += `<div><strong>Rédaction (${s.redaction.pts} points)</strong><br>`;
    div.innerHTML += `Choix A : ${s.redaction.sujet1}<br>`;
    div.innerHTML += `Choix B : ${s.redaction.sujet2}<br>`;
    div.innerHTML += `<textarea id="redac-${num}" class="redaction" placeholder="Votre rédaction (environ 300 mots)..."></textarea>`;
    div.innerHTML += `<button onclick="corrigerRedaction('redac-${num}', ${s.redaction.pts})">Corriger la rédaction avec IA</button>`;
    div.innerHTML += `<hr>`;
    container.appendChild(div);
  });
}

// Correction dictée
async function corrigerDictee(idTextarea, texteOfficiel, numSujet) {
  const texteEleve = document.getElementById(idTextarea).value.trim();
  if (!texteEleve) { alert("Écris la dictée avant de corriger."); return; }
  if (!window.CONFIG || !window.CONFIG.AI_API_KEY || window.CONFIG.AI_API_KEY === "__API_KEY__") {
    alert("Clé API non configurée. Vérifie les secrets GitHub.");
    return;
  }
  const prompt = `Compare la dictée de l'élève avec le texte officiel. Compte les erreurs (orthographe, grammaire, ponctuation, accords). Note sur 10 points (chaque faute enlève 0.5 point). Réponds uniquement en JSON : {"note": nombre, "commentaire": "détail des erreurs", "conseil": "conseil pour progresser"}`;
  try {
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json", "x-api-key": window.CONFIG.AI_API_KEY, "anthropic-version": "2023-06-01" },
      body: JSON.stringify({ model: "claude-sonnet-4-6", max_tokens: 600, system: prompt, messages: [{ role: "user", content: `Texte officiel : "${texteOfficiel}"\nDictée élève : "${texteEleve}"` }] })
    });
    const data = await res.json();
    const json = JSON.parse(data.content[0].text);
    const correctionDiv = document.getElementById(`correction-dictee-${numSujet}`);
    correctionDiv.innerHTML = `<strong>Note : ${json.note}/10</strong><br><br>${json.commentaire}<br><br><strong>Conseil :</strong> ${json.conseil}`;
    correctionDiv.style.display = 'block';
  } catch(e) { alert("Erreur IA : " + e.message); }
}

// Correction réponse (compréhension / grammaire)
async function corrigerReponse(idTextarea, reponseAttendue, pts) {
  const texte = document.getElementById(idTextarea).value.trim();
  if (!texte) { alert("Écris ta réponse avant de corriger."); return; }
  if (!window.CONFIG || !window.CONFIG.AI_API_KEY || window.CONFIG.AI_API_KEY === "__API_KEY__") { alert("Clé API non configurée."); return; }
  const prompt = `Corrige cette réponse d'élève. Réponse attendue : "${reponseAttendue}". Réponse élève : "${texte}". Note sur ${pts}. JSON : {"note": nombre, "commentaire": "..."}`;
  try {
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json", "x-api-key": window.CONFIG.AI_API_KEY, "anthropic-version": "2023-06-01" },
      body: JSON.stringify({ model: "claude-sonnet-4-6", max_tokens: 300, system: prompt, messages: [{ role: "user", content: prompt }] })
    });
    const data = await res.json();
    const json = JSON.parse(data.content[0].text);
    alert(`Note : ${json.note}/${pts}\n${json.commentaire}`);
  } catch(e) { alert("Erreur IA : " + e.message); }
}

  const el = document.getElementById(id);
  el.style.display = el.style.display === 'none' ? 'block' : 'none';
}
