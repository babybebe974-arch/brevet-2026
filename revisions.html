<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>📖 Fiches de révision – Brevet 2026</title>
  <script src="data-francais.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:#000000;font-family:'DM Sans',sans-serif;padding:1rem;color:#ffffff;}
    .container{max-width:1200px;margin:0 auto;background:#1a1a1a;border-radius:2rem;padding:2rem;border:1px solid #ffcc00;}
    h1{font-family:'Playfair Display',serif;font-size:2rem;color:#ffcc00;margin-bottom:0.25rem;}
    .sub{color:#aaa;margin-bottom:1.5rem;border-left:3px solid #ffcc00;padding-left:1rem;}
    
    .nav-row{display:flex;flex-wrap:wrap;gap:1rem;margin-bottom:2rem;align-items:flex-end;}
    .nav-group{flex:1;min-width:200px;}
    .nav-group label{display:block;font-size:0.7rem;color:#aaa;margin-bottom:0.2rem;}
    select{width:100%;background:#2a2a2a;border:1px solid #333;border-radius:40px;padding:0.6rem 1rem;color:#ffffff;font-size:0.9rem;cursor:pointer;}
    select:focus{outline:none;border-color:#ffcc00;}
    
    .fiche-content{background:#1a1a1a;border-radius:1rem;padding:1.2rem;border:1px solid #333;}
    .objectif{background:#2a2a2a;padding:0.8rem;border-radius:1rem;margin-bottom:1rem;border-left:4px solid #ffcc00;}
    table{width:100%;border-collapse:collapse;margin:1rem 0;font-size:0.85rem;}
    th,td{border:1px solid #333;padding:0.6rem;vertical-align:top;text-align:left;color:#ffffff;}
    th{background:#2a2a2a;color:#ffcc00;}
    tr:nth-child(even) td{background:#222;}
    .notion{color:#ff3b3b;font-weight:600;background:rgba(255,59,59,0.15);padding:0.1rem 0.2rem;border-radius:4px;display:inline-block;}
    .pieges,.exemple,.flashcards{background:#2a2a2a;padding:0.8rem;border-radius:1rem;margin:1rem 0;}
    .flashcards{border-left:3px solid #ff3b3b;}
    .footer{font-size:0.7rem;color:#aaa;text-align:center;margin-top:1rem;}
    strong{color:#ffcc00;}
  </style>
</head>
<body>
<div class="container">
  <h1>📖 Fiches de révision</h1>
  <div class="sub">Brevet 2026 – Choisis ta matière et ton chapitre</div>

  <div class="nav-row">
    <div class="nav-group">
      <label>📚 Matière</label>
      <select id="matiereSelect">
        <option value="francais">🇫🇷 Français</option>
        <option value="maths">📐 Mathématiques</option>
        <option value="histoire">🌍 Histoire-Géo & EMC</option>
        <option value="sciences">🔬 Sciences</option>
      </select>
    </div>
    <div class="nav-group">
      <label>📖 Chapitre</label>
      <select id="chapitreSelect"></select>
    </div>
  </div>

  <div id="ficheContainer" class="fiche-content">
    <!-- Le contenu de la fiche s'affichera ici dynamiquement -->
  </div>

  <div class="footer">📌 Notions en <span class="notion">rouge</span> = flashcards à maîtriser.</div>
</div>

<script>
// ==================== GÉNÉRATION DES FICHES À PARTIR DE DATA-FRANCAIS.JS ====================
// Cette fonction construit les fiches de révision à partir des données des flashcards

function genererFicheDepuisData(chapitreId) {
  const chapitreData = CHAPITRES_FR[chapitreId];
  if (!chapitreData) return null;
  
  // Extraire les questions des flashcards pour les mettre en rouge dans la section "Flashcards"
  const questionsFlashcards = chapitreData.cartes.map(c => c.q).slice(0, 8);
  const flashcardsHtml = questionsFlashcards.map(q => `<span class="notion">${q.substring(0, 50)}${q.length>50?'…':''}</span>`).join(' – ');
  
  // Générer le tableau des notions (à personnaliser par chapitre)
  let tableauHtml = '';
  if (chapitreId <= 10) {
    // Pour les chapitres 1 à 10, on utilise un tableau générique basé sur les flashcards
    tableauHtml = `<tr><thead><tr><th>Notion clé</th><th>Définition / Astuce</th><th>Exemple</th></tr></thead><tbody>`;
    for (let i = 0; i < Math.min(5, chapitreData.cartes.length); i++) {
      const c = chapitreData.cartes[i];
      tableauHtml += `<tr><td class="notion">${c.q.substring(0, 40)}${c.q.length>40?'…':''}</td><td>${c.r.substring(0, 80)}${c.r.length>80?'…':''}</td><td>—</td></tr>`;
    }
    tableauHtml += `</tbody></table>`;
  } else {
    tableauHtml = `<div class="pieges">📖 ${chapitreData.cartes.length} flashcards disponibles dans ce chapitre.</div>`;
  }
  
  return {
    objectif: `Maîtriser les notions du chapitre <span class="notion">${chapitreData.titre}</span>`,
    tableauHtml: tableauHtml,
    pieges: "Relis attentivement les flashcards pour éviter les erreurs courantes.",
    exemple: "Entraîne-toi avec les flashcards et les automatismes.",
    flashcards: flashcardsHtml
  };
}

// ==================== DONNÉES POUR MATHS, HISTOIRE, SCIENCES (à compléter) ====================
// Pour l'instant, on utilise CHAPITRES_FR uniquement pour le français

// Construction des listes de chapitres pour chaque matière
const matieresData = {
  francais: { chapitres: [] },
  maths: { chapitres: [] },
  histoire: { chapitres: [] },
  sciences: { chapitres: [] }
};

// Remplir les chapitres français à partir de CHAPITRES_FR (venant de data-francais.js)
for (let i = 1; i <= 26; i++) {
  if (CHAPITRES_FR[i]) {
    matieresData.francais.chapitres.push({
      numero: i,
      titre: CHAPITRES_FR[i].titre,
      generateur: () => genererFicheDepuisData(i)
    });
  }
}

// Pour maths, histoire, sciences (à compléter avec vos données)
for (let i = 1; i <= 18; i++) {
  matieresData.maths.chapitres.push({
    numero: i,
    titre: "Chapitre " + i,
    generateur: () => ({ objectif: "À compléter", tableauHtml: "", pieges: "", exemple: "", flashcards: "" })
  });
}
for (let i = 1; i <= 21; i++) {
  matieresData.histoire.chapitres.push({
    numero: i,
    titre: "Chapitre " + i,
    generateur: () => ({ objectif: "À compléter", tableauHtml: "", pieges: "", exemple: "", flashcards: "" })
  });
}
for (let i = 1; i <= 28; i++) {
  matieresData.sciences.chapitres.push({
    numero: i,
    titre: "Chapitre " + i,
    generateur: () => ({ objectif: "À compléter", tableauHtml: "", pieges: "", exemple: "", flashcards: "" })
  });
}

function updateChapitreSelect() {
  const matiere = document.getElementById('matiereSelect').value;
  const chapitres = matieresData[matiere].chapitres;
  const select = document.getElementById('chapitreSelect');
  select.innerHTML = '';
  chapitres.forEach(ch => {
    const option = document.createElement('option');
    option.value = ch.numero;
    option.textContent = `Chapitre ${ch.numero} : ${ch.titre}`;
    select.appendChild(option);
  });
  afficherFiche();
}

function afficherFiche() {
  const matiere = document.getElementById('matiereSelect').value;
  const chapitreNum = parseInt(document.getElementById('chapitreSelect').value);
  const chapitre = matieresData[matiere].chapitres.find(c => c.numero === chapitreNum);
  if (!chapitre || !chapitre.generateur) return;
  
  const fiche = chapitre.generateur();
  
  const html = `
    <div class="objectif">🎯 ${fiche.objectif}</div>
    ${fiche.tableauHtml}
    <div class="pieges">⚠️ ${fiche.pieges}</div>
    <div class="exemple">✍️ ${fiche.exemple}</div>
    <div class="flashcards">🃏 Flashcards : ${fiche.flashcards}</div>
  `;
  document.getElementById('ficheContainer').innerHTML = html;
}

document.getElementById('matiereSelect').addEventListener('change', updateChapitreSelect);
document.getElementById('chapitreSelect').addEventListener('change', afficherFiche);

updateChapitreSelect();
</script>
</body>
</html>
