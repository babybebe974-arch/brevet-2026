    {numero:1,titre:"Les classes grammaticales",objectif:"Identifier la <span class='notion'>nature (classe grammaticale)</span> de n'importe quel mot.",tableau:[["Nom","Être, chose, idée. On peut mettre « le » ou « un » devant.","chat, table, liberté"],["Déterminant","Précède le nom, indique genre/nombre.","le, la, les, un, une, des, ce, mon, ton, son"],["Adjectif qualificatif","Qualifie le nom (accorde en genre/nombre).","grand, belle, intéressant"],["Pronom","Remplace un nom ou un GN.","je, tu, il, elle, on, nous, vous, ils, elles, le, lui, y, en, que, qui, dont, où"],["Verbe","Action ou état. Se conjugue.","manger, courir, être, avoir, sembler"],["Adverbe","Modifie un verbe, un adjectif ou un adverbe. Invariable.","rapidement, très, bien, mal, hier, trop"],["Préposition","Introduit un complément. Invariable.","à, de, pour, par, avec, sans, dans, sur, sous, chez"],["Conjonction","Relie des mots ou propositions.","mais, ou, et, donc, or, ni, car (coordination) ; que, parce que, lorsque, puisque, comme, si (subordination)"],["Interjection","Mot-phrase exprimant une émotion.","Ah ! Oh ! Hélas ! Bravo ! Zut !"]],pieges:"<span class='notion'>Leur / leurs</span> : <em>leur</em> = pronom invariable ; <em>leurs</em> = déterminant pluriel.<br>• <span class='notion'>Tout</span> peut être : déterminant, pronom, adverbe ou nom.<br>• Ne pas confondre <span class='notion'>nature</span> (ce qu'un mot est) et <span class='notion'>fonction</span> (ce qu'il fait dans la phrase).",exemple:"« <span class='notion'>L'immense</span> forêt <span class='notion'>s'étendait</span> <span class='notion'>silencieusement</span> <span class='notion'>devant</span> <span class='notion'>eux</span>. »",flashcards:"<span class='notion'>9 classes grammaticales</span> – <span class='notion'>déterminants</span> – <span class='notion'>pronoms</span> – <span class='notion'>adverbe vs préposition</span> – <span class='notion'>7 conjonctions de coordination</span> – <span class='notion'>reconnaître nom/verbe</span> – <span class='notion'>leur/leurs</span> – <span class='notion'>tout (4 natures)</span>"},
    {numero:2,titre:"Les fonctions grammaticales",objectif:"Identifier la <span class='notion'>fonction</span> d'un mot dans la phrase.",tableau:[["Sujet","qui est-ce qui ? quoi ?","Le chat dort."],["COD","quoi ? qui ? (sans préposition)","Je mange UNE POMME."],["COI","à qui ? à quoi ?","Je parle À MARIE."],["Complément circonstanciel","temps, lieu, manière, cause, but","Il court LE MATIN."],["Attribut du sujet","verbe d'état (être, paraître, sembler)","Il est GRAND."],["Épithète","adjectif qui qualifie directement un nom","Une GRANDE maison."],["Apposition","nom ou adjectif placé à côté d'un nom","Paris, CAPITALE DE LA FRANCE."],["Complément du nom","groupe de mots qui complète un nom","La maison DE MA GRAND-MÈRE."]],pieges:"Ne pas confondre <span class='notion'>nature</span> et <span class='notion'>fonction</span>.",exemple:"« Marie mange une pomme dans la cuisine. » → Marie = sujet, mange = verbe, une pomme = COD, dans la cuisine = CC de lieu.",flashcards:"<span class='notion'>sujet</span> – <span class='notion'>COD</span> – <span class='notion'>COI</span> – <span class='notion'>complément circonstanciel</span> – <span class='notion'>attribut du sujet</span> – <span class='notion'>épithète</span> – <span class='notion'>apposition</span> – <span class='notion'>complément du nom</span>"},

    {numero:4,titre:"Temps et modes verbaux",objectif:"Maîtriser les temps et leurs valeurs.",tableau:[["Indicatif","Mode de la réalité.","présent, imparfait, passé simple, passé composé, plus-que-parfait, futur"],["Subjonctif","Mode du doute, souhait, émotion.","Il faut que tu VIENNES."],["Conditionnel","Mode de l'hypothèse.","Si j'avais de l'argent, je VOYAGERAIS."],["Impératif","Mode de l'ordre.","Viens !"]],pieges:"Ne pas confondre conditionnel et futur (mêmes terminaisons mais contextes différents).",exemple:"Imparfait = description/habitude (Quand j'étais petit, je jouais). Passé simple = action ponctuelle (Il entra).",flashcards:"<span class='notion'>indicatif</span> – <span class='notion'>subjonctif</span> – <span class='notion'>conditionnel</span> – <span class='notion'>impératif</span>"},

  // Assemblage des données par matière
  const fichesData = {
    francais: { chapitres: francaisChapitres },
    maths: { chapitres: mathsChapitres },
    histoire: { chapitres: histoireChapitres },
    sciences: { chapitres: sciencesChapitres }
  };

  // Mise à jour du sélecteur de chapitre
  function updateChapitreSelect() {
    const matiere = document.getElementById('matiereSelect').value;
    const chapitres = fichesData[matiere].chapitres;
    const select = document.getElementById('chapitreSelect');
    select.innerHTML = '';
    chapitres.forEach(ch => {
      const option = document.createElement('option');
      option.value = ch.numero;
      option.textContent = `Chapitre ${ch.numero} : ${ch.titre}`;
      select.appendChild(option);
    });
    afficherFiche();
  }

  // Affichage de la fiche sélectionnée
  function afficherFiche() {
    const matiere = document.getElementById('matiereSelect').value;
    const chapitreNum = parseInt(document.getElementById('chapitreSelect').value);
    const chapitre = fichesData[matiere].chapitres.find(c => c.numero === chapitreNum);
    if (!chapitre) return;

    let tableauHtml = '';
    if (chapitre.tableau && chapitre.tableau.length > 0) {
      tableauHtml = '<table><thead><tr><th>Notion</th><th>Astuce / Définition</th><th>Exemples</th></tr></thead><tbody>';
      for (const row of chapitre.tableau) {
        tableauHtml += `<tr><td class="notion">${row[0]}</td><td>${row[1]}</td><td>${row[2] || ''}</td></tr>`;
      }
      tableauHtml += '</tbody></tr>';
    }

    const html = `
      <div class="objectif">🎯 ${chapitre.objectif}</div>
      ${tableauHtml}
      <div class="pieges">⚠️ ${chapitre.pieges}</div>
      <div class="exemple">✍️ ${chapitre.exemple}</div>
      <div class="flashcards">🃏 Flashcards : ${chapitre.flashcards}</div>
    `;
    document.getElementById('ficheContainer').innerHTML = html;
  }

  // Événements
  document.getElementById('matiereSelect').addEventListener('change', () => updateChapitreSelect());
  document.getElementById('chapitreSelect').addEventListener('change', () => afficherFiche());

  // Initialisation
  updateChapitreSelect();
</script>
