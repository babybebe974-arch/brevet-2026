<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📊 Suivi parental – Brevet 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:#000000;font-family:'DM Sans',sans-serif;padding:1.5rem;color:#fff;}
    .container{max-width:1200px;margin:0 auto;}
    h1{font-family:'Playfair Display',serif;font-size:2rem;color:#ffcc00;margin-bottom:0.25rem;}
    .sub{color:#aaa;margin-bottom:2rem;border-left:3px solid #ffcc00;padding-left:1rem;}
    .back-link{display:inline-block;margin-bottom:1.5rem;text-decoration:none;color:#5ecfb1;font-size:0.8rem;}
    
    /* Grille 4 matières */
    .matieres-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1.5rem;margin-bottom:2rem;}
    .matiere-card{background:#1a1a1a;border-radius:1.5rem;border:1px solid #333;overflow:hidden;}
    .matiere-header{padding:1rem;background:#2a2a2a;border-bottom:1px solid #333;}
    .matiere-nom{font-size:1.3rem;font-weight:700;}
    .matiere-score{font-size:2rem;font-weight:800;margin-top:0.25rem;}
    .matiere-date{font-size:0.7rem;color:#aaa;margin-top:0.25rem;}
    .sessions-list{padding:0.8rem;max-height:300px;overflow-y:auto;}
    .session-item{background:#0a0a0f;border-radius:0.8rem;padding:0.6rem;margin-bottom:0.5rem;border-left:3px solid #5ecfb1;}
    .session-date{font-size:0.7rem;color:#5ecfb1;font-family:'DM Mono',monospace;}
    .session-chapitres{font-size:0.75rem;color:#ddd;margin:0.25rem 0;}
    .session-score{font-size:0.8rem;font-weight:700;color:#ffcc00;}
    .vide{color:#555;text-align:center;padding:1rem;font-style:italic;}
    
    .btn-group{display:flex;gap:1rem;margin-top:1rem;flex-wrap:wrap;}
    button{background:#1e2a3e;border:1px solid #5ecfb1;border-radius:40px;padding:0.5rem 1.2rem;font-size:0.8rem;color:#5ecfb1;cursor:pointer;}
    button:hover{background:#2a3652;}
    .btn-danger{border-color:#e74c3c;color:#e74c3c;}
    
    footer{text-align:center;margin-top:2rem;padding-top:1rem;border-top:1px solid #333;font-size:0.7rem;color:#555;}
  </style>
</head>
<body>
<div class="container">
  <a href="index.html" class="back-link">← Retour au hub</a>
  <h1>📊 Suivi parental</h1>
  <div class="sub">Chaque session d'automatismes est enregistrée automatiquement.</div>

  <div class="matieres-grid" id="matieresGrid"></div>
  
  <div class="btn-group">
    <button id="refreshBtn">🔄 Actualiser</button>
    <button id="exportBtn" style="border-color:#e8c87a;color:#e8c87a;">📤 Exporter tout (JSON)</button>
    <button id="resetBtn" class="btn-danger">⚠️ Réinitialiser toutes les données</button>
  </div>
  <footer>💡 Les scores viennent des exercices "Automatismes" (Français, Maths, Histoire, Sciences). Chaque session est automatiquement sauvegardée avec la date, les chapitres et le score.</footer>
</div>

<script>
  // Clés localStorage utilisées par les fichiers automatismes-*.html
  const MATIERES = {
    francais: { nom: "Français", couleur: "#ffcc00", storageKey: "automatismes_sessions_francais" },
    maths: { nom: "Mathématiques", couleur: "#2ecc71", storageKey: "automatismes_sessions_maths" },
    histoire: { nom: "Histoire-Géo & EMC", couleur: "#e74c3c", storageKey: "automatismes_sessions_histoire" },
    sciences: { nom: "Sciences", couleur: "#3498db", storageKey: "automatismes_sessions_sciences" }
  };

  // Récupérer toutes les sessions d'une matière
  function getSessions(matiereId) {
    const key = MATIERES[matiereId].storageKey;
    const saved = localStorage.getItem(key);
    if (!saved) return [];
    try {
      return JSON.parse(saved);
    } catch(e) {
      return [];
    }
  }

  // Sauvegarder une session (appelé depuis automatismes)
  function sauvegarderSession(matiereId, chapitres, score, details) {
    const key = MATIERES[matiereId].storageKey;
    const sessions = getSessions(matiereId);
    const nouvelleSession = {
      id: Date.now(),
      date: new Date().toISOString(),
      dateFr: new Date().toLocaleDateString('fr-FR', { day:'2-digit', month:'long', hour:'2-digit', minute:'2-digit' }),
      chapitres: chapitres, // tableau des chapitres étudiés
      score: score, // nombre de bonnes réponses / total
      pourcentage: Math.round((score.bonnes / score.total) * 100),
      details: details || {}
    };
    sessions.unshift(nouvelleSession); // les plus récentes d'abord
    // Garder max 100 sessions par matière
    while(sessions.length > 100) sessions.pop();
    localStorage.setItem(key, JSON.stringify(sessions));
    return nouvelleSession;
  }

  // Calculer la moyenne des 5 dernières sessions
  function moyenneRecente(sessions) {
    const dernieres = sessions.slice(0, 5);
    if (dernieres.length === 0) return null;
    const sum = dernieres.reduce((acc, s) => acc + s.pourcentage, 0);
    return Math.round(sum / dernieres.length);
  }

  // Afficher toutes les matières
  function afficherSuivi() {
    const grid = document.getElementById("matieresGrid");
    grid.innerHTML = "";
    
    for (const [id, mat] of Object.entries(MATIERES)) {
      const sessions = getSessions(id);
      const moyenne = moyenneRecente(sessions);
      const derniereSession = sessions[0];
      
      const card = document.createElement("div");
      card.className = "matiere-card";
      card.innerHTML = `
        <div class="matiere-header">
          <div class="matiere-nom" style="color:${mat.couleur}">${mat.nom}</div>
          <div class="matiere-score">${moyenne !== null ? moyenne + '%' : '—'}</div>
          <div class="matiere-date">📊 Moyenne des 5 dernières sessions</div>
        </div>
        <div class="sessions-list">
          ${sessions.length === 0 ? '<div class="vide">📭 Aucune session enregistrée.<br>Lancez un quiz "Automatismes" !</div>' : ''}
          ${sessions.slice(0, 15).map(s => `
            <div class="session-item">
              <div class="session-date">📅 ${s.dateFr}</div>
              <div class="session-chapitres">📖 ${Array.isArray(s.chapitres) ? s.chapitres.join(', ') : s.chapitres || 'Quiz complet'}</div>
              <div class="session-score">🎯 Score : ${s.score.bonnes || s.score}/${s.score.total || 100} (${s.pourcentage}%)</div>
            </div>
          `).join('')}
          ${sessions.length > 15 ? `<div class="session-item" style="text-align:center;color:#555;">+ ${sessions.length - 15} sessions anciennes...</div>` : ''}
        </div>
      `;
      grid.appendChild(card);
    }
  }

  // Exporter toutes les données
  function exporterJSON() {
    const allData = {};
    for (const [id, mat] of Object.entries(MATIERES)) {
      allData[id] = getSessions(id);
    }
    const blob = new Blob([JSON.stringify({
      exportDate: new Date().toISOString(),
      data: allData
    }, null, 2)], {type: "application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `suivi_parental_${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
  }

  // Réinitialiser tout
  function resetAll() {
    if (confirm("⚠️ Supprimer TOUTES les sessions de TOUTES les matières ? Cette action est irréversible.")) {
      for (const [id, mat] of Object.entries(MATIERES)) {
        localStorage.removeItem(mat.storageKey);
      }
      afficherSuivi();
    }
  }

  // Exposer la fonction de sauvegarde pour les fichiers automatismes
  window.SuiviParental = {
    sauvegarderSession: sauvegarderSession,
    getSessions: getSessions
  };

  // Événements
  document.getElementById("refreshBtn").addEventListener("click", afficherSuivi);
  document.getElementById("exportBtn").addEventListener("click", exporterJSON);
  document.getElementById("resetBtn").addEventListener("click", resetAll);
  
  // Afficher au chargement
  afficherSuivi();
</script>
</body>
</html>
